# Runs this repository's Checks on pull requests, in the merge queue and after
# a merge to main, and reports them as `ci` and `desktop_test`. After a merge it
# also records the test map's laps, which reports and gates nothing, and
# publishes the commit as a release once `ci` passes.
# docs/practices/ci.md says what each trigger is for and how a Check is added.
#
# This workflow gates nothing by itself: a ruleset that requires `ci` does.
name: checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. A merge group or
# a push to main is keyed by its own commit, so nothing else cancels it.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  # Decides which Checks run. `armada covers` is the same answer the merge line
  # and Fleet's gate ask, so a path hits the same Checks here as there.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `actions: read` lists the merge queue's runs, *What the queue failed*.
    permissions:
      contents: read
      actions: read
    outputs:
      checks: ${{ steps.covers.outputs.checks }}
      matrix: ${{ steps.covers.outputs.matrix }}
      has_matrix: ${{ steps.covers.outputs.has_matrix }}
      compile: ${{ steps.covers.outputs.compile }}
      whole: ${{ steps.paths.outputs.whole }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/rust-setup
        with:
          key: plan

      - name: Build armada
        run: cargo build -p armada --locked

      # The merge line's rule (git show ecfffb2c1ebd:docs/capabilities/merge-line.md, *Choosing what
      # reruns*): a Check runs when it covers what the branch changed or what
      # landed on main since the branch was cut, either side. Only when the
      # branch's own change hits a Check: one that hits none merges into main's
      # code unchanged, and main was checked when that landed. HEAD is the merge
      # GitHub tests, HEAD^1 is current main and HEAD^2 the branch. The event's
      # own base sha is the main of the day the PR opened, so it is not used.
      # `--no-renames` lists both sides of a rename.
      - name: Changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          mkdir plan
          case "$EVENT" in
            pull_request)
              mb=$(git merge-base HEAD^1 HEAD^2)
              git diff --name-only --no-renames "$mb" HEAD^2 | sort -u > plan/branch.txt
              { cat plan/branch.txt; git diff --name-only --no-renames "$mb" HEAD^1; } | sort -u > plan/changed.txt
              whole=false ;;
            merge_group) git diff --name-only --no-renames "$MG_BASE" "$MG_HEAD" > plan/changed.txt; whole=false ;;
            *) : > plan/changed.txt; whole=true ;;
          esac
          echo "whole=$whole" >> "$GITHUB_OUTPUT"
          echo "MACHINE plan cores=$(nproc) $(grep MemTotal /proc/meminfo)"
          echo "CHANGED $EVENT whole=$whole"
          cat plan/changed.txt

      # A pull request the merge queue dropped runs again what the queue failed,
      # so a fix is tried here before it waits in the queue again. The newest
      # queue run for it that passed or failed decides; a cancelled one says
      # nothing. A read that fails warns and leaves the quick plan.
      - name: What the queue failed
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          : > plan/queue-failed.txt
          if ! run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow checks --event merge_group --limit 100 \
              --json databaseId,headBranch,conclusion \
              --jq "[.[] | select(.headBranch | startswith(\"gh-readonly-queue/main/pr-$PR-\")) | select(.conclusion == \"failure\" or .conclusion == \"success\")][0] | select(.conclusion == \"failure\") | .databaseId"); then
            echo "::warning::could not read the merge queue's runs for #$PR, so only the quick Checks run"
            exit 0
          fi
          if [ -n "$run" ] && ! gh run view "$run" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | select(.conclusion == "failure") | .name' > plan/queue-failed.txt; then
            echo "::warning::could not read the jobs of queue run $run, so only the quick Checks run"
            : > plan/queue-failed.txt
          fi
          echo "QUEUE ${run:-none}"
          cat plan/queue-failed.txt

      # A failure here fails the job, so a plan that cannot be made never
      # reads as a plan that runs nothing. `plan.py` sorts the keys `armada
      # covers` prints into the jobs below and fails on one that CI neither runs
      # nor excludes: docs/practices/ci.md, *How a Check is chosen*. A whole run
      # asks about every tracked path, so it names every Check there is.
      # A pull request keeps only the Checks that compile (`--quick`), and those
      # the queue last failed it on (`--rerun`); the merge queue runs the rest
      # once, docs/practices/ci.md, *What runs when*.
      - name: Which Checks
        id: covers
        env:
          WHOLE: ${{ steps.paths.outputs.whole }}
          QUICK: ${{ github.event_name == 'pull_request' && '--quick --rerun plan/queue-failed.txt' || '' }}
        run: |
          set -euo pipefail
          if [ "$WHOLE" = true ]; then
            git ls-files | ./target/debug/armada covers > plan/covers.txt
          elif [ -f plan/branch.txt ] && ./target/debug/armada covers < plan/branch.txt > plan/branch-covers.txt && [ ! -s plan/branch-covers.txt ]; then
            # The branch's own change hits no Check, so main's side is not rerun.
            : > plan/covers.txt
          else
            ./target/debug/armada covers < plan/changed.txt > plan/covers.txt
          fi
          python3 .github/ci/plan.py $QUICK < plan/covers.txt > plan/plan.json
          checks=$(jq -c .checks plan/plan.json)
          matrix=$(jq -c .matrix plan/plan.json)
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_matrix=$(jq '.matrix.include | length > 0' plan/plan.json)" >> "$GITHUB_OUTPUT"
          echo "compile=$(jq -c .compile plan/plan.json)" >> "$GITHUB_OUTPUT"
          echo "CHECKS $checks"
          echo "### plan: $checks" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.excluded[] | "excluded: \(.)"' plan/plan.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '.queued[] | "in the merge queue: \(.)"' plan/plan.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '.rerun[] | "the merge queue failed it last: \(.)"' plan/plan.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '.compile[] | "its test code compiled here, run in the merge queue: \(.)"' plan/plan.json >> "$GITHUB_STEP_SUMMARY"

      # Every job that runs `armada check` takes this binary rather than
      # building its own: 2 minutes a job, measured 31 Oct 2026. The runners
      # are the same image.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: armada-bin
          path: target/debug/armada
          retention-days: 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan
          path: plan
          retention-days: 3

  build:
    name: build
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'build')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plan
          path: plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: armada-bin
          path: bin
      - uses: ./.github/actions/rust-setup
        with:
          key: build
      - uses: ./.github/actions/run-check
        with:
          name: build
          cmd: |
            chmod +x bin/armada
            export PATH="$PWD/bin:$PATH"
            if [ "${{ needs.plan.outputs.whole }}" = true ]; then armada check build; else armada check build --changed < plan/changed.txt; fi

  # Four runners, each a quarter of the tests nextest would run (`--partition
  # slice:<n>/4`): 572s of tests on one runner, measured 17 Oct 2026. `armada
  # check` has no way to pass the flag, so a `cargo` ahead on PATH adds it to
  # `nextest run`. `--no-tests=pass`: a narrowed run of a few tests leaves some
  # slices empty.
  test:
    name: test ${{ matrix.shard }}/4
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plan
          path: plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: armada-bin
          path: bin
      - uses: ./.github/actions/rust-setup
        with:
          key: test
          nextest: "true"
      - name: Slice nextest
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/slice"
          cat > "$RUNNER_TEMP/slice/cargo" <<EOF
          #!/bin/sh
          if [ "\$1" = nextest ] && [ "\$2" = run ]; then
            shift 2
            exec "$(command -v cargo)" nextest run --partition slice:$SHARD/4 --no-tests=pass "\$@"
          fi
          exec "$(command -v cargo)" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/slice/cargo"
          echo "$RUNNER_TEMP/slice" >> "$GITHUB_PATH"
      - uses: ./.github/actions/run-check
        with:
          name: test
          cmd: |
            chmod +x bin/armada
            export PATH="$PWD/bin:$PATH"
            if [ "${{ needs.plan.outputs.whole }}" = true ]; then armada check test; else armada check test --changed < plan/changed.txt; fi

  # A pull request's run only: compiles the test code of the Rust Checks it
  # leaves to the merge queue, and runs no test. `cargo build` compiles no test
  # target, so a change that broke a test's code passed its pull request and
  # failed in the queue, with the entries behind it: 4 of 16 failed queue runs
  # on 30 and 31 Oct 2026. A `cargo` ahead on PATH adds `--no-run` to `nextest
  # run`, so the crates compiled are the ones the queue's run narrows to.
  test_compile:
    name: test_compile
    needs: plan
    if: needs.plan.outputs.compile != '' && needs.plan.outputs.compile != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plan
          path: plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: armada-bin
          path: bin
      - uses: ./.github/actions/rust-setup
        with:
          key: test
          nextest: "true"
      - name: No-run nextest
        run: |
          mkdir -p "$RUNNER_TEMP/norun"
          cat > "$RUNNER_TEMP/norun/cargo" <<EOF
          #!/bin/sh
          if [ "\$1" = nextest ] && [ "\$2" = run ]; then
            shift 2
            exec "$(command -v cargo)" nextest run --no-run "\$@"
          fi
          exec "$(command -v cargo)" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/norun/cargo"
          echo "$RUNNER_TEMP/norun" >> "$GITHUB_PATH"
      - uses: ./.github/actions/run-check
        env:
          COMPILE: ${{ needs.plan.outputs.compile }}
        with:
          name: test_compile
          cmd: |
            chmod +x bin/armada
            export PATH="$PWD/bin:$PATH"
            code=0
            for key in $(echo "$COMPILE" | jq -r '.[]'); do
              echo "COMPILE $key"
              if [ "$key" = test ]; then armada check test --changed < plan/changed.txt || code=1; else armada check "$key" || code=1; fi
            done
            exit $code

  # The xtask tests read `apps/` and `packages/` (vocabulary, error codes,
  # design rules). Nextest directly, as `apps/desktop/armada.yml` runs it: the
  # plan's `armada` is a Node-job artifact, and this job builds only xtask.
  xtask_test:
    name: apps/desktop:xtask_test
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'apps/desktop:xtask_test')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          key: xtask_test
          nextest: "true"
      - uses: ./.github/actions/run-check
        with:
          name: apps/desktop:xtask_test
          cmd: cargo nextest run -p xtask --test-threads "$WIDTH"

  # Whole, with no `--changed`: the Check has no narrowing, and it is the one
  # run of a milestone's claim.
  acceptance:
    name: acceptance
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'acceptance')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: armada-bin
          path: bin
      - uses: ./.github/actions/rust-setup
        with:
          key: acceptance
          nextest: "true"
      - uses: ./.github/actions/run-check
        with:
          name: acceptance
          cmd: |
            chmod +x bin/armada
            export PATH="$PWD/bin:$PATH"
            armada check acceptance

  typecheck:
    name: typecheck
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'typecheck')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/node-setup
      - uses: ./.github/actions/run-check
        with:
          name: typecheck
          cmd: pnpm typecheck

  # Every workspace Check on Linux: one job per key `armada covers` named, run
  # as `armada check <key>` in that workspace's directory. The key is the
  # display name.
  workspace_check:
    name: ${{ matrix.key || 'workspace_check' }}
    needs: plan
    if: needs.plan.outputs.has_matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: armada-bin
          path: bin
      - uses: ./.github/actions/node-setup
        with:
          browsers: ${{ matrix.browsers }}
      - uses: ./.github/actions/run-check
        env:
          KEY: ${{ matrix.key }}
        with:
          name: ${{ matrix.key }}
          cmd: |
            chmod +x bin/armada
            PATH="$PWD/bin:$PATH" armada check "$KEY"

  hooks_test:
    name: hooks_test
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'hooks_test')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/run-check
        with:
          name: hooks_test
          cmd: python3 .claude/hooks/test_guard_merge.py

  preview_test:
    name: preview_test
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'preview_test')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/run-check
        with:
          name: preview_test
          cmd: python3 scripts/test_preview.py

  sync_mod_test:
    name: sync_mod_test
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'sync_mod_test')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/run-check
        with:
          name: sync_mod_test
          cmd: python3 scripts/test_sync_mod.py

  # The desktop tests that read no surface: main and the renderer's own modules,
  # mostly node. Linux, one job, no shards: the files add up to 44 seconds.
  desktop_unit:
    name: desktop_unit
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'apps/desktop/unit:desktop_test')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/node-setup
        with:
          browsers: "true"
      - uses: ./.github/actions/run-check
        with:
          name: apps/desktop/unit:desktop_test
          cmd: pnpm --dir apps/desktop exec vitest run --maxWorkers="$WIDTH" --project 'desktop*'

  # The name a ruleset will require, once desktop_test is stable. Passes when
  # the plan skipped the unit job, fails when it failed or was cancelled.
  desktop_test:
    name: desktop_test
    if: always()
    needs: [plan, desktop_unit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read the jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"'
          echo "$NEEDS" | jq -e '.plan.result == "success" and ([.[] | .result] | all(. == "success" or . == "skipped"))'

  # Not chosen by `armada covers`: the foundations apply to every change, docs
  # included. Read as the merge line read it, docs/practices/ci.md, *Foundations*:
  # HEAD is the candidate, HEAD^1 is main's own tip, and only a failing line the
  # candidate has more of than main is red.
  foundations:
    name: foundations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # The privacy rule bans the name the gate runs as. On a runner that is
      # `runner`, which is an ordinary word all over the tree, so it is unset.
      USER: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      # A bare path in a doc means v1-final, and the path rule reads that tag's
      # tree. Without it every v1 citation reads as a path that does not exist.
      - name: The v1-final tag
        run: git fetch --depth=1 origin tag v1-final

      - name: Self-test of the reading
        run: |
          echo "OUT=$RUNNER_TEMP/foundations" >> "$GITHUB_ENV"
          python3 -m unittest discover -s .github/ci

      - uses: ./.github/actions/rust-setup
        with:
          key: foundations

      - name: Main's tip
        id: base
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      # One entry per main commit. The key is the commit alone: its xtask and
      # its tree are both fixed by it, so a hash of xtask would add nothing.
      - name: Main's reading, cached
        id: cached
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/foundations/base
          key: foundations-main-v2-${{ steps.base.outputs.sha }}

      # The merge line regenerated and committed these. CI cannot commit onto
      # a pull request, so a change here is the author's to push.
      - name: Generated files
        id: generated
        run: |
          cargo xtask verify-docs --write
          cargo xtask verify-tokens --write
          changed=$(git status --porcelain)
          if [ -n "$changed" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            {
              echo "### foundations: generated files are stale"
              echo
              echo "Run \`cargo xtask verify-docs --write\` and \`cargo xtask verify-tokens --write\`, then commit what they change:"
              echo
              echo '```'
              echo "$changed"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Main's own run
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$OUT/base"
          git worktree add --detach "$RUNNER_TEMP/main" HEAD^1
          cd "$RUNNER_TEMP/main"
          set +e
          cargo xtask verify-foundations --timings > "$OUT/base/out" 2> "$OUT/base/err"
          echo $? > "$OUT/base/exit"
          cat "$OUT/base/err"
          cd "$GITHUB_WORKSPACE"
          if ! python3 .github/ci/foundations_delta.py report "$OUT/base/out" "$(cat "$OUT/base/exit")"; then
            echo "::error::main's own run names no rule, so there is nothing to compare against"
            tail -n 10 "$OUT/base/out" "$OUT/base/err"
            exit 1
          fi

      - name: Cache main's reading
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/foundations/base
          key: foundations-main-v2-${{ steps.base.outputs.sha }}

      - name: The candidate's run
        id: run
        run: |
          mkdir -p "$OUT/run"
          set +e
          cargo xtask verify-foundations --timings > "$OUT/run/out" 2> "$OUT/run/err"
          echo $? > "$OUT/run/exit"
          cat "$OUT/run/err" "$OUT/run/out"
          python3 .github/ci/foundations_delta.py report "$OUT/run/out" "$(cat "$OUT/run/exit")" && echo "report=true" >> "$GITHUB_OUTPUT"
          exit 0

      # On main the candidate is main, so its own reading is what the next pull
      # request needs. A pull request's cache is not visible to another one.
      - name: Cache this commit as main's reading
        if: github.event_name == 'push' && steps.run.outputs.report == 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/foundations/run
          key: foundations-main-v2-${{ github.sha }}

      - name: Read against main
        run: |
          set -o pipefail
          python3 .github/ci/foundations_delta.py delta "$OUT/base/out" "$OUT/run/out" "$(cat "$OUT/run/exit")" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail on stale generated files
        if: always() && steps.generated.outputs.stale == 'true'
        run: |
          echo "::error::generated files are stale: run cargo xtask verify-docs --write and cargo xtask verify-tokens --write, then commit"
          exit 1

  # After a merge to main only: measures which tests reach which files, with
  # coverage on, and uploads the laps as `test-map-<sha>` for Fleet to fetch
  # (docs/concepts/test-map.md, *How it stays current*). A cold instrumented
  # build of the whole workspace, so never on a pull request or in the queue.
  #
  # **It gates nothing.** `ci` does not need it, and `continue-on-error` keeps a
  # failure here from turning the run, and so main, red: Fleet reads a missing
  # artifact as no laps for that commit and carries on with the last ones.
  test_map:
    name: test_map
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: armada-bin
          path: bin
      - uses: ./.github/actions/rust-setup
        with:
          key: test_map
          nextest: "true"
      # The collector reads each profile with the compiler's own LLVM.
      - run: rustup component add llvm-tools-preview
      - uses: ./.github/actions/run-check
        with:
          name: test_map
          cmd: |
            chmod +x bin/armada
            PATH="$PWD/bin:$PATH" armada test-map record --check test --out test-map/laps.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-map-${{ github.sha }}
          path: test-map/laps.json
          retention-days: 3
          if-no-files-found: error

  # The one name the ruleset requires for everything but desktop_test. A Check
  # the plan skipped passes; one that failed or was cancelled fails; a plan
  # that failed fails, so a change is never green because nothing was chosen.
  ci:
    name: ci
    if: always()
    needs:
      - plan
      - build
      - test
      - acceptance
      - typecheck
      - workspace_check
      - hooks_test
      - preview_test
      - sync_mod_test
      - xtask_test
      - test_compile
      - foundations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read the Checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"'
          echo "$NEEDS" | jq -e '.plan.result == "success" and ([.[] | .result] | all(. == "success" or . == "skipped"))'

  # After a merge to main, or a dispatch on main, and only once `ci` passed:
  # publishes the commit as a GitHub Release a person installs with one line.
  # It waits on `ci` and nothing else, so a release is out minutes after the
  # merge rather than after `test_map`'s hours. docs/practices/ci.md, *Releases*.
  #
  # One release builds at a time and is never cancelled. GitHub holds one run
  # waiting behind it and a newer merge replaces that one, so two quick merges
  # make one release holding both.
  release:
    name: release
    needs: ci
    if: needs.ci.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: release
      cancel-in-progress: false
    # Apple Silicon only, the owner's call (25 Oct 2026). Intel is a second build.
    runs-on: macos-15
    timeout-minutes: 60
    # The one job here that writes: it creates the tag and the release.
    permissions:
      contents: write
    env:
      SHA: ${{ github.sha }}
    steps:
      # Whole history: the patch number is the count of commits on main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      # `0.<minor>.<commits>`: the root package.json's major and minor, bumped by
      # hand when they mean something, and the commit count, which only grows on
      # main. The hash goes in the notes. A tag that already exists means this
      # commit was released, so the run stops there.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          base=$(jq -r .version package.json | cut -d. -f1,2)
          version="$base.$(git rev-list --count HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released"
          fi
          echo "VERSION $version $(git rev-parse HEAD)"

      - uses: ./.github/actions/rust-setup
        if: steps.version.outputs.exists != 'true'
        with:
          key: release

      - uses: ./.github/actions/node-setup
        if: steps.version.outputs.exists != 'true'

      # `shipped`: optimised and stripped, so the download carries no debug
      # line tables. Cargo.toml says why it is not `installed`.
      - name: Build armada
        if: steps.version.outputs.exists != 'true'
        run: cargo build -p armada --profile shipped --locked

      # The version lands in the bundle's package.json, which is what
      # `app.getVersion()` and `CFBundleShortVersionString` read.
      - name: Build Armada.app
        if: steps.version.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd apps/desktop
          pnpm exec electron-vite build
          pnpm exec electron-builder --mac --arm64 --publish never -c.extraMetadata.version="$VERSION"

      # Fleet rides inside the app, so one download is the whole of Armada.
      # Writing into the bundle breaks electron-builder's ad hoc seal, so the
      # bundle is signed again, ad hoc, once it is complete. `ditto` keeps the
      # bundle's symlinks and attributes, which `zip` does not.
      - name: Bundle Fleet and package
        if: steps.version.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app=apps/desktop/release/mac-arm64/Armada.app
          mkdir -p "$app/Contents/Resources/bin"
          cp target/shipped/armada "$app/Contents/Resources/bin/armada"
          printf '%s %s\n' "$VERSION" "$SHA" > "$app/Contents/Resources/version"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/Resources/bin/armada" help >/dev/null
          mkdir -p dist-release
          ditto -c -k --sequesterRsrc --keepParent "$app" dist-release/Armada-macos-arm64.zip
          cp scripts/install.sh dist-release/install.sh
          ls -l dist-release

      # The asset names carry no version, so `releases/latest/download/<name>`
      # is a link that never changes. The newest release is marked Latest.
      - name: Publish
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHORT: ${{ steps.version.outputs.short }}
        run: |
          set -euo pipefail
          {
            echo "Built from $SHORT on main."
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh"
            echo '```'
          } > notes.md
          gh release create "v$VERSION" dist-release/* \
            --target "$SHA" --title "Armada $VERSION" --notes-file notes.md --latest
