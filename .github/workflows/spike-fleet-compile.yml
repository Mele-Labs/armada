# Throwaway: times fleet's test harness compile on the runner the Rust shards use.
# Lives only on armada/spike-fleet-test-compile and is never merged.
name: spike-fleet-compile
on:
  push:
    branches: [armada/spike-fleet-test-compile]
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
jobs:
  time:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          key: test
          shared: test-test
      - name: Warm every dependency of fleet's harness
        run: |
          nproc; rustc -Vv
          cargo test -p fleet --lib --no-run 2>&1 | tail -3
      - name: Variants of fleet's harness alone
        run: |
          set +e
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          one() {
            label="$1"; shift
            touch crates/fleet/src/lib.rs
            start=$(date +%s.%N)
            RUSTC_BOOTSTRAP=1 cargo rustc -p fleet --lib --profile test -- "$@" > "$out/$label.log" 2>&1
            code=$?
            end=$(date +%s.%N)
            printf '%s\t%.1f\texit %s\n' "$label" "$(echo "$end - $start" | bc)" "$code" | tee -a "$out/summary.tsv"
          }
          one baseline
          one baseline_again
          one debuginfo0 -Cdebuginfo=0
          one threads4 -Zthreads=4
          one threads4_debuginfo0 -Zthreads=4 -Cdebuginfo=0
          one cgu16 -Ccodegen-units=16
          one time_passes -Ztime-passes
          {
            echo '## fleet harness, seconds'; echo '```'; cat "$out/summary.tsv"; echo '```'
            echo '## time-passes, passes over 2 s'; echo '```'
            grep -E '^time:' "$out/time_passes.log" | awk '{t=$2; gsub(/;/,"",t); if (t+0 >= 2) print}' | head -60
            echo '```'
            echo '## threads4 log tail'; echo '```'; tail -5 "$out/threads4.log"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spike-fleet-compile
          path: ${{ runner.temp }}/out

  tmpfs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          key: test
          shared: test-test
          nextest: "true"
      - name: Build store and fleet tests
        run: |
          df -h /tmp /dev/shm; findmnt -T /tmp; nproc
          cargo nextest run -p store -p fleet --no-run 2>&1 | tail -2
      - name: The migration-count test and the store and fleet suites, disk against RAM
        run: |
          set +e
          one() {
            label="$1"; dir="$2"; shift 2
            TMPDIR="$dir" cargo nextest run -p store -p fleet --test-threads 4 --no-fail-fast "$@" > "$RUNNER_TEMP/$label.log" 2>&1
            echo "$label: $(grep -oE 'Summary \[ *[0-9.]+s\][^\n]*' "$RUNNER_TEMP/$label.log" | head -1)" | tee -a "$RUNNER_TEMP/tmpfs.txt"
          }
          one count_disk /tmp -E 'test(a_numbered_file_converts_at_every_count_the_old_list_had)'
          one count_ram /dev/shm -E 'test(a_numbered_file_converts_at_every_count_the_old_list_had)'
          one suites_disk /tmp
          one suites_ram /dev/shm
          for l in suites_disk suites_ram; do
            echo "$l slowest:" >> "$RUNNER_TEMP/tmpfs.txt"
            grep -oE '(PASS|FAIL) \[ *[0-9.]+s\].*' "$RUNNER_TEMP/$l.log" | sort -t'[' -k2 -rn | head -5 >> "$RUNNER_TEMP/tmpfs.txt"
            grep -cE '^ *FAIL' "$RUNNER_TEMP/$l.log" >> "$RUNNER_TEMP/tmpfs.txt"
          done
          { echo '## disk against RAM'; echo '```'; cat "$RUNNER_TEMP/tmpfs.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/tmpfs.txt"
