# Throwaway: the fixed test compile, through the real swap and run-check actions.
# Runs on pushes to this one branch only, and is deleted before the branch lands.
name: diag-runner
on:
  push:
    branches: [armada/session-99adfb33]
permissions:
  contents: read
concurrency:
  group: diag-runner
  cancel-in-progress: true
jobs:
  compile:
    name: diag compile fixed ${{ matrix.copy }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          key: test
          shared: test-test
          nextest: "true"
      - uses: ./.github/actions/swap
      - uses: ./.github/actions/run-check
        with:
          name: test_compile
          cmd: set -o pipefail; cargo nextest run --workspace --exclude acceptance --no-run 2>&1 | grep -v -E "^\s+(Compiling|Checking|Fresh)" | tail -5
