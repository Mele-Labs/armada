# Throwaway: what fills a hosted runner's memory while CI compiles the test code.
# Runs on pushes to this one branch only, and is deleted before the branch lands.
name: diag-runner
on:
  push:
    branches: [armada/session-99adfb33]
permissions:
  contents: read
concurrency:
  group: diag-runner
  cancel-in-progress: true
jobs:
  compile:
    name: diag compile ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        variant: [threads1, threads1-jobs2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          key: test
          shared: test-test
          nextest: "true"
      - name: Compile, sampled
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          case "$VARIANT" in
            threads4) export RUSTC_WORKSPACE_WRAPPER="$PWD/.github/ci/rustc-threads.sh" ;;
            threads1-jobs2) export CARGO_BUILD_JOBS=2 ;;
          esac
          (
            while true; do
              echo "MEM $(date -u +%T) $(free -m | awk '/Mem:/{print "used="$3"M avail="$7"M"}') swap=$(free -m | awk '/Swap:/{print $3"M"}')"
              ps -eo rss=,comm=,args= --sort=-rss | head -6 | sed -E 's/^ *([0-9]+) +([^ ]+) .*--crate-name ([^ ]+)(.*--test)?.*$/TOP \1K \2 \3 \4/; s/^ *([0-9]+) +([^ ]+) .*$/TOP \1K \2/'
              sleep 5
            done
          ) &
          start=$(date +%s)
          cargo nextest run --workspace --exclude acceptance --no-run 2>&1 | grep -v -E "^\s+(Compiling|Checking|Fresh)" | tail -20
          echo "RESULT variant=$VARIANT seconds=$(( $(date +%s) - start ))"
          kill %1 2>/dev/null || true
