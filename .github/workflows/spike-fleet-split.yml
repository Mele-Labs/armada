# Throwaway: what each way of cutting fleet would save, on the runner the Rust
# shards use. Lives only on armada/spike-fleet-split and is never merged.
name: spike-fleet-split
on:
  push:
    branches: [armada/spike-fleet-split]
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
jobs:
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTC_WORKSPACE_WRAPPER: ${{ github.workspace }}/.github/ci/rustc-threads.sh
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          key: test
          shared: test-test
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-lines
      - name: Warm
        run: |
          cargo test -p fleet --lib --no-run 2>&1 | tail -1
          cargo build -p armada 2>&1 | tail -1
      - name: Where the generated code comes from
        run: |
          set +e
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          t() {
            label="$1"; shift
            start=$(date +%s.%N)
            "$@" > "$out/$label.log" 2>&1
            code=$?
            end=$(date +%s.%N)
            printf '%s\t%.1f\texit %s\n' "$label" "$(echo "$end - $start" | bc)" "$code" | tee -a "$out/times.tsv"
          }
          # armada is where Fleet meets its real types: its own compile, fleet's lib cached.
          touch crates/armada/src/lib.rs crates/armada/src/main.rs
          t armada_build cargo build -p armada
          cargo build -p armada --timings > /dev/null 2>&1; cp target/cargo-timings/cargo-timing.html "$out/armada-timing.html"
          t lines_fleet_test sh -c 'cargo llvm-lines -p fleet --lib --profile test > "$0"' "$out/llvm-fleet-test.txt"
          t lines_fleet_test_files sh -c 'cargo llvm-lines -p fleet --lib --profile test --files > "$0"' "$out/llvm-fleet-test-files.txt"
          t lines_fleet_lib sh -c 'cargo llvm-lines -p fleet --lib > "$0"' "$out/llvm-fleet-lib.txt"
          t lines_armada sh -c 'cargo llvm-lines -p armada --lib > "$0"' "$out/llvm-armada.txt"
          t lines_armada_bin sh -c 'cargo llvm-lines -p armada --bin armada > "$0"' "$out/llvm-armada-bin.txt"
          for f in "$out"/llvm-*.txt; do echo "== $f"; head -45 "$f"; done
      - name: Summary
        if: always()
        run: |
          out="$RUNNER_TEMP/out"
          { echo '## times'; echo '```'; cat "$out/times.tsv"; echo '```'
            for f in "$out"/llvm-*.txt; do echo "## $(basename "$f")"; echo '```'; head -40 "$f"; echo '```'; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spike-fleet-lines
          path: ${{ runner.temp }}/out
