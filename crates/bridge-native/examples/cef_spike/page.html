<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Armada spike page</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.4 -apple-system, "SF Pro Text", Helvetica, sans-serif; background: #fff; color: #1d1d1f; }
  #top { padding: 16px 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .swatch { display: inline-block; padding: 2px 6px; font-size: 11px; margin: 2px; }
  .r-on-b { color: #e02020; background: #2040e0; }
  .g-on-m { color: #20c040; background: #d020a0; }
  .y-on-k { color: #f0e020; background: #101010; }
  .w-on-r { color: #ffffff; background: #d02020; }
  #bar { position: absolute; left: 24px; top: 190px; width: 120px; height: 24px; background: #0a84ff; }
  .live #bar { animation: slide 2s linear infinite alternate; }
  @keyframes slide { from { left: 24px; } to { left: 600px; } }
  #count { position: absolute; left: 24px; top: 230px; font: 600 28px ui-monospace, Menlo, monospace; }
  #q { position: absolute; left: 24px; top: 290px; width: 300px; height: 36px; font-size: 16px; padding: 0 8px; }
  #scroller { position: absolute; left: 24px; top: 350px; width: 560px; height: 260px; overflow: auto; border: 1px solid #c7c7cc; }
  #scroller p { margin: 0; padding: 4px 8px; }
</style>
</head>
<body>
<div id="top">
  <h1>Chrome inside the Bridge window</h1>
  <div>Thin text at 12px: the quick brown fox jumps over the lazy dog 0123456789.</div>
  <div>
    <span class="swatch r-on-b">red on blue 11px</span>
    <span class="swatch g-on-m">green on magenta 11px</span>
    <span class="swatch y-on-k">yellow on black 11px</span>
    <span class="swatch w-on-r">white on red 11px</span>
  </div>
</div>
<div id="bar"></div>
<div id="count">0</div>
<input id="q" placeholder="type here" autofocus>
<div id="scroller"></div>
<script>
  const s = document.getElementById('scroller');
  for (let i = 0; i < 200; i++) { const p = document.createElement('p'); p.textContent = 'Row ' + i + ' of the scrolling list'; s.appendChild(p); }
  // ?static freezes the page, to measure what an idle document costs.
  let n = 0;
  if (!location.search.includes('static')) {
    document.body.classList.add('live');
    const tick = () => { document.getElementById('count').textContent = ++n; requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
  window.__spike = { scrollTop: () => s.scrollTop, input: () => document.getElementById('q').value, frames: () => n };
</script>
</body>
</html>
