# Throwaway spike: can Chrome (CEF) draw inside a gpui window? See docs/spikes/native-bridge-chrome.md.
# Its own workspace and lockfile, so `cef` never reaches the bridge-native build or the root workspace.
[package]
name = "cef-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "cef_spike"
path = "src/main.rs"

[[bin]]
name = "cef_spike_helper"
path = "src/helper.rs"

# The same pins as bridge-native, so the gpui under test is the gpui Bridge ships.
[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["runtime_shaders", "font-kit", "test-support"] }
cef = { version = "=156.4.0+156.0.26", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFDictionary", "CFString", "CFNumber", "CFBase", "CFCGTypes"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVMetalTexture", "CVMetalTextureCache", "CVReturn", "CVBase", "objc2", "objc2-metal"] }

# The conversion loop runs at full speed even in a debug build, so its timings mean something.
[profile.dev.package.cef-spike]
opt-level = 3
