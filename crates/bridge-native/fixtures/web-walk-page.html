<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orders</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, system-ui, sans-serif; }
  body { margin: 0; background: #f6f7f9; color: #15171c; }
  @media (prefers-color-scheme: dark) { body { background: #16181d; color: #e9ebf0; } }
  header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; padding: 16px 24px; border-bottom: 1px solid #8884; }
  header strong { font-size: 18px; }
  nav { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  nav a { color: #3b6cf0; text-decoration: none; }
  main { padding: 24px 24px 120px; max-width: 720px; }
  h1 { font-size: 28px; margin: 0 0 16px; }
  .tools { display: flex; gap: 12px; margin-bottom: 20px; }
  .tools input { flex: 1; min-width: 0; }
  input, button { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid #8886; background: transparent; color: inherit; }
  button.primary { background: #3b6cf0; border-color: #3b6cf0; color: #fff; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #8884; }
  .spacer { height: 520px; }
  footer { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; }
  dialog { border: 1px solid #8886; border-radius: 10px; padding: 24px; background: inherit; color: inherit; box-sizing: border-box; width: min(360px, calc(100vw - 32px)); }
  dialog input { width: 100%; box-sizing: border-box; }
  dialog::backdrop { background: #0006; }
</style>
</head>
<body>
<header>
  <strong>Shop admin</strong>
  <nav aria-label="Sections">
    <a href="#orders">Orders</a>
    <a href="#customers">Customers</a>
    <a href="#stock">Stock</a>
  </nav>
</header>
<main>
  <h1>Orders</h1>
  <div class="tools">
    <input type="search" aria-label="Search orders" placeholder="Search orders">
    <button class="primary" id="add">Add order</button>
  </div>
  <table aria-label="Recent orders">
    <thead><tr><th>Order</th><th>Customer</th><th>Total</th></tr></thead>
    <tbody>
      <tr><td>#1042</td><td>Ada Lovelace</td><td>$84.00</td></tr>
      <tr><td>#1041</td><td>Grace Hopper</td><td>$212.50</td></tr>
      <tr><td>#1040</td><td>Edsger Dijkstra</td><td>$19.99</td></tr>
    </tbody>
  </table>
  <div class="spacer"></div>
  <footer>
    <span>3 of 3 orders</span>
    <button id="export">Export orders</button>
  </footer>
</main>
<dialog id="new" aria-label="New order">
  <h2>New order</h2>
  <p><input aria-label="Customer name" placeholder="Customer name"></p>
  <button id="close">Cancel</button>
</dialog>
<script>
  document.getElementById("add").addEventListener("click", () => document.getElementById("new").showModal());
  document.getElementById("close").addEventListener("click", () => document.getElementById("new").close());
</script>
</body>
</html>
