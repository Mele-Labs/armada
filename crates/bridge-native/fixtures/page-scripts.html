/* What the kit's script draws on a sealed page, on Armada's tokens. The looks the owner approved on 14 Nov 2026:
   acts in a column on the right of their row, a pressed row washed green with a success edge, takes side by side. */
:root { background: var(--bg-base); color-scheme: dark; }
body { margin: 0; padding: var(--space-6); }

/* House style, a calm default under the page's own CSS. Every selector is :where(), so a page's rules and the kit's win.
   Text is muted and headings are not, depth is surface steps edged by hairlines, and colour is for state and the ask. */
:where(body) { color: var(--fg-muted); font-family: var(--font-sans); font-size: var(--text-sm); line-height: var(--leading-base); }
:where(input, button, select, textarea) { font: inherit; accent-color: var(--accent); }
:where(fieldset) { margin: 0 0 var(--space-4); padding: var(--space-3) var(--space-4); border: var(--border-width) solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--bg-raised); }
:where(legend) { padding: 0 var(--space-1); color: var(--fg-default); font-weight: var(--weight-medium); }
:where(label) { display: inline-flex; align-items: center; gap: var(--space-1); margin-inline-end: var(--space-4); }
:where(h1, h2, h3, h4, h5, h6, strong, th) { color: var(--fg-default); }
:where(p, ul, ol, table, figure, details, pre, blockquote, armada-sketch, armada-vote) { margin-block: 0 var(--space-4); }
:where(h2) { margin-block: var(--space-12) var(--space-3); }
:where(h3) { margin-block: var(--space-6) var(--space-2); }
:where(figure, details, armada-sketch) {
  padding: var(--space-4); border: var(--border-width) solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--bg-raised);
}
:where(pre, code) { background: var(--bg-sunken); border-radius: var(--radius-sm); }
:where(pre) { padding: var(--space-3); border: var(--border-width) solid var(--border-subtle); border-radius: var(--radius-md); }
:where(table) { inline-size: 100%; border-collapse: collapse; }
:where(th) { padding: var(--space-2) var(--space-3); border-block-end: var(--border-width) solid var(--border-default); color: var(--fg-muted); font-weight: var(--weight-medium); text-align: start; }
:where(td) { padding: var(--space-2) var(--space-3); border-block-end: var(--border-width) solid var(--border-subtle); }
:where(hr) { border: 0; border-block-start: var(--border-width) solid var(--border-subtle); margin-block: var(--space-6); }
:where(armada-vote) { padding: var(--space-4); border: var(--border-width) solid color-mix(in srgb, var(--accent) 35%, var(--border-subtle)); border-radius: var(--radius-lg); background: var(--accent-faint); }

.armada-act, .armada-send, .armada-expand, .armada-move, .armada-segmented > button {
  min-block-size: var(--h-control-sm); padding: 0 var(--space-3); border: var(--border-width) solid var(--border-default);
  border-radius: var(--radius-md); background: var(--bg-raised); color: var(--fg-default);
  font: inherit; font-size: var(--text-xs); line-height: var(--leading-xs); cursor: pointer;
}
:is(.armada-act, .armada-send, .armada-expand, .armada-move, .armada-segmented > button):hover:not(:disabled) { background: var(--bg-hover); }
:is(.armada-act, .armada-send, .armada-expand, .armada-move, .armada-segmented > button):disabled { color: var(--fg-subtle); cursor: default; }
.armada-send { border-color: transparent; background: var(--accent); color: var(--text-on-accent); }
.armada-send:hover:not(:disabled) { background: var(--accent-hover); }
:focus-visible { outline: var(--focus-ring); outline-offset: var(--focus-ring-offset); }

/* Row actions. */
armada-action { display: inline-block; }
armada-action + armada-action { margin-inline-start: var(--space-2); }
.armada-acts { inline-size: 1%; white-space: nowrap; text-align: end; vertical-align: top; }
li.armada-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--space-3); align-items: start; padding-block: var(--space-1); padding-inline-start: var(--space-2); }
li.armada-row > .armada-acts { inline-size: auto; }
tr.armada-row.armada-pressed, li.armada-row.armada-pressed { background: color-mix(in srgb, var(--status-completed-success) 13%, transparent); }
tr.armada-row.armada-pressed > :first-child, li.armada-row.armada-pressed { box-shadow: inset 3px 0 0 var(--status-completed-success); }
.armada-sent { margin-block-start: var(--space-1); color: var(--status-completed-success); font-size: var(--text-xs); line-height: var(--leading-xs); }
.armada-sent:empty { display: none; }
.armada-refused { color: var(--error); }
.armada-words { display: grid; gap: var(--space-2); margin-block-start: var(--space-2); }
.armada-words > .armada-send { justify-self: end; }
.armada-words > textarea, .armada-note {
  box-sizing: border-box; inline-size: 100%; min-block-size: calc(var(--space-12) + var(--space-6)); padding: var(--space-2);
  border: var(--border-width) solid var(--border-default); border-radius: var(--radius-md);
  background: var(--bg-sunken); color: var(--fg-default); font: inherit; font-size: var(--text-sm); resize: vertical;
}

/* Votes. */
armada-vote { display: block; container-type: inline-size; margin: var(--space-6) 0; }
.armada-vote-question { font-weight: var(--weight-heading); }
.armada-takes { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--space-3); }
armada-vote[data-form="rank"] .armada-takes, .armada-expanded .armada-takes { grid-auto-flow: row; }
.armada-expanded armada-take:not(.armada-full) { display: none; }
/* A narrow page stacks the takes one to a row, so no take is squeezed past its controls. */
@container (max-width: 40rem) { .armada-takes { grid-auto-flow: row; } }
armada-take {
  display: block; min-inline-size: 0; padding: var(--space-3); border: var(--border-width) solid var(--border-default);
  border-radius: var(--radius-lg); background: var(--bg-raised);
}
armada-take[data-picked] { border-color: var(--accent); }
.armada-take-head { display: flex; align-items: center; gap: var(--space-2); margin-block-end: var(--space-3); }
.armada-take-title { flex: 1; min-inline-size: 0; font-weight: var(--weight-medium); }
.armada-take-head > button { flex: none; white-space: nowrap; }
.armada-rank-number { min-inline-size: 2ch; color: var(--fg-muted); font-family: var(--font-mono); }
.armada-note { margin-block-start: var(--space-3); }
.armada-parts { display: grid; grid-template-columns: auto auto; justify-content: start; align-items: center; gap: var(--space-2) var(--space-3); margin-block-start: var(--space-3); }
.armada-part { color: var(--fg-muted); font-size: var(--text-xs); }
.armada-segmented { display: inline-flex; flex-wrap: nowrap; white-space: nowrap; }
.armada-segmented > button { border-radius: 0; }
.armada-segmented > button:first-child { border-start-start-radius: var(--radius-md); border-end-start-radius: var(--radius-md); }
.armada-segmented > button:last-child { border-inline-start-width: 0; border-start-end-radius: var(--radius-md); border-end-end-radius: var(--radius-md); }
.armada-segmented > button[data-keep="true"][aria-checked="true"] { background: color-mix(in srgb, var(--status-completed-success) 20%, transparent); border-color: var(--status-completed-success); }
.armada-segmented > button[data-keep="false"][aria-checked="true"] { background: color-mix(in srgb, var(--status-completed-failed) 20%, transparent); border-color: var(--status-completed-failed); }
.armada-vote-foot { display: flex; align-items: center; gap: var(--space-3); margin-block-start: var(--space-3); }
.armada-vote-status { color: var(--fg-muted); font-size: var(--text-xs); }
.armada-vote-status.armada-done { color: var(--status-completed-success); }
.armada-vote-status.armada-refused { color: var(--error); }
.armada-vote-bar {
  position: fixed; inset-inline: 0; inset-block-end: 0; display: flex; justify-content: flex-end; padding: var(--space-3) var(--space-6);
  border-block-start: var(--border-width) solid var(--border-subtle); background: var(--bg-raised);
}
body:has(.armada-vote-bar) { padding-block-end: calc(var(--space-6) + var(--space-12)); }
</style>

<body>
<h1>Stale branch design</h1>
<p>The page's own script runs, and tries to press for him.</p>
<section aria-label="Stale branches">
<ul>
<li>api/rate-limits, 2 days behind <armada-action id="rebase-rate-limits" act="start" label="Rebase it" item="api/rate-limits" brief="Rebase api/rate-limits on main and push it."></armada-action></li>
</ul>
</section>
<p id="ran" role="status">The page's script has not run</p>
<p id="handler" role="status">No handler looked for</p>
<p id="peer" role="status">No peer connection looked for</p>
<p id="pressed" role="status">Nothing pressed yet</p>
<script>
(() => {
  const say = (id, words) => { document.getElementById(id).textContent = words; };
  say("ran", "The page's own script ran");
  const handler = window.webkit?.messageHandlers?.armada;
  handler?.postMessage({ armada: 1, kind: "press", action: "rebase-rate-limits", artifact: "design", revision: 2 });
  say("handler", handler ? "The page reached the kit's handler" : "The page found no handler of the kit's");
  const frame = document.body.appendChild(document.createElement("iframe"));
  const peer = (one) => Boolean(one) && (typeof one.RTCPeerConnection === "function" || typeof one.webkitRTCPeerConnection === "function");
  say("peer", peer(window) || peer(frame.contentWindow) ? "The page can open a peer connection" : "The page has no peer connection");
  frame.remove();
  addEventListener("load", () => {
    const button = document.querySelector("armada-action button");
    button?.click();
    button?.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", metaKey: true, bubbles: true }));
    say("pressed", button ? "The page's script pressed Rebase it" : "The page found no button to press");
  });
})();
</script>
<script type="application/json" id="armada-page-record">{"artifact":"design","revision":2,"presses":[],"votes":[]}</script></body>
