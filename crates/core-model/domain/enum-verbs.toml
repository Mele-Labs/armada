[verbs.change_kind.type_changed]
verb = "type changed"
icon = ""
status_token = ""
vocabulary = "Change kind"
in_code = ""
notes = "A file became a directory or a symlink, or the reverse, and it is not a content change — which is the whole of what the row has to keep separate from `modified`. The underscore comes out and nothing else does: `became a different kind of file` was drafted and rejected for the width it would force on a column that is scanned beside a path. Neither glyph nor token, for `added`'s reason."

[verbs.change_kind.conflicted]
verb = "conflicted"
icon = ""
status_token = ""
vocabulary = "Change kind"
in_code = ""
notes = "git's word, kept. Neither glyph nor token, for `added`'s reason."

[verbs.change_kind.unreadable]
verb = "could not be read"
icon = ""
status_token = ""
vocabulary = "Change kind"
in_code = ""
notes = "The one change kind whose enum name states the wrong thing. `unreadable` reads as a property the file has, and what happened is that one path's reading failed while the rest did not — the file is in the diff and it is not an absence of change. The verb says which reading failed rather than claiming nothing happened, and it is past tense because the next reading may well succeed. Neither glyph nor token, for `added`'s reason."

[verbs.land_state.waiting]
verb = "waiting"
icon = "clock"
status_token = "--status-not-started"
vocabulary = "Land state"
in_code = ""
notes = "In line, and nothing is being done to it yet. The word `--status` already prints. `clock` and the queued hue are `job_status.queued`'s, borrowed one level over: a branch in line is queued work, and `clock`'s own row says it is the mark for nobody acting. The merge line is a list of branches and never a step's rail row, so the refusal `[conventions.step_activity_borrowing]` records for `clock` does not reach it."

[verbs.land_state.gating]
verb = "Running Checks before landing"
icon = "circle-dot"
status_token = "--status-running"
vocabulary = "Land state"
in_code = ""
notes = "In its turn: main merged in, the generators, `verify-foundations` and the Checks. The owner found `gating` opaque on 2 Oct 2026 and chose these words for Bridge, for while a Check runs; before one does, Bridge reads `preparing`. The key, and what `--status` prints, stay `gating`. `circle-dot` and the running hue, pulsing on the row while the turn holds it, as a running Job's badge does. Shared with `merging`, for `group_state.running`'s reason: both are the turn live, and the tooltip carries which."

[verbs.land_state.preparing]
verb = "Preparing to land"
icon = "git-merge"
status_token = "--status-running"
vocabulary = "Land state"
in_code = ""
notes = "Bridge's own, not a word the retired runner printed: a `gating` branch whose turn has run no Check yet, so main merged in, the generators or `verify-foundations`. Bridge reads it off the Check list Fleet serves (`packages/screens/src/merge-line.ts`). The owner asked for it on 2 Oct 2026. `git-merge` (the owner chose it over `hammer`), pulsing in the running hue as `gating` does; see its row in `packages/icons/icons/`."

[verbs.land_state.held]
verb = "Held, red on main"
icon = "pause"
status_token = "--status-not-started"
vocabulary = "Land state"
in_code = ""
notes = "Bridge's own, as `preparing` is, and not a word the retired runner printed: a turn whose failed Check is red on main too, so the turn holds and nobody is to blame. Bridge reads it off the line's `notice` (kind `main`) and draws it on the rows of the running turn (`packages/screens/src/merge-line.ts`). `pause` and the neutral hue, the pair the panel's Alert draws for the same state, so row and alert read as one condition. It is stationary: a held turn is doing nothing, and a pulse would say it was working. The owner asked for the mark on 5 Oct 2026."

[verbs.land_state.merging]
verb = "Pushing onto main"
icon = "circle-dot"
status_token = "--status-running"
vocabulary = "Land state"
in_code = ""
notes = "Gated green, and the runner is pushing the merge onto main. `gating`'s glyph and hue; see that row."

[verbs.land_state.landed]
verb = "landed"
icon = "check"
status_token = "--status-completed-success"
vocabulary = "Land state"
in_code = ""
notes = "On main, as its own merge commit. `check` and the success hue, `group_state.landed`'s pair. Not `git-merge`, which is reserved to a merged pull request's badge: a branch lands with no pull request at all."

[verbs.land_state.red]
verb = "Checks failed"
icon = "x"
status_token = "--status-completed-failed"
vocabulary = "Land state"
in_code = ""
notes = "The gate or a Check found the combination broken, and nothing was pushed. The line's own word, kept: `red` is what `--status`, the outcome file and `docs/capabilities/merge-line.md` all say. `x` and the failed hue, `group_state.failed`'s pair for a group whose Checks failed. Not `shield-x`, which marks one Check's result and is drawn beside each failing Check's name instead."

[verbs.land_state.conflict]
verb = "conflict"
icon = "unplug"
status_token = "--status-escalated"
vocabulary = "Land state"
in_code = ""
notes = "Main does not merge into the branch cleanly, and the branch keeps its place until somebody merges main in. `unplug`, two halves with a gap where they should join, is the merge that would not close; its usage in `packages/icons/icons/` records this. The owner refused `split` on the walk of 2 Oct 2026 and chose this over `wrench` on the next. The escalated hue because somebody has to act before it moves. Red needs that too, and the two are told apart by kind: red is a measured failure, a conflict is work owed."

[verbs.land_state.stopped]
verb = "stopped"
icon = "power"
status_token = "--status-killed"
vocabulary = "Land state"
in_code = ""
notes = "The turn ended without learning anything about the combination: the branch moved after it joined, it was withdrawn, or a tool was missing. `power` and the killed hue, the deliberate stop: the line stopped the turn, and the branch did not fail it."
