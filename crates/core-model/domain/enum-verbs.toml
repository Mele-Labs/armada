# The word, the glyph and the colour each enum variant renders as. The
# vocabulary Bridge's generated TypeScript module is built from: codegen joins
# `core-model`'s enum names to this file and emits one module the renderer
# imports, so no surface holds a verb list, a badge map or a copy of the enum
# of its own.
#
# Authored here. This file is the authority on how a variant reads; a page in
# the design workspace that disagrees with it is stale, not right.
#
# Tables nest one level: `[verbs.<enum>.<variant>]`. The inner table key is the
# wire value, so a rule can compare a set here against the Rust enum without a
# mapping in between, and the outer key names which enum that is.
#
# The enums, which `xtask`'s `VOCABULARIES` holds the same list of:
#   queued_reason              - why a branch is waiting. Only
#                                `blocked_by_dependency` is read, by the merge
#                                line
#   step_state                 - where one step of a workflow is on the rail
#   task_state                 - where one task of a Session's plan stands
#   group_state                - where one group of a Session's plan is. Its
#                                glyphs are the step's borrowed one level further
#                                down, which
#                                `[conventions.step_activity_borrowing]` in
#                                `packages/icons/icons/` sanctions
#   land_state                 - where one branch is on the merge line.
#                                Keys are the words `ipc::LandState` carries on
#                                the wire. Not paired: that enum is `crates/ipc`'s
#                                and carries a serde derive, not `as_wire` and `ALL`
#   advance_gate               - what it takes to advance past one step. No
#                                registry file of its own: the set is the
#                                WorkflowDef schema's four forms, of which
#                                `manifest_rule:<key>` is one key per row
#   auto_merge                 - whether a machine may land a repository's
#                                work. Keys are `armada.yml`'s own words,
#                                hyphen and all
#   check_outcome              - how one declared Check ended. Keys match
#                                check-outcomes.toml
#   criterion_verdict_check    - one criterion, as a mechanical Check saw it
#   criterion_verdict_judge    - one criterion, as the Judge saw it
#   evidence_type              - what one step produces as its work product. No
#                                registry file of its own
#   change_kind                - what happened to one file in a worktree, as of
#                                one reading
#
# **Several of these have no `PAIRINGS` entry in `xtask/src/rules_enums.rs`, so
# the set is declared here and compared against nothing.** `change_kind` joins
# them because the enum is `crates/ipc`'s and carries a serde derive rather than
# the `ALL` and `as_wire` pair the rule reads. `auto_merge` joins them because
# `core_model::AutoMerge` spells its words through `as_written`, not `as_wire`.
#
# Fields:
#   verb         - what a person reads. Never the enum name
#   icon         - the lucide glyph, keyed to packages/icons/icons/
#   status_token - the CSS custom property, defined in packages/tokens/src
#   vocabulary   - the enum this variant belongs to, as the source names it.
#                  Redundant against the outer table key and carried anyway:
#                  declared intent checked against what was wired
#   in_code      - whether an implementation exists, as the source recorded it.
#                  Provenance, not fact: it describes v1, which is deleted, so
#                  every "In code" here is false as a claim about this
#                  workspace
#   notes        - the reasoning the row carried
#   hint         - the sentence a tooltip reads for the variant, where the verb
#                  alone gives no reasoning. Carried only by `auto_merge`'s
#                  three rows today, where it is the consequence line drawn
#                  under the selected value; every other table leaves it unset
#                  and the generator emits `null`
#
# An empty `verb`, `icon` or `status_token` is a gap, not a default. The build
# fails where a variant lacks one; the gaps are carried so they are countable.

[verbs.step_state.advanced]
verb = "advanced"
icon = "check"
status_token = ""
vocabulary = "Step state"
in_code = ""
notes = "The inner machine's word for what the outer one calls `done`, and it stays the enum's own spelling because the enum's own spelling is already plain English — the same reason `running` and `rejected` keep theirs. `check` is the borrowing `packages/icons/icons/` sanctions under `[conventions.step_activity_borrowing]`: the Job glyph that means the same thing one level down, and a rail row that showed a different mark from the badge above it is the collision that convention exists to prevent. No token: the hue is `--step-advanced` in `packages/tokens/src/status.css`, which is its own axis and not a `--status-` stem, so it lands in GAPS the way the two Judge verdicts do. `in_code` is empty because there is no source value to carry: the row was authored here."

[verbs.step_state.awaiting_human]
verb = "needs review"
icon = "eye"
status_token = ""
vocabulary = "Step state"
in_code = ""
notes = "The same words as `job_status.awaiting_review` (`needs review`, since 4 Oct 2026), because it is the same claim one level down: `step-states.toml` sees this state beneath that status and beneath no other. `awaiting a human` would be a second phrase for one fact, and `waiting on you` would be a third. `eye` for the same reason the words are the same, and it is one of the five glyphs `[conventions.step_activity_borrowing]` names. Iconography's prose says `waiting (clock)` in the paragraph above the one that defers to that convention for the full mapping — `clock` is `queued`'s and the convention does not list it, so the convention is read as the authority and the prose as stale. Settled that way by `#347`, and Iconography now says the same. No token, for `advanced`'s reason: the hue is `--step-waiting`."

[verbs.step_state.not_started]
verb = "not started"
icon = "circle-dashed"
status_token = ""
vocabulary = "Step state"
in_code = ""
notes = "Written at Job creation for every step of the frozen WorkflowDef, so it is the state most rail rows are in and the one that must read as ordinary rather than as something withheld. The enum's spelling with its underscore taken out. `circle-dashed`, minted rather than borrowed — see `packages/icons/icons/` for the full argument against `circle-dot` and rule 3. It is the fallback `StepActivityMark` draws only where no ordinal reaches it; the ordinal keeps the mark's slot wherever `WorkflowRail` or `StepRow` supplies one, and this glyph must not be read as a reason to take that away. No token by decision rather than by omission — `packages/tokens/src/status.css` says outright that not-started takes no hue and renders in `--fg-subtle`, which `circle-dashed` inherits unchanged."

[verbs.step_state.retrying]
verb = "retrying"
icon = "rotate-cw"
status_token = ""
vocabulary = "Step state"
in_code = ""
notes = "`rotate-cw` is the single-arrow glyph, deliberately not `refresh-cw`, which `packages/icons/icons/` reserves to churning alone. The registry's own note on that row already calls it the proposed step-level retrying mark, so this is the assignment being taken up rather than made. No token: `status.css` says retrying takes no hue and renders in `--fg-muted`."

[verbs.step_state.running]
verb = "running"
icon = "circle-dot"
status_token = ""
vocabulary = "Step state"
in_code = ""
notes = "The Job glyph one level down, from `[conventions.step_activity_borrowing]`. No token, for `advanced`'s reason: the hue is `--step-running`."

[verbs.step_state.stopped]
verb = "stopped"
icon = "flag"
status_token = ""
vocabulary = "Step state"
in_code = ""
notes = "Retries spent, and neither retrying nor waiting on a person — folding it into either would make a designed human gate and a dead stop render alike, which is `step-states.toml`'s own `why`. The verb stays `stopped` rather than becoming `retries spent`: the count of attempts is on the row beside it, and a verb that stated a cause would say twice what the badge above already says once. `flag` is reserved to this state alone and to nothing else in Armada. No token, and this row is the one place that is a real loss: the state's whole treatment is a surface, `--step-stopped-bg`, rather than a glyph hue, and a `--status-` stem cannot carry it."

[verbs.task_state.open]
verb = "open"
icon = "circle-dashed"
status_token = "--status-not-started"
vocabulary = "Task state"
in_code = ""
notes = "Promoted from `packages/screens/src/draft/words.ts` with the rest of the set at protocol 22.0, spike 022 slice 1a, and that draft entry is gone. `circle-dashed` is `TaskMark`'s, under its own usage row in `packages/icons/icons/`: a stroke broken at rest, for a task no work has touched."

[verbs.task_state.working]
verb = "working"
icon = "circle-dot"
status_token = "--status-running"
vocabulary = "Task state"
in_code = ""
notes = "`circle-dot`, `job_status.running`'s glyph two levels down, as `TaskMark` already draws it."

[verbs.task_state.handed_in]
verb = "done, no edit seen"
icon = "check"
status_token = "--status-completed-success"
vocabulary = "Task state"
in_code = ""
notes = "The agent's task list says completed and Fleet saw no edit for it under its group's paths. No Checks are involved: Checks on tasks went with the old Job model, and nothing moves this state on. It reads as done, so `check` and `--status-completed-success` are `done`'s own, and `TaskMark` adds a faint `pencil-off` in the corner for the missing edit. Usually the task had no file edits: reading, running tests, a subagent's edits, or edits outside the group's paths. The wire name stays `handed_in`."

[verbs.task_state.done]
verb = "done"
icon = "check"
status_token = "--status-completed-success"
vocabulary = "Task state"
in_code = ""
notes = "The bare checkmark `TaskMark` takes for done, `step_state.advanced`'s borrowing one level further down."

[verbs.task_state.failed]
verb = "failed"
icon = "x"
status_token = "--status-completed-failed"
vocabulary = "Task state"
in_code = ""
notes = "Not `dropped`: an agent that stopped without finishing, or a group whose Checks went red, is a system failure, bare `x`'s reservation, where a drop is a person's decision. `x`'s usage row for `TaskMark` sanctions it. Written by Fleet from slice 2; nothing writes it at 22.0."

[verbs.task_state.dropped]
verb = "dropped"
icon = "minus"
status_token = "--status-killed"
vocabulary = "Task state"
in_code = ""
notes = "`minus`, under its own usage row for a dropped plan task: nobody has ruled on whether it still stands. `--status-killed`, a person's decision."

[verbs.group_state.pending]
verb = "not started"
icon = "circle-dashed"
status_token = "--status-not-started"
vocabulary = "Group state"
in_code = ""
notes = "A group's states are the step's one level further down, and they take their glyphs the way a step takes the Job's — `[conventions.step_activity_borrowing]` in `packages/icons/icons/`, which already lends `circle-dashed` to a plan task's open state on exactly this argument. The convention's own words: a second silhouette for one meaning is the collision the page exists to prevent. **No registry file of its own**, for the reason the header gives: the set is paired against `core_model::GroupState`, which Fleet writes since protocol 23.4. `--status-not-started` rather than the step row's empty token: a group's state is drawn as a tinted chip and the tint is `--status-not-started-bg`, which a step's rail row has no use for."

[verbs.group_state.running]
verb = "running"
icon = "circle-dot"
status_token = "--status-running"
vocabulary = "Group state"
in_code = ""
notes = "`circle-dot` is `job_status.running`'s own glyph, borrowed two levels down rather than one. It is shared with `joining` and `checking` below, which is deliberate: all three are the group live, and the word beside the mark is what tells the phase. A glyph each would claim three kinds of activity where there is one."

[verbs.group_state.joining]
verb = "joining"
icon = "circle-dot"
status_token = "--status-running"
vocabulary = "Group state"
in_code = ""
notes = "A concurrent group's tasks converging at its boundary. Still the group live, so `running`'s mark and hue with its own word — see that row."

[verbs.group_state.checking]
verb = "checking"
icon = "circle-dot"
status_token = "--status-running"
vocabulary = "Group state"
in_code = ""
notes = "The boundary's Checks are running. `shield-*` was refused: that family is a Check's own outcome, and this is the group being live while they run rather than a result. Still `running`'s mark and hue — see that row."

[verbs.group_state.passed]
verb = "passed"
icon = "check"
status_token = "--status-completed-success"
vocabulary = "Group state"
in_code = ""
notes = "`check`, the bare checkmark, which `circle-check`'s reservation sends every completed thing to and which `step_state.advanced` already borrows on the same grounds. Shared with `landed` below, for `running`'s reason: both are the group through, and the word carries which."

[verbs.group_state.failed]
verb = "failed"
icon = "x"
status_token = "--status-completed-failed"
vocabulary = "Group state"
in_code = ""
notes = "`x`, on the roster `[conventions.step_activity_borrowing]` names, and hued `--status-completed-failed` rather than the badge's own — the same treatment-not-glyph difference that convention records for `x` at step level. A failed group is a system failure, not a human decision, which is what keeps it inside `x`'s reservation rather than widening it."

[verbs.group_state.retrying]
verb = "retrying"
icon = "rotate-cw"
status_token = "--status-awaiting-review"
vocabulary = "Group state"
in_code = ""
notes = "`rotate-cw`, whose own row in `packages/icons/icons/` already names it \"the proposed step-level retrying mark\" and carries no reservation against this. `--status-awaiting-review` is the draft's own assignment, kept: a group between attempts is amber rather than red because nothing has failed for good."

[verbs.group_state.landed]
verb = "landed"
icon = "check"
status_token = "--status-completed-success"
vocabulary = "Group state"
in_code = ""
notes = "The group's work reached the branch. `check` and the success hue, shared with `passed` — see that row."

[verbs.queued_reason.blocked_by_dependency]
verb = "blocked"
icon = "link"
status_token = "--status-not-started"
vocabulary = "Queued reason"
in_code = ""

[verbs.criterion_verdict_check.failed]
verb = "failed"
icon = ""
status_token = ""
vocabulary = "Criterion verdict — Check"
in_code = ""

[verbs.criterion_verdict_check.not_reached]
verb = "not reached"
icon = "shield-minus"
status_token = ""
vocabulary = "Criterion verdict — Check"
in_code = ""
notes = "Moved off circle-minus when the circle-* family was reserved to Judge verdicts. shield-minus completes the check family rather than damaging it."

[verbs.criterion_verdict_check.passed]
verb = "passed"
icon = ""
status_token = ""
vocabulary = "Criterion verdict — Check"
in_code = ""

[verbs.criterion_verdict_judge.met]
verb = "no objection"
icon = "circle-check"
status_token = ""
vocabulary = "Criterion verdict — Judge"
in_code = ""
notes = "Not \"accepted\". The Judge declines to refuse; it never grants."

[verbs.criterion_verdict_judge.not_met]
verb = "refused"
icon = "circle-x"
status_token = ""
vocabulary = "Criterion verdict — Judge"
in_code = ""

[verbs.check_outcome.passed]
verb = "passed"
icon = "shield-check"
status_token = "--status-completed-success"
vocabulary = "Check outcome"
in_code = "In code"

[verbs.check_outcome.failed]
verb = "failed"
icon = "shield-x"
status_token = "--status-completed-failed"
vocabulary = "Check outcome"
in_code = "In code"
notes = "Shares gate_failure's glyph. It is the same event seen from two distances — the Check that did not pass, and the Job that stopped because of it."

[verbs.check_outcome.signalled]
verb = "ended by a signal"
icon = "unplug"
status_token = "--status-escalated"
vocabulary = "Check outcome"
in_code = "In code"
notes = "The verb says what happened rather than restating the enum: there was no exit code to compare, so the Check neither passed nor failed. Shares interrupted's glyph, which is the same shape of ending."

[verbs.check_outcome.timed_out]
verb = "outran its budget"
icon = "clock"
status_token = "--status-escalated"
vocabulary = "Check outcome"
in_code = "In code"
notes = "Not \"timed out\", which reads as the machine's word for it. The Check did not fail, it did not finish, and retrying reproduces the same hang — which is why check_timeout escalates rather than counting as a failure."

[verbs.check_outcome.never_ran]
verb = "never started"
icon = "shield-minus"
status_token = "--status-not-started"
vocabulary = "Check outcome"
in_code = "In code"
notes = "The token is not a mistake and is the one somebody will later try to correct. A Check whose command is not installed measured nothing: it must not read green, because a missing command is a failure and never a vacuous pass, and it must not read as a failed Check either, because nothing ran to fail. --status-not-started is the only one of the three that says what actually happened."

[verbs.check_outcome.skipped]
verb = "skipped"
icon = "shield-off"
status_token = "--status-not-started"
vocabulary = "Check outcome"
in_code = "In code"
notes = "Its own glyph, and that is the whole point of the row. Reusing never_ran's shield-minus would draw a Check nobody asked to run identically to a Check whose command is missing, and one of those is a failure. The verb is \"skipped\" (owner, 7 Oct 2026), changed from \"not run\", which a Check still waiting to run also reads as. The token is not-started for never_ran's reason — nothing measured, so neither green nor red is true."

[verbs.advance_gate.auto]
verb = "the checks decide"
icon = ""
status_token = ""
vocabulary = "Advance gate"
in_code = ""
notes = "Names the tier rather than the absence of a person, because `auto` reads as unattended and the step is not — it is gated, on everything `mechanical_checks[]` declares. The rail draws no row for this value at all, so the words are read where a gate is named beside a tier rather than in a list of three. Neither glyph nor token, and that is the vocabulary's decision rather than this row's: a gate is a property of the frozen step and not a status, it renders as a label beside `advance_gate` in `--fg-muted`, and the `shield-*` family is reserved to Checks. `in_code` is empty because the row was authored here."

[verbs.advance_gate.auto_if_judge_passes]
verb = "the checks decide, unless the Judge objects"
icon = ""
status_token = ""
vocabulary = "Advance gate"
in_code = ""
notes = "Deliberately does not say `if the Judge passes`, which is the enum's own name and the thing the design contract forbids saying: there is no such thing as a Judge pass, only a mechanical pass a Judge declined to refuse. `objects` is the negation of `no objection`, which is what `criterion_verdict_judge.met` already reads, so the two rows use one word for one act. It also keeps the order the gate actually runs in — the mechanical tier holds first, and the Judge can only make the answer stricter. Neither glyph nor token, for `auto`'s reason."

[verbs.advance_gate.human_always]
verb = "a person answers"
icon = ""
status_token = ""
vocabulary = "Advance gate"
in_code = ""
notes = "The two other values name a tier and this one names an actor, which is the distinction everything downstream turns on, so the verb names the actor and says nothing about the tiers. They still run and still stop the step — what they establish is the material a person reads, not the verdict — and a verb saying `no checks` or `skips the gate` would be false of both halves. `a person`, not `you`: the same Job may be answered by whoever is at the machine, and the rest of this file addresses nobody. Neither glyph nor token, for `auto`'s reason."

[verbs.advance_gate."manifest_rule:auto_merge"]
verb = "the repository's auto-merge policy decides"
icon = ""
status_token = ""
vocabulary = "Advance gate"
in_code = ""
notes = "Quoted, because a colon is outside TOML's bare-key set and the key is the wire value verbatim — `xtask/src/rules_enums.rs` strips the quotes on both sides of its comparison rather than letting two spellings exist. The verb names the policy rather than what it resolved to, and that is the row's whole point: a reader on job detail is looking at a step whose gate is not in the workflow file, and naming the answer here would state it in the one place that cannot know it. `auto-merge`, hyphenated, because the verb is prose and `auto_merge` is the key; the key is beside it in the label."

[verbs.advance_gate."manifest_rule:review_gate"]
verb = "the repository's review-gate policy decides"
icon = ""
status_token = ""
vocabulary = "Advance gate"
in_code = ""
notes = "Its sibling's shape, asked of the other question: `auto_merge` says whether work lands without a person, this says whether a person signs off before it is offered. Both read `decides` rather than `says` because the resolution happens at the gate, against the Job's gating Manifests, and is a ruling rather than a lookup. Neither glyph nor token, for `auto`'s reason."

[verbs.auto_merge.never]
verb = "a person merges"
icon = ""
status_token = ""
vocabulary = "Auto merge"
in_code = ""
hint = "A person merges every pull request here."
notes = "Names the actor, for `advance_gate.human_always`'s reason: the other two values name what Fleet waits on, and this one is no machine at all. The value where a file says nothing. Neither glyph nor token, for `advance_gate.auto`'s reason: a policy value is a property of a file, not a status. `hint` is the line the Setup sheet and the Manifest form draw under the selected value, because `checks-pass` means nothing on its own. `in_code` is empty because the row was authored here."

[verbs.auto_merge.checks-pass]
verb = "Fleet merges once the forge's checks pass"
icon = ""
status_token = ""
vocabulary = "Auto merge"
in_code = ""
hint = "Fleet merges once every check the forge runs has passed. Where the forge runs none, nothing merges."
notes = "`the forge's`, because the value's name is deliberately the ambiguous one: `core_model::AutoMerge::ChecksPass` reads the checks a forge runs on the pull request, never the Checks this file declares, which have already run at the gate this is read at. The hint's second sentence is that variant's own rule: nothing ran is not everything passed. Neither glyph nor token, for `never`'s reason."

[verbs.auto_merge.always]
verb = "Fleet merges whatever ran"
icon = ""
status_token = ""
vocabulary = "Auto merge"
in_code = ""
hint = "Fleet merges without waiting on the forge's checks."
notes = "`whatever ran` is `AutoMerge::Always`'s own doc. It separates this from `checks-pass` without claiming anything about a review step, which `review_gate` decides and this does not. Neither glyph nor token, for `never`'s reason."

[verbs.evidence_type.diff]
verb = "a diff"
icon = ""
status_token = ""
vocabulary = "Evidence type"
in_code = ""
notes = "What the step produces as its work product, in the words `docs/contracts/workflow-design-system.md` uses in its own per-type table. Neither glyph nor token, and that is the vocabulary's decision rather than this row's: it renders in mono on the evidence trail's provenance line beside the time, which is a label and not a badge, and every member of the `file-*` family that means evidence is already reserved elsewhere — `file` to the log row, `file-check` to a submission that landed, `file-diff` to opening one produced file's changes. `in_code` is empty because the row was authored here."

[verbs.evidence_type.failing_test]
verb = "a failing test"
icon = ""
status_token = ""
vocabulary = "Evidence type"
in_code = ""
notes = "The test is the product and its failing is the point — a reproduction nobody can run proves nothing, which is why Bug's `repro` step is the one this value exists for. Neither glyph nor token, for `diff`'s reason."

[verbs.evidence_type.facts_note]
verb = "a note of facts"
icon = ""
status_token = ""
vocabulary = "Evidence type"
in_code = ""
notes = "The enum's spelling read as English and no further. `a root-cause analysis` was rejected: that is the question the Judge asks of Bug's `diagnose` step and not what the type is, and writing it here would narrow a value Prototype also uses for something else. `a written finding` was rejected for the same reason, and because the phrase is already `shown_by`'s in the evidence schema. The note is a deliverable judged as one, never the Drone's account of how the step went — the transcript is that, and it is not admissible. Neither glyph nor token, for `diff`'s reason."

[verbs.evidence_type.test_suite_run]
verb = "a test suite run"
icon = ""
status_token = ""
vocabulary = "Evidence type"
in_code = ""
notes = "The enum's spelling read as English. The verb claims nothing about the outcome, which is right: the run's exit code is a deterministic fact handed to the Judge alongside the diff, and the Judge's question on this type is about the diff rather than the run. Neither glyph nor token, for `diff`'s reason."

[verbs.evidence_type.bundle]
verb = "the earlier steps' evidence, assembled"
icon = ""
status_token = ""
vocabulary = "Evidence type"
in_code = ""
notes = "The one value whose enum name tells a reader nothing, and the only one whose verb is longer than its wire spelling. It is the accumulated evidence of prior steps gathered into one payload, which is what Bug's `review` step reads — so the verb says what was gathered rather than naming the container. Neither glyph nor token, for `diff`'s reason."

[verbs.evidence_type.document]
verb = "a document"
icon = ""
status_token = ""
vocabulary = "Evidence type"
in_code = ""
notes = "Design Plan's product, and the contract's table calls it `Document or mockup`. The verb takes the narrower half: a mockup is a document here, and a verb naming both would ask a reader to pick which one arrived when the type does not distinguish them. Neither glyph nor token, for `diff`'s reason."

[verbs.evidence_type.plan]
verb = "a plan"
icon = ""
status_token = ""
vocabulary = "Evidence type"
in_code = ""
notes = "An approach and a list of tasks, recorded with `record_plan` into a record Fleet holds rather than written to a file. `#893`. Not the declared scope a step names with `declare_scope`, which is where work will be rather than what it is. Neither glyph nor token, for `diff`'s reason."

[verbs.evidence_type.review]
verb = "a review"
icon = ""
status_token = ""
vocabulary = "Evidence type"
in_code = ""
notes = "What a reviewing step hands in about a change: its areas, the tests in it, and its findings, which Fleet checks against the diff. Not `review findings`, the Code Review design's name, because the findings are one part of three. Neither glyph nor token, for `diff`'s reason. #903."

[verbs.change_kind.added]
verb = "added"
icon = ""
status_token = ""
vocabulary = "Change kind"
in_code = ""
notes = "Five of the eight change kinds keep the enum's own spelling, because git's words for what happened to a file are already the words a person reads — the same reason `running` and `passed` keep theirs. The rows exist so a surface reads them from here rather than falling through to the wire, which is what the changed-files list does today. Staged or not: an untracked file a Drone wrote is added. Neither glyph nor token, and that is the vocabulary's decision rather than this row's — a changed file is not a status, and `packages/icons/icons/` reserves `file` to the log row and `file-check` to a submission that landed, so the mark column stays empty on purpose. `in_code` is empty because the row was authored here."

