[actions.deck_tabs]
kind = "Action"
tier = "Global"
verb = "Go to a tab"
icon = ""
icon_absent = "by design"
shortcut = "⌘1–⌘9"
scope = "anywhere"
destructive = false
confirms = false
notes = "`⌘1` to `⌘9` are the places bar's tabs in the order it draws them, every drawn tab taking the next digit and a tab that is not drawn taking none: Operator, Cockpit, Jobs, Studios, Logbook, Reviews, Issues, Projects and System at most, and System opens the page last used there. A layout that hides a tab moves the digits behind it (26 Oct 2026, the owner: the digits follow what the bar draws). One row over the digits because the rule is the tab's place in the bar, not the number. Studios and Retros took `⌘4` and `⌘5` on 15 Oct 2026 (the owner: studios and retros should live in the main bar), which moved System to `⌘6` and Settings off `⌘5` to `open_settings`. Every other page is reached from the System strip, the title bar's menu, a link on the deck or the palette by name, and has no key. This row replaced `bridge_surfaces`, which numbered the rail's rows `⌘1` to `⌘9` until the rail went with #2301. The Operator became a page and the first tab on 5 Nov 2026 (the owner: it should not be an overlay), which moved every tab one digit on and took the row to `⌘9`. The digits switch screens even from a Job's message box, and the box's quick lines are `⇧⌘1` to `⇧⌘9`, which put the line in the draft and do not send it (10 Nov 2026, the owner). The native app does this; Electron still sends quick line n on `⌘n` from the box until it is ported."

[actions.open_settings]
kind = "Action"
tier = "Global"
verb = "Open Settings"
icon = "settings"
shortcut = "⌘,"
scope = "anywhere"
destructive = false
confirms = false
notes = "Opens the Settings page from anywhere, including from inside a field, as `⌘K` does. `⌘,` is the platform's own key for preferences and nothing else in the registry or Electron's menu answers it. Settings held `⌘5` as the last digit of `deck_tabs` until Studios and Retros became tabs on 15 Oct 2026."

[actions.open_file]
kind = "Action"
tier = "Global"
verb = "Open a file"
icon = "file"
shortcut = "⌘O"
scope = "anywhere"
destructive = false
confirms = false
notes = "Asks for any file on this machine in a dialog main opens, and shows it in the side panel's code editor. Works from inside a field, as `⌘N` does. Added 19 Oct 2026 with the file panel."

[actions.dispatch_repository]
kind = "Action"
tier = "Global"
verb = "Choose a repository to dispatch to"
icon = ""
icon_absent = "undecided"
shortcut = "⌥1–⌥9"
scope = "anywhere"
destructive = false
confirms = false
notes = "In the Dispatch panel, chooses the repository whose chip carries that number: the first nine of the row, the rail's repository first, then the one the words name, then the ones picked last. Where none is chosen yet it also sends, as a press on the chip does. One row over the digits because the rule is the chip's place in the row. A modifier means this tier, so it works from inside the request. Read by the key's place on the keyboard, since Option changes the character a digit types. Added 15 Oct 2026 with the one Dispatch panel. In the native Bridge the rows are his projects, each once for every repository it holds, then every repository in no project, and the digit picks the row in that order (14 Nov 2026)."

[actions.call_reply]
