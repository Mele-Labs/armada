notes = "Asks the Judge to read the words selected in the thread. Beside Ask in the selection bar and its menu: it opens the same box the other Judge presses open, with a row of judge types and the line Anything in particular?, and nothing is read until Judge is pressed in it. The reading is of kind `excerpt`, its id the row the words came from and eight hex digits of a hash of the words, its title the words. The finished reading is a Judged card at the thread's end. `POST /sessions/judge`."

[actions.card_judge]
kind = "Action"
