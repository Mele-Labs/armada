destructive = false
confirms = false
notes = "Says Yes to the Operator's pick on the item open in Your turn, the Operator's page (`operator_answer` with `yes`). The pick is drawn as the primary button with `A` on it. `a` and not `Enter`: `Enter` sends the answer picked with the digits, and on a go-ahead to file an issue the digits pick the Then, so `a` takes the pick as the Operator read it. Added 10 Nov 2026 with the native Operator page."

[actions.call_ask]
