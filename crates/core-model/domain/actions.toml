# ------------------------------------------------------------------ api client

[actions.api_client_environment]
kind = "Action"
tier = "Contextual"
verb = "Next environment"
icon = ""
icon_absent = "undecided"
shortcut = "⌘E"
scope = "api client"
destructive = false
confirms = false
notes = "Cycles the environment of a Job's API Client tab: none, then each environment in the order Fleet lists them, then none again. The environment fills each `{{name}}` of the address, the headers and the body. Its scope is the tab, so the key means this only while the keys are inside it. The Send chord is `send_message`'s, which the tab's request line also answers while it has the keys, and `⌘L` and `⌘N` stay the Layout menu's and Dispatch's. Native only, 20 Nov 2026."

[actions.api_client_part]
kind = "Action"
tier = "Contextual"
verb = "Previous or next part"
icon = ""
icon_absent = "undecided"
shortcut = "[ / ]"
scope = "api client"
destructive = false
confirms = false
notes = "Cycles the open request of a Job's API Client tab through its Headers, Body and Environment parts, `[` to the one before and `]` to the one after, round the end. A bare key, so it stands down while a text box has the keys. Native only, 20 Nov 2026."

[actions.api_client_save]
kind = "Action"
tier = "Contextual"
verb = "Save"
icon = ""
icon_absent = "undecided"
shortcut = "⌘S"
scope = "api client"
destructive = false
confirms = false
notes = "Saves what is open in a Job's API Client tab. A saved request is written back into its collection, with the collection's other requests as they are. Any other request asks for a name and a collection on a row under the request line, and a second press saves it there. A collection open on the right writes its name and shared headers, and the Environment part writes the environment the keys were last in. Nothing is saved while the person's own requests file will not read, and the control says so. Its scope is the tab, so the key means this only while the keys are inside it; `⌘S` is the Kit file editor's own while that is up. Native only, 20 Nov 2026."

[actions.usage_apply]
kind = "Action"
tier = "Contextual"
verb = "Apply the setting"
icon = ""
icon_absent = "undecided"
shortcut = "a"
scope = "usage"
destructive = false
confirms = false
notes = "Sends the value the setting's list stands on, for the row the keys are on in the Usage page's table of settings that change the burn. It does nothing where the list stands on the value in force. Native only, 19 Nov 2026."

[actions.usage_window]
kind = "Action"
tier = "Contextual"
verb = "Pick the window"
icon = ""
icon_absent = "undecided"
shortcut = "d / w / f"
scope = "usage"
destructive = false
confirms = false
notes = "Sets the window the Usage page reads to a day, a week or a fortnight, in that order: one key a window. Native only, 18 Nov 2026."

