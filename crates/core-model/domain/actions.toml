scope = "review"
destructive = false
confirms = false
notes = "Moves focus to a part of the Reviews tab: `l` the list of pull requests, `r` the pull request open in the reader, `f` the review tools at its foot. The deck's own letters for the same places (`l` and `f` of `deck_panel`), in the scope of the tab that has the same three parts. Three letters in one row because they are one act with a target; a part's key is its slot in this row, so Settings → Keyboard moves the key and the tab follows."

