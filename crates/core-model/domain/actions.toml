icon = ""
icon_absent = "undecided"
shortcut = "l b c q f a d"
scope = "deck"
destructive = false
confirms = false
notes = "Moves focus to a panel of the flight deck: `l` the list of Jobs and Sessions, `b` the bays, `c` the first row of the list that needs him, else the first place that holds a call (a merge queue chip), `q` the merge queue, `f` the flight controls, `a` Autopilot, `d` the Dispatch tile. Seven letters in one row because they are one act with a target, as `bridge_surfaces` is one row for a rail. The deck's own scope, `deck`, is where it listens: `l` and `b` are also `call_later` and `call_best`, which hold their keys only while a call pane is in front, and the deck stands down for it; `c` is `copy_debug_info` on a list, and the deck is not one. A panel's key is its slot in this row, so Settings → Keyboard moves the key and the deck follows. The map is not here: it is `dashboard_view`'s `m`, which the deck reads as the map."

[actions.deck_tile]
kind = "Action"
tier = "Contextual"
verb = "Press a flight control"
icon = ""
icon_absent = "undecided"
shortcut = "⌥⇧0–⌥⇧9"
scope = "deck"
destructive = false
confirms = false
notes = "Presses the flight control tile that wears the key, from anywhere on the deck. Option and Shift with a digit, never a bare one: a question's numbers (`call_pick`) are the bare digits, and the owner's note of 23 Oct 2026 was that the tiles pressed when he meant an answer. With no Job open the tiles are Checks, Calls, Map and Timeline, ⌥⇧1 to ⌥⇧4 until the owner rearranges them. While a Job is open on the stage the same keys press its tiles, ⌥⇧1 to ⌥⇧9 and ⌥⇧0: Ask for update, Auto land, Compact, Report, Map, Judge, Release, Artifacts, Subagents and Checks. Bays has no digit: it is lit only when a bay is wrong, and the call in the thread opens it. Pause answers `P`, which is no row of the registry since `p` is Pilot's there. Edit in the flight control band gives a tile another key, and hiding or moving a tile moves the keys after it, so these are Armada's own. A letter given to a tile is never one the registry binds on the deck. They are not rows of their own because each is a press on a tile and the key is the only way. Terminal and Browser are tabs and no longer tiles, so their keys press nothing drawn: a Job in panes brings that kind's tab to the front and focuses its pane, or opens one where it has none (Terminal answers ⌥⇧0; Browser has no key until the owner gives it one), as of 31 Oct 2026."

