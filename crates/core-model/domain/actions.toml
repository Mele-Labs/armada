# ------------------------------------------------------------------ thread

[actions.thread_yes]
kind = "Action"
tier = "Global"
verb = "Yes"
icon = ""
icon_absent = "undecided"
shortcut = "⌥↵"
scope = "thread"
destructive = false
confirms = true
notes = "The yes of the target card in a Job's thread: Approve a plan or a draft, Allow once, Answer a question, Send to job, End job, Retry a hand off. The target is the waiting card that holds focus, else the newest card still waiting. Every press opens a dialog listing each waiting card with a yes, the target picked, so three alike drafts are never approved by mistake. A modifier, so it works from the Job's message box, where the box gives ⌥↵ up rather than sending. Decided by the owner on 28 Oct 2026."

[actions.thread_change]
kind = "Action"
tier = "Global"
verb = "Change"
icon = ""
icon_absent = "undecided"
shortcut = "⌥E"
scope = "thread"
destructive = false
confirms = false
notes = "Opens the target card's own box to change what it says: a draft's Edit, a question's Other, the plan in full for a plan. No dialog: the box is the confirmation. Read by the key's place on the keyboard, since Option changes the character E types. Decided by the owner on 28 Oct 2026."

[actions.thread_send_back]
kind = "Action"
tier = "Global"
verb = "Send back"
icon = ""
icon_absent = "undecided"
shortcut = "⌥R"
scope = "thread"
destructive = false
confirms = false
notes = "Sends the target card back: a draft's Note opens, whose ⌘Enter is Send back, and a plan is set aside with Not yet. No dialog: the box is the confirmation, and a plan set aside unfolds again on a press. Read by the key's place on the keyboard, since Option changes the character R types. Decided by the owner on 28 Oct 2026."

[actions.thread_no]
kind = "Action"
tier = "Global"
verb = "No"
icon = ""
icon_absent = "undecided"
shortcut = "⌥X"
scope = "thread"
destructive = false
confirms = true
notes = "The no of the target card in a Job's thread: Deny a permission, Skip a question, Keep going after done, Withdraw a draft. Every press opens a dialog listing each waiting card with a no, the target picked. Read by the key's place on the keyboard, since Option changes the character X types. Decided by the owner on 28 Oct 2026."

[actions.needs_you]
kind = "Action"
tier = "Global"
verb = "Needs you"
icon = ""
icon_absent = "undecided"
shortcut = "⇧⌘Y"
scope = "thread"
destructive = false
confirms = false
notes = "Opens the review sheet on the Job on screen when a plan, sketch, draft, document or walk waits on the person, oldest first, each answered where it stands; the Review key on the band opens the same sheet. Where none does, it folds the Needs you card open or shut, which holds the questions, commands, pull requests and messages. Nothing happens where nothing waits."

[actions.needs_you_fold]
kind = "Action"
tier = "Global"
verb = "Fold Needs you"
icon = ""
icon_absent = "undecided"
shortcut = "⌥⌘Y"
scope = "thread"
destructive = false
confirms = false
notes = "Folds the open Job's Needs you card to its band, or opens it, from anywhere in the Job, so the thread can be read with it shut. Where a review waits ⇧⌘Y opens the sheet; this key only folds. A scroll of the thread or a press in it folds the card too. Asked for by the owner on 10 Nov 2026."

[actions.thread_find]
kind = "Action"
tier = "Global"
verb = "Find in thread"
icon = "search"
shortcut = "⌘F"
scope = "thread"
destructive = false
confirms = false
notes = "Opens a find bar over the open Job's thread with the keys in it, or puts them back in it while it is open. It searches the whole thread, rows not drawn and folds included: messages, reasoning and tool calls. Every match is marked, the current one more strongly, and a match in a folded tool run or folded reasoning opens that fold. Enter and ⇧Enter step to the next and the previous match in the bar; Esc shuts it and puts the keys in the message box. From the message box too, which leaves ⌘F to the Job. Native only. Asked for by the owner on 13 Nov 2026."

[actions.thread_find_next]
kind = "Action"
tier = "Global"
verb = "Next match"
icon = "chevron-down"
shortcut = "⌘G"
scope = "thread"
destructive = false
confirms = false
notes = "Steps to the next match of the thread's find bar while it is open, from the last back to the first, opening a fold that holds it. Enter in the bar does the same. Native only."

[actions.thread_find_previous]
kind = "Action"
tier = "Global"
verb = "Previous match"
icon = "chevron-up"
shortcut = "⇧⌘G"
scope = "thread"
destructive = false
confirms = false
notes = "Steps to the previous match of the thread's find bar while it is open, from the first round to the last. ⇧Enter in the bar does the same. Native only."

[actions.thread_question]
kind = "Action"
tier = "Global"
verb = "Go to your question"
icon = ""
icon_absent = "undecided"
shortcut = "⌥↑ ⌥↓"
scope = "thread"
destructive = false
confirms = false
notes = "Scrolls the open Job's thread to the person's previous question with ⌥↑, or the next with ⌥↓, from the item at the top of the view: a message of his that Fleet sorted as a question (`list_job_questions`). Nothing moves past the first or the last. In the message box the keys stay the box's. Native only. Approved by the owner in a sketch on 17 Nov 2026."

[actions.handoff_retry]
