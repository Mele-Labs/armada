notes = "Approves the item chosen in the review sheet, with the notes typed on it, through `answer_items` for that one item. The sheet lists the asks of one Job, or of every Job from the Jobs list, beside the chosen one. An answered ask leaves the list. There is no Approve all: each ask is answered on its own, the owner's decision of 19 Nov 2026. Its own scope, as the sheet holds the keys while it is up and its letters meet only the global ones. Native only. The owner's look, 14 Nov 2026."

[actions.items_ask_changes]
kind = "Action"
tier = "Contextual"
verb = "Ask for changes"
icon = ""
icon_absent = "undecided"
shortcut = "c"
scope = "review sheet"
destructive = false
confirms = false
notes = "Sends the chosen item back with its notes through `answer_items`. With no notes typed it puts the caret in the item's notes and sends nothing, since Fleet refuses a send back with none (`fleet.items_send_back_empty`). In the notes `⌘↵` sends. Native only, 14 Nov 2026."

[actions.items_dismiss]
kind = "Action"
tier = "Contextual"
verb = "Dismiss"
icon = ""
icon_absent = "undecided"
shortcut = "d"
scope = "review sheet"
destructive = false
confirms = false
notes = "Takes the chosen item off his list with no verdict, through `dismiss_items` for that one item. Native only, 14 Nov 2026."

[actions.items_edit]
kind = "Action"
tier = "Contextual"
verb = "Edit"
icon = ""
icon_absent = "undecided"
shortcut = "e"
scope = "review sheet"
destructive = false
confirms = false
notes = "Opens the chosen draft's words in the sheet's answer bar, to fix before approving. `⌘↵` approves it with his words in place of the Job's through `answer_waiting` with `fixed`, or as written where he changed nothing; Esc shuts the box. Only a draft offers it. It took the place of the draft card's own Edit when the review sheet became the one place an ask is answered, the owner's decision of 19 Nov 2026. Native only, 21 Nov 2026."

[actions.items_move]
kind = "Motion"
tier = "Contextual"
verb = "Move between items"
icon = ""
shortcut = "j / k / ↓ / ↑"
scope = "review sheet"
destructive = false
confirms = false
notes = "Chooses the next or the previous item of the review sheet, across its Jobs' groups. Its own row for the reason `plan`'s is: the sheet's list is not the Board's. Native only, 14 Nov 2026."

[actions.build_note_step]
kind = "Action"
tier = "Contextual"
verb = "Go to step"
icon = ""
icon_absent = "undecided"
shortcut = "1–9"
scope = "review sheet"
destructive = false
confirms = false
notes = "The number on each step of a note in the In this build sheet, which opens on a preview build that holds branches Jobs offered. It runs that step's Go: the sheet closes and the step's act runs on the app. A step with no act has no Go and its number does nothing, and nothing happens on a number past the last step. The sheet shares the review sheet's scope because it is the same kind of sheet and holds its keys while it is up. Native only, 14 Nov 2026."

[actions.build_note_looked]
kind = "Action"
tier = "Contextual"
verb = "Good"
icon = ""
icon_absent = "undecided"
shortcut = "⌘E"
scope = "review sheet"
destructive = false
confirms = false
notes = "Marks the chosen note of the In this build sheet looked at and good, through `mark_build_note_looked_at` with the verdict `good`. Fleet keeps it for that branch at that tip, so a later build with the same tip finds it marked, and tells the note's Job its work is fine. The id stays from when the press read Looked at. ⌘E, since ⌘L is the Layout menu's everywhere the sheet's scope meets. Native only, 14 Nov 2026; Good on ⌘E since 15 Nov."

[actions.build_note_needs_work]
kind = "Action"
tier = "Contextual"
verb = "Needs work"
icon = ""
icon_absent = "undecided"
shortcut = "⇧⌘E"
scope = "review sheet"
destructive = false
confirms = false
notes = "Marks the chosen note of the In this build sheet looked at and needing work, through `mark_build_note_looked_at` with the verdict `needs_work`, and puts the keys in the note's box. Fleet tells the note's Job to wait for his words, which Send carries. Shift on Good's chord. Native only, 15 Nov 2026."

[actions.build_note_open_job]
kind = "Action"
tier = "Contextual"
verb = "Open Job"
icon = ""
icon_absent = "undecided"
shortcut = "⌥⌘O"
scope = "review sheet"
destructive = false
confirms = false
notes = "Closes the In this build sheet and opens the thread of the chosen note's Job on the Jobs screen, as a Job from the command palette opens, ended or not. ⌥⌘O, since ⌘O is Open a file's and a bare O is typing in the note's box. Native only, 16 Nov 2026."

# --------------------------------------------------------------------- kit

[actions.kit_move]
kind = "Motion"
tier = "Contextual"
verb = "Move between pieces"
icon = ""
shortcut = "j / k / ↓ / ↑"
scope = "kit"
destructive = false
confirms = false
notes = "Picks the next or the previous piece in Kit's list, the next or previous kind in its rail, and scrolls the file by a line in its read pane. Its own row because Kit is not a list of Jobs, and `move_focus`'s scope is. Native only, 16 Nov 2026."

[actions.kit_pane]
kind = "Motion"
tier = "Contextual"
verb = "Move between panes"
icon = ""
shortcut = "Tab / ⇧Tab"
scope = "kit"
destructive = false
confirms = false
notes = "Gives the keys to the next or the previous of Kit's three panes: the rail, the list and the read pane. It wraps round at either end. Native only, 16 Nov 2026."

[actions.kit_toggle]
kind = "Action"
tier = "Contextual"
verb = "Turn on or off"
icon = ""
icon_absent = "undecided"
shortcut = "Space"
scope = "kit"
destructive = false
confirms = false
notes = "Turns the piece picked on or off for this project: a skill for each of the project's repositories, a server's reach in the Manifest. A piece with no switch ignores it. Native only, 16 Nov 2026."

[actions.kit_remove]
kind = "Action"
tier = "Contextual"
verb = "Remove"
icon = ""
icon_absent = "undecided"
shortcut = "Backspace / Delete"
scope = "kit"
destructive = false
confirms = false
notes = "Removes the piece picked. A skill goes to the Trash and stays in the list with Restore, and ⌘Z brings it back. A plugin asks first, and an allowed command or a server Kit holds is taken out at once. A piece a plugin brought has no Remove and says which plugin does. Not destructive for the reason `projects_delete` is not. Native only, 16 Nov 2026."

[actions.kit_edit]
kind = "Action"
tier = "Contextual"
verb = "Edit"
icon = ""
icon_absent = "undecided"
shortcut = "e"
scope = "kit"
destructive = false
confirms = false
notes = "Turns the read pane into a text box over the file. Esc leaves it and ⌘S saves it, and those two stay the pane's own while it is up. A file a plugin brought is not his to edit, and the key does nothing there. Native only, 16 Nov 2026."

[actions.kit_open]
kind = "Action"
tier = "Contextual"
verb = "Open in editor"
icon = ""
icon_absent = "undecided"
shortcut = "Enter"
scope = "kit"
destructive = false
confirms = false
notes = "Hands the file of the piece picked to his editor, outside Bridge. Enter on the question that asks before a plugin is removed answers that question instead. Native only, 16 Nov 2026."

[actions.kit_filter]
kind = "Action"
tier = "Contextual"
verb = "Filter"
icon = ""
icon_absent = "undecided"
shortcut = "/"
scope = "kit"
destructive = false
confirms = false
notes = "Puts the caret in the box above Kit's list, which narrows the pieces of the kind shown as he types. Esc gives the keys back to the list. Native only, 16 Nov 2026."

[actions.kit_add]
kind = "Action"
tier = "Contextual"
verb = "Add from a link"
icon = ""
icon_absent = "undecided"
shortcut = "a"
scope = "kit"
destructive = false
confirms = false
notes = "Opens the box that takes a link to a piece and adds it to Kit. Enter in the box looks at the link and then adds what it found, and Esc closes the box. Native only, 16 Nov 2026."

[actions.kit_scroll]
kind = "Motion"
tier = "Contextual"
verb = "Scroll the file"
icon = ""
shortcut = "PageDown / PageUp / ⌥↓ / ⌥↑ / Home / End"
scope = "kit"
destructive = false
confirms = false
notes = "Scrolls Kit's read pane by a page or to either end, while the keys are on that pane and nowhere else. The first four go down and up by a page and the last two to the top and the bottom. Native only, 16 Nov 2026."

