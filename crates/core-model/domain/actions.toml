icon_absent = "undecided"
shortcut = "r"
scope = "thread"
destructive = false
confirms = false
notes = "Starts a failed hand off again, from the band on the composer, while focus is inside the band. The band's own key since it was drawn; moved into the registry so Settings can rebind it. ⌥↵ reaches the same Retry when the band is the target card."

[actions.handoff_dispatch]
