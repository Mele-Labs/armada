# The verb, the glyph and the binding every act in Bridge carries. The artifact
# `docs/contracts/design-system.md` promises under "One artifact, three
# columns", and the source the two key-map blocks under "Two tiers" are
# transcribed from.
#
# Authored here. This file is the authority on what an act is called and what
# it is bound to. The contract's blocks are the same map written for a design
# session to paste, and the gate fails where the two disagree.
#
# **The glyph is a reference, never a copy.** `icon` names a key in
# `packages/icons/icons/`, which stays the authority on what a silhouette
# may mean and what it may never be reused for; a second roster of glyphs here
# is the drift this repository has collected before. The same holds against
# `enum-verbs.toml`, which carries the word a *state* renders as. Nothing there
# is an act and no key is spelled in both files.
#
# The table key is the id an implementation binds to. `shortcut` is the binding
# spelled exactly as the contract spells it, so a rule compares the two with no
# mapping in between: `⌘1–⌘5` is one row rather than five because the contract
# makes the rule the tab's place in the bar rather than the digits, and five rows
# would fix an assignment it refuses to fix.
#
# Fields:
#   kind        - Action | Motion. A Motion moves the cursor, appears in no
#                 palette and so carries no glyph. Every other row is an act
#   tier        - Global | Contextual
#   verb        - what a person reads, in the lexicon's word. Never the id
#   icon        - a glyph key in packages/icons/icons/
#   icon_absent - why the glyph column is empty where it is. `undecided`, or
#                 `by design` where a document decided this act carries none.
#                 An Action with neither a glyph nor a reason fails the gate
#   shortcut    - the binding, as the contract's map spells it
#   scope       - where the binding is offered: anywhere | list |
#                 list and detail | open studio | dashboard | deck | review | call |
#                 logbook | issues | report | plan | thread | dispatch |
#                 review sheet | kit | usage | features
#   destructive - whether it ends or overrules a record
#   confirms    - whether it takes a confirmation. Destructive implies it
#   unbuilt     - the issue that builds the act, on a row Bridge cannot answer
#                 yet. Absent means live. The gate refuses anything here that
#                 is not an issue reference, and the contract's map annotates
#                 the same rows `not built`
#   notes       - the reasoning the row carries
#
# `icon_absent = "undecided"` is a gap, not a default: no registered glyph
# means the act, and inventing one is a decision that belongs in the icon
# registry rather than here. The gate counts the rows carrying it; what a new
# action may not do is ship without either.
#
# **`unbuilt` is the other kind of blank, and it is not a gap.** This file was
# transcribed from a map settled by drawing the Board and the palette together,
# so it holds acts nobody has written. The palette displays a binding beside every entry,
# which makes a row nothing answers a key a person will press; the alternative
# to a column is a list of them in `apps/`, which is the second registry this
# file exists to prevent. A row loses the field in the change that builds it.

# ------------------------------------------------------------------ global

[actions.command_palette]
kind = "Action"
tier = "Global"
verb = "Command palette"
icon = ""
icon_absent = "undecided"
shortcut = "⌘K"
scope = "anywhere"
destructive = false
confirms = false
notes = "The palette is the discovery surface for every other row here, and it is the one row that cannot be discovered inside it. `search` was not taken: the registry gives it to the search control, and the palette is a superset of the UI rather than a search over a list."

[actions.operator]
kind = "Action"
tier = "Global"
verb = "Operator"
icon = "bot"
shortcut = "⌘J"
scope = "anywhere"
destructive = false
confirms = false
notes = "Toggles the Operator's panel, a dock over the content on every Bridge surface rather than in the rail. Decided with the owner on 2026-09-13 (#948): the dock left the rail, so it takes no digit after the last surface, and the rail's digits are the rail's alone. It read ⌘5 until 2026-09-03 and ⌘6 until this. In the native Bridge the Operator's page is the right side of the Cockpit, and this key puts the caret in its talk box; with a Job open over the page it keeps the Job's side chat."

[actions.toast_history]
kind = "Action"
tier = "Global"
verb = "Toasts"
icon = "bell"
shortcut = "⌥⌘N"
scope = "anywhere"
destructive = false
confirms = false
notes = "Opens and shuts the history of what the Operator raised as toasts, from the bell in the native title bar. Native only. Taken 10 Nov 2026; nothing held it."

[actions.new_terminal_job]
kind = "Action"
tier = "Global"
verb = "New Side Job"
icon = "plus"
shortcut = "⌘T"
scope = "anywhere"
destructive = false
confirms = false
notes = "Starts a Job with no sheet and opens it on its thread with the keys in its message box: in the project or repository the window is on, else the open Job's, else the place one last started in, and the dispatch sheet where there is none. Fleet's Side Job (`start_side_job`): its agent waits until he writes, and no shell opens until he asks for one from the Job's +. Native only. Taken 12 Nov 2026; nothing held it, the walk window's takes are ⌥⌘T, and a shell never hears a ⌘ chord. Renamed from New terminal the same day, when he wanted to start a Job and jump into it, on its thread. The id stays `new_terminal_job`. Renamed New Side Job on 13 Nov 2026, the name Fleet gives it."

[actions.toast_focus]
kind = "Action"
tier = "Global"
verb = "Newest toast"
icon = "bell-ring"
shortcut = "⌥⌘J"
scope = "anywhere"
destructive = false
confirms = false
notes = "Puts the keys on the newest open toast, where A presses its pick, L puts it Later and Esc shuts it. Native only. ⌥ beside the Operator's ⌘J; taken 10 Nov 2026, nothing held it."

[actions.prototype_pop_out]
kind = "Action"
tier = "Global"
verb = "Pop out"
icon = "maximize-2"
shortcut = "⌥⌘P"
scope = "prototype"
destructive = false
confirms = false
notes = "Opens the prototype in front in a window of its own, with the note capture over it, so ⌥⌘A works there and its notes go to the Job. Answered where the focus is in a Job's Prototype tab. Native only. Taken 23 Nov 2026; nothing held it."

[actions.open_kit]
kind = "Action"
tier = "Global"
verb = "Kit"
icon = "briefcase"
shortcut = "⇧⌘K"
scope = "anywhere"
destructive = false
confirms = false
notes = "Brings Kit to the front: the owner's Claude Code setup, kind by kind, in the native Bridge's strip. Native only. Taken 16 Nov 2026 with Kit's own place; the glyph is the registry's, reserved to the Kit surface."

[actions.capture_note]
kind = "Action"
tier = "Global"
verb = "Capture a note"
icon = ""
icon_absent = "undecided"
shortcut = "⌥⌘C"
scope = "anywhere"
destructive = false
confirms = false
notes = "Studio capture (#1290): point at something wrong anywhere in Bridge and it lands on the open Studio as a Note. Global, because what is wrong is on whatever surface a person is looking at rather than on the Studio. The modifier pair is the development annotation layer's own — ⌥⌘A, which stays permanently and is not in this registry, and ships in every build since 19 Nov 2026 — so the two capture tools sit a key apart and neither is a bare ⌘. C for capture; ⌥⌘C is bound by no Electron default menu and by nothing else here. No glyph: nothing registered means pointing at a thing, and the nearest silhouettes are all spoken for — `flag` is an alert's, `stamp` is attest's, `message-square` is a thread's."

[actions.history]
kind = "Action"
tier = "Global"
verb = "Back / forward"
icon = "chevron-left"
shortcut = "⌘[ ⌘]"
scope = "anywhere"
destructive = false
confirms = false
notes = "One row for a pair, because the two are one act with a direction. The row names the back half's glyph, `chevron-left`, leading `Back to …` in Sheet's head; the forward half takes `chevron-right`, trailing its label. Both registered by the owner on 30 Sep 2026, once Job detail's Back trail had drawn Back as words alone."

[actions.browser_reload]
kind = "Action"
tier = "Global"
verb = "Reload"
icon = "refresh-cw"
shortcut = "⌘R"
scope = "anywhere"
destructive = false
confirms = false
notes = "Reloads the page of the Job browser tab in front of the focused pane in the open Job's area; with no Job browser in front it does nothing, and the key goes on to whatever else holds it. Native only: Classic's Job browser reads ⌘R from its own pane. Its glyph is the one the icon registry proposes for Reload on the Job browser's head. Back and Forward are `history`'s two slots, with the same rule. Added 17 Nov 2026 with the native Job browser."

[actions.send_message]
kind = "Action"
tier = "Global"
verb = "Send"
icon = ""
icon_absent = "undecided"
shortcut = "⌘Enter"
scope = "anywhere"
destructive = false
confirms = false
notes = "The owner's note of 18 Sep 2026: hold Cmd over a message box and the Send button shows the key that sends it. Global, because it is modifier-based and the two boxes that answer it — the drone message box at the foot of a step's activity, and a Job's composer — sit on detail and on every surface respectively; `anywhere` is where a composer can hold focus, not a claim that the key fires with nothing focused. Plain Enter stays a new line in both, which is what makes the modifier necessary: a note to a drone is prose. The palette draws this row and cannot press it, the same as Report and the Studio's three — `classic-final:apps/desktop/src/renderer/src/palette.ts` says so. No glyph: `send` is the registry's paper plane and means Dispatch, `message-square` is a thread's, `corner-up-right` is Redirect's, and reusing any of them would give one silhouette two meanings. Three fields already bound ⌘Enter with nothing in here to read — `StudioAddNode`, `StudioCapture` and the annotation layer's own note field — which is the drift this row closes; none of the three was rewired by the change that added it."

[actions.queue_session]
kind = "Action"
tier = "Global"
verb = "Queue for later"
icon = ""
icon_absent = "undecided"
shortcut = "⇧⌘Enter"
scope = "anywhere"
destructive = false
confirms = false
notes = "In the Dispatch panel on a Session, saves the request as an idea to start later instead of starting it: the idea keeps its words, its repository and the model and effort picked, and waits at the head of its repository's group in the Cockpit's list, with Start and Remove. The same act as the Queue for later button, from inside the request where `Enter` starts. Global, because it is modifier-based, and the shifted form of `send_message` so the two keys read as one family: the ⌘ key that sends, and the same key with Shift that saves. Plain `Enter` still starts a Session. A Job and an Autopilot have no queue, so the key does nothing there. The button draws the key while ⌘ is held, as Send does. No glyph: the button is a word. Added 16 Oct 2026."

[actions.margin_send_held]
kind = "Action"
tier = "Global"
verb = "Send held"
icon = ""
icon_absent = "undecided"
shortcut = "⇧⌘↵"
scope = "thread"
destructive = false
confirms = false
notes = "In a page's tab on a Job, sends every comment he holds in the page's margin to the agent together, the same act as the margin's Send held button, which draws the key. Acts where the page's reader holds the keys or the caret is in one of its comment boxes, and does nothing where he holds no comment. The shifted form of `send_message`, which sends the one comment the caret is in, so the pair reads as Queue for later's does: the ⌘ key that sends now, and the same key with Shift for what waits. Its own row and `thread` scope, as `queue_session` does nothing on a Job; spelled `⇧⌘↵` so the contract's map names it on a line of its own. Native only, 21 Nov 2026."

[actions.draft_session]
kind = "Action"
tier = "Global"
verb = "Draft"
icon = ""
icon_absent = "undecided"
shortcut = "⌥Enter"
scope = "dispatch"
destructive = false
confirms = false
notes = "In the Dispatch panel on a Job, starts it on its start card: nothing runs until Start is pressed there. Start itself runs at once. Added 12 Nov 2026. Its own `dispatch` scope, as the panel holds the keys while it is up: anywhere, `⌥Enter` met `thread_yes` (13 Nov 2026)."

[actions.dispatch_after]
kind = "Action"
tier = "Global"
verb = "Dispatch after another Job"
icon = ""
icon_absent = "undecided"
shortcut = "⌥A"
scope = "anywhere"
destructive = false
confirms = false
notes = "Opens the Dispatch panel on a Session with an `@` typed at the end of the request, and the menu of live Sessions open on it: pick one and the brief waits on it. Inside the panel it types the `@` at the caret, from any kind. The sentence over the request then shows the proposer's reading of the wait (which Session, when, from where, what it needs). A modifier means this tier, so it works from inside the request. Read by the key's place on the keyboard, since Option changes the character A types. No glyph: the request is the act, and `link` is the mark of a Session that already waits. Added 16 Oct 2026 with the Session that waits on another."

[actions.message_job]
kind = "Action"
tier = "Global"
verb = "Message the Job"
icon = ""
icon_absent = "undecided"
shortcut = "⌥M"
scope = "anywhere"
destructive = false
confirms = false
notes = "Puts the caret in the open Job's message box from anywhere in its view, a field or a layer included. A modifier means this tier, so it works while another field has focus; with no Job open it does nothing. ⌥M is the Job view's own family (⌥W, ⌥1–⌥3, ⌥F, ⌥N, ⌥L) and free in the map: ⌘J is the Operator's panel, ⌘M is the platform's Minimize, and a bare letter would be suppressed in the field the person is leaving. Read by the key's place on the keyboard, since Option changes the character M types. No glyph: `message-square` is a thread's. Added 27 Oct 2026 on the owner's *\"a key to jump to the Job's composer\"*. On the native Operator page it puts the caret in the message box pinned at the page's foot (12 Nov 2026)."

[actions.pane_split_right]
kind = "Action"
tier = "Global"
verb = "Split right"
icon = ""
icon_absent = "undecided"
shortcut = "⌘D"
scope = "anywhere"
destructive = false
confirms = false
notes = "Splits the focused pane of the open Job's area, and the new pane opens empty to its right. With no Job open it does nothing. Read by the key's place on the keyboard, since Option changes the character D types. Added 30 Oct 2026 with the Job's arrangeable panes. No glyph: a tab's menu names it in words."

[actions.pane_split_down]
kind = "Action"
tier = "Global"
verb = "Split down"
icon = ""
icon_absent = "undecided"
shortcut = "⌘⌥D"
scope = "anywhere"
destructive = false
confirms = false
notes = "Splits the focused pane of the open Job's area, and the new pane opens empty below it. ⇧⌘D is Debug Bridge's, so the split down takes Option. Added 30 Oct 2026 with the Job's arrangeable panes."

[actions.pane_zoom]
kind = "Action"
tier = "Global"
verb = "Zoom pane"
icon = "maximize-2"
shortcut = "⌥⌘Enter"
scope = "anywhere"
destructive = false
confirms = false
notes = "Zooms the focused pane of the open Job's area over the rest of the Cockpit below the title bar, or puts it back. A view only: the arrangement, the layout's edited mark and the undo history are untouched, and a change of Job or the Layout menu ends it. A text box keeps the key, and ⇧⌘Enter is the Dispatch panel's queue key, so zoom took Option instead. With no Job open it does nothing. Added 30 Oct 2026 with the Job's arrangeable panes."

[actions.layout_menu]
kind = "Action"
tier = "Global"
verb = "Layout"
icon = ""
icon_absent = "undecided"
shortcut = "⌘L"
scope = "anywhere"
destructive = false
confirms = false
notes = "Opens the Layout menu in the open Job's header: the layouts to take, and Update, Save as, Reset and New Jobs open on, which opens a submenu of the layouts. With no Job open it does nothing. Added 30 Oct 2026 with the Job's arrangeable panes."

[actions.pane_undo]
kind = "Action"
tier = "Global"
verb = "Undo arrangement"
icon = ""
icon_absent = "undecided"
shortcut = "⌘Z"
scope = "anywhere"
destructive = false
confirms = false
notes = "Takes back the last change to the open Job's panes, tabs and layout, one Job at a time. A text box keeps ⌘Z for its own typing, so it is heard everywhere else. With no Job open it does nothing. Added 30 Oct 2026 with the Job's arrangeable panes."

[actions.pane_redo]
kind = "Action"
tier = "Global"
verb = "Redo arrangement"
icon = ""
icon_absent = "undecided"
shortcut = "⇧⌘Z"
scope = "anywhere"
destructive = false
confirms = false
notes = "Puts back the change ⌘Z took back. A text box keeps ⇧⌘Z for its own typing. Added 30 Oct 2026 with the Job's arrangeable panes."

[actions.next_tab]
kind = "Action"
tier = "Global"
verb = "Next tab"
icon = ""
icon_absent = "undecided"
shortcut = "⌃Tab"
scope = "anywhere"
destructive = false
confirms = false
notes = "Brings the next tab of the focused pane to the front, wrapping round. ⌃ is spelled out because ⌘ answers to Control too, and this key is the browsers' own. Added 30 Oct 2026 with the Job's arrangeable panes."

[actions.previous_tab]
kind = "Action"
tier = "Global"
verb = "Previous tab"
icon = ""
icon_absent = "undecided"
shortcut = "⌃⇧Tab"
scope = "anywhere"
destructive = false
confirms = false
notes = "Brings the previous tab of the focused pane to the front, wrapping round. Added 30 Oct 2026 with the Job's arrangeable panes."

[actions.focus_pane]
kind = "Motion"
tier = "Global"
verb = "Move to the pane"
shortcut = "⌘⌥← / ⌘⌥↑ / ⌘⌥→ / ⌘⌥↓"
scope = "anywhere"
destructive = false
confirms = false
notes = "Moves the focus to the pane beside the focused one, in the direction of the arrow, in the open Job's area. A Motion: it acts on nothing and appears in no palette. Added 30 Oct 2026 with the Job's arrangeable panes."

[actions.move_tab_next_pane]
kind = "Action"
tier = "Global"
verb = "Move tab to the next pane"
icon = ""
icon_absent = "undecided"
shortcut = "⌃⌘]"
scope = "anywhere"
destructive = false
confirms = false
notes = "Moves the tab the keys are on to the pane after the focused one in the open Job's area, to the front of it, wrapping round. A pane left with no tab goes. Added 13 Nov 2026 with the Job's panes drawn natively."

[actions.pane_grow]
kind = "Action"
tier = "Global"
verb = "Grow pane"
icon = ""
icon_absent = "undecided"
shortcut = "⌃⌘="
scope = "anywhere"
destructive = false
confirms = false
notes = "Widens the focused pane in the open Job's area by one step toward its neighbour, or heightens it where it is stacked, keeping each pane its least size. A run of presses is one step for undo. Added 13 Nov 2026 with the Job's panes drawn natively."

[actions.pane_shrink]
kind = "Action"
tier = "Global"
verb = "Shrink pane"
icon = ""
icon_absent = "undecided"
shortcut = "⌃⌘-"
scope = "anywhere"
destructive = false
confirms = false
notes = "The reverse of Grow pane: the focused pane gives one step to its neighbour. Added 13 Nov 2026 with the Job's panes drawn natively."

[actions.close]
kind = "Action"
tier = "Global"
verb = "Close"
icon = "x"
shortcut = "Esc"
scope = "anywhere"
destructive = false
confirms = false
notes = "Closes an overlay, or returns to the list from a detail route. `x` is the badge set's system-failure mark and the registry already carries its second reading: as chrome it is the dialog close, unchanged."

[actions.refresh]
kind = "Action"
tier = "Global"
verb = "Refresh"
icon = ""
icon_absent = "undecided"
shortcut = "⇧⌘R"
scope = "anywhere"
destructive = false
confirms = false
notes = "Re-reads everything Fleet holds over the connection Bridge already has; it does not reconnect. The owner's note of 1 Oct 2026 took it off Overview's menu and put it on a key, and he chose ⇧⌘R over ⌘R: ⌘R stays Electron's own View > Reload, which reloads the whole window, and a hand that presses it out of habit still gets that. ⇧⌘R was Electron's Force Reload in the same default menu. Bridge's handler takes the press first and prevents it, which stops the menu ever seeing it — measured against Electron 40 on 1 Oct 2026. Spelled in Apple's modifier order, ⇧ before ⌘, as `capture_note`'s ⌥⌘C is. No glyph: `rotate-cw` means Redispatch and `refresh-cw` is reserved to churning, so both rotation silhouettes are spoken for."

[actions.debug_bridge]
kind = "Action"
tier = "Global"
verb = "Debug Bridge"
icon = ""
icon_absent = "undecided"
shortcut = "⇧⌘D"
scope = "anywhere"
destructive = false
confirms = false
notes = "Shoots the whole window, records the page, the open Job or Session, the connection and Doctor's read as a whole-window annotation, and starts a Session on Bridge's own repository with all of it as the first message, then opens that Session. The owner asked for it on 12 Oct 2026, to report the state of the app in one keystroke rather than through the annotation layer. Dev only: a packaged Bridge has no repository of its own source, so the palette draws it dormant there. ⇧⌘D and not ⌥⌘D, which macOS takes to hide the Dock."

# -------------------------------------------------------------- contextual

[actions.move_focus]
kind = "Motion"
tier = "Contextual"
verb = "Move focus"
icon = ""
shortcut = "j / k / ↓ / ↑"
scope = "list"
destructive = false
confirms = false
notes = "The two navigation keys the destructive-key rule is measured against. A list is a listbox and already roves on the arrows; j and k are here because nothing else claims them. The scope covered detail too, because the run tree and the activity log were listboxes — moving between steps and moving between rows are one act. **Retired:** the run tree went with Overview's reframe of 29 Sep 2026 and the activity log with #1761, so nothing on detail roves and the owner had the detail half removed (2 Oct 2026). The Board's list keeps it."

[actions.open_focused]
kind = "Motion"
tier = "Contextual"
verb = "Open the focused job"
icon = ""
shortcut = "Enter"
scope = "list"
destructive = false
confirms = false
notes = "Acts on nothing, which is what makes it a motion rather than a second Open. Enter belongs to whatever holds focus first — a row, a button — and this is what it means when none of them does."

[actions.open]
kind = "Action"
tier = "Contextual"
verb = "Open"
icon = ""
icon_absent = "undecided"
shortcut = "o"
scope = "list"
destructive = false
confirms = false
notes = "The same act as Enter, named so the palette can display it — which is the whole reason it has a row of its own. The deck's lists answer it too (Jobs and Sessions, Activity, Bays, the merge queue), since the deck's list is in this scope; the stage's page, the flight controls and Autopilot do not. `external-link` is not it: that hands a path to something outside Bridge."

[actions.copy_debug_info]
kind = "Action"
tier = "Contextual"
verb = "Copy debug info"
icon = ""
icon_absent = "by design"
shortcut = "c"
scope = "list and detail"
destructive = false
confirms = false
notes = "The contract decides the blank: nothing in the error treatment carries a glyph, and `triangle-alert` and `octagon-alert` are both spoken for. `copy` was not taken either — it means copy an id or a path, and a debug payload is an artifact rather than a value. Widening it is a decision for the icon registry."

[actions.move_to_mac]
kind = "Action"
tier = "Contextual"
verb = "Move to another Mac"
icon = ""
icon_absent = "undecided"
shortcut = "M"
scope = "list"
destructive = false
confirms = false
notes = "Moves the focused Job to his other Mac, or brings it here where that Mac holds it: Fleet's `move_job_to_mac`, which waits for the Job's turn to end, then pauses it, pushes its branch and resumes it there. Offered only while another Mac is linked, and on a Job that has not ended, is not paused and is not moving already. Native only. Shifted because `m` is the Cockpit's map; Pause (`p`) and Snooze (`z`) are the Jobs list's own bare keys and carry no row, so the next row act takes a capital. No glyph: nothing registered means a Job travelling between machines, and `monitor` and `laptop` are each reserved for where a thing is. The palette answers it as the row's own act, with ⌥⌘M. Taken 14 Nov 2026."

[actions.move_to_project]
kind = "Action"
tier = "Contextual"
verb = "Move to project"
icon = ""
icon_absent = "undecided"
shortcut = "P"
scope = "list"
destructive = false
confirms = false
notes = "Moves the Jobs under the keys into one of his projects, or out to none: the row's own Job, or every Job selected where the row is among them. Opens the project picker, whose rows are his projects with their repositories under the name, then the copies of his other Mac's shared projects with that Mac named on the line, and No project last; a copy takes a Job only where it lists the Job's repository (`fleet.project_copy_not_member`); the project every Job stands in is ticked. Fleet's `set_session_project` writes it for live and ended Jobs alike, and the Jobs list regroups on the `session.changed` it publishes. Native only. Shifted because Pause (`p`) is the Jobs list's own bare key and carries no row. No glyph: `layers` means how many places a Job writes, so a project is not its meaning. A Job on another Mac is left off, with why, because Fleet answers it 404. The palette answers it as the row's own act, with ⌥⌘P, and as a command for the open Job. Taken 15 Nov 2026."

[actions.start_sub_project]
kind = "Action"
tier = "Contextual"
verb = "Start a sub project"
icon = "boxes"
shortcut = "S"
scope = "list"
destructive = false
confirms = false
notes = "Groups the Jobs under the keys under a name he gives: the row's own Job, or every Job selected where the row is among them. Opens the naming sheet in the project picker's place, with the features those Jobs write to now under Comes with; Enter sends Fleet's `start_sub_project`, Esc leaves. The sub project heads the list in every grouping, and a live Job that writes to one of its features joins it there. Native only. Shifted as Move to project is: the Jobs list's bare keys are its own and carry no row, so a row act takes a capital. Taken 26 Nov 2026."

[actions.deck_select]
kind = "Action"
tier = "Contextual"
verb = "Select the row"
icon = ""
icon_absent = "undecided"
shortcut = "Space / x"
scope = "list"
destructive = false
confirms = false
notes = "Selects the focused Job, or takes it out of the selection, as a ⌘-click on it does. ⇧↓ and ⇧↑ select the Job they move to, and ⇧-click selects the range from the Job last clicked. Esc clears the selection while there is one, and otherwise keeps its meaning. The Jobs selected move to a project together on `P`. A queued idea and a project's name are never selected. Native only. Taken 15 Nov 2026."

[actions.new_job]
kind = "Action"
tier = "Contextual"
verb = "Dispatch"
icon = "plus"
shortcut = "⌘N"
scope = "anywhere"
destructive = false
confirms = false
notes = "The one contextual key that acts on nothing on screen, which is why its scope is anywhere rather than the list it is pressed on. Renamed from `New job` on 2026-09-14 (#1087): the owner put this act in the title row and wanted it called Dispatch there, which means it now shares its verb with the dispatch card's own submit — this row opens the card, the card's own button sends what it read. The id stays `new_job`; only the rendered word moved. Icon decided 2026-09-14 (#1107): `plus`, newly registered in `packages/icons/icons/` for this row. From 15 Oct 2026 this key opens the Dispatch panel directly from every surface, a centred sheet over the window with the caret in the request, where a Job, a Session or an Autopilot is chosen; the palette is search only. The Cockpit's Dispatch tile and every New job entry open the same sheet. The Cockpit's own dispatch bar was removed on 13 Oct 2026. The key was a bare `n` until 31 Oct 2026, when it became `⌘N` because a bare letter fired while typing; `dispatch_from_field` was folded into it."

[actions.add_note]
kind = "Action"
tier = "Contextual"
verb = "Add a note"
icon = "sticky-note"
shortcut = "N"
scope = "open studio"
destructive = false
confirms = false
notes = "The first of the three kinds a person puts on a Studio by hand (#1364), and the one the owner went looking for and did not find. `N` for a node, as the design drew it, shifted because plain `n` is Dispatch and its scope is `anywhere` — an unshifted `n` on a Studio would open the composer under a person reaching for a note. The shifted set is where a second act on a spoken-for letter goes; `X`, `B` and `T` are the precedent. Scoped `open studio`, which is a place and not a Job: none of these three acts on anything focused, they act on the board. The glyph is the rail's, `packages/icons/icons/`'s `sticky-note`, group `Canvas rail`: the owner, 2 Oct 2026, *"Give them the rail's icons"*, so the palette and the rail draw one act one way."

[actions.add_link]
kind = "Action"
tier = "Contextual"
verb = "Add a link"
icon = "link"
shortcut = "V"
scope = "open studio"
destructive = false
confirms = false
notes = "A board, document, issue, page or session, kept as its address — `docs/concepts/studio.md`, Nodes. `V` as the design drew it, which reads as the paste key it sits beside, and shifted because `v` is Observe. A Link is not read in by adding it: reading one in is a scout's act (#1293) and this only puts the address on the board. The glyph is the rail's `link`, on its `Canvas rail` usage: the owner, 2 Oct 2026, *"Give them the rail's icons"*. The row's first meaning is the Queued reason badge's, something upstream unfinished, and the registry permits the second because that one is a 12px badge and this a 16px control the badge is never drawn beside."

[actions.add_sketch]
