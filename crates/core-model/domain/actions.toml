destructive = false
confirms = false
notes = "Presses Catch up on the librarian card over the Features list, which runs the project's librarian now. It does nothing while the librarian is reading or has read through the last merge. Native only, 18 Nov 2026."

[actions.features_who_view]
kind = "Action"
tier = "Contextual"
