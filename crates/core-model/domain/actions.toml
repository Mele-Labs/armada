# The verb, the glyph and the binding every act in Bridge carries. The artifact
# `docs/contracts/design-system.md` promises under "One artifact, three
# columns", and the source the two key-map blocks under "Two tiers" are
# transcribed from.
#
# Authored here. This file is the authority on what an act is called and what
# it is bound to. The contract's blocks are the same map written for a design
# session to paste, and the gate fails where the two disagree.
#
# **The glyph is a reference, never a copy.** `icon` names a key in
# `packages/icons/icons/`, which stays the authority on what a silhouette
# may mean and what it may never be reused for; a second roster of glyphs here
# is the drift this repository has collected before. The same holds against
# `enum-verbs.toml`, which carries the word a *state* renders as. Nothing there
# is an act and no key is spelled in both files.
#
# The table key is the id an implementation binds to. `shortcut` is the binding
# spelled exactly as the contract spells it, so a rule compares the two with no
# mapping in between: `⌘1–⌘5` is one row rather than five because the contract
# makes the rule the tab's place in the bar rather than the digits, and five rows
# would fix an assignment it refuses to fix.
#
# Fields:
#   kind        - Action | Motion. A Motion moves the cursor, appears in no
#                 palette and so carries no glyph. Every other row is an act
#   tier        - Global | Contextual
#   verb        - what a person reads, in the lexicon's word. Never the id
#   icon        - a glyph key in packages/icons/icons/
#   icon_absent - why the glyph column is empty where it is. `undecided`, or
#                 `by design` where a document decided this act carries none.
#                 An Action with neither a glyph nor a reason fails the gate
#   shortcut    - the binding, as the contract's map spells it
#   scope       - where the binding is offered: anywhere | list |
#                 list and detail | open studio | dashboard | deck | review | call |
#                 logbook
#   destructive - whether it ends or overrules a record
#   confirms    - whether it takes a confirmation. Destructive implies it
#   unbuilt     - the issue that builds the act, on a row Bridge cannot answer
#                 yet. Absent means live. The gate refuses anything here that
#                 is not an issue reference, and the contract's map annotates
#                 the same rows `not built`
#   notes       - the reasoning the row carries
#
# `icon_absent = "undecided"` is a gap, not a default: no registered glyph
# means the act, and inventing one is a decision that belongs in the icon
# registry rather than here. The gate counts the rows carrying it; what a new
# action may not do is ship without either.
#
# **`unbuilt` is the other kind of blank, and it is not a gap.** This file was
# transcribed from a map settled by drawing the Board and the palette together,
# so it holds acts nobody has written. The palette displays a binding beside every entry,
# which makes a row nothing answers a key a person will press; the alternative
# to a column is a list of them in `apps/`, which is the second registry this
# file exists to prevent. A row loses the field in the change that builds it.

# ------------------------------------------------------------------ global

[actions.command_palette]
kind = "Action"
tier = "Global"
verb = "Command palette"
icon = ""
icon_absent = "undecided"
shortcut = "⌘K"
scope = "anywhere"
destructive = false
confirms = false
notes = "The palette is the discovery surface for every other row here, and it is the one row that cannot be discovered inside it. `search` was not taken: the registry gives it to the search control, and the palette is a superset of the UI rather than a search over a list."

[actions.helm]
kind = "Action"
tier = "Global"
verb = "Helm"
icon = "message-square"
shortcut = "⌘J"
scope = "anywhere"
destructive = false
confirms = false
notes = "Toggles Helm's dock, which sits beside the content on every Bridge surface rather than in the rail. Decided with the owner on 2026-09-13 (#948): Helm left the rail, so it no longer takes the digit after the last surface, and the rail's digits are the rail's alone. It read ⌘5 until 2026-09-03 and ⌘6 until this. The glyph is the registry's own assignment for Helm."

[actions.capture_note]
kind = "Action"
tier = "Global"
verb = "Capture a note"
icon = ""
icon_absent = "undecided"
shortcut = "⌥⌘C"
scope = "anywhere"
destructive = false
confirms = false
notes = "Studio capture (#1290): point at something wrong anywhere in Bridge and it lands on the open Studio as a Note. Global, because what is wrong is on whatever surface a person is looking at rather than on the Studio. The modifier pair is the development annotation layer's own — ⌥⌘A, which stays permanently and is not in this registry because it ships in no packaged build — so the two capture tools sit a key apart and neither is a bare ⌘. C for capture; ⌥⌘C is bound by no Electron default menu and by nothing else here. No glyph: nothing registered means pointing at a thing, and the nearest silhouettes are all spoken for — `flag` is an alert's, `stamp` is attest's, `message-square` is Helm's."

[actions.history]
kind = "Action"
tier = "Global"
verb = "Back / forward"
icon = "chevron-left"
shortcut = "⌘[ ⌘]"
scope = "anywhere"
destructive = false
confirms = false
notes = "One row for a pair, because the two are one act with a direction. The row names the back half's glyph, `chevron-left`, leading `Back to …` in Sheet's head; the forward half takes `chevron-right`, trailing its label. Both registered by the owner on 30 Sep 2026, once Job detail's Back trail had drawn Back as words alone."

[actions.send_message]
kind = "Action"
tier = "Global"
verb = "Send"
icon = ""
icon_absent = "undecided"
shortcut = "⌘Enter"
scope = "anywhere"
destructive = false
confirms = false
notes = "The owner's note of 18 Sep 2026: hold Cmd over a message box and the Send button shows the key that sends it. Global, because it is modifier-based and the two boxes that answer it — the drone message box at the foot of a step's activity, and Helm's composer — sit on detail and on every surface respectively; `anywhere` is where a composer can hold focus, not a claim that the key fires with nothing focused. Plain Enter stays a new line in both, which is what makes the modifier necessary: a note to a drone is prose. The palette draws this row and cannot press it, the same as Report and the Studio's three — `apps/desktop/src/renderer/src/palette.ts` says so. No glyph: `send` is the registry's paper plane and means Dispatch, `message-square` is Helm's own, `corner-up-right` is Redirect's, and reusing any of them would give one silhouette two meanings. Three fields already bound ⌘Enter with nothing in here to read — `StudioAddNode`, `StudioCapture` and the annotation layer's own note field — which is the drift this row closes; none of the three was rewired by the change that added it."

[actions.queue_session]
kind = "Action"
tier = "Global"
verb = "Queue for later"
icon = ""
icon_absent = "undecided"
shortcut = "⇧⌘Enter"
scope = "anywhere"
destructive = false
confirms = false
notes = "In the Dispatch panel on a Session, saves the request as an idea to start later instead of starting it: the idea keeps its words, its repository and the model and effort picked, and waits at the head of its repository's group in the Cockpit's list, with Start and Remove. The same act as the Queue for later button, from inside the request where `Enter` starts. Global, because it is modifier-based, and the shifted form of `send_message` so the two keys read as one family: the ⌘ key that sends, and the same key with Shift that saves. Plain `Enter` still starts a Session. A Job and an Autopilot have no queue, so the key does nothing there. The button draws the key while ⌘ is held, as Send does. No glyph: the button is a word. Added 16 Oct 2026."

[actions.dispatch_after]
kind = "Action"
tier = "Global"
verb = "Dispatch after another Job"
icon = ""
icon_absent = "undecided"
shortcut = "⌥A"
scope = "anywhere"
destructive = false
confirms = false
notes = "Opens the Dispatch panel on a Session with an `@` typed at the end of the request, and the menu of live Sessions open on it: pick one and the brief waits on it. Inside the panel it types the `@` at the caret, from any kind. The sentence over the request then shows the proposer's reading of the wait (which Session, when, from where, what it needs). A modifier means this tier, so it works from inside the request. Read by the key's place on the keyboard, since Option changes the character A types. No glyph: the request is the act, and `link` is the mark of a Session that already waits. Added 16 Oct 2026 with the Session that waits on another."

[actions.close]
kind = "Action"
tier = "Global"
verb = "Close"
icon = "x"
shortcut = "Esc"
scope = "anywhere"
destructive = false
confirms = false
notes = "Closes an overlay, or returns to the list from a detail route. `x` is the badge set's system-failure mark and the registry already carries its second reading: as chrome it is the dialog close, unchanged."

[actions.refresh]
kind = "Action"
tier = "Global"
verb = "Refresh"
icon = ""
icon_absent = "undecided"
shortcut = "⇧⌘R"
scope = "anywhere"
destructive = false
confirms = false
notes = "Re-reads everything Fleet holds over the connection Bridge already has; it does not reconnect. The owner's note of 1 Oct 2026 took it off Overview's menu and put it on a key, and he chose ⇧⌘R over ⌘R: ⌘R stays Electron's own View > Reload, which reloads the whole window, and a hand that presses it out of habit still gets that. ⇧⌘R was Electron's Force Reload in the same default menu. Bridge's handler takes the press first and prevents it, which stops the menu ever seeing it — measured against Electron 40 on 1 Oct 2026. Spelled in Apple's modifier order, ⇧ before ⌘, as `capture_note`'s ⌥⌘C is. No glyph: `rotate-cw` means Redispatch and `refresh-cw` is reserved to churning, so both rotation silhouettes are spoken for."

[actions.debug_bridge]
kind = "Action"
tier = "Global"
verb = "Debug Bridge"
icon = ""
icon_absent = "undecided"
shortcut = "⇧⌘D"
scope = "anywhere"
destructive = false
confirms = false
notes = "Shoots the whole window, records the page, the open Job or Session, the connection and Doctor's read as a whole-window annotation, and starts a Session on Bridge's own repository with all of it as the first message, then opens that Session. The owner asked for it on 12 Oct 2026, to report the state of the app in one keystroke rather than through the annotation layer. Dev only, like the layer: a packaged Bridge has no capture and no repository of its own source, so the palette draws it dormant there. ⇧⌘D and not ⌥⌘D, which macOS takes to hide the Dock."

# -------------------------------------------------------------- contextual

[actions.move_focus]
kind = "Motion"
tier = "Contextual"
verb = "Move focus"
icon = ""
shortcut = "j / k / ↓ / ↑"
scope = "list"
destructive = false
confirms = false
notes = "The two navigation keys the destructive-key rule is measured against. A list is a listbox and already roves on the arrows; j and k are here because nothing else claims them. The scope covered detail too, because the run tree and the activity log were listboxes — moving between steps and moving between rows are one act. **Retired:** the run tree went with Overview's reframe of 29 Sep 2026 and the activity log with #1761, so nothing on detail roves and the owner had the detail half removed (2 Oct 2026). The Board's list keeps it."

[actions.open_focused]
kind = "Motion"
tier = "Contextual"
verb = "Open the focused job"
icon = ""
shortcut = "Enter"
scope = "list"
destructive = false
confirms = false
notes = "Acts on nothing, which is what makes it a motion rather than a second Open. Enter belongs to whatever holds focus first — a row, a button — and this is what it means when none of them does."

[actions.open]
kind = "Action"
tier = "Contextual"
verb = "Open"
icon = ""
icon_absent = "undecided"
shortcut = "o"
scope = "list"
destructive = false
confirms = false
notes = "The same act as Enter, named so the palette can display it — which is the whole reason it has a row of its own. The deck's lists answer it too (Jobs and Sessions, Activity, Bays, the merge queue), since the deck's list is in this scope; the stage's page, the flight controls and Autopilot do not. `external-link` is not it: that hands a path to something outside Bridge."

[actions.copy_debug_info]
kind = "Action"
tier = "Contextual"
verb = "Copy debug info"
icon = ""
icon_absent = "by design"
shortcut = "c"
scope = "list and detail"
destructive = false
confirms = false
notes = "The contract decides the blank: nothing in the error treatment carries a glyph, and `triangle-alert` and `octagon-alert` are both spoken for. `copy` was not taken either — it means copy an id or a path, and a debug payload is an artifact rather than a value. Widening it is a decision for the icon registry."

[actions.new_job]
kind = "Action"
tier = "Contextual"
verb = "Dispatch"
icon = "plus"
shortcut = "n"
scope = "anywhere"
destructive = false
confirms = false
notes = "The one contextual key that acts on nothing on screen, which is why its scope is anywhere rather than the list it is pressed on. Renamed from `New job` on 2026-09-14 (#1087): the owner put this act in the title row and wanted it called Dispatch there, which means it now shares its verb with the dispatch card's own submit — this row opens the card, the card's own button sends what it read. The id stays `new_job`; only the rendered word moved. Icon decided 2026-09-14 (#1107): `plus`, newly registered in `packages/icons/icons/` for this row. From 15 Oct 2026 `n`, and `⌘N` from inside a field, open the Dispatch panel directly from every surface, a centred sheet over the window with the caret in the request, where a Job, a Session or an Autopilot is chosen; the palette is search only. The Cockpit's Dispatch tile and every New job entry open the same sheet. The Cockpit's own dispatch bar was removed on 13 Oct 2026."

[actions.add_note]
kind = "Action"
tier = "Contextual"
verb = "Add a note"
icon = "sticky-note"
shortcut = "N"
scope = "open studio"
destructive = false
confirms = false
notes = "The first of the three kinds a person puts on a Studio by hand (#1364), and the one the owner went looking for and did not find. `N` for a node, as the design drew it, shifted because plain `n` is Dispatch and its scope is `anywhere` — an unshifted `n` on a Studio would open the composer under a person reaching for a note. The shifted set is where a second act on a spoken-for letter goes; `X`, `B` and `T` are the precedent. Scoped `open studio`, which is a place and not a Job: none of these three acts on anything focused, they act on the board. The glyph is the rail's, `packages/icons/icons/`'s `sticky-note`, group `Canvas rail`: the owner, 2 Oct 2026, *"Give them the rail's icons"*, so the palette and the rail draw one act one way."

[actions.add_link]
kind = "Action"
tier = "Contextual"
verb = "Add a link"
icon = "link"
shortcut = "V"
scope = "open studio"
destructive = false
confirms = false
notes = "A board, document, issue, page or session, kept as its address — `docs/concepts/studio.md`, Nodes. `V` as the design drew it, which reads as the paste key it sits beside, and shifted because `v` is Observe. A Link is not read in by adding it: reading one in is a scout's act (#1293) and this only puts the address on the board. The glyph is the rail's `link`, on its `Canvas rail` usage: the owner, 2 Oct 2026, *"Give them the rail's icons"*. The row's first meaning is the Queued reason badge's, something upstream unfinished, and the registry permits the second because that one is a 12px badge and this a 16px control the badge is never drawn beside."

[actions.add_sketch]
kind = "Action"
tier = "Contextual"
verb = "Add a sketch"
icon = "shapes"
shortcut = "S"
scope = "open studio"
destructive = false
confirms = false
notes = "The third kind, and the one the design did not draw: it drew `R` for a run, which `start_studio_run` holds. `S` for sketch, shifted because `s` is Restart step. Placing a Sketch opens the pad where it was put down, and the node draws the drawing left on it (1 Oct 2026); an image pasted on its own is a Picture. The glyph is the rail's `shapes`, for `add_note`'s reason."

[actions.add_zone]
kind = "Action"
tier = "Contextual"
verb = "Add a zone"
icon = "vector-square"
shortcut = "Z"
scope = "open studio"
destructive = false
confirms = false
notes = "A Zone rings off part of a Studio so what is in it moves together (#1620). The word is the owner's, 28 Sep 2026: `.claude/decisions/2026-09-28-the-studio-container-is-a-zone.md`. Placing one puts an empty Zone where the board was pressed, with no field: a Zone holds no words, and a node dropped on it goes in. `Z` for zone, shifted because a single letter on an open Studio is a node's and `z` is free only by accident. The glyph is `packages/icons/icons/`'s `vector-square`, group `Canvas rail`."

[actions.start_studio_run]
kind = "Action"
tier = "Contextual"
verb = "Run"
icon = "zap"
shortcut = "R"
scope = "open studio"
destructive = false
confirms = false
notes = "Run on a Studio's rail (`.claude/decisions/2026-10-02-run-is-on-the-rail.md`): the key and the palette row open the same menu its press does — the Checks and Commands the checkout declares, then its servers — and the node lands where the person is looking. Added 2 Oct 2026 on the owner's *\"Add it, with R as the original design drew it.\"* Shifted, on `add_note`'s precedent, because `r` is Review on a list and the run sheet on detail. Off when the rail's Run is off, for the rail's reason — read-only, no connection, or nothing declared — and the palette row says that reason. The glyph is the rail's `zap`, whose row reserves it to this act."

[actions.call_pick]
kind = "Action"
tier = "Contextual"
verb = "Pick an answer"
icon = ""
icon_absent = "undecided"
shortcut = "1–9"
scope = "call"
destructive = false
confirms = false
notes = "The number on each answer of the call in front, as `ROW_VERBS` numbers a row's own act. A digit only picks; `Enter` sends. Nothing happens on a number past the last answer."

[actions.call_send]
kind = "Action"
tier = "Contextual"
verb = "Send the answer"
icon = ""
icon_absent = "undecided"
shortcut = "Enter"
scope = "call"
destructive = false
confirms = false
notes = "Sends the answer picked on the call in front, or opens what the call is about where it has no answer. **Never said again**: an `Enter` pressed while the card is leaving is dropped, because a second press must never send the next call."

[actions.call_later]
kind = "Action"
tier = "Contextual"
verb = "Later"
icon = ""
icon_absent = "undecided"
shortcut = "l"
scope = "call"
destructive = false
confirms = false
notes = "Puts the call in front at the back of the stack of waiting calls. `Esc` does the same while a call is in front, and is not a second row because `Esc` is the Global close above and means the same thing there: step back from what is in front."

[actions.call_dismiss]
kind = "Action"
tier = "Contextual"
verb = "Dismiss"
icon = ""
icon_absent = "undecided"
shortcut = "d"
scope = "call"
destructive = false
confirms = false
notes = "Removes the call in front for good, where `call_later` only puts it at the back. Its tooltip reads *Never show this again*. A Session's waiting item is dismissed on the Session (`POST /sessions/waiting/dismiss`, and until the window has that route a remembered set keyed `session_id:item_id`); a call about a state Fleet raised (a failing pull request, main red, a failed Check, a stuck Drone) is remembered by that state, so the same failure stays gone and the next one shows. `d` is Redirect on a list and detail, a different scope. Added 9 Oct 2026 on the owner's *\"It thinks a bunch of things need me when really they don't. I should be able to ignore these for good, not just save for later.\"*"

[actions.call_expand]
kind = "Action"
tier = "Contextual"
verb = "Expand the request"
icon = ""
icon_absent = "undecided"
shortcut = "e"
scope = "call"
destructive = false
confirms = false
notes = "Opens the whole of what the owner dispatched the Job with, on a call whose request is longer than its clamp. The card says the key beside its own button."

[actions.call_open_walk]
kind = "Action"
tier = "Contextual"
verb = "Open walk"
icon = ""
icon_absent = "undecided"
shortcut = "v"
scope = "call"
destructive = false
confirms = false
notes = "Opens the walk a Session is waiting on the owner's approval of, from the call in front, where `o` opens the Session. Only a call whose waiting item acts on a walk offers it. Opening the walk does not clear the call; Approve still does. `w` is `call_recall` and stays so. Added 9 Oct 2026 on the owner's *\"Where there is a walk waiting for my approval, the card should give me the option to open the walk, not just the session.\"*"

[actions.call_best]
kind = "Action"
tier = "Contextual"
verb = "Make the best decision"
icon = ""
icon_absent = "undecided"
shortcut = "b"
scope = "call"
destructive = false
confirms = false
notes = "A standing answer, after the numbered ones, on a question an agent asked and could answer itself: a Plan question, a Drone's or a Judge's, a Session's permission or a Session's question with options. **Never on a Session's plain line**, which is an errand for the owner (a command to run, a pull request to approve, a page to open): that gets its own act and a text box. It tells the agent to weigh the options and choose the best solution itself; on a Session's permission, to weigh the command and decide whether to run it. **Never on a call Fleet raises about a state** — a failing pull request, main red, a failed Check, a stuck Drone. Needs a Fleet command: an answer to the ask carrying `mode: "best"`. Settled with the owner on 9 Oct 2026."

[actions.call_quick]
kind = "Action"
tier = "Contextual"
verb = "Just get it done"
icon = ""
icon_absent = "undecided"
shortcut = "g"
scope = "call"
destructive = false
confirms = false
notes = "The other standing answer, on the same calls as `b`: take the reasonable path, finish the work and land it, skipping the formalities (no asking again whether to land); on a Session's permission, run the command if it is reasonable. Needs a Fleet command: an answer to the ask carrying `mode: "quick"`."

[actions.call_recall]
kind = "Action"
tier = "Contextual"
verb = "Bring a waiting call back"
icon = ""
icon_absent = "undecided"
shortcut = "w"
scope = "dashboard"
destructive = false
confirms = false
notes = "Brings the nearest of the waiting calls to the front, when none is in front. A press on the strip does the same."

[actions.dashboard_view]
kind = "Action"
tier = "Contextual"
verb = "Show the map"
icon = "chart-no-axes-gantt"
shortcut = "m"
scope = "dashboard"
destructive = false
confirms = false
notes = "Shows the map on the Cockpit's stage, as `t` shows the timeline. The choice is remembered. Until #2301 this flipped the Dashboard panel between its tiles and its timeline; the tiles went with the grid Cockpit and the row kept its key."

[actions.key_sheet]
kind = "Action"
tier = "Contextual"
verb = "Show the keys"
icon = ""
icon_absent = "undecided"
shortcut = "?"
scope = "dashboard"
destructive = false
confirms = false
notes = "Opens the sheet that lists every key the Cockpit answers, grouped by what it acts on."

[actions.deck_panel]
kind = "Action"
tier = "Contextual"
verb = "Go to a panel"
icon = ""
icon_absent = "undecided"
shortcut = "l b c q f a d"
scope = "deck"
destructive = false
confirms = false
notes = "Moves focus to a panel of the flight deck: `l` the list of Jobs and Sessions, `b` the bays, `c` the first row of the list that needs him, else the first place that holds a call (a merge queue chip, then Helm or Sleep in the title row), `q` the merge queue, `f` the flight controls, `a` Autopilot, `d` the Dispatch tile. Seven letters in one row because they are one act with a target, as `bridge_surfaces` is one row for a rail. The deck's own scope, `deck`, is where it listens: `l` and `b` are also `call_later` and `call_best`, which hold their keys only while a call pane is in front, and the deck stands down for it; `c` is `copy_debug_info` on a list, and the deck is not one. A panel's key is its slot in this row, so Settings → Keyboard moves the key and the deck follows. The map is not here: it is `dashboard_view`'s `m`, which the deck reads as the map."

[actions.deck_tile]
kind = "Action"
tier = "Contextual"
verb = "Press a flight control"
icon = ""
icon_absent = "undecided"
shortcut = "0–9"
scope = "deck"
destructive = false
confirms = false
notes = "Presses the flight control tile that wears the key, from anywhere on the deck. Bare digits, as `call_pick` is: a call pane in front takes them while it is up, and gives them back. With no Job open the tiles are Checks, Calls, Map and Timeline, `1` to `4` until the owner rearranges them. While a Job is open on the stage the same digits press its tiles, `1` to `9` and `0`: Ask for update, Auto land, Compact, Report, Map, Judge, Release, Artifacts, Subagents and Checks. Bays has no digit: it is lit only when a bay is wrong, and the call in the thread opens it. Pause answers `P`, which is no row of the registry since `p` is Pilot's there. Edit in the flight control band gives a tile another digit or a letter, and hiding or moving a tile moves the keys after it, so these are Armada's own. A letter given to a tile is never one the registry binds on the deck. They are not rows of their own because each is a press on a tile and the key is the only way."

[actions.deck_timeline]
kind = "Action"
tier = "Contextual"
verb = "Show the timeline"
icon = ""
icon_absent = "undecided"
shortcut = "t"
scope = "deck"
destructive = false
confirms = false
notes = "Shows the deck's event timeline on the stage and takes focus to it. `t` is `call_reply` on a call. On the deck it is the timeline's, as `c` is a panel's. `m` shows the map."

[actions.deck_field]
kind = "Action"
tier = "Contextual"
verb = "Expand the Field"
icon = "maximize-2"
shortcut = "e"
scope = "deck"
destructive = false
confirms = false
notes = "While a Session is open on the stage, opens its Field large in the layer over the stage, with the plan along its foot; the same key, Esc or Back puts it back and focus returns to the control. `e` is `call_expand` on a call: a different scope, never in front at once. Added on the owner's 16 Oct 2026 ask to expand the Field in the panel overlay."

[actions.deck_search]
kind = "Action"
tier = "Contextual"
verb = "Search the list"
icon = ""
icon_absent = "undecided"
shortcut = "/"
scope = "deck"
destructive = false
confirms = false
notes = "Opens the Work list's Filter menu with its search field focused, from anywhere on the deck outside a text box. ↑ from the list's first row does the same. `/` is `review_search` on the Reviews tab: a different scope, so neither is the other's conflict."

[actions.deck_reorder]
kind = "Action"
tier = "Contextual"
verb = "Move the row up or down"
icon = ""
icon_absent = "undecided"
shortcut = "⌥↑ ⌥↓"
scope = "deck"
destructive = false
confirms = false
notes = "Moves the Session under the cursor past the one above it or below it in the Work list, inside its repository heading and never across one. The same move a drag makes: the order is his, kept on this machine, and a state change never moves a row. A Session handed a plan group goes where its parent goes. ⌥ and an arrow are bound by nothing else in Bridge."

[actions.deck_page]
kind = "Action"
tier = "Contextual"
verb = "Go to a page"
icon = ""
icon_absent = "undecided"
shortcut = "g"
scope = "deck"
destructive = false
confirms = false
notes = "The first key of a two key chord: `g` and then `c` the Cockpit, `j` Jobs, `s` Sessions or `y` System. The second key is read only for the moment after `g` and is not a binding of its own, which is why the row is `g` and not four keys: the keymap holds a key and not a sequence. `g` is `call_quick` while a call is in front."

[actions.review_panel]
kind = "Action"
