icon = ""
icon_absent = "undecided"
shortcut = "v"
scope = "features"
destructive = false
confirms = false
notes = "Cycles Who's on what through its three layouts, Grid, By feature and By person, and round again, from the page or from the list while that page is the one beside it. The choice is kept for the next start. `v` is free in the features scope; `call_open_walk` has it in the call's. Native only, 18 Nov 2026."

[actions.features_story]
kind = "Action"
tier = "Contextual"
verb = "Open the story of the ask"
icon = ""
icon_absent = "undecided"
shortcut = "s"
scope = "features"
destructive = false
confirms = false
notes = "Opens the Job an ask on a feature's page came from, on its Story tab, at that ask. The same as Enter on the row and a press on its Story link. An ask filed outside a Job has none. Native only, 17 Nov 2026."

[actions.note_feature]
kind = "Action"
tier = "Contextual"
verb = "Open the feature of this note"
icon = ""
icon_absent = "undecided"
shortcut = "f"
scope = "features"
destructive = false
confirms = false
notes = "On the card of a note in the annotation layer: opens the page of the feature the note's element belongs to beside the card, and the next feature on a press while one is open, where the note maps to several. Fleet maps it from the file the element was drawn from, else from its component's name. The scope is `features` because the layer has none of its own and the key belongs to the feature page it opens; the card takes the scope's context while it has the keys. Esc closes the page before it closes the card. Native only, 17 Nov 2026."

[actions.message_kind]
kind = "Action"
tier = "Global"
verb = "Change the kind of the message"
icon = ""
icon_absent = "undecided"
shortcut = "⌥K"
scope = "thread"
destructive = false
confirms = false
notes = "Opens the menu under the kind chip of one of his messages in a Job's thread, which lists Bug, Change request, Idea, Fix, Revision, Answer and Talk, the current one marked. The target is the chip that holds focus, else the chip of his newest sorted message. Revision and Answer then list the Job's open asks. Read by the key's place on the keyboard, since Option changes the character K types; K is free in the thread beside ⌥E, ⌥R and ⌥X. Native only, 17 Nov 2026."

[actions.thread_rail]
kind = "Action"
tier = "Global"
verb = "Open the asks of this thread"
icon = ""
icon_absent = "undecided"
shortcut = "⌥T"
scope = "thread"
destructive = false
confirms = false
notes = "Opens the list beside the contents rail on a Job's thread, which names each ask said in the thread in the order its first words come, the one in view marked. Up and Down move along it, Enter scrolls the thread to where the ask started and Esc puts the list away. A thread with no asks has no rail and the key does nothing. Read by the key's place on the keyboard, since Option changes the character T types; T is free in the thread beside ⌥E, ⌥R, ⌥X and ⌥K. Native only, 17 Nov 2026."

[actions.ask_for_tool]
kind = "Action"
tier = "Global"
verb = "Ask the agent for a tool"
icon = "plus"
shortcut = "⌘/"
scope = "thread"
destructive = false
confirms = false
notes = "Opens the list of Armada's own tools over the open Job's message box, as its + button does: Sketch, Diagram, Takes, Document, Browser, Terminal, Features and API Client. Up and Down move, Enter or Tab puts the tool's chip at the caret, and Esc puts the list away with the keys still in the box. When the message is sent, Fleet tells the agent which tool to use. ⌘K is the palette's, so the key is ⌘/, beside the / that lists the agent's own commands. Native only, 19 Nov 2026."

