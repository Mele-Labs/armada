tier = "Contextual"
verb = "Dispatch job to fix"
icon = ""
icon_absent = "undecided"
shortcut = "d"
scope = "thread"
destructive = false
confirms = false
notes = "Dispatches a Job to fix a failed hand off, the failure toast's own act, from the band on the composer while focus is inside the band. The band's own key since it was drawn; moved into the registry so Settings can rebind it."

