confirms = false
notes = "Opens the Judge's box on the card that holds focus: a sketch, a document, a draft, a Ready to try build or an agent's reply. The same press stands on the card's foot or bar. Its notes stand inside the card, and the same reading is a Judged card at the thread's end; Send to Job or Dismiss in either settles both. `POST /sessions/judge`."

[actions.job_judge]
