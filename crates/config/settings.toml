# Every setting Armada has decided it will have.
#
# Authored here. This is the list the `config` crate reads and, once each
# owning crate declares the keys it reads, the list it generates — at which
# point `read_by` stops being a design decision and becomes an observation.
# That is why the field is named for what it claims rather than what it knows.
#
# `notes` carries the argument for a value, including where a classification is
# the least confident one in the table. That reasoning is the reason this moved
# out of a database and into the repository: it is read while writing the code
# that obeys it.
#
# The rules these obey — the tiering test, how Kit and Manifest merge, what
# peer polarity is for — are in docs/contracts/configuration.md.
#
# `lifetime = "Frozen for the Job"` was `"Frozen at spawn"` until Focus. A Drone
# belongs to a workflow step, so a Job spawns one per step and "at spawn" would
# mean re-resolved at every boundary — which is the thing the snapshot rule
# forbids, because a step boundary has no person in it. The snapshot is taken
# once, at Job creation, and every Drone of that Job boots from it.


[settings.cpu-mem-headroom-threshold-for-spawning]
name = "Memory headroom threshold for spawning"
scope = "Machine"
lifetime = "Live"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "fleet"
notes = """
**Enforced.** `fleet::headroom::Headroom` carries it and `Fleet::room_for_another` is the predicate: `admit_next` opens with it, and a Job approved onto a machine short of it stays `queued` with `waiting_on_resources` as its reason — the same predicate, so a Board cannot say a Job is blocked while Fleet is starting it. It read as unparsed until Throughput.

**Memory only, and never CPU.** The key still says `cpu` because Bridge reads it by that name; the check does not. On 12 Sep 2026 the owner's other agents held the one-minute load near 27 on 10 cores, and Fleet was the only thing on the machine that yielded — the operating system schedules CPU, so Fleet no longer holds a Job back for it. Doctor still prints CPU in use. Disk is the other signal the same predicate reads, against a floor rather than a share — `disk-headroom-floor-for-spawning` below.

**Changed while Fleet runs.** Bridge saves it through `save_limits` (0 to 50 percent); settings.json keeps it across restarts, a hand edit to the file counts the same, and the next admission turn applies it. Nothing already running is stopped. `get_limits` reads it back beside the shipped value.

Machine constraint. Also sets Doctor's System stats warn boundary — below threshold is warn, since Drones queue rather than spawn. System stats is the one Doctor module whose warn is live degradation rather than "works now, will break later".

Where nothing is saved, `config::settings`' table supplies it and carries the argument for the number beside its entry. It ships at 15 percent: nothing has measured what a Drone costs in memory, and what the number is for is refusing to start work on a machine that is already full.

**The value lives in settings.json under `limits.memorySparePercent`** (live), since the owner's decision of 10 Oct 2026 — `docs/concepts/machine.md`, *settings.json*.
"""

[settings.checks-at-once]
name = "Checks at once"
scope = "Machine"
lifetime = "Live"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "fleet"
notes = """
**Enforced, for the whole machine.** How many Checks run at once across every Job and every repository this Fleet serves — `fleet::places::Places`, one line that a gate, a Drone's own run, a fix draft and a proof after a merge each wait in before a command starts. A Drone's own run takes the next free place ahead of a gate, and nothing waiting is passed over more than `fleet::places::OVERTAKEN_AT_MOST` times. It reads the machine against the memory and disk rows here, so a short machine makes the next Check wait for a running one to finish. The first on the machine always starts: a short machine slows Checks and never stops them.

**A step's gate runs its own Checks one at a time**, so this bounds how many Jobs' gates and Drones' runs share the machine, never one gate's Checks beside each other. The owner's decision of 4 Oct 2026, after Job 3's gate ran its own `desktop_test` beside its own `components_test` and Rust `test`. `docs/concepts/manifest.md`, *How many Checks run at once*.

**Not a cap on compiling.** A compile takes from one pool of compiler jobs sized to the machine's cores and shared by every build Fleet starts, Drones and Jobs included: the owner's decision of 16 Oct 2026, after five builds at 3 jobs each were 15 rustc jobs on 12 cores at a load average of 28. This number counts Checks and `${width}` sizes a runner's workers; neither bounds a compile. `docs/concepts/manifest.md`, *One pool of compiler jobs for the machine*.

**Machine, not Manifest.** How many Checks a repository declares is the Manifest's; how many one machine can host is not. Shipped at half the cores, from one to eight — `limits.checksAtOnce`'s entry in `config::settings` says why.

**The value lives in settings.json under `limits.checksAtOnce`** (live), since the owner's decision of 10 Oct 2026 — `docs/concepts/machine.md`, *settings.json*. A save moves Fleet's places and the machine's Check slots it holds (`checks_runner::CheckSlots::resize`) from the next Check; one running keeps its slot. An `armada check` already running counts by the number it started with.
"""

[settings.disk-headroom-floor-for-spawning]
name = "Disk headroom floor for spawning"
scope = "Machine"
lifetime = "Live"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "fleet"
notes = """
**Enforced per Job, on its own volume.** `admit_next` and the Board's `waiting_on_resources` both fold `Fleet::room_for` (the bound and memory) with `Fleet::volume_is_short`, which reads free space under the Job's own repository root, where its worktree is cut. A short volume holds back only the Jobs on it (#987). `get_capacity` still reads the one volume Fleet watches (#1025).

**Bytes, and not a share, which is why it is its own row.** The row above is a percentage and a percentage cannot carry this: a tenth of a 4 TB volume reserves 400 GB against a worktree that needs three, and a tenth of a 60 GB volume leaves less than one build. What a Job costs in disk is absolute — a cut worktree plus its build output — so it is held against a number of gigabytes.

**It exists because of a measured failure, not for symmetry with memory.** On 31 Aug 2026 a volume filled during a parallel agent run: 220 GB across 74 worktrees, roughly three gigabytes each, and three agents died at zero bytes free holding uncommitted work. Nothing saw it coming, nothing reported it, and the first symptom was tool calls failing with `ENOSPC`.

**Changed while Fleet runs.** Bridge saves it through `save_limits` (0 to 100 GiB); settings.json keeps it across restarts, a hand edit to the file counts the same, and the next admission turn applies it. Nothing already running is stopped. A floor of zero is allowed and is a person accepting the 31 Aug failure back.

Where nothing is saved, `config::settings`' table supplies it and carries the argument for the number beside its entry. It ships at ten gibibytes, which is about three worktrees' worth: enough that the Job being started can finish and a person has warning before the next one.

**The value lives in settings.json under `limits.diskFloorGib`** (live), since the owner's decision of 10 Oct 2026 — `docs/concepts/machine.md`, *settings.json*.
"""

[settings.slot-build-trim-after-days]
name = "Build output trim age"
scope = "Machine"
default = "14 days"
lifetime = "Daemon start"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "adapters"
notes = """
**Enforced**, as `adapters::leasing::TRIM_AFTER_DAYS`. A release of a pool slot, `armada clean` giving back a Job's slot, and Fleet's sweep each drop every file under a `target/` that no build has written for this long, and the incremental session directories that leave empty. Cargo never deletes a stale artifact, and on 6 Oct 2026 24 checkouts grew `target/` to 50 GB each, about 800 GB in all, until the disk filled. A slot stays warm: what a recent build wrote is kept.

**Not yet a value a person can change**: it is a constant, and the next step is a machine file read at start, as the pool's shape is.

**The value lives in settings.json under `limits.slotBuildTrimAfterDays`** (read at start), since the owner's decision of 10 Oct 2026 — `docs/concepts/machine.md`, *settings.json*.
"""

[settings.slot-build-ceiling-gib]
name = "Build output ceiling"
scope = "Machine"
default = "20 GiB"
lifetime = "Daemon start"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "adapters"
notes = """
**Enforced**, as `adapters::leasing::CEILING_GIB`. When a `target/` is still larger than this after its stale files are dropped, the whole directory is removed. That costs a cold rebuild, which is why it is the second step and not the first, and Fleet says so on its console each time.

**A `target/` with a cargo build running in it is never touched.** Cargo holds a lock on each profile directory for the length of a build; the trim takes every one first and keeps them until it is done, so a build that starts meanwhile waits on the trim rather than losing files under it.

**The value lives in settings.json under `limits.slotBuildCeilingGib`** (read at start), since the owner's decision of 10 Oct 2026 — `docs/concepts/machine.md`, *settings.json*.
"""

[settings.build-sweep-interval-minutes]
name = "Build sweep interval"
scope = "Machine"
default = "60 minutes"
lifetime = "Daemon start"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "adapters"
notes = """
**Enforced**, as `timeouts.buildSweepSeconds` in settings.json, read at start. Every interval `fleet::sweeping::keep_sweeping` applies the same trim to the `target/` of every checkout of each served repository: the main checkout, each pool slot held or free, `.armada/bases`, `.armada/land`, `.armada/preview`, `.armada/worktrees` and `.claude/worktrees`. It reaches the checkouts nothing releases or cleans. The first sweep is one interval after Fleet starts.

**The value lives in settings.json under `timeouts.buildSweepSeconds`** (read at start), since the owner's decision of 10 Oct 2026 — `docs/concepts/machine.md`, *settings.json*.
"""

[settings.fleet-health-check-resource-poll-interval]
name = "Fleet health-check / resource-poll interval"
scope = "Machine"
lifetime = "Daemon start"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "fleet"
notes = """
**Enforced**, as a freshness bound rather than as a second timer. `fleet::headroom::Polling` carries it and `Fleet::room_for_another` refreshes the machine reading only once it is older than this — a background poll and a lazily refreshed reading are the same number and the same staleness, and the bound costs nothing while Fleet is idle.

A reading is three short-lived processes and about eighty milliseconds, so taking one on every turn — four a second — would be a measurable share of a core spent on a number that does not move that fast. It ships at five seconds, which is twenty turns.

Daemon-level. Distinct from Drone silence threshold (quiet_after), which is per-Drone silence rather than Fleet's own polling.

**The value lives in settings.json under `timeouts.resourcePollSeconds`** (live), since the owner's decision of 10 Oct 2026 — `docs/concepts/machine.md`, *settings.json*.
"""

