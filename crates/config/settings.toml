[settings.voice-tone]
name = "Voice/tone"
scope = "Machine"
lifetime = "Frozen for the Job"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Kit"
read_by = "fleet, verification"
notes = """
Governs runtime-generated prose only — Judge summaries, Helm replies, Job summaries. Static UI chrome is not configurable. Bounded by Design System — UI & Voice: may adjust length and formality, may not override the principles, lexicon or status grammar. "Terse" and "explanatory" are legal; "playful" is not. That bound is a doc contract, not a config tier, and it survives the withdrawal of the config direction rule unchanged. Frozen for the Job, per the live/frozen split. Owner is an exception and is recorded as one: nothing enforces Voice, so the concept here means the one that defines it, not the one that gates it. Every other row means enforcement. Classified Machine Aug 22 2026, and this is the least confident classification in the table — the Agent Prompt Contract places Voice at prompt layer 2 beside Skills, the Agent file and Sub agent definitions, all of which are Kit. Recorded on that page as an open disagreement.
"""

[settings.worktree-cleanup-policy]
name = "Worktree cleanup policy"
scope = "Kit → Manifest"
default = "Remove on terminal status past Job retention"
lifetime = "Live"
merge_strategy = "REPLACE"
peer_polarity = "Unconstrained — cosmetic"
owner = "Manifest"
read_by = "fleet"
notes = """
Per-repo disk/audit needs. Resolved Aug 2026: the worktree belongs to the Job, not the Drone — "Drone exited" is never grounds to remove one, since rescope-and-respawn reuses the worktree and Pilot hands a human a terminal in it. Removal is driven by Job retention, which resolves the drift risk this row previously carried: nothing deletes on completion, so a retained Job never points at deleted paths. An interrupted Job's worktree is never swept — it may hold uncommitted work. Fleet stops a Drone only at a cap, and the worktree survives that too: a cap ends the spending, never the work.
"""

[settings.notification-routing-in-app-vs-os-per-event-type]
name = "Notification routing (in-app vs OS, per event type)"
scope = "Machine"
lifetime = "Read at render"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Bridge"
read_by = "bridge (TS), fleet"
notes = """
Noise tolerance varies by machine; the adapter itself is in-app only until Phase 4+. Retagged Machine Aug 22 2026 — it was filed Guild → Manifest, which was a mis-tag: there is no project-level version of how loudly Armada notifies you. One value, no merge, no second tier. Bounded by Design System — UI & Voice as a product rule rather than a config tier: the loudness order is silent < in-app < OS < push, routing may move an event type down it but never up, and an approval may never be promoted to push. That holds because an escalation means work has stopped and nothing progresses until a person looks, while an approval means work is waiting to start and will keep. Orphan risk: no dependency path carries config to Bridge, so the Electron side reads its own copy or a hardcoded default.
"""

[settings.copy-lint-enforcement-mode-gate-vs-warning]
