[settings.judge-model]
name = "Judge model"
scope = "Kit → Manifest"
default = "haiku"
lifetime = "Frozen for the Job"
merge_strategy = "REPLACE"
peer_polarity = "Member of the Kit set"
owner = "Judge"
read_by = "adapters, verification"
notes = """
Added by the Aug 2026 config review. Judge had no row among the original 45: the only tier in the system that measures correctness was unconfigured, unbudgeted and unversioned. Runs through ModelClient — cheap model, tight latency budget, and since 2 Oct 2026 read-only access to the repository's checkout for `judge-read-turns` turns.

DECIDED 28 Aug 2026: haiku. It was already the value in the adapter, written there as a stand-in for this row; it is now this row's decision and the adapter derives it rather than stating it. What changed is not the string but who owns it.

Why the cheapest tier is the right floor, rather than the safe-looking stronger one. The Judge is veto-only: one narrow yes/no about a diff it was handed, decided 28 Aug 2026 when it had no tools, no repository and one turn. That is the smallest question in the system, and the tier that answers it is the cheapest one that can read a patch. A stronger default would not make the Judge see more — it reads the same checkout under the same turn cap whatever the model — it would only make every criterion cost more and take longer.

Why it must be a floor and not a middle. Model is a deliberate per-step dial and the reference Bug workflow already varies it: four steps on haiku, review on sonnet. A dial is only meaningful against a default it moves away from, and a default already at the middle of the roster leaves the cheap direction unreachable — the step that wants rigour can no longer be told apart from the step that got it by inheritance.

Latency, not money, is what the value is chosen against. The calls sit at a gate a person is waiting behind, and criteria x panel_size multiplies them: four criteria at panel_size 3 is twelve calls in series at one gate. v1 measured a judgment at roughly 4k input / 300 output tokens, which is under a cent at this tier, so twelve of them is cents either way — the difference the default makes is seconds of wait, and it is paid on every gate of every Job.

Member of the Kit set is load-bearing here, and is why the value lives where it does. The alias is a vendor's spelling, so gate rule six keeps it inside adapters; the adapter reads it as the last entry of the model roster it already states, the roster running strongest-first, so the default is a member of the offered set by construction rather than by a check. A test pins that derivation to this row's value, so a roster reordering breaks the build rather than silently redeciding this setting.

**The value lives in settings.json under `models.judge`** (live; `ARMADA_JUDGE_MODEL` still wins), since the owner's decision of 10 Oct 2026 — `docs/concepts/machine.md`, *settings.json*.
"""

[settings.job-proposer-model]
name = "Job proposer model"
scope = "Kit → Manifest"
default = "undecided"
lifetime = "Read at render"
merge_strategy = "REPLACE"
peer_polarity = "Member of the Kit set"
owner = "Fleet"
read_by = "adapters, fleet"
notes = """
Added with the Job proposer. Its own row rather than a second reading of judge-model: the two are the same shape of call and are raised for opposite reasons, and a machine that raised one by raising the other would pay the raise on every dispatch as well as on every criterion. One turn, no tools, no directory — the shape a Judge call had until it was let read the repository on 2 Oct 2026. Overridden by ARMADA_PROPOSER_MODEL, resolved at the composition root, and nothing below Fleet reads it. Carries no value yet, so the default is the adapter's own stand-in. judge-model was in the same arrangement until 28 Aug 2026 and is now decided; this row was left where it was rather than being carried along, because the two are raised for different reasons and the proposer's own reasons have not been worked through.

