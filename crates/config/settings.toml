default = "Warning on Judge summaries"
lifetime = "Live"
merge_strategy = "REPLACE"
peer_polarity = "Union (deny-shaped)"
read_by = "verification"
notes = """
Split by destination, not by surface. No agent writes text that leaves Armada: Fleet composes PR descriptions and commit messages from the Job's record, so neither is linted. Judge summaries stay inside and draw a warning. The lint is not built. A gate here would need a correction round that does not consume the retry budget, or a style bounce spends retry_count and a Job can escalate as gate_failure over an em dash. Voice cannot widen or narrow this in either direction. A block wins over a warning across a Job's several gating Manifests. Owner is empty on purpose: Agent Copy Contract is a Doc, not a Concept row, and the unit that enforces this is verification.
"""

