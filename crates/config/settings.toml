Feeds spike #3 (model-selection resolution). The one Manifest-only row still related to a Kit value: it selects from Kit-level allowed/default models list, so its polarity is membership. Previously that membership was checked at config load rather than assumed, on the strength of the config direction rule; the rule was withdrawn Aug 22 2026 and nothing enforces the membership now. Filed as an open finding.

**The value lives in settings.json under `models.default`** (live; `ARMADA_MODEL` still wins), since the owner's decision of 10 Oct 2026 — `docs/concepts/machine.md`, *settings.json*.

**Drones and Jobs only.** A Session has its own row, `session-model`; this one never reaches a Session. It is live: a Job proposed after a change takes the new value, `list_models` serves it, and a Job already proposed keeps the model it was given.
"""

[settings.session-workflows]
name = "Workflows for Jobs"
scope = "Machine"
default = "on"
lifetime = "Live"
merge_strategy = "REPLACE"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "fleet"
notes = """
DECIDED 16 Oct 2026 (owner): a person can switch the workflow system off and always dispatch plain Jobs.

**Off means three things and no more.** The proposer is shown no workflows and so never picks one, and still proposes the title, model and effort; `set_session_workflow` refuses to set one with `fleet.session_workflows_off`, and clearing one still works; and a Job that already has a workflow has no `workflow_step`, hears no nudge for a step skipped, and has no judge run at a step's boundary, nor is told its workflow's steps on its first turn. Nothing is deleted: the Job keeps the workflow it has, so switching back on picks the rail up where the facts put it. The Judge tile reads the work against the plan either way.

Live: read when the row is drawn and when a call is made, so a change shows on the next published row. Bridge reads it from the settings it already serves and hides the workflow picker and the steps when it is off.

**The value lives in settings.json under `features.workflows`** (live), `docs/concepts/machine.md`, *settings.json*.
"""

