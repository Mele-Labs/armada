read_by = "verification"
notes = """
SUPERSEDED Aug 21 2026 — this setting has no referent and should be deleted or repurposed. Added by the Aug 2026 config review on the assumption that a Judge returns a graded confidence. It does not. Decided Aug 21: the gate auto_if_judge_high_confidence is renamed auto_if_judge_passes and the confidence notion is dropped — a veto-only Judge either refuses or it does not, the question it is asked is a narrow yes/no, and a panel requires unanimity rather than a score. There is nothing for a threshold to threshold. Original note, kept for the reasoning: 'Floor rather than cap: a Manifest may demand more confidence than the Guild, never less. A threshold that a Manifest could lower is a veto a repo can switch off.' Aug 22 2026: the never-less half of that instinct was the config direction rule and is withdrawn. What survives and relocates to judge_check.panel_size is the shape — raising the panel is how a Manifest demands more rigour, and higher-is-stricter is the correct peer polarity for it — but nothing now stops a Manifest lowering it. Same finding as the Judge trigger set row.
"""

[settings.judge-cost-cap-per-check]
name = "Judge cost cap per check"
scope = "Machine"
default = "undecided"
lifetime = "Live"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Judge"
read_by = "fleet, verification"
notes = """
Added by the Aug 2026 config review. Without it a Judge Check bills against the Job budget with no sub-limit, so verification competes for spend with the work it verifies.

STAYS OPEN 28 Aug 2026, and the reason is now written rather than absent. It was reviewed alongside judge-model, which was decided in the same pass; a number was deliberately not invented for this one.

Nothing can read what a Judge call cost. A Judge is rendered with --output-format text, so the call answers in prose and emits no result envelope. The cost figure this cap would be compared against — total_cost_usd, read as cost_micros — reaches Armada only on a Drone's stream-json transcript, which a Judge call deliberately is not. So a dollar written into this row today would be enforced by nothing while reading, to anyone who found it, as a limit that was set. That is the failure this row is more dangerous than useful in: an unenforced cap is worse than an absent one, because only one of the two is visible as missing.

What is actually open has therefore changed, and is no longer 'what is the number'. It is: does a Judge call get a cost readout at all — which means an output format that carries a result line, and a reader for it, in adapters and fleet — and if it does, is a per-check dollar cap the right shape, given that the two bounds that exist today are both shaped differently. judge-call-count-ceiling bounds criteria x panel_size per step and needs no price to enforce; budget-cost-cap-per-job bounds the Job, enforced at admission, and since Sept 2026 a repository and a Job may each state their own — which changes who can move that bound but not its shape, and adds no sub-limit here. Between them the product is already bounded, and v1's measurement of a judgment at roughly 4k input / 300 output tokens puts a fully fanned-out step in cents.

Judge is also not where verification's spend risk concentrates. Cost is not the driver on this tier and the Judge concept says so outright — latency is, because the calls queue at a gate a person is waiting behind. That bound is real and is enforced today, provisionally and by wall clock, in the composition root.
"""

[settings.standing-rules-cap]
name = "Standing rules cap"
scope = "Machine"
default = "4 KiB"
lifetime = "Daemon start"
merge_strategy = "n/a — single layer"
peer_polarity = "Lower is stricter"
owner = "Fleet"
read_by = "verification"
notes = """
The most of the file `armada.yml`'s `standing_rules` names that one Judge brief carries. Over it, `verification::Standing::read` cuts at the last whole line that fits and the brief says the file was cut, at what size, and that the rest is not shown — a Judge is never handed part of a repository's rules without being told. `STANDING_RULES` in `crates/verification/src/standing.rs`.

**The Judge is its only reader.** It was `judge-brief-standing-rules-cap` until 1 Oct 2026, when the Drone's opening brief began carrying the same file; that block was removed on 2 Oct 2026, because a Drone reads the repository itself (owner, 2 Oct 2026).

**A judgement, not a measurement.** The text rides every Judge call, times `panel_size`, beside a brief already carrying the request, the Check tails and often the whole diff, so it must stay a small part of one. Four kibibytes is roughly a thousand tokens and nearly three times `docs/instructions/every-change.md`, the file Armada's own `armada.yml` names. It is a list of what every change carries, and a file that needs more is a contract to point at rather than to paste.

**The value lives in settings.json under `limits.standingRulesKib`** (live), since the owner's decision of 10 Oct 2026 — `docs/concepts/machine.md`, *settings.json*.
"""

