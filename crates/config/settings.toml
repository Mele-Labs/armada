[settings.auto-merge-policy-never-checks-pass-always]
name = "Auto-merge policy (never / checks-pass / always)"
scope = "Manifest only"
default = "never"
lifetime = "Live"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Manifest"
read_by = "config, fleet"
notes = """
Explicit in brief, per-project. Built in #525: config reads the top-level `auto_merge:` key, core-model folds it most-restrictive-wins across a Job's gating Manifests, and fleet::merging acts on it — on the sweep over an open pull request, once per pull request per process, recorded with Fleet as the actor rather than a person.

`read_by` was `adapters, fleet` and no adapter ever read it. What an adapter answers is `WhatTheForgeRan`, which is the reading `checks-pass` consults; the policy itself is never seen below Fleet.

**`checks-pass` is the forge's own checks and not Armada's.** Armada's ran at the gate the Job is holding at, and totalling the two would claim a gate had held that never ran. Only all-passed is a pass: a repository whose forge runs nothing has proved nothing, and a check finishing in a word this build has no name for counts as not passed (#524).

**An approval is not one of the three values and is deliberately unread.** All three are about machines; whether a person approving on the forge becomes `auto_merge: approved` or a policy of its own is undecided and was not settled by #525. `always` therefore merges over an outstanding request for changes, with the forge's own branch protection as the backstop.
"""

[settings.merge-by-forge-push]
name = "How work lands (forge / push)"
scope = "Manifest only"
default = "forge"
lifetime = "Live"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Manifest"
read_by = "config, fleet"
notes = """
The top-level `merge_by:` key. `forge` merges the pull request through the forge, so branch protection and the forge's own checks stay in the path. `push` makes the `--no-ff` merge commit in Fleet and pushes the base, never forced; a base that moved past what the branch holds is refused rather than merged. `auto_merge` decides whether work lands and this decides how, so it is not folded across Manifests: one Job lands in one repository. `git show ecfffb2c1ebd:docs/capabilities/merge-line.md`, *The merge*.
"""

[settings.pull-request-mode-ready-draft]
name = "Pull request mode (ready / draft)"
scope = "Kit → Manifest"
default = "ready"
lifetime = "Live"
merge_strategy = "REPLACE"
peer_polarity = "n/a — single layer"
owner = "Manifest"
read_by = "config, core-model, fleet, store"
notes = """
**Five tiers, the most specific winning**: the Job's own choice at approval, the delivering step's `draft_pr` in its WorkflowDef, the repository's top-level `pr_mode:`, this machine's `draft_pull_requests` preference, then ready. `core_model::PrModeTiers::resolve` is the one place the order is written, and `fleet::approving::decided_under` reads it at the approval.

**Filed Kit → Manifest by `budget-cost-cap-per-job`'s precedent, and there is no Kit tier.** The machine's is a Machine setting in settings.json (`features.draftPullRequests`), the bottom of the order, and it does not travel. Absent is deferring in every tier: a repository writing `pr_mode: ready` beats a machine that drafts, which absent would not.

**Only a step with `delivers: true` may carry `draft_pr`**, since any other step opens no pull request. The loader refuses it elsewhere. The step's value freezes onto the Job with the workflow; the repository's and the machine's are read at the approval, and the result is kept in the Job's landing. A Job approved before a default moved keeps what it opened as. `docs/concepts/landing.md`, *Pull request mode*.

**The value lives in settings.json under `features.draftPullRequests`** (live), since the owner's decision of 10 Oct 2026 — `docs/concepts/machine.md`, *settings.json*.
"""

[settings.default-model-per-job-type]
name = "Default model per Job type"
