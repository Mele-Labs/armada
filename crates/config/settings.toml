notes = """
Two-tier, explicit in brief. Documented on Kit; enforced by Fleet. Kit holds the default allowlist and a Manifest may extend or restrict it — in either direction. The row previously carried the opposite rule, that an allow-shaped list merges by intersection and a Manifest addition is rejected at config load; that was the config direction rule and it was withdrawn Aug 22 2026. Peer polarity is unchanged: across a Job's several gating Manifests the allowlist still intersects, because a Drone must hold only what every declared Manifest granted. Open finding, filed separately: the allowlist's value was never prevention but the denial record in the approvals table, and nothing now stops a Manifest removing entries and with them the record.
"""

