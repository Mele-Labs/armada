[operations.list_request_environments]
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "The named base addresses a request's {{base}} can be: the owner's saved ones, and one for each server your Job is running, named server:<name>"
notes = """
Since 19 Oct 2026. `GET /requests/environments`, with an optional `?session_id=`. `RequestEnvironments`: `saved`, tagged by `what` (`read` with `file`, or `not_read` with `why`), and `servers`, each a `RequestEnvironment` (`name`, `base`).

**`saved` is `~/.armada/requests.toml`, read on each call**, as `get_flight_controls` reads its file: absent is `read` and empty, and a file that will not read is `not_read`, never empty. **`servers` is one for each server running in the Job's slot**, named `server:<name>` and based at `http://localhost:<port>` on the first port it serves on, so a saved name cannot collide with one. A Job placing no slot, or none named, has none.

**The Job** is the one whose process holds the connection when Fleet hosts it; `session_id` is read only where it places none, as `send_request`'s is.

`agent_access` is `Yes`: `send_request` takes an environment by name, and an agent asked to check a staging address has no other way to find its name.
"""
