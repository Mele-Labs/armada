[operations.ask_for_slot]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "A Job's `armada worktree lease` found every slot held: it waits, and the Job's record says so"
notes = """
`POST /sessions/slot_wanted`, body `AskForSlot`: `act` is `ask` or `done`, and `session_id` is the Job, read by the command from the `ARMADA_SESSION` Fleet set in its process. Answered with `SlotAsked`: `standing` is `asking` (it waits for a slot, and the Job's `slot_wait` says so), `waiting` (an older Wait answer, so the command keeps looking), `added` (he chose to add one: Fleet made a slot and holds it for this Job until `done` or about thirty seconds) or `unasked` (Fleet does not host that Job, or it has ended, and the command goes on as it did).

**It is the wait a queued write starts, and never a second one.** Nobody is asked: the Job's record carries `slot_wait` while either the Job is in its repository's line or a command of its is asking; where both stand, one wait is shown, and Add (`answer_waiting` on `slot-choice`) settles both. A choice of *Add a slot* for a Job in the line leases the new slot to the Job, and the command keeps waiting.

**`ask` is the heartbeat.** The command repeats it about once a second, and Fleet forgets a command it has not heard from for ten seconds, taking the call and any reservation with it. `done` ends it at once. Nothing is moved: unlike a queued write, the command takes its slot itself, `armada worktree lease` being a lease per call.

A command with no `ARMADA_SESSION`, or with no Fleet to ask, does not call this and waits as it always did. `agent_access` is `No`: an agent reaches this only by running the command.
"""
