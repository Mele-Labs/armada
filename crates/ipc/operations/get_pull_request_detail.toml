[operations.get_pull_request_detail]
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "What a pull request's panel draws beyond its standing: base, author, mergeability, review state, conversation, the forge's checks with their run time, files and commits"
notes = """
`GET /pull_request_details/:repository/:number`, `repository` a manifest id. Since 23.83. `PullRequestPage`. **Read apart from `PullRequestState`**, which rides every `session.changed`: a conversation is read when the panel opens and carried nowhere.

`conversation` is the pull request's comments and its reviews merged in the order they were said; a review with neither a body nor a verdict is left out. `approvals` counts reviewers whose latest review approved. `reviewers` are who is asked to review (a person by login, a team by slug), each with the verdict of their latest review where they have one, then those who reviewed and are no longer asked, since the forge drops the request on review; absent when there are none. `review` is `required` while the base branch asks for a review and none has given one. A check's `seconds` is absent while it runs and where the forge gave no start and end.

**Any open pull request of a served repository, held by a Job or not.** `head` is the commit the branch is at, whole; `body` is the description; `threads` are the conversations on the diff (path, line and side, resolved or not, the comments in order), the forge's first 100. A page whose threads the forge would not give is not a page: the whole read is the 500 below, since a review of a diff without its conversations is wrong.

**Lists are capped, never silently**: the first 300 files, the first 250 commits and the latest 200 things said; the reader counts what it left out, and Fleet has no log outside a Job to say it in.

Refused with a 500 `fleet.pull_request_unreadable` where the forge would not answer (no tool, nobody signed in, no such number), and a 422 for a repository Fleet does not serve.
"""
