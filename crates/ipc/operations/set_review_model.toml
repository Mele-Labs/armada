[operations.set_review_model]
kind = "command"
transport = "HTTP"
agent_access = "Helm only"
description = "Choose the model one Job's review step runs on, or clear the choice"
notes = """
`set_model`'s terms, for the one step that writes Armada's review (#903). **On that step a chosen review model beats the Job's own chosen model**, and every other step ignores it. The body is `model`, a name `list_models` offers or `null` to clear, sent rather than implied. `JobDetail.review_model_override` reads the choice back, and `JobDetail.review_step` names the step it applies to, absent on a workflow with none.

Refused with a 409 on a model `list_models` does not offer. `agent_access` is `Helm only`, `set_model`'s reason.
"""
