[operations.unlink_task_job]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Let a held task go back to open"
notes = """
`POST /projects/:repository/:project/rows/:row/job/unlink`, no body. A task `held` by a Job, and the subtasks the same Job held, are `open` again. A task in any other state changes nothing: an `asked` one is answered through `tick_project_task`. `docs/practices/protocol/projects.md`. Answers `Projects` as `list_projects` does, and publishes it as `projects.changed`.

A 422 `fleet.project_row_not_a_task` for a `row` that is an issue row, a 404 `fleet.no_such_project` for a `project` the repository has none of, a 404 `fleet.no_such_project_row` for a `row` the project has none of, and a 422 for a repository Fleet does not serve.
"""
