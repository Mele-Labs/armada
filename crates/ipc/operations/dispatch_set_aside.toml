[operations.dispatch_set_aside]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Dispatch a pick Autopilot set aside, through the approval gate like any dispatch"
notes = """
`POST /autopilots/:repository/picks/:pick_id/dispatch`. #2092. **A person is choosing now, so the gate applies**: the issue's address goes through the same proposer read `propose_from_request` makes, and the Job waits at `awaiting_approval`, origin `manual`, with the issue as its source. The pick reads `started` with the Job's id and counts toward `jobs_started` and the spend; a cap does not refuse it, because a cap stops Autopilot's picks and this one is the person's. Answers the `Autopilot` and publishes `autopilot.changed`.

A 409 `fleet.pick_not_set_aside` for a pick that is not set aside, or that is not this run's; the proposer's own refusals as `propose_from_request` has them, after which the pick is set aside again.
"""
