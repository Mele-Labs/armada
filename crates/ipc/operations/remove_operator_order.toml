[operations.remove_operator_order]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "The person removes a standing order with one press"
notes = """
`POST /operator/orders/remove`, body `RemoveOperatorOrder`: `id`, of a hold, which is what Forget presses. Answered with `OperatorOrders`, which lists holds only. It stops standing at once: the hold's Jobs write again. `operator.page_changed` is sent. 422 `fleet.operator_order_unknown` where it is not standing.
"""
