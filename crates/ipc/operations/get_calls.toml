[operations.get_calls]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "Every call standing on the person, oldest first: what the Jobs wait on him for, main when it is red, and a failing pull request of his, each with whether he has opened it"
notes = """
`GET /calls`. Answers `StandingCalls`: `calls`, oldest first by `since`. Since 9 Nov 2026. `docs/practices/protocol/a-jobs-calls.md`.

**What Fleet derives.** The native Bridge and Pocket draw what Electron Bridge worked out in TypeScript (`callsFromWaiting`, the merge-line calls, `incomingOf`) without working it out again. A call is `job` (something a live, unpaused Job waits on him for, or the Job's own row where it needs him), `main` (a repository's main reads red with nothing newer running and nobody on it), `checkout` (a served checkout held back) or `pull` (a pull request of his that failed its checks, cannot merge, or is an `armada.yml` edit to merge by hand, nobody on it). Every kind is listed in the practice doc. `owner` is `callOwnerOf`'s string: the Job for a Job's calls and for the Job already on a failure, else the key. A badge counts each `owner` with an unopened call once; `StandingCalls::unopened` in `crates/ipc` does it.

**`opened`.** A Job call is opened while he has the Job on screen or has been in it since the call began, unless the Job asks him (a question, a permission, a plan, a start card, a document waiting, or a Job Fleet gave up restarting): that one stays unopened until it does not. A main, checkout or pull request call is opened by `open_call`. That memory is Fleet's own and a restart forgets it.

`agent_access` is `No`: an agent reads what it waits on from its own `waiting_for`. A Bridge that missed `calls.changed` reads this route again on the resync that follows a `Missed`.
"""
