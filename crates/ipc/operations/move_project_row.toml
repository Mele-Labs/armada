[operations.move_project_row]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Move a row to a place in its project"
notes = """
`POST /projects/:repository/:project/rows/:row/move`, body `MoveProjectRow`: `position`, counted from 0 among the rows of the parent the row ends up under, where the row is put; past the end is the end. A task or an issue row alike, within its project. **`parent`** is optional: the id of a top-level task to make it a subtask of, `""` to take it out to the top level, and absent to leave it under the parent it has. A task with subtasks of its own cannot go under another, and an issue row cannot go under any. `docs/practices/protocol/projects.md`. Answers `Projects` as `list_projects` does, and publishes it as `projects.changed`.

A 422 `fleet.project_subtask_too_deep` for a move that would make a subtask of a subtask, of a row with subtasks, or of itself, a 422 `fleet.project_row_not_a_task` for an issue row under a parent or a parent that is an issue row, a 404 `fleet.no_such_project_row` for a `parent` the project has none of, a 404 `fleet.no_such_project` for a `project` the repository has none of, a 404 `fleet.no_such_project_row` for a `row` the project has none of, and a 422 for a repository Fleet does not serve.
"""
