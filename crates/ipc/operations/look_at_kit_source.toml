[operations.look_at_kit_source]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Say whether a pasted source is a plugin, a skill or neither, and the commands Install would run, running nothing"
notes = """
`POST /kit/pieces/look`, body `LookAtKitSource` `{ source }`: `owner/repository`, a GitHub address, or a website's. Answers 200 with `KitSourceFound`, tagged by `found`: `plugin` with `name`, `marketplace`, `repository`, `skills` and `commands`; `skill` with `name`, `repository` and `commands`; `several` with `repository`, `kind` and `choices`, each `{ name, says?, commands }`; or `unknown` with `why`, in Fleet's words.

A website is fetched once and followed to the repository its install line names, `/plugin marketplace add` or `npx skills add`, and failing those its first link to a repository. A repository is read through `gh`: a `.claude-plugin/marketplace.json` makes it a plugin, by the names that file gives; otherwise a `SKILL.md` at its root or under `skills/*/` makes it a skill. A marketplace listing several plugins, or several skills and no marketplace, is `several`: each choice carries its own commands and its own words for itself, a plugin's `description` or a skill's front matter, and Install takes one by name. **Nothing a source cannot be read as is a refusal**: every way a look fails is `unknown` with why.

**It runs nothing on this machine**, so the commands are shown before any is run, and Install looks again rather than taking them from a body.

A command, not a query, because the source is a body: `read_package`'s shape. `agent_access` is `No`: what a person is about to install is theirs to look at, and an agent that wants to know what a repository holds can read it itself.
"""
