[operations.get_checkout_run_sheet]
kind = "query"
transport = "HTTP"
agent_access = "Helm only"
description = "What a person can run in the main checkout - its Setup, Checks and Commands - off the Manifest Fleet holds"
notes = """
**`?repository=<root>` names the checkout where `?manifest_id=` cannot**: a repository whose root has no `armada.yml` has no id, and a workspace there still verifies. Naming both is refused with `fleet.repository_named_twice`, rather than one quietly winning. With no root Manifest the three lists and `servers` are empty, and `verify` is still the checkout's. `workspaces` lists each directory Scan finds holding its own `armada.yml` that loads, with the Commands that file declares, pressed with `StartCheckoutRun.workspace`; it is listed with or without a root Manifest, so a root's own page can run a workspace's Command too. Which directories hold one is found once per repository, by Scan's walk, and found again when its root Manifest is re-read, the served repositories change, or Setup writes a file; each file is read afresh.

**It needs no Job and reads no store.** This is the `armada.yml` Fleet is already running on and watching, which is why it answers on a repository that has never had a Job in it. Nothing here is frozen: there is one file and it is the one that runs.

`seed` is the `setup.seed` the Manifest declares, with whether the seed at the current base commit is warm, warming or cold — read from git and the base checkout's own marker, never the store (#1064).

Under `/manifest` beside `get_manifest_reading`, for that operation's reason — a Fleet serves one repository, and this reads it before any Job exists to read one from instead.

`agent_access` is `Helm only`, `list_checkout_runs`' reason: it is where a Helm session finds what it may be asked to start. No other agent is offered it — `get_run_sheet` is what an agent working a Job needs, and the main checkout is the tree a Drone is confined out of.
"""
