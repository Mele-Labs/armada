[operations.read_session_wait]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Read a brief that tags a Job with @ for the wait it names: when the new Job starts, from where, and what it needs of the one waited on"
notes = """
`POST /sessions/read_wait`, body `ReadSessionWait`: `session_id`, the Job the brief tags, and `request`, the brief as typed. Answered with `WaitReading`: `condition` (`ends`, `group_done` with a `group`, `task_done` with a `task`, `pr_pushed` or `pr_lands`), `base` (`main` or `branch`) and `needs`, the line the Job waited on is told. `docs/concepts/session.md`, *A Job that waits on another*.

**The proposer reads it, once, with the Job proposer's model.** The question carries the brief and the groups and tasks of the tagged Job's plan with their ids, so a plan part is named by an id Fleet holds. **A reading that cannot be used is the defaults, never a refusal**: a proposer that is not configured, a call that fails or times out, an answer that does not follow the format, and a part the plan does not hold all read as `ends`, from `main`, asking nothing, and Fleet says why on its standard error. `pr_pushed` reads as starting from `branch` unless the brief says main. Bridge reads the brief as the person pauses typing and draws the answer as the sentence over the request; the person changes any part of it by hand before `start_session` carries it as `after`.

Refused 422 `fleet.wait_session_unknown` for a Job Fleet does not host. `agent_access` is `No`: it is Bridge's reading of what the person typed.
"""
