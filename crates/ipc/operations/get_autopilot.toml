[operations.get_autopilot]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "One repository's Autopilot: its settings, its state, what its Jobs spent, and every pick of this run"
notes = """
`GET /autopilots/:repository`, `repository` a manifest id. #2092, `docs/concepts/autopilot.md`. Answers `Autopilot`: `manifest_id`, `instruction`, `at_once`, the optional caps `until`, `spend_cap_micros` and `job_cap`, `state` (`running`, `paused`, `stopped`), `started_at`, `ended_at`, `capped_by` (`until`, `spend`, `jobs`) where a cap rather than a person paused it, until a Resume clears it (#2105), and three figures read now: `spent_micros` summed from each of its Jobs' own spend, `jobs_started`, and `at_work`, how many of its Jobs hold a place.

**A Job waiting on a person holds no place**: one whose Drone asked and is waiting on the answer, a paused one, and one escalated, at review, awaiting repair or attestation, or piloted. `at_work` counts the rest of its running and queued Jobs, and Autopilot picks while it is under `at_once`.

`picks`, oldest first, are `AutopilotPick`: `pick_id`, the issue's `issue_reference` (`#123`, `ABC-123`), `issue_title` and `issue_url`, the `workflow_id` the picker chose where it chose one, the `job_id` it started, `state` (`started`, `set_aside`, `withdrawn`, `dismissed`), the picker's `reason`, and `at`.

`fault`, where present, is why the last pass picked nothing, in Fleet's words: the tracker would not answer, or the picker's answer was refused. It goes once a pass goes through, and is the only place a pass's failure is told.

A 409 `fleet.no_autopilot` for a repository that has never had one, and a 422 for one Fleet does not serve.
"""
