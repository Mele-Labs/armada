[operations.list_projects]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "His projects, each with its rows in order, its members and where its file is kept, and the tasks in none"
notes = """
`GET /projects`. `docs/practices/protocol/projects.md`. Answers `Projects`: `projects` in the order he keeps them, each `{ id, name, rows, members, place, unread? }`, `loose`, the tasks in no project, in their own order, and `left_out`, the project files Fleet could not read, each `{ place, path, why }`. **A project holds no repository**: every row names its own, `manifest_id`, and a project may hold rows of several. `members` is the repositories its file lists, each `{ manifest_id, folder? }`, in the file's order; they follow its tasks, so a repository a task is written or moved into the project in becomes a whole member. `place` is where its file is kept, `{ place, synced_folder?, cloud? }`, and `this_mac` where none was chosen. **`name` and `members` are the file's**; `unread` is present where the file could not be read, the sentence that says why, and then `name` is the last the store saw and `members` is empty. A row is `{ kind: "task", id, manifest_id, title, notes, state }`, `state` `open`, `done`, `held` or `asked`, or `{ kind: "issue", id, manifest_id, issue, title?, state? }`, `issue` the tracker's reference only.

**An issue row keeps no state.** Its `state` (`open` or `closed`) and `title` are the tracker's, read when the rows are, from the tracker of the row's repository: the open list Fleet holds for the Issues tab, and an issue not on it read by its reference, each held five minutes. Where the tracker cannot say, both are absent and nothing is refused. Kept in Fleet's store on this Mac and survives a restart; never written to the repository or the Manifest.
"""
