[operations.list_repositories]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "Every repository Fleet serves, in the order they were added, each with its Manifest where one has loaded, and none on a Fleet nobody has added one to"
notes = """
Beside `list_manifests` rather than instead of it: Setup starts from a folder with no Manifest (no `armada.yml` and no Kit copy), and that repository has a root and records before it has one. The root is what `?repository=` names on Scan and its proposals.

A repository with no Manifest, no `armada.yml` and no Kit copy, carries `implicit_id`: the `manifest_id` a Job started there carries, made of the folder's name and a digest of its path. It is absent where there is a `manifest`, Kit's copy alone included, and a Job that carries it keeps its repository after a Manifest is written.

`agent_access` is `No` for `get_repository_scan`'s reason: a root is the owner's checkout on disk.
"""
