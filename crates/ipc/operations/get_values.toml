[operations.get_values]
kind = "query"
transport = "HTTP"
agent_access = "Bridge only"
description = "Every value that decides how work behaves, resolved for a project, a repository or both, each with the layer it came from"
notes = """
`GET /projects/values?project=&manifest_id=`, both optional. `docs/practices/protocol/projects.md`, *Values*. Answers 200 with `ResolvedValues`: `pr_mode`, `auto_merge`, `review_model`, `layout`, `theme` and `density`, each `{ value?, from }`, and `tracker`, `{ value?, from }` where `value` is the Manifest's `tracker:` block as a map (`provider` and every other key), `reviews`, `{ plans, pull_requests, walks, from, plans_from, pull_requests_from, walks_from }` each a word and each kind's own layer (`from` the nearest that set any kind), `autonomy`, one `{ kind, value, from }` for each kind of act, and, where a project was asked about, `workflows`, one `{ id, on, from }` for each workflow of the repository asked (every served repository's where none was), in id order: **off wins**, so `from` is the furthest layer that switched it off, `machine`, `repository` (both the `workflows.off` setting) or `project` (its `values.workflows_off`), and `default` where it is on. `features.workflows` is not folded in. `from` is `default`, `machine`, `kit`, `repository`, `project` or `job`, the nearest layer that sets the key. `value` is absent for a key no layer sets and the default has no word for. A plain key also carries `learned` (true only for a project's `delivery` still standing as Fleet learned it from his first answer; kept in a store note, never in the project's file, dropped when his own edit leaves `delivery` absent or another word), and, where `from` is `project`, `inherited` and `inherited_from`, what the layers below the project give it (`inherited` absent and `inherited_from` `default` where nothing below sets a word). `reviews` carries the same per kind, `plans_inherited` and `plans_inherited_from`, `pull_requests_inherited` and `pull_requests_inherited_from`, `walks_inherited` and `walks_inherited_from`, each pair set only where that kind's own `*_from` is `project`; a kind always has a word, so where nothing below sets one it is `off` from `default`. All of them are left off where they say nothing, and a Job's frozen `hosted.values` carries none.

The layers, nearest winning: **default, Machine, Kit, repository, Project, Job**. Absent `project` leaves the Project layer empty, and absent `manifest_id` leaves the repository layer empty and `autonomy` out: it is **not** the repository Fleet was started in, as it is on the routes that act on a Manifest. A repository's own word is its `armada.yml` `pr_mode:` and `auto_merge:`, where it writes them. **The tracker resolves repository then project, the project's winning**: a project that names one replaces its members' trackers for the Jobs in it, and a repository's own `tracker:` is the answer where no project names one. `value` is absent, `from` `default`, where neither does: the forge's own. A Job's frozen `hosted.values` leaves `tracker` out, since a Job asks its tracker where it acts. Autonomy is read from the pieces it already has, `kit` for those scoped to every repository, `project` for those scoped to the named project and `repository` for those scoped to the repository, a repository's over its project's.

Nothing is written, and the answer is not held: a Job's own values are `hosted.values`, frozen at its start.

404 `fleet.no_such_project` for a project he has none of. 422 `fleet.project_unreadable` where its file did not read, 422 `fleet.project_not_member` where it does not list the repository, and 422 `fleet.unacceptable_proposal` where Fleet serves no repository by that id.
"""
