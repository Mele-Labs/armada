[operations."write_clashes.changed"]
kind = "event"
transport = "WebSocket"
agent_access = "Bridge only"
description = "The standing write clashes of the served repositories moved, and this is every one now"
notes = """
Carries `AllWriteClashes` itself, the answer to `list_all_write_clashes`, for `merge_lines.changed`' reason: the route and the event are the same fact, and a client replaces what it holds. Since 9 Nov 2026.

**Fleet publishes it on the notice loop's tick that checks the clashes, and only when the set differs from the last one sent**: a clash found, one cleared, a clash's files changing, a holder ending and taking its clashes with it, a Job's title changing. The first read sets the baseline and sends nothing. Fleet finds a clash about 30 seconds after the writes that made it, so a Bridge that polled saw it later.

A resync does not carry it. A Bridge that missed one, or reconnects, reads `list_all_write_clashes` again on the resync that follows a `Missed`.
"""
