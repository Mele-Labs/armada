[operations.ask_in_window]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Ask the person about a place on the page your walk window shows: Bridge takes them there, highlights it and shows the question with its options. Body: question, options (label, optional description), url, selector, optional text. Returns at once; end your turn and the answer comes as a message"
notes = """
`POST /sessions/window/ask`, body `AskInWindow`: `question`, `options` (each `label` and an optional `description`; the person may always answer in words of their own instead), `url`, `selector` (a CSS selector for the element), an optional `text` the element shows, which picks one where the selector finds several, and an optional `session_id`. Answered with the `SessionRecord`; **through the agent's door, a receipt** of `session_id` and `asked`, the question's `window_ask:<row id>`, because the row grows with every attachment and an agent keeps each answer.

**Only about the walk.** The `url` must be `http` or `https` and on the origin of a window the session showed with `show_window`, or of any of its `variations`; anything else is refused with 422 and the reason, which points at `AskUserQuestion` — a question that is not about the walk is asked with it, and while he walks Fleet keeps it whole in his Needs you list. A blank question or selector is refused too.

**It does not wait.** Fleet keeps a `window_ask` row on the thread and answers at once, and the session ends its turn. The open question is `window_ask:<row id>` in `SessionRecord.waiting_for`, source `window_ask`, with its `place` and an `act` of `walk` on the window it was asked in, so it shows under Waiting on you as well. **Bridge brings the session's window forward when the row arrives** — opening it if it is closed — moves the page to `url`, highlights the element and draws the question on its own bar. `answer_waiting` settles it: the session gets the person's message, `Re: <question>`, then the option chosen and any words, and the row is replaced with its `answer`. `dismiss_waiting` drops it with nothing sent.

**The session is the one whose process holds the connection** when Fleet hosts it, whatever the body says; `session_id` is read only for a session in a terminal, as `show_window`'s is.

`agent_access` is `Yes`: the session is the one with the question, and the place it is about.
"""
