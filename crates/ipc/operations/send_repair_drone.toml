[operations.send_repair_drone]
kind = "command"
transport = "HTTP"
agent_access = "Commander only"
description = "Put a repair Drone on the Job's own branch and worktree, then restart the step the breakage stopped"
notes = """
**The Commander's own repair, offered to no other caller.** The door lists it to a Job's Commander alone and the route refuses a call the door did not place as one, so the move it ends in is always signed Commander (`#2163`, `#2168`). It is not `add_job_step`, which lets the Commander write a step of its own whose output would be gated as that step's; a repair is gated as the step it unblocks. `#2170`.

The body is `broke`: `merge_conflict`, `dependencies`, `missing_binary` or `worktree`. A closed set and no prose, so the Job's log and the thread say what broke in a word and the Drone is granted what that fault needs: the index for a conflict, the repository's declared bootstrap for the other two. The Drone reads the worktree for the rest.

**The Job's own branch, the Job's own worktree.** Not the side branch a failed Trigger's repair is cut onto (`docs/concepts/fleet.md`, *A failed Trigger's repair*), which stays as it is. Fleet commits what the Drone wrote to the Job's branch, then restarts the stopped step as the Commander. The step's baseline was read when it first began, so the repair's files count as that step's work: its Checks run on the tree that holds them and the Judge reads the patch that includes them. Nothing the repair does skips either.

**Offered where `restart_step` is.** The act is refused, at the moment it is asked, where the Job is not held for a person, where a Drone is still on it, where the worktree is gone (a redispatch, as `restart_step` says) and where no step stopped for it to put back. A Job whose preparation failed before any step began is such a Job; its Commander sends the owner a card.

**202.** The answer names the step and the Drone and the Drone has not finished. A second repair while one is out is a 409. The Drone cannot edit `armada.yml`, the Manifests of the workspaces or `.armada`, which is where a Check is declared, and it cannot commit or push: Fleet commits.

**One owner of the count: the loop bound.** A repair does not spend `healing`'s repairs per kind. One that hands nothing in (it would not start, ran past its budget, or left the conflict) wakes the Commander as a trouble of its own, and `docs/concepts/commander.md`, *The loop bound*, stops it.
"""
