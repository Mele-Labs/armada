[operations.operator_talk]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "The conversation with the Operator so far"
notes = """
`GET /operator/talk`, answered with `OperatorTalk`: the last hundred lines, oldest first, each with the `about` it was said about, where it named one. Kept in the store, so it survives a restart.

Besides his messages and the answers, a line is the Operator raising a Needs you item, with `raise`: the Job (`session_id`, absent on a suggestion no Job holds, and `job`, its title), the `item` as it was raised, the Operator's `read` and `pick` where a call read it, and `settled_at` once the item left the list. Its `text` is markdown that reads alone, and a settled raise is served with a last line saying when, in local time. A line with `briefing` is the day's briefing, its `text` only saying it is ready, carrying what it held as data: `since`, the Jobs that ended and the pull requests that merged; `waiting`, the raises still open by Job and item; `on`, what the Operator has in hand; and `top`, the call's one line, where it answered. Bridge reads it again on `operator.talk_changed`.
"""
