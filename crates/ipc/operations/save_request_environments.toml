[operations.save_request_environments]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Write the owner's named base addresses for Requests to Kit, whole"
notes = """
Since 19 Oct 2026. `POST /requests/environments`, body `RequestEnvironmentsFile`: `version` and `environment`, each `name` and `base`, the whole file and never a patch. Answers `RequestEnvironmentsRead` read again. Comments written in the file by hand are not kept.

**Checked before anything is written**, the first broken rule naming its field (`environment[1].base`): a `version` other than 1, a blank name, a name used twice, a name starting `server:`, and a base that is not an `http` or `https` address or ends in `/`. A 422 `fleet.request_environments_refused`; 500 `fleet.request_environments_unwritable` where the file cannot be written. Written to `requests.toml.writing` and renamed over the file, as `save_flight_controls` writes.

**Kit holds no secret**, and this file holds none: a cookie is kept by `set_request_cookie`, in the Keychain.

`agent_access` is `No`: the addresses are the owner's, and an agent reads them with `list_request_environments`.
"""
