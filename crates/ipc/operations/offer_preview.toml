[operations.offer_preview]
ask_tool = "none"
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Offer a branch for the owner's preview, with one line on what it holds, what to look at and the steps there, so Fleet checks it merges and compiles with main and the other offers"
notes = """
`POST /sessions/offer_preview`, body `OfferPreview`: optionally `branch`, `about`, `look`, `steps`, `approved`, `pictures`, `words` and `session_id`. Answered `PreviewOffered`: the `branch`, its `tip` in full as it stands now, and `state`, always `checking`.

**`branch` is the branch of the slot the Job holds** when it is left out. **`about` is one line on what the branch holds**, at most 120 characters, no newline. It is required on a Job's first offer of a branch and kept on a re-offer that leaves it out.

**Write `look` and `steps` for the owner, who loads the preview and reads one note a Job.** `look` is one line, at most 300 characters, no newline: what he should look at once the build holds the branch ("The toast pile stacks newest on top"). `steps` are how he gets there, at most 9, each `{say, act?}`: `say` is one line of at most 120 characters, as he reads it ("Press Projects"), and `act` is an id in the acts registry, `crates/core-model/domain/actions.toml` (the `[actions.<id>]` table names), read at the offered tip so an act the branch adds counts. **Aim each step at an act where one takes him there**: Bridge shows the act's key beside the step, and his Go press runs it. A step that goes nowhere leaves `act` out. An offer kept with no `look` is told so in the Job's thread and asked to offer again with one. A re-offer that leaves `look` or `steps` out keeps the ones it had; an empty `look` clears it and an empty `steps` list clears them.

**A visual offer names what he approved and attaches a picture of what was built**, for the Ready to try card the offer raises in the Job's thread (`answer_ready_to_try`). `approved` is `{artifact, revision?}`: the sketch or page he approved that the branch builds, by its artifact id or title, at the revision he approved (absent is the newest). `pictures` are at most 4 paths to png, jpeg, gif, webp or svg files, relative to the Job's checkout or absolute, read through `get_repository_file`. `words` are his words that asked for the work, at most 2000 characters, quoted on the card until the request record carries them. A re-offer that leaves any of them out keeps it; an empty list or empty words clear it. **His Looks good on that card is his Approve for the plan's first open `you_approved` gate**, so a Job needs no `approves` item of its own for the preview.

**Fleet keeps the offer at the tip it was made at**, one a (Job, branch): offering again replaces it at the new tip. It then checks the set, one check at a time for the whole Fleet, in one kept worktree. `main` goes first, then each offer's tip in the order they were offered; a conflict fails the offer that brought it in. What each offer touches is compiled against main. All the offers are tried together, and where that fails they are tried one at a time, each on top of those already passed.

**What the check found reaches the Job as a notice, once a change of state**: `<branch> is on the preview list at <tip>.`, or why it is off it, with the files, or that its tip moved since the offer. The check runs again when an offer is made or withdrawn and when `origin/main` moves. `scripts/preview` reads the ready offers from `Armada/preview-offered`, and the owner's Refresh row is `get_preview_offers`'s `refresh`.

**Fleet keeps a note of the offer for the build he runs**, one a (branch, tip), with its `about`, `look` and `steps`. It outlives the offer: an offer is dropped when its Job ends or its tip lands on `main`, and the note stays while a build holds the branch. A re-offer at the same tip updates the note; a new tip is a new note, not looked at. The owner reads it with `get_build_notes`, marks it looked at, and sends feedback on it, which reaches this Job, or a new Job where this one has ended.

**Fleet drops an offer without a word** when its tip is on main or its Job has ended. A branch whose tip moved is dropped and the Job told, since what was checked is no longer what the branch holds.

Refused 422, each naming what is missing: `fleet.preview_no_branch` where the Job holds no branch and names none; `fleet.preview_branch_unknown` where the branch is not in the served repository; `fleet.preview_not_ahead` where the branch is not ahead of main; `fleet.preview_about_needed` on a first offer with no `about`; `fleet.preview_about_invalid` for an `about` over 120 characters or on more than one line; `fleet.preview_look_invalid` for a `look` over 300 characters or on more than one line; `fleet.preview_steps_invalid` for more than 9 steps, or a step with no `say`, a `say` over 120 characters or on more than one line; `fleet.preview_step_act_unknown` for an `act` that is no id in the acts registry, naming it; `fleet.artifact_not_held` where `approved` names no artifact of the Job; `fleet.preview_approved_revision_unknown` for a revision the artifact lacks; `fleet.preview_pictures_invalid` for more than 4 pictures or a path that is no picture file; `fleet.preview_words_invalid` for words over 2000 characters; `fleet.preview_unavailable` where the served repository has no `scripts/preview`. 422 where the call places no Job.

`agent_access` is `Yes`: only the Job knows its branch is ready to be tried.
"""
