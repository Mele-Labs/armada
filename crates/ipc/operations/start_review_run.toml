[operations.start_review_run]
kind = "command"
transport = "HTTP"
agent_access = "Bridge only"
description = "Ask an agent, read-only, about one pull request: a tool, an explanation, a question, a fix for a finding, its change sets, its overview or a change set's practices, kept for the commit it read"
notes = """
`POST /review_runs/:repository`, `repository` a manifest id, body `StartReviewRun`: `number`, `kind` (`tool`, `explanation`, `ask`, `fix`, `change_sets`, `overview` or `practices`), `name` (the definition's id, the question's words, for a fix `<path>:<start>-<end> <title>`, for `practices` the change set's id, and not read for `change_sets` or `overview`), `again`, `place` and `finding`. **Answers at once** with a `ReviewRun`; its progress and its result arrive as `review_run.changed`, and `get_review_runs` reads them again.

**Only a press starts one, and a kept result is answered as it stands.** Without `again`, a result kept for this pull request, this kind and name is answered with no run, at the commit it ran on: a newer head leaves it served, and Bridge marks it out of date. Nothing kept starts a run at the head the forge says now. With `again` a run starts whatever is kept and replaces the result for that head. A run already going for the same key is answered, not started twice.

**The run reads and cannot write.** Fleet leases a bay, checks out the pull request's head there on a branch of the lease's own, and asks one model call with the read tools only (Read, Grep, Glob; no shell, no edit, no network) confined to that checkout, then gives the bay back. It is handed the definition's prompt, the pull request's title, description, head and diff. The model is `models.review`. The answer is JSON in the shape the kind has, validated; one that is not valid is a failed run with its reason and is never a result.

**The tool `walk` writes a walk and needs `place`**, where the change runs (`find_walk_place`, or the sheet's answer). It answers `web_walk`, `show_window` steps over the page at the place, or `api_walk`, a list of requests with what to look for in each response, whichever the pull request is, and Fleet fills the `place` into the result itself. Without a `place` that is a 422 `fleet.review_walk_needs_a_place`; `place` on any other name is ignored. A walk's steps are checked as `show_window` checks them, and a request is checked for a path on the base address, a method of the five and a body that is JSON. Natural Search is not started here: `start_review_search`.

**A `fix` writes the lines that replace one finding's, and needs `finding`**, on the `right` side of a file the pull request changes. Fleet reads lines `start` to `end` of that file at the head from the bay before the model is asked, and answers `fix` with the finding's place as `at`, those lines as `before`, the agent's `after` and its `why`. A finding past the file's end, an empty `after`, or an `after` that is `before` is a failed run. `finding` on any other kind is ignored.

**`change_sets` answers `change_sets`**: the pull request's hunks put into sets, each with an `id` (`set-1` on, in the order the sets run), a `title`, a `kind` (`migration`, `data`, `logic`, `api`, `ui`, `tests`, `config` or `other`), a one-sentence `purpose`, an `area` and its `hunks` in the order they run. A hunk is a `HunkRef`, the path and the header's ranges, never its text: the agent is told each hunk by an id Fleet gives it and answers ids, so a set can name no hunk the diff does not have. A hunk it puts in no set goes into a last set of kind `other`. The `area` is the directory every hunk of the set is under, `""` for the root. Kept under the name `change-sets`.

**`overview` answers `overview`**: blockers, risks and possible bugs, each with its `severity`, the `set` it is in, a `title`, one sentence of `reason` under the finding comment rule and a place, blockers first. It is told the sets kept at the same head and the review tools `risks`, `bugs` and `api-breaking-changes` as the repository resolves them. Kept under the name `overview`.

**`practices` answers `practices`** for one set: the repository's own docs that state practices for its `kind` and `area`, read into checklist items, and each item `met`, `missed` or `not_applicable` with a `note`. What was read is kept in the practice catalogue by repository, area and kind, with each doc's blob at the pull request's base. A later run for the same area and kind, on any pull request, reads no doc and checks against the kept items (`reused` true), unless a doc's blob at its base has moved, which reads them again. `read_at` and `sources` say when and from what. A read that finds no doc is answered with no checks and is not kept.

`overview` and `practices` need the `change_sets` result kept at the same head and range: without it a 409 `fleet.review_change_sets_needed`, and nothing is spent. A `practices` name that is no set's id is a 422 `fleet.review_change_set_unknown`.

A 422 `fleet.review_unknown_tool` for a name no definition has, `fleet.review_blank` for a blank question or a fix with no name, `fleet.review_fix_needs_a_finding` for a fix with no `finding`, `fleet.review_fix_on_old_lines` for a finding on the `left` side, `fleet.review_fix_off_the_change` for a finding in a file the pull request does not change or on no range from line 1, and a 500 `fleet.review_pull_request_unreadable` where the forge would not give the pull request.
"""
