[operations.ask_scout]
kind = "command"
transport = "HTTP"
agent_access = "Bridge only"
description = "Ask a scout how something works in the code: a Finding is added Gathering and the scout starts reading, and the Studio is answered"
notes = """
**A person's ask, typed on a Studio.** `asked` is told to the scout verbatim, with the repository's checkout on disk as its directory and read tools alone (`docs/concepts/scout.md`). The Finding records the commit checked out and whether anything uncommitted sat on top of it before the scout reads a line; a checkout git will not read is refused as `fleet.scout_checkout_unreadable`, and nothing starts.

Every file read and every search run is written to the Finding as each is answered, and each write publishes `studio.changed`, so a whiteboard watches it fill. It freezes however it ends, with `ended` saying `answered`, `stopped` or `failed` and the cost where the agent reported one.

**No budget and no place under the concurrency cap**, decided with the owner: the cost is shown when it ends, and `stop_scout` is how a person ends one. `Bridge only` because it is the person's own ask; Helm acting on an ask adds a Proposed Finding and calls `start_scout`.
"""
