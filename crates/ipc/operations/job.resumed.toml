[operations."job.resumed"]
kind = "event"
transport = "WebSocket"
agent_access = "Bridge only"
description = "A Job's pause was lifted, or its resume began waiting for a slot"
notes = """
Since 23.39. `job.paused`'s counterpart and shape: the row whole, with `paused` absent where the Job holds a slot again, and present with `resuming` where every slot was held.

Published by a resume that seated the Job or began its wait, and by the turn that seats a waiting Job when a slot frees. A queued Job that admission seats moves status, so `job.state_changed` tells it. A resume of a Job already waiting changes nothing and publishes nothing.

`agent_access` is `Bridge only`, for `job.paused`'s reason.
"""
