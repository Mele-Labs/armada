[operations.answer_command]
kind = "command"
transport = "HTTP"
agent_access = "Helm only"
description = "A person allows or rejects a command a Drone was not given"
notes = """
**It answers two things, and the call id says which.** A command a Drone is waiting on right now — its Job is set to `ask_me`, which a person chose, so the harness is holding it inside the permission call — is answered in place, and the Drone carries on in the same session. A refused row on a Job stopped at `blocked_by_policy` — `refuse_and_hold` — is answered after the fact: an allow records the command for the Job and restarts the step, and a reject reaches the Drone as a turn.

`always_allow` does what `allow_for_job` does, for every Job against this Manifest: since `#836` Fleet keeps the rule in its own table, listed by `get_repository_allowed_commands`, and commits nothing. The rule is one of the command's own `rules` when the body names one (`#834`), and the whole command when it does not.

The body is `call`, `answer`, and since 11.5 an optional `note`. The answer is one of the offers the command carries, `CommandInFlight.offers` or `Refusal.offers`. A command offered nothing is one no person may allow from here, and `Refusal.withheld` says why: declared destructive, or a push.

**The `note` is prose, and this row said there was none until 12 Sep 2026** — words reached a Drone through `redirect_drone` alone. What falsified that is the shape of the moment rather than an argument about mediums: the reason for a refusal exists in a person's head exactly when they press reject, and a design that answers the command in one box and carries the reason in another spends that reason to a second act nobody remembers to take. It rides only on a reject. An allow already tells the Drone everything it acts on, and `redirect_drone` is still the way to send words that are not about a refusal.

Refused with a 409 where the call names nothing waiting or refused on that Job, and where the answer is not among its offers. The id is what makes a window left open across an answered command a refusal rather than a coincidence.

It replaces `approve_command`, a placeholder row for confirm-before-destructive that nothing served. A command declared destructive is offered nothing here.

`agent_access` is `Helm only`. An allow becomes something a Drone runs, and `always_allow` a line every later Job is given — real consequences, but ones Helm may now cause on the same terms as any other act: only when asked, in conversation, and never on its own initiative.
"""
