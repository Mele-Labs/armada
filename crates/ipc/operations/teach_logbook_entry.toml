[operations.teach_logbook_entry]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Teach Armada an entry by hand, which stands at once"
notes = """
`POST /logbook/entries`, body `{section, repository?, kind, text, paths?}`. Answers with the entry. It stands with no Job behind it, marked edited, and is handed to the next Job. `repository` is a root `list_repositories` names and is required for `repo`; the other sections ignore it. A `section` or `kind` outside its set is a 400. A `repo` entry with no `repository` is a 422 `fleet.logbook_repository_missing`, and a root Fleet does not serve a 404 `fleet.run_memory_repository_not_served`. Text that is empty or over 400 characters is a 422 `fleet.logbook_text_refused`. **Teaching text the person forgot lifts that forgetting**, since teaching it is asking it back. Teaching text an entry already says stands that entry and answers with it.
"""
