[operations.checkout_to_pull_request]
kind = "command"
transport = "HTTP"
agent_access = "Bridge only"
description = "Send a held checkout's uncommitted files up as a pull request into its base with auto-merge on, without touching the checkout, and answer with the pull request's number"
notes = """
`POST /merge_lines/checkout_to_pull_request`, body `CheckoutToPullRequest`: the repository's `manifest_id` and nothing else. Answered `CheckoutSentAsPullRequest` with a 200: the forge's `pull_request` number and whether it took `auto_merge`. `docs/concepts/fleet.md`, *What Fleet knows after the merge, and what it does not*, has the model.

**No path crosses the wire.** Fleet reads the hold again (`held_back`) and refuses on the same conditions as `catch_up_checkout`: on the base, ahead of nothing, an uncommitted file, none of them a file main also changed to something else. It then sends the files the hold lists.

**The checkout is not touched.** The commit is made from objects, as a form's save to the Manifest is: its parent is the tip `origin` holds of the base, its tree is that tip's with each listed path's working-tree content (a file gone from the working tree is removed), and it is pushed to a new branch `armada/checkout-<hex>`. The working tree, the index and `HEAD` are the person's and stay as they are. The pull request is titled by the path, or `<n> files`; auto-merge is turned on with `gh pr merge --auto --merge`.

**The hold carries the pull request** (`HeldCheckout.pull_request`, in `merge_lines.changed` within two seconds) until the hold clears. The files stay listed: they are still uncommitted here. Once the pull request is on main, Fleet finds every uncommitted file byte for byte main's and catches the checkout up itself with `git pull --ff-only --autostash`, with no call raised. **A forge that refused auto-merge is not a failure**: the pull request is open, and `auto_merge` is `false`.

Refused with a 409 and nothing sent: `fleet.checkout_already_sent` where this hold already carries a pull request; `fleet.checkout_not_held` where nothing holds the checkout back now, the repository names no base or git could not be read there; `fleet.checkout_not_catchable` where it is on another branch, has commits the base lacks, has an uncommitted file main also changed, or has nothing uncommitted. 500 `fleet.checkout_not_sent` where the commit, the push or the pull request would not go, with the tool's words in the message. 422 `fleet.repository_not_served` on a `manifest_id` this Fleet does not serve.

`Bridge only`: it publishes a person's unfinished work to the forge, and the press is the owner's say-so.
"""
