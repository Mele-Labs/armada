[operations.get_merge_line_view]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "Each served repository's merge line as a screen draws it: the pull requests to list in order, and main's mark"
notes = """
`GET /merge_lines/view`. Answers `MergeLineViews`: one `MergeLineView` for each line `get_merge_lines` serves, in its order, so the native Bridge and Pocket draw what the Electron Bridge worked out in TypeScript without working it out again.

**What Fleet derives.** `name` is the repository's label among the ones Fleet serves: its Manifest's name, widened to `parent/folder` and then the whole root only where another served repository reads alike, and the root itself where the list has not caught up with the line. `pulls` are the forge's merge queue by position, then those waiting for ci to join it, then the rest as the forge lists them. **Someone else's pull request (`mine` false) is listed only while it is in the queue, and quiet**: number, title, branch, address and author, and its queue state `in_queue` with its position, with every other field absent and `draft` and `merge_by_hand` false. A pull request of your own passes through whole. **Each pull request also carries `held_by` and `tone`**: the Job that holds it by id and title (absent where none does), and `calm`, `ask` or `bad` for its chip. `main` is `green`, or `red` naming the first failed job and the others with the Manifest Check each maps to; it is **absent** for a main not read yet, one running, one the forge ran nothing on, and a red that names no failed job. A red's merging Job and the Job taking it always carry a `title`: the ledger's, else the branch, else the Job's id. `landed`, `checkout`, `read_at` and `quiet_since` are the hub's as they are.

**What is left out.** The land runner's lists (`line`, `off`, `landed` and `sent_back` of a `MergeLine`) are always empty and are not here. A pull request's place in the queue is its `queue.position` in `pulls`; there is no other. **The person's repository pick stays a client filter**: every served line is here.

`agent_access` is `No` for `get_merge_lines`' reason. A Bridge that missed `merge_line_view.changed` reads this route again on the resync that follows a `Missed`.
"""
