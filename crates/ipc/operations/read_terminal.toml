[operations.read_terminal]
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "Read the last lines of this Job's terminal, the one the person sees in Bridge, as its screen shows them: what a server printed since, or what the person typed and ran there. Optional lines (60 unless set, at most 500); optional until, text to wait for in what the shell printed since your last type_in_terminal, the echo of your own text included, so a prompt that came before this call still counts; optional regex (false unless true, reads until as a regular expression); optional wait_seconds (10 unless set, at most 60, read only with until); optional session_id, only where you run in a terminal. With until the answer has matched, false where the wait ran out first. For a wait longer than a minute, start_watch. Refused where the Job has no terminal open: type_in_terminal opens one"
notes = """
`GET /sessions/terminal/read?lines=&session_id=&until=&regex=&wait_seconds=`, the query `ReadTerminal`. Answered 200 with `TerminalScreen`: `run_id`, `screen`, and `matched` where `until` was given; `screen` is the last `lines` of the shell's held output (absent is 60, held to between 1 and 500) with escapes and carriage-return overwrites resolved, and the last 32 KiB at most. A full-screen program, an editor or a pager, draws by moving the cursor, and reads here as the lines it wrote rather than the screen it drew.

**The Job is the one the connection places when Fleet hosts it**, else `session_id`. Nothing placing one is refused with 422, and so is a Job with no shell open, one that has exited included.

**`until` reads from the agent's last `type_in_terminal` on the shell**, or from all the shell holds where the agent never typed into it, so a prompt that arrived between the two calls counts. It is read as the screen resolved it, escapes and carriage-return overwrites resolved, as `screen` is. `regex` reads it as a regular expression in the `regex` crate's syntax, and one that does not compile is refused with 422. The read answers as soon as it is found, or once `wait_seconds` has passed (absent is 10, held to between 1 and 60), or once the shell exits, with `matched` `false` in the last two cases. The wait is held under a minute for the reason `type_in_terminal`'s is: a longer one is a watch's, `start_watch`.

`agent_access` is `Yes`: the agent reads the shell it shares with the person, which holds nothing the person's pane does not show.
"""
