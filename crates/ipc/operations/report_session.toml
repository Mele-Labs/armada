[operations.report_session]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "A harness tells Fleet one fact about an agent job a person runs: it began, moved, took a branch or a pull request, measured, finished a turn or ended"
notes = """
`POST /sessions/report`, body `SessionReport`: the harness's name, the job's own id and one `fact`. Since 23.43. Answered with the whole `SessionRecord`.

**Armada's own shape and no harness's.** A mod in a terminal job, a Bridge-hosted job and a script send the same body, so nothing past the adapter that sends it knows what a job runs in. Fleet stamps each fact on arrival, so no clock of the sender's is compared with its own.

**Fleet resolves what the sender cannot.** `started` and `moved` carry only the directory; Fleet matches it to a served repository and to the pool slot it stands in, and a job moving out of a slot gives it back. A `branch` or `slot` attachment is exclusive per job; every other `kind` is kept as the open word it arrived as.

**A terminal job's `ended` parks its slot**: what is in it is committed to its own branch and nothing is pushed, once the process holding its lease has gone. Not for `clear` or `resume`, after which the same process goes on under another id. `docs/concepts/session.md`, *Ending a terminal job*.

**`started` and `tuned` carry the mod's `mod_version`** (since 23.62), kept on the job's row; a fact without one leaves it.

**`tasks`, `plan_left`, `committed` and `pushed` feed a Job's build record** (`SessionRecord.build`): the agent's whole task list as its task tools left it, plan mode left, and a commit or a push that git printed. A task a subagent wrote carries `by`, its `agentId`: subagents share the Job's list. `docs/concepts/session.md`, *The build record*.

**A fact is idempotent**: the same attachment reported twice changes nothing and publishes nothing. A job Fleet has never heard of is created by whatever fact arrives first, so a job already running when Fleet started is recorded from its next fact.

`agent_access` is `No`: it is the harness that reports, never the agent inside it, and an agent that could write its own row could write another's.
"""
