[operations.promote_mod]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Put a valid mod into a repository under packages/mods by a Job of its own, which pushes it, opens its pull request and sees it merged"
notes = """
Since 23 Oct 2026 by a Job of its own, as `commit_to_repository` is. `POST /mods/promote`, body `PromoteMod`: `name` and an optional `manifest_id` (absent is the first repository Fleet serves). Answered with `ModPromoted`: `name`, `session_id` (the Job made for this promote), `branch` (its own), `commit`, `pull_request` (its address, where one opened) and `pull_request_not_opened` (why not, where none did).

Fleet starts a hosted Job titled for the mod (`Add the calm theme mod`), leases it a slot and its own branch, writes `mod.toml` and `theme.css`, or `layout.json` for a layout mod or `tracker.toml` for a tracker mod (never the mod's `.git` or a tracker's try record), to `packages/mods/<name>/` in its tree, commits exactly those paths with the title as the message, pushes the branch and opens a pull request into the base. The pull request goes on the Job's row, so Fleet tells the Job when its ci fails, it conflicts or it merges, and the Job is told so in Fleet's words: fix what goes red, keep the branch current with the base, and finish when it merges. Neither the owner's checkout nor any branch that exists is touched. The mod's own history stays in its own repository.

**A pull request that does not open loses nothing**: no remote, a push or forge that refuses, or no tool on the machine leaves the Job holding its branch with the commit on it, `pull_request_not_opened` says which, and the Job is told nothing, having nothing to watch.

Refused, before any Job is made, with 409 `fleet.mod_not_promotable` where the mod is invalid, is built in (`built-in:<name>`, which is in the repository already), where the repository has no `packages/` folder, or where its checkout holds the mod exactly as it is; also where no slot could be leased for the Job, which is then closed (try again); 404 `fleet.no_such_mod` for a slug naming no folder or an id naming no built-in mod. A 500 `fleet.mod_not_written` where a file cannot be written or git refuses the commit, which leaves the Job holding its tree.

`agent_access` is `No`: putting something into the owner's repository is asked for by the owner.
"""
