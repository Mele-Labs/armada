[operations."calls.changed"]
kind = "event"
transport = "WebSocket"
agent_access = "Bridge only"
description = "The calls on the person moved or something began to wait on him, and this is every call now with what is new"
notes = """
Carries `CallsChanged`: `calls`, the answer to `get_calls` whole, and `arrived`, the news since the last publish: a `CallArrival` for each item that began to wait on a live, unpaused Job (`needs`), or Job that Fleet gave up restarting (`stopped`), or another Mac that began to wait for his Confirm to pair (`mac_pairing`, whose `key` is the call's key `mac:<id>`, and whose `session_id` still carries that key, naming no Job, for readers that do not read `key` yet), or a review somebody asked of him by name (`review_requested`, told once a request, whose `key` and `session_id` are the call's key `review:<owner/name>#<number>`; the call of that key carries the pull request in `review`), with the Job's title, the words and a `tone` of `blocked` where the item holds the turn and `waiting` where it does not. `arrived` is empty where only openedness or the list moved.

**Fleet publishes when the calls or the news differ from the last publish**, off every Job's row and every merge line, not on each tick. What stood when Fleet started only seeds, so nothing it held is news, and an item the Job posts again under its id is the same one. The batching window (Electron's two seconds), the sound, the banner and the Dock count stay with the client. Nothing here is told for a merge, a finish or a merge-line call. A review request is read on its own five-minute tick, not off a row.

A resync does not carry it; a client that reconnects reads `get_calls` again, and the news it missed is not told.
"""
