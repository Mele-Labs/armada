[operations.set_run_memory_place]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Choose where a repository's remembered runs are kept"
notes = """
The body is `{repository, place, synced_folder?, cloud?}`. `this_mac` keeps them in a file under Kit's folder (`~/.armada/runs/`) keyed by the repository's remote, or its path where it has none. `repository` writes each remembered line as a Command (never a Check, so nothing here gates a pull request) into the repository's own `armada.yml` on a Job's branch, so they land with the Job's pull request; a line the file already declares is never overwritten. `synced` is the same Kit layout under `synced_folder`, which is required and must be an existing folder. `cloud` needs `cloud`, one of `{"store":{}}` (Armada's central store, as the profile the repository is bound to, keyed by a hash of the repository's remote) or `{"bucket":"s3://bucket/prefix"}` (also `r2://` and `gs://`, read with the provider's own environment and credential files, never kept). The same layout as `synced` is written there, and a fact another machine wrote is merged in first.

Choosing a place does not move what is already kept: the next Job to end writes the facts there. A 422 (`fleet.run_place_refused`) where `synced_folder` is missing or not a folder, or `cloud` is missing or not an address of those forms. A cloud place that cannot be used now is a 422 and the old place stays: `fleet.run_cloud_unsigned` (no profile signed in for the repository, or no credentials for the bucket), `fleet.run_cloud_unreachable` or `fleet.run_cloud_refused`. A write that fails later keeps the facts here and is tried again at the next turn's end. Answers with the place as `get_run_memory_place` does.
"""
