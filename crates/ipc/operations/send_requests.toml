[operations.send_requests]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Send one request for each body file and each value, in one call, with an environment's secrets you never see: twenty files and twenty values are four hundred requests. Write the files under your Job's scratch folder or slot first, then name them in body_files (absolute paths). The template is the method, url, headers and optional collection every request shares; vary names a placeholder and its values, and {{that name}} in the url, headers and each file is replaced by one value per request, before every other {{name}} is filled from the environment, secrets included, which reads as {{name}} in everything you get back. Up to 5 requests are in flight at once (concurrency, at most 10), and no new request is sent after 5 answers in a row that are a 4xx, a 5xx or an error (stop_after); what was not sent is listed as skipped. At most 1000 requests a call. The answer is one short line for each request, never a body: its name (the file's stem, then a dash and the value), status, ms, error, and saved, the file in the answer's folder that holds the whole body with secrets as {{name}}. Read those files with jq, python or grep. They go when the Job ends. Body: environment, template (method, url, headers as a list of name and value, optional collection), optional body_files, optional vary (name, values), optional concurrency, optional stop_after"
notes = """
Since 2 Nov 2026. `POST /requests/send_many`, body `SendRequests`: an optional `session_id` and `repository`, an optional `environment`, a `template` (`RequestTemplate`: `method`, `url`, `headers`, optional `collection`), `body_files` (absolute paths, each read as in `send_request`'s `body_file`), an optional `vary` (`{ name, values }`), an optional `concurrency` (default 5, over 10 is 10) and an optional `stop_after` (default 5, under 1 is 1). **A field the body does not name is refused as it is read.** Answers 200 with `RequestsSent`: `folder`, `lines` (each `{ name, status?, ms, saved?, error?, skipped? }`) and a `note` where the batch stopped or was cut.

**What is sent.** One request for each body file and each value, so twenty and twenty are four hundred; with no `vary` one for each file, with no files one for each value and no body. `{{<vary name>}}`, spaces inside the braces allowed, is replaced by the value in the `url`, every header value and the body **before** Fleet fills the environment, so every other `{{name}}` is left for it. A body file is read once, from the Job's scratch folder or its slot only, and a path outside them, one that is not text, one over 64 KiB or one that is not there is a 422 `fleet.request_refused` before anything is sent. A batch of more than 1000 is refused the same way. Each request then goes as `send_request` sends one: filled in Fleet, a secret never leaving it but on the request.

**Many at once, with a stop.** Up to `concurrency` requests are in flight. After `stop_after` answers in a row, counted as they arrive, that are a status of 400 or more or an error, nothing more is started and the rest are `skipped`; `note` says so. A request already in flight finishes. An answer that is not a failure resets the count.

**Each answer is saved whole**, to `<folder>/<name>.json` (`.txt` where the answer names no json), with every secret hidden as `{{name}}` over the whole text, and the line holds the file's name only, so four hundred lines fit the door's cap. A name taken twice gets `~2`, `~3` after it. The thread gets no `requested` row for a batch, and the Job is not told: it holds the answers. A batch needs a Job whose thread is open, since the files go in its scratch folder: with none it is a 422 `fleet.requests_unplaced`. A Keychain that would not read a secret is a 500 `fleet.request_secret_unkept`, never carrying the value.

`agent_access` is `Yes`, for `send_request`'s reason.
"""
