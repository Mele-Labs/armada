[operations.get_review_lists]
kind = "query"
transport = "HTTP"
agent_access = "Bridge only"
description = "The pull requests waiting on a person, as five lists read from the forge: asked of them by name, asked of a team they are on, assigned to them, opened by them, and the open ones they ran a review tool on that are on none of the other four"
notes = """
`GET /review_lists`, or `GET /review_lists?project=<id>`. `PullReviewLists`. **Read when the Reviews tab opens and on Refresh, and never polled**: Armada does not watch other people's pull requests, so Fleet holds no copy and the reply is as old as the forge's answer.

Open pull requests of every repository Fleet serves, **one forge call a list** (`gh api graphql` over a search that names all the served repositories), newest-updated first and **capped at 50 a list**; a list at 50 has more behind it. `me` is the "mine" login of `fleet::my_pulls`, the account Armada is signed in as for the repository, else the forge command line's, and every list is asked for that login by name. `team` is review requested of a team the person is on and not of them by name; its rows carry the team's name. A pull request on several lists is on each, as a row.

**`reviewing` is the open pull requests he ran a review tool on in Armada and that are on none of the four**, newest run first and capped at 50. Fleet names them from its own record of runs, a tool, an explanation, the change sets, the overview or a practice check at any head and not a question, a fix or a search, then reads them from the forge by number in **one call beside the four** and keeps the open ones. **Every row of every list carries `reviewing`**, true where he ran one.

**With `project`, every list keeps only the rows of that project's member repositories**, a folder member counting as its repository, and only those are asked of the forge. A project none of whose members Fleet serves answers five empty lists. A project he has none of is a 404 `fleet.no_such_project`, and one whose file did not read a 422 `fleet.project_unreadable`. Without it, every served repository's rows, as before.

A list the forge would not answer is empty and named in `silent`, so one failure does not blank the others. All four of the forge's own lists silent is a 500 `fleet.review_lists_unreadable`; a read by number that fails names `reviewing` in `silent` and fails nothing else. **GitHub's rate limit** is its own answer: with the lists last read, those are shown with `rate_limited` set (`until`, RFC 3339 with milliseconds, absent where GitHub named no time, and `said`, the forge's own sentence for the limit without a time) and `fetched_at` their time, and Fleet asks nothing until `until`, or for three minutes where none was named; with none read it is a 500 `fleet.review_lists_rate_limited`, `fields.until` the same time. No token and an unanswering GitHub are `fleet.review_lists_unreadable` with a sentence that says which. No login known is a 500 with the same code.

`agent_access` is `Bridge only`: an agent that wants one pull request asks for it by number.
"""
