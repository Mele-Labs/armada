[operations.read_request_repository]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "Which served repository the words of a request are about, for the dispatch panel's repository chip"
notes = """
`GET /repositories/of_request?q=`, the words typed so far. Read before any Job exists, on a pause in typing, so it is deterministic and cheap: **no model call**, a stat per candidate path, and one open of each repository's git config for its remote. Nothing is recorded.

Answers `RequestRepository`: `manifest_id`, set only where exactly one repository is clearly meant, with a Manifest or without (the id a Job there carries, `implicit_id` in `list_repositories`; absent otherwise, never `null`), and `likely`, every repository best first. The signals in order, the first to name any repository deciding: a ticket or pull request link whose forge repository is a repository's remote; the repository's name, Manifest id or root directory name as a whole word, a longer name winning over a shorter one it contains; an `@path` or a path with a `/` that exists in the repository's tree, or lies under its root; and only one repository being served. If the deciding signal names two, the answer is none rather than a pick from a weaker signal. Names under three characters are not read as words. Ties in `likely` fall to the repository with more Jobs.

`manifest_id` is what the dispatch panel shows on its chip, and its absence is what makes the panel ask the person before anything is built. It never refuses: a Fleet serving no repository answers an empty `likely`. `agent_access` is `No`: it exists for the person typing, and an agent names its repository outright.
"""
