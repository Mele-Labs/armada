[operations.list_watches]
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "This Job's watches, live and ended, the newest first: each one's id, name, command, state, whether it is live, its readings, the parts set aside and the verdicts given, each with its sentence"
notes = """
`GET /watches?session_id=`. Answers 200 with a `WatchList`: `session_id` and `watches`, each a `WatchSummary` `{ id, session_id, name, command[], recipe?, every_seconds, gives_up_after_seconds, follows?, environment?, state, live, started_at, last?, readings[], set_aside[], verdicts[] }`. `state` is one of `waiting`, `running`, `passed`, `failed`, `gave_up`, `broken` or `stopped`; `last` is a `WatchReading`, `kind` `read` `{ at, state, finished, says, link?, parts[] }` or `broken` `{ at, why, output? }`.

`readings` are the newest 50, oldest first, and `last` is the newest of them; `verdicts` are `{ at, verdict, sentence, parts? }` in the order given. All of it is kept in the store, so a restart answers the same.

**The Job** is the one the connection places when Fleet hosts it, else `session_id`, a 422 `fleet.no_such_session` where Fleet holds no such Job; nothing placing one is a 422 `fleet.watches_unplaced`.

`agent_access` is `Yes`: an agent woken by a watch's notice reads the watch whole here.
"""
always_loaded = true
