[operations.show_window]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Show the person a web page in a window of Bridge's own, which opens by itself and which a note taken in is answered by a message to this session"
notes = """
`POST /sessions/window`, body `ShowWindow`: `url`, an optional `title` and an optional `session_id`. Answered with the `SessionRecord`.

**Any `http` or `https` address**; any other scheme is refused with 422 and nothing written. **The session is the one whose process holds the connection** when Fleet hosts it, whatever the body says; `session_id` is read only for a session in a terminal, whose connection Fleet cannot place; the mod tells the model its own id at the start of the conversation (`prompt.context`), and the model passes it. A call that places no session and names none is refused.

**Fleet records it twice and publishes it once.** An `artifact` attachment of form `window` with the address as its target, kept once however often the address is shown, and a `window` row on the thread, appended on every call; the row is `session.row`. Bridge opens the window when that row arrives, and raises it where it is already open. A note taken in the window is sent to the session as `send_session_message` from the person, which wakes it.

`agent_access` is `Yes`: the session is the one that has something to show, and a person is not always looking at the thread when it does.
"""
