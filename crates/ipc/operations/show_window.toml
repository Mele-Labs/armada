[operations.show_window]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Show the person a web page in a window of Bridge's own, which opens by itself and which a note taken in is answered by a message to this job. While he walks it, AskUserQuestion is refused: ask a question about the page with ask_in_window; any other Armada keeps, whole, in his Needs you list for after the walk, so do not add it to waiting_for, and end your turn so his notes reach you. To offer several takes of one change, pass variations, a list of {name, url}, with url the first's: he swaps between them on the window's bar and a note or an Approve names the take. To walk him through the page step by step, on any page and in any repository, pass steps, a list in the order to play. Each step is {say: a line he reads, plus one verb}: press, look, hover, later or paste with a target; type with the words and into a target; key with a key such as Tab or Meta+n and on a target; select with words and in a target; drag with a target and by {x, y} in pixels. A target is {role, name}, role a role such as button, tab or textbox, or text for words the page draws, name a string inside its accessible name (exact: true for the whole name), within another target to look only inside it. Bridge rings each target, shows the line, and acts on it with real input when he presses Next. On a page that is not on his machine, Autoplay stops before a step that acts and he presses Next to run it. A target it cannot find holds the walk on that step and you are told which. Call show_window again when the page is ready to walk mid-turn: Armada marks the window as still changing while you edit files. The page may be a deployed app, not only a local server. The window follows redirects and links only on the page's own origin; to let it pass through others, such as a single sign-on provider the page redirects to, pass origins, a list of http or https origins with no path (for example https://login.example.com). The owner then signs in on that page in the window, and the sign-in stays for later walks of this repository. If this repository gives you a way to sign in yourself, such as a dev magic link or a token login address, pass sign_in, a list of addresses on the page's origin or one of origins: the window loads each in order before the page. sign_in holds a secret: Armada keeps it in memory only until the window opens and writes it nowhere, so never put one in a message, a note or a waiting_for item"
notes = """
`POST /sessions/window`, body `ShowWindow`: `url`, an optional `title`, an optional `session_id`, optional `variations`, optional `steps`, optional `origins` and optional `sign_in`. Answered with the `SessionRecord`; **through the agent's door, a receipt** of `session_id`, `window` (the address), `title` where one was given, `takes` (their names) and `steps` (their captions) where there are any, because the row grows with every attachment and an agent keeps each answer.

**Any `http` or `https` address**; any other scheme is refused with 422 and nothing written. **The job is the one whose process holds the connection** when Fleet hosts it, whatever the body says; `session_id` is read only for a job in a terminal, whose connection Fleet cannot place; the mod tells the model its own id at the start of the conversation (`prompt.context`), and the model passes it. A call that places no job and names none is refused.

**`variations` is a list of `{name, url}`, several takes of one change in one window.** Each `url` is held to the rule `url` is, a take with no name is refused, and `url` must be the first take's: 422, nothing written. They ride the `window` row and the artifact's `detail.variations` (a JSON string, as `detail` holds strings only), so reopening the window from the ledger or the thread brings them back. Bridge draws a letter and name per take on the bar; a note names the take it was taken on (`On B, Needs you first: …`) and Approve names the one on screen (`Approved B, Needs you first: <address>`). The walk ends on an Approve of any take.

**`steps` is a scripted walk of the page, played by Bridge from outside it.** The steps are the mock walks' own (`apps/desktop/src/renderer/src/mock/walk.ts`): each is an object with a `say` caption and exactly one verb, `press`, `look`, `hover`, `later` or `paste` (a target), `type` (words) with `into`, `key` (`n`, `Tab`, `Meta+n`) with `on`, `select` (words) with `in`, or `drag` (a target) with `by` (`{x, y}`). A target is `{role, name?, exact?, within?}`: a role, or `text` for the words an element draws, and a string inside its accessible name in any case. Fleet refuses a call whose steps do not have that shape, naming the first step that does not (a key it does not know is a 400 from the decode, a verb or target that is wrong a 422), and nothing is written. They ride the `window` row and the artifact's `detail.steps` (a JSON string), so reopening the window from the ledger or the thread brings them back, and a window carrying steps is not the same window as one shown without them. A page that plays its own walk (`window.__armadaWalk`, Armada's mock) is passed none, and plays as it did. **A step Bridge cannot play is told back**: when a target is not found on the page within five seconds, Bridge holds on that step and sends `window_failed` naming the step and its target, once, so the job fixes its steps and shows the window again. `docs/practices/capture-window.md`, *A walk in the page*.

**`origins` is a list of other web origins the window may pass through**, so a deployed page behind single sign-on can be walked: the redirect to the provider and back is followed instead of refused. Each is `http` or `https`, a host and an optional port, and no path, query, fragment or sign-in of its own; one that is not is refused with 422 and nothing written. The window is pinned to the shown origin and these, and everything else stays refused. They are kept on the `window` row and the artifact's `detail.origins` (a JSON string), so reopening the window brings them back. The window's cookies are one jar for the job's repository, so a sign-in, the person's or the job's, holds for later walks of it.

**`sign_in` is a list of `http` or `https` addresses, each on the shown origin or one of `origins`** (422 otherwise, nothing written), which the window loads in order, in the repository's cookie jar, before it loads the page. **They are secrets.** Fleet holds them in memory from the call until Bridge takes them (`take_window_sign_in`), the job shows another window, or the job ends, and writes them nowhere: not the store, the thread, the timeline, a note, the `window` row, the artifact or the receipt. A Bridge that is not connected when the page is shown opens the window when it connects, and takes them then. A failed sign-in load is not told to the job.

**Showing a page says it is ready, and Armada marks it still changing without being told.** The window artifact's `detail.working` is `"true"` after the mod reports a file the job itself wrote (`report_session` fact `wrote`, never a subagent's), or after the owner sends a note from the window (`On …, at <address>`); showing again, or the end of the job's turn (`turn_completed`), clears it. Bridge draws it on the bar and Approve reads Not ready while it is set.

**Fleet records it twice and publishes it once.** An `artifact` attachment of form `window` with the address as its target, kept once however often the address is shown, and a `window` row on the thread, appended on every call; the row is `session.row`. Bridge opens the window when that row arrives, and raises it where it is already open. A note taken in the window is sent to the job as `send_session_message` from the person, which wakes it.

**It opens the job's walk**, and while that is open Fleet refuses the job's `AskUserQuestion` with what to do instead, `ask_in_window` for a question about the page, and for any other the question kept whole as an ask row settled `kept`, which Bridge draws in the Needs you list for him to answer after the walk (the agent is told not to add it to `waiting_for`): an open question keeps the turn open, and every note and the Approve would queue behind it. The walk ends when the person approves the page, closes the window (`window_closed`), or a newer `show_window` replaces it. `docs/concepts/session.md`.

`agent_access` is `Yes`: the job is the one that has something to show, and a person is not always looking at the thread when it does.
"""
