[operations.show_window]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Show the person a web page in a window of Bridge's own, which opens by itself and which a note taken in is answered by a message to this session. While he walks it, AskUserQuestion is refused: ask a question about the page with ask_in_window, put any other in waiting_for, and end your turn, so his notes reach you. To offer several takes of one change, pass variations, a list of {name, url}, with url the first's: he swaps between them on the window's bar and a note or an Approve names the take. Call show_window again when the page is ready to walk mid-turn: Armada marks the window as still changing while you edit files. The page may be a deployed app, not only a local server. The window follows redirects and links only on the page's own origin; to let it pass through others, such as a single sign-on provider the page redirects to, pass origins, a list of http or https origins with no path (for example https://login.example.com). The owner then signs in on that page in the window, and the sign-in stays for later walks of this repository. If this repository gives you a way to sign in yourself, such as a dev magic link or a token login address, pass sign_in, a list of addresses on the page's origin or one of origins: the window loads each in order before the page. sign_in holds a secret: Armada keeps it in memory only until the window opens and writes it nowhere, so never put one in a message, a note or a waiting_for item"
notes = """
`POST /sessions/window`, body `ShowWindow`: `url`, an optional `title`, an optional `session_id`, optional `variations`, optional `origins` and optional `sign_in`. Answered with the `SessionRecord`; **through the agent's door, a receipt** of `session_id`, `window` (the address), `title` where one was given and `takes` (their names) where there are any, because the row grows with every attachment and an agent keeps each answer.

**Any `http` or `https` address**; any other scheme is refused with 422 and nothing written. **The session is the one whose process holds the connection** when Fleet hosts it, whatever the body says; `session_id` is read only for a session in a terminal, whose connection Fleet cannot place; the mod tells the model its own id at the start of the conversation (`prompt.context`), and the model passes it. A call that places no session and names none is refused.

**`variations` is a list of `{name, url}`, several takes of one change in one window.** Each `url` is held to the rule `url` is, a take with no name is refused, and `url` must be the first take's: 422, nothing written. They ride the `window` row and the artifact's `detail.variations` (a JSON string, as `detail` holds strings only), so reopening the window from the ledger or the thread brings them back. Bridge draws a letter and name per take on the bar; a note names the take it was taken on (`On B, Needs you first: …`) and Approve names the one on screen (`Approved B, Needs you first: <address>`). The walk ends on an Approve of any take.

**`origins` is a list of other web origins the window may pass through**, so a deployed page behind single sign-on can be walked: the redirect to the provider and back is followed instead of refused. Each is `http` or `https`, a host and an optional port, and no path, query, fragment or sign-in of its own; one that is not is refused with 422 and nothing written. The window is pinned to the shown origin and these, and everything else stays refused. They are kept on the `window` row and the artifact's `detail.origins` (a JSON string), so reopening the window brings them back. The window's cookies are one jar for the session's repository, so a sign-in, the person's or the session's, holds for later walks of it.

**`sign_in` is a list of `http` or `https` addresses, each on the shown origin or one of `origins`** (422 otherwise, nothing written), which the window loads in order, in the repository's cookie jar, before it loads the page. **They are secrets.** Fleet holds them in memory from the call until Bridge takes them (`take_window_sign_in`), two minutes at most, and writes them nowhere: not the store, the thread, the timeline, a note, the `window` row, the artifact or the receipt. A Bridge that is not connected when the page is shown opens no window and loses them. A failed sign-in load is not told to the session.

**Showing a page says it is ready, and Armada marks it still changing without being told.** The window artifact's `detail.working` is `"true"` after the mod reports a file the session itself wrote (`report_session` fact `wrote`, never a subagent's), or after the owner sends a note from the window (`On …, at <address>`); showing again, or the end of the session's turn (`turn_completed`), clears it. Bridge draws it on the bar and Approve reads Not ready while it is set.

**Fleet records it twice and publishes it once.** An `artifact` attachment of form `window` with the address as its target, kept once however often the address is shown, and a `window` row on the thread, appended on every call; the row is `session.row`. Bridge opens the window when that row arrives, and raises it where it is already open. A note taken in the window is sent to the session as `send_session_message` from the person, which wakes it.

**It opens the session's walk**, and while that is open Fleet refuses the session's `AskUserQuestion` with what to do instead, `ask_in_window` for a question about the page and `waiting_for` for any other: an open question keeps the turn open, and every note and the Approve would queue behind it. The walk ends when the person approves the page, closes the window (`window_closed`), or a newer `show_window` replaces it. `docs/concepts/session.md`.

`agent_access` is `Yes`: the session is the one that has something to show, and a person is not always looking at the thread when it does.
"""
