[operations.unlink_task_pull]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Take a linked pull request off a task or subtask"
notes = """
`POST /projects/rows/:row/pulls/unlink`, body `LinkTaskPull`: `number`, as it was linked. One the task does not have changes nothing. `docs/practices/protocol/projects.md`. Answers `Projects` as `list_projects` does, and publishes it as `projects.changed`.

A 422 `fleet.project_row_not_a_task` for a `row` that is an issue row, and a 404 `fleet.no_such_project_row` for a `row` there is none of.
"""
