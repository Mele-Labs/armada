[operations.list_checkout_runs]
kind = "query"
transport = "HTTP"
agent_access = "Helm only"
description = "The main checkout's earlier runs: name, exit code, when, how long, what changed, and the log"
notes = """
**`?repository=<root>` names the checkout where `?manifest_id=` cannot**: a repository whose root has no `armada.yml` has no id, and a workspace there still runs. Naming both is refused with `fleet.repository_named_twice`, rather than one quietly winning.

A run of a workspace's own entry names it in `workspace`, so two of one name stay apart; a record from before the field reads as the root's.

`list_runs` read off `.armada/runs/main/` rather than `.armada/runs/<job>/`. A Job handle always begins with the Job's own number, so no Job can be called `main` and the two cannot collide.

Kept for the Machine's ad-hoc run log retention, swept when the checkout next starts a run.

`agent_access` is `Helm only`: **Helm reads the runs it can start** (#1288). `start_checkout_run` answers at once and the end is `checkout_run.finished`, which no session receives, so a run Helm started on a person's ask would otherwise be one it could not say the end of. No other agent can start one, so no other agent is offered this.
"""
