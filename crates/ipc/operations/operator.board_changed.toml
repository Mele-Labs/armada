[operations."operator.board_changed"]
kind = "event"
transport = "WebSocket"
agent_access = "Bridge only"
description = "The Operator's board is not what it was"
notes = """
Published when the Operator is switched on or off, which is when the page's `on` is not what it was. **It carries nothing** beyond the stream's cursor: Bridge reads `operator_page` again.
"""
