[operations.all_done]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Finish this job in one call: give back its slots, merged branches and servers as finish_up does, then say you have nothing left to work on, so Bridge offers to end it. A refusal names every reason at once. Clear waiting_for first, and call it only when nothing is running or owed. While a group of the plan has a gate still open, the call is held rather than refused, and Fleet finishes the job when the last gate closes. Give a summary: one or two plain sentences on what the job achieved for its brief, not how, bare facts"
notes = """
`POST /sessions/done`, body `AllDone`: an optional `session_id` and an optional `summary`, one or two plain sentences on what the Job achieved for its brief, not how. Fleet trims it, drops an empty one, and keeps it with the done mark as `SessionRecord.done_summary`; a later non-empty summary on a standing done replaces it. Answered with the `SessionRecord`, whose `done_since` is the instant Fleet stamped; **through the agent's door, a receipt** of `session_id`, `done` and `done_since`, because the row grows with every attachment and an agent keeps each answer.

**The job is the one whose process holds the connection** when Fleet hosts it, whatever the body says; `session_id` is read only for a job in a terminal, as `waiting_for`'s is. Calling it again while it stands keeps the first `done_since`. An ended job is refused: there is nothing to end.

**It gives back what `finish_up` gives back first**, once nothing refuses it, so one call finishes a Job: a terminal job holds nothing to give back, and what `finish_up` would keep stays, as it did. `finish_up` stays an act for a Job that wants to give things back early.

**A refusal names every reason at once**, one block each, open follow-ups first and then what the Job holds in flight, and stamps and releases nothing. With both the code is `fleet.lifecycles_in_flight`.

**It is refused while a follow-up is open.** The refusal is 409 `fleet.later_open`, names each open item of `SessionRecord.later` by id and sentence, and says how to settle it with `settle_later`: done, filed with an issue number, or dropped with a reason. Nothing is stamped. The person's End job is `close_session` and is never refused for one.

**It is refused while the Job holds an instance standing in a state its lifecycle does not end on**: a ticket, a pull request, a deploy or a Job it started. The refusal is 409 `fleet.lifecycles_in_flight` and names each as `Deploy is Rolling out`, one to a line. **One that is unread, or in a status no state lists, holds nothing**, since where the tracker declares no words the built-in Ticket lifecycle lists none but `closed` and nothing the agent can do would clear it; End still lists it. **A ticket in a status the tracker declares a word for does hold the Job**, as a beads ticket reading `open` or `in_progress` does. Nothing is stamped, and Fleet keeps that the agent was told to wait: when the last instance holding it reaches an end state it sends one `lifecycles_clear` notice, `PR #812 is Merged. Nothing holds this Job open.`, and the agent calls again. A Job that holds no instance, which is every Job started before lifecycles, is never refused for one, and neither is the person's End job.

**It is held, not refused, while a gate of the plan is open.** A plan group may name the gate that ends it, and while one has not closed Fleet keeps the call (`SessionPlan.held`) and stamps no `done_since`. The receipt carries `held`, a line saying which group's gate it waits on, and is absent otherwise. The follow-up refusal above still stands; the in-flight one is skipped, since the gate covers it. When the last gate closes Fleet runs the call itself with the summary given then, and tells the agent with a `gate_hold` notice if that is refused. A call held stops standing as `done_since` does.

**It is a statement, not an act.** Fleet ends nothing. Bridge draws a callout at the foot of the thread, End job or Keep going, and the person decides.

**It stops standing** when the person sends the job a message, when the agent calls `waiting_for` with a non-empty list, and when a hosted job's turn starts again, except a turn Fleet's own news starts (a pull request merged, a build moved). `SessionChanged` is published each time `done_since` appears or clears.

`agent_access` is `Yes`: the agent is the one that knows nothing is running or owed.
"""
always_loaded = true
