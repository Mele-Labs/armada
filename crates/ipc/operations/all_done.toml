[operations.all_done]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Say you have nothing left to work on and it is safe to end this session, so Bridge offers to end it. Clear waiting_for first, and call it only when nothing is running or owed"
notes = """
`POST /sessions/done`, body `AllDone`: an optional `session_id`. Answered with the `SessionRecord`, whose `done_since` is the instant Fleet stamped.

**The session is the one whose process holds the connection** when Fleet hosts it, whatever the body says; `session_id` is read only for a session in a terminal, as `waiting_for`'s is. Calling it again while it stands keeps the first `done_since`. An ended session is refused: there is nothing to end.

**It is a statement, not an act.** Fleet ends nothing. Bridge draws a callout at the foot of the thread, End session or Keep going, and the person decides.

**It stops standing** when the person sends the session a message, when the agent calls `waiting_for` with a non-empty list, and when a hosted session's turn starts again. `SessionChanged` is published each time `done_since` appears or clears.

`agent_access` is `Yes`: the agent is the one that knows nothing is running or owed.
"""
