[operations.dismiss_set_aside]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Put away a pick Autopilot set aside, so it leaves the pile"
notes = """
`POST /autopilots/:repository/picks/:pick_id/dismiss`. The pick reads `dismissed`; nothing is written on the issue, and this run does not pick it again. Answers the `Autopilot` and publishes `autopilot.changed`. #2092. A 409 `fleet.pick_not_set_aside` for a pick that is not set aside.
"""
