[operations.tell_session]
kind = "command"
transport = "HTTP"
agent_access = "On your words"
description = "Send words to a live Job, as a person's own send does, and say where they went"
notes = """
`POST /operator/tell_session?manifest_id=`, body `{ session_id, text }`. Answers 200 with the `ThoughtTarget` the words went to: `{ kind: "session", id, title, manifest_id?, slot? }`. The manifest names the repository the call was made in, and the door fills it from the job's own.

**The same delivery as `send_session_message`**, which no agent is offered: a hosted Job takes a turn, and a terminal Job is held for its mod, so one that is not listening is refused with `fleet.terminal_session_unreachable` and the words are not kept anywhere. There are no attachments and no mentions; this is words.

**On success Fleet publishes `operator.words_sent`** and writes no row of its own: the words are in the receiving Job's thread as a person's send leaves them. A refused send publishes nothing. It exists because words that reach a Job on your words as a request ("send this to the Walk Variations job") had no way to leave it: Bridge delivers what its own reading routed, and a Job on your words has only the door.

**Not destructive, pushes nothing and writes nothing off this machine**, so it runs on the person's ask with no card. `On your words`: the Job on your words is offered it, and a Drone's endpoint and any other Job's door do not list it.
"""
