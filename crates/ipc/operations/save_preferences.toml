[operations.save_preferences]
kind = "command"
transport = "HTTP"
agent_access = "On your words"
description = "Save one preference by name, and answer with every preference now in force"
notes = """
**One preference, not the set**, written into settings.json under its key — `where_things_are_open` is `bridge.whereThingsAreOpen`, `draft_pull_requests` is `features.draftPullRequests`, `theme` is `bridge.theme`, `layout_choices` is `bridge.layout` and `key_bindings` is `bridge.keyBindings` and `time_format` is `bridge.timeFormat`. Every other key in the file is left as it was.

**`theme` is saved with `text`, not `value`.** `value` is read for every name but that one and `text` for no other; a `theme` with no `text`, or one that is not 1 to 40 lowercase letters, digits and `-`, is a 422 `fleet.unacceptable_theme`. Fleet keeps the word and Bridge decides what it names, so a theme that names no mod and no shipped theme is saved and Bridge draws the default.

**`layout_choices` is saved with `text` too**, and an empty or absent `text` takes the choices back. Anything else must pass the rules `validate_mod` applies to a `layout.json`, or it is a 422 `fleet.unacceptable_layout` naming the first problem and nothing is stored. Fleet keeps the text and Bridge decides what it draws.

**`key_bindings` is saved with `text` too**, `layout_choices`' terms: empty or absent takes them back, and text `ipc::key_bindings` cannot read is a 422 `fleet.unacceptable_key_bindings` naming the first problem, with nothing stored.

**`time_format` is saved with `text` too**, on the same terms: empty or absent takes the choice back, and text that is not a JSON object of exactly the booleans `hour12`, `seconds` and `date` is a 422 `fleet.unacceptable_time_format` naming the first problem, with nothing stored.

**How he works with Jobs** is twelve more, each a key of its own: `take_in` is `bridge.takeIn`, `answer_with` is `bridge.answerWith`, `first_run_answered` is `bridge.firstRunAnswered`, `read_results` is `bridge.readResults`, `look_results` is `bridge.lookResults`, `look_questions` is `bridge.lookQuestions`, `listen_end_summary` is `bridge.listenEndSummary`, `listen_needs_you` is `bridge.listenNeedsYou`, `listen_progress` is `bridge.listenProgress`, `listen_operator` is `bridge.listenOperator`, `listen_voice` is `bridge.listenVoice` and `buttons_words` is `bridge.buttonsWords`. The five closed sets ride in `text` as one word: `take_in` is `read`, `look` or `listen`; `answer_with` is `type`, `talk` or `buttons`; `read_results` is `note_then_page`, `always_page` or `thread_only`; `look_results` is `picture_every`, `picture_screens` or `walk_visible`; `look_questions` is `pictures_mix` or `pictures_whole`. Any other word, an empty one included, is a 422 `fleet.unacceptable_choice` naming the preference and the word, with nothing stored. `listen_voice` rides in `text` too, and a blank one takes the choice back. The six switches ride in `value`. **A switch that defaults on, `listen_end_summary`, `listen_needs_you` and `buttons_words`, is saved off by `value: false`, which writes `false` into the file**: the shipped `true` is the registry's answer for a key the file lacks, and a key the file holds wins.

**A name outside the closed set is refused by name**, `fleet.unknown_preference`, naming what was sent. The eighteen names above are the set; an empty `layout_choices`, `key_bindings`, `time_format` or `listen_voice` removes its key from the file.

Publishes `settings.changed`, `save_limits`' reason: it writes the file `get_settings` reads.
"""
