[operations.save_preferences]
kind = "command"
transport = "HTTP"
agent_access = "Helm only"
description = "Save one preference by name, and answer with every preference now in force"
notes = """
**One preference, not the set** — unlike `save_limits`, which saves all three fields of one fixed row in a single request. A preference is a row keyed by name, so saving one leaves the store untouched for every other name, and there is nothing to omit.

**A name outside the closed set is refused by name**, `fleet.unknown_preference`, naming what was sent. `store::Preferences`' own `CHECK` is the set's one definition; nothing here restates it, and Fleet is asked before the refusal is decided rather than the row failing a constraint it never explains.

No event, `save_limits`' reason: the answer already carries what changed, and nothing else reads a preference on a timer.
"""
