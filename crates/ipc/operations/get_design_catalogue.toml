[operations.get_design_catalogue]
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "Use this before the first mock node of a sketch, in place of reading the repository's stylesheets yourself: it is the repository's design catalogue, kept by Fleet and read again only when its files change. Optional area, one of contents (the default: the names in each area), tokens, components, icons or patterns; optional match, words that narrow the area to names or paths containing them, such as --space, colour, settings or Kbd; optional repository, another served repository's root; and session_id. Answers area, themes (the theme names tokens are set under, default first), sheets (the stylesheets that set them, for a mock's styles), and the asked area: tokens as groups {role, family, tokens}, each token {name, value, alias?, themes?}, where role is colour, space, type, radius, shadow, motion or other, value is resolved in the default theme, alias is the var() to write in css, and themes holds another theme's value where it differs; components {name, file, sheet?, classes, sample?}, where classes are the real class names and sample is HTML read from the component's own tags; icons, the glyphs a mock may name as <i data-icon>; patterns {name, note?, html}, the house patterns the repository keeps in .armada/catalogue/patterns.html. An answer is kept under 24 KB, and cut says what was left out and how to ask for it. Ask for one area, narrowed with match, rather than everything"
notes = """
`GET /sessions/design_catalogue?area=&match=&repository=&session_id=`. Answers 200 with `DesignCatalogue`: `area`, `themes[]`, `sheets[]`, and the asked area alone filled: `contents` (`CatalogueContents` `{ tokens[] of { role, family, tokens }, components[], patterns[], icons }`), `tokens[]` (`TokenGroup`), `components[]` (`CatalogueComponent`), `icons[]` or `patterns[]` (`CataloguePattern`); `cut?` where the answer was cut to stay under 24 KB.

**The checkout** is the Job's, placed by the connection when Fleet hosts it, else by `session_id`; `repository`, a served root, reads that repository's main checkout instead. Neither is a 422 `fleet.catalogue_unplaced`; an `area` that is not one of the five is a 422 `fleet.catalogue_area_unknown`; a `repository` Fleet does not serve is a 404.

**Kept, not read on every call.** Fleet lists the inputs with `git ls-files` (tracked and untracked, ignored left out) and fingerprints each path with its size and modified time; the catalogue of a checkout is read again only when that fingerprint moves. The inputs are every `.css`, `.scss` and `.less`, every `.tsx`, `.jsx`, `.vue` and `.svelte` named for a component, and `.armada/catalogue/patterns.html`.

A token is a custom property set on the document (`:root`, `html`, `[data-theme]`, `@theme`) or on a theme (`[data-theme="light"]`, `.dark`, `@media (prefers-color-scheme: …)`); a Tailwind `@theme` declaration that only points at another token is left out. `icons` is `MOCK_GLYPHS`, held to `mock-icons.ts` by a test. `agent_access` is `Yes`: the catalogue is for the agent drawing a mock.
"""
