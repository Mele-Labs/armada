[operations.pause_autopilot]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Pause a repository's Autopilot: no new picks, and the Jobs it started finish"
notes = """
`POST /autopilots/:repository/pause`. Answers the `Autopilot`, `paused`, and publishes `autopilot.changed`. #2092; `.claude/decisions/2026-10-11-pause-drains-stop-withdraws.md`.

Nothing is withdrawn: a Job it started that has not reached a Drone yet stays queued and starts when a place opens. **It does not stop a Job that is spending**; that is the Job's own Pause. A 409 `fleet.autopilot_not_running` where it is not running, and `fleet.no_autopilot` where there is none.
"""
