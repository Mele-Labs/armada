[operations.reject_in_catalog]
ask_tool = "none"
kind = "command"
transport = "HTTP"
agent_access = "Operator"
description = "Keep his Not this feature or Doesn't go together as a rule of a project's catalog. Give project, reject, the features, areas or paths it is about, and why, his words, where he gave a reason"
notes = """
`POST /features/reject`, body `RejectInCatalog` `{ project, reject, features?, areas?, paths?, why? }`. `reject` is `not_this_feature` or `not_together`. Answers `CatalogRuleKept` `{ project, rule }`, the `CatalogRule` kept.

**It keeps a rule and changes nothing else** in the catalog: no feature moves, merges or goes. The librarian and the Operator are given the rule whenever they shape the catalog, so what he rejected is not proposed again.

**`not_this_feature` names a feature or an area that is not one**, or `paths` and the one feature they are not part of. **`not_together` names two things or more** across `features`, `areas` and `paths`. A feature may be named by a slug it was known by, and is kept by the slug it has now. Paths are kept as written.

**The rule's text is `why`**, his words on one line. Without it Fleet writes what he rejected as a fact, from the titles: "Voting and Page actions do not go together.", "src/a.rs is not part of Voting.", "Voting is not a feature.".

**The Operator and Bridge reach it**, as `change_feature` is. 422 `fleet.not_the_operator` for any other session, and 403 `api.the_persons_own` from inside a Job. 422 `fleet.feature_project` for a project Fleet does not hold, 422 `fleet.catalog_reject` for a reject that names too little or paths with no one feature, 422 `fleet.feature_area_unknown` for an area the project does not keep, 404 `fleet.feature_unknown` for a feature it does not hold. Nothing is kept on a refusal.
"""
