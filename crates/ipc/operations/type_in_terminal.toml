[operations.type_in_terminal]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Type into one of this Job's terminals and read what it printed once it goes quiet. A Job has several terminals, named t1, t2 and so on. The person sees them in Bridge and may be typing in one. They can hand you an ID: pass it as terminal. list_terminals names the open ones. Left out, terminal is the one you last typed into or read, and where you have none a new terminal opens in your worktree. It is never the person's terminal unless they handed you the ID. Pass new true for a terminal of your own, even when you have one. Use a terminal for what the person should see or join, such as a dev server; use your own shell tool for ordinary work. A terminal stays open until it exits or the Job ends. A terminal you name that is not open is refused. Where the terminal you last used has ended, a new one is opened and nothing is typed: the refusal names both, and read_terminal on the new one lets you type again. Body: text; optional terminal (an ID such as t2); optional new (false unless true, opens a new terminal and types there; not with terminal); optional enter (true unless false, presses Enter after text); optional clear (true unless false, presses Ctrl-U before text so nothing left on the line runs with it; a full-screen program such as an editor may take Ctrl-U as a key of its own, so set it false there); optional wait_seconds (10 unless set, at most 60); optional session_id, only where you run in a terminal. Ctrl-C is text set to the one character U+0003 with enter false, and is sent without Ctrl-U. The answer names the terminal and gives the lines printed after your text; still_printing true where output was still arriving when the wait ran out, as a server's does: read the rest with read_terminal; and echoed false where your text never appeared in what was printed. A password prompt does that, and so does a program that is not reading its input: read_terminal before typing more"
notes = """
`POST /sessions/terminal/type`, body `TypeInTerminal`: `text`, `enter` (absent is `true`, which writes a carriage return after `text`), `clear` (absent is `true`, which writes Ctrl-U, the character 21, before `text`), `wait_seconds` (absent is 10, held to between 1 and 60), `session_id`, `terminal` and `new` (absent is `false`). Answered 200 with `TerminalTyped`: `terminal`, `run_id`, `printed`, `still_printing` and `echoed`.

**The Job is the one the connection places when Fleet hosts it**, else `session_id`. Nothing placing one is refused with 422, and so is a Job `open_terminal` refuses.

**Which terminal.** A Job has terminals `t1`, `t2` and so on, the shells `open_terminal` opens, and the person sees all of them. `terminal` names one and is refused with 422 where it is not open. `new` opens a new terminal, the next ID, and types there. Neither: the terminal the agent last typed into or read, and where it has none, or that one has ended, a new terminal. **Never the person's terminal by default**: the agent types into one the person opened only when `terminal` names it, as a person hands over an ID. `terminal` with `new` is refused with 422. A shell that opens now is 80 by 24, and Fleet waits for it to print its prompt and go quiet before typing. `text` is written as it is, so Ctrl-C is the character 3.

**The line is cleared first.** A terminal answers some of a program's queries, a background colour or a cursor position, by writing to the shell's input, and a reply that arrives while no program reads it stands on zsh's line as text: `11;rgb:1313/1111/1a1a`, `1R`. Enter would run it with the agent's words. Ctrl-U clears the line in zsh, in bash and in the terminal's own line discipline. It is left off where `clear` is `false`, and where `text` holds nothing printable, so Ctrl-C reaches a full-screen program as the one key.

**`echoed` is a flag, never a refusal.** It is `false` where the first 16 characters of `text`'s first printable line, spaces aside, appear nowhere in what was printed, read both as the screen resolved it and as the characters arrived. Only the start is read, since zsh redraws a long line in place and writes only what changed. A password prompt prints nothing of what is typed, and so does a program that is not reading, such as a remote console that has stopped. `true` where `text` holds nothing printable.

**A shell that replaced one the agent used is read before it is typed into.** Fleet keeps, in the store's `job_terminals`, the run id of the shell the agent last typed into or read in each terminal, and when, since a shell can end while Fleet is away and the store outlives it. The last used terminal is the latest of those. **Per terminal**: where the terminal the call means has a shell other than the one the agent last saw in it, as when the person reopens `t2` under its ID after it ended, the call is refused with 422 and nothing is typed, and `read_terminal` of that terminal keeps the new shell and typing goes on. Where no terminal is named and the last used one has ended, a new terminal is opened instead, and the refusal names the ended terminal and the new one; `read_terminal` with none named then reads the new one, the lowest open, and typing goes on. A command typed for a remote console must not reach a fresh local shell. An agent that never typed or read is not refused, and its typing with none named opens a terminal of its own whoever else has one open. A run id is a ULID, so no shell after a restart takes the id of one before it. The ID of a terminal is never given twice in a Job, ended or not.

**The answer waits for quiet.** It comes once the shell has printed nothing for 1.5 seconds, or once `wait_seconds` has passed, whichever is first; `still_printing` is `true` in the second case. A command silent for longer than that answers early, and its output is `read_terminal`'s. `printed` is what arrived after the text was typed, the echo of the text included, with escapes and carriage-return overwrites resolved, the last 200 lines and the last 32 KiB at most, so the door's 64 KiB cut never reaches it.

`agent_access` is `Yes`: the terminals are the ones the person watches, in the Job's own worktree, and typing into it writes no Evidence and moves nothing on the Job. The wait is held under a minute because the agent's own limit on a tool call is not known here.
"""
