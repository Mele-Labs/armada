[operations.get_operator_board]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "What the Operator is ruling on, what waits for it and what it settled"
notes = """
`GET /operator/board`, answered with `OperatorBoard`: `on` (whether the Operator is on), `now` (the arrival a call is out on, if any), `next` (arrivals not yet ruled on, in the order they will be taken), `suggestions` (what the Operator would do with something no Job holds, such as a note, waiting on a press), `done` (its last twenty rulings, newest first) and `paused` (`week`, the share of the week's plan used, and `at`, the share where the Operator pauses, both percent; present only while the Operator is on and paused) and `switched` (the last twenty moves of the master switch, newest first, each `on` and `at`, RFC 3339; left out while there are none).

An `OperatorBoardItem` is `id` (the arrival's id), `kind` (`start`, `question`, `card`, `stall` or `report`: a plan is a `start`, and an issue, a review request, a red main, a Later item, a note and an error are each a `report`). **Since 10 Nov the Operator is handed only a note, an error, a report, an issue and a red main**, all `report`, so `now` and `next` carry no other kind, and the rest name rows of `done` kept before then, `session_id`, `title` (the Job's title, or the question's first line), `repository` (its name) and `waits` (how long it has been with the Operator, such as `12s` or `3m`). An `OperatorBoardSuggestion` is `id` (`suggestion:<n>`, the id `answer_operator_suggestion` takes and the Needs you rows use), `text` (what the row says), `options` (`Do it`, then `Skip`, each a `label`) and `at` (when it was raised, RFC 3339). `suggestions` holds the unsettled ones tied to no Job, oldest first, and is an empty list when there are none. An `OperatorBoardSettled` has the same without `waits`, and `outcome` written `Kind: what` (`Answered: Keep them in the store`, `Handed over: to Fix the pane`, `Sent: to Fix the pane`, `Started`, `Passed on`) with the kind of one or two words and the what under about sixty characters, `at`, RFC 3339, `by` (`operator` for its ruling, `person` for his press on a suggestion) and `because` (why, in the words kept with the ruling; absent where there were none).

**`next` is what arrived while a call was out.** A pass takes everything waiting into one call, so what a call has been handed leads `next` and cannot be moved; the rest follows in the order `move_on_operator_board` leaves it. `done` is the Log's rows that settled something: the Operator's rulings, the person's press on a suggestion (`Filed: bd-12`, `Started: Fix the pane`, `Skipped`) and his send of a note to a Job (`Sent: to Fix the pane`, `by` `person`). The Operator leaving such a note where he sent it is not in it. An Operator ruling that was only suggested is not in it, since the press is the row. A person's correction and Fleet's own lifting of a hold are not rulings. A repository Fleet does not serve is named by no `repository`.
"""
