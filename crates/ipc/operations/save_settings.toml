[operations.save_settings]
kind = "command"
transport = "HTTP"
agent_access = "On your words"
description = "Change Machine settings by key, a null putting one back to what ships, and answer with every setting now"
notes = """
`POST /settings/save`, body `SaveSettings`: `changes`, a key to its new value or to `null`, which removes the key from `settings.json` so the shipped default is back in force. A key the save does not name keeps what the file holds. Answered with `SettingsList`, as `get_settings` answers it, and `settings.changed` is published.

**Checked whole, against the file it would write.** A key this build does not have, a value of the wrong kind or out of range is a 400 `fleet.unacceptable_settings` naming the key, and nothing is written. So is any save while the file as it stands is refused: a save starts from the file, never from what is in force. A key already in the file that this build does not have is written back as it was. The file is written beside itself and renamed over, so a reader never meets it half written.

**A `live` setting reaches Fleet at once**, from the next time it is read — the next admission turn, the next Check, the next Judge call. An `at_restart` one is saved and answered with `pending_restart` until Fleet starts again. A setting an environment variable overrides is saved and stays overridden.

`agent_access` is `On your words`: the owner asked that a Job on your words change any setting he asks it to (15 Oct 2026). A Job on your words acts on an ask, and a read-only calls no command, so it cannot raise its own authority. No other agent is offered it, since settings.json names the program every Drone is started as.

**Called on the port from inside any Job, around the door, it is a 403 `api.the_persons_own`**, as is every route `api::callers::THE_PERSONS_OWN` names: only the person changes settings, from Bridge. `docs/contracts/system-architecture.md`.
"""
