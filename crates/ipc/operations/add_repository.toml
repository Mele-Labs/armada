[operations.add_repository]
kind = "command"
transport = "HTTP"
agent_access = "Helm only"
description = "Serve one more repository, from a folder a person chose"
notes = """
Locate, by folder — `docs/journeys/set-up-a-project-manifest.md`, *Getting in*. The body is `path`, absolute. Answers 201 with the repository as `list_repositories` lists it.

Refused with a 422 where the folder is inside a git repository but is not its root (`fleet.not_a_repository`) or its `armada.yml` or workflows will not load (`fleet.repository_refused`), and a 409 where the folder, or the Manifest id its `armada.yml` declares, is already served (`fleet.repository_served`) — a Job names its repository by that id alone. **A folder in no git repository at all is started as one first**: `git init` on `main` with a first commit of the folder's current files, less what its own `.gitignore` leaves out, so a slot has them; an empty folder gets an empty commit. A folder with no `armada.yml` is served, and a Job can start there: the answer carries `implicit_id`, which that Job's `manifest_id` is.

Fleet remembers the repository and serves it again after a restart. The store's Jobs for a repository added again are reconciled as a restart reconciles them. Clone from a URL is `clone_repository`.
"""
