[operations.read_teaching]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Read what a person taught, about words, a notice, a task or a place in Bridge, into a proposal of up to six parts"
notes = """
`POST /teachings/read`, body `{words?, message?, said, repository?, reach, session_id?, source?}`, where `said` is what the person wrote, `reach` is `repository` or `everywhere`, `repository` is a root `list_repositories` names (required for `repository`), `words` and `message` are the selected words and the message they came from, and `source` is `{kind, text, ids?}` with `kind` one of `words`, `command`, `notice`, `task`, `check`, `pull_request`, `ticket`, `panel`, `row` or `title_bar`. A body with no `source` is a `words` source made of `words`.

Answers `{note?, words?, fleet?, tweak?, layout?, rule?}` with at least one present. `note` is `{section, kind, text}`, the section and kind `teach_logbook_entry` takes. `words` is `{name, pattern, example, address?}`, with `address` `{template, found}`: `template` has `{match}` where the matched words go, and `found` is `settings`, `pull_request #<number>` or `person`. **Where the person wrote an address it is theirs** (`person`); otherwise, with a `repository` given, the read looks for the address that repository has, in the order a save does: a Words mod with the same `pattern` that already has one (its `found` as it was kept), then the Manifest's tracker settings, then the text of recently merged pull requests, held to a ten second bound. With none found, or no `repository`, `address` is absent. `fleet` is `{notice, does, where, matches?, when?, untestable?}` with `does` one of `tell`, `quiet`, `batch` or `call` and `where` one string: `job <id>`, `repo <manifest>` or `everywhere`. `matches` is a pattern over the notice's text, held to a Words pattern's rules except that it finds its words anywhere in the text, and one that finds nothing in the notice pressed on is refused. `when` is a list of `{if, does}`, tried in order, the first that holds replacing `does`; `if` is one of `blocks_merge`, `open_pull_request`, `working` and `owner_away`, which Fleet reads from what it already keeps, never from the forge, and which do not hold when Fleet does not know. **A condition the person names outside those four comes back as their own words in `untestable`, a list of strings, and no condition is made up**; a rule saved with `untestable` is saved without it. `tweak` is a list of `{token, was, now, used_in?, note?}`. `layout` is `{name, layout}`, `layout` the text of a layout mod's `layout.json`. `rule` is a lifecycle rule as `list_lifecycle_rules` answers one, `{id, name, scope, when, conditions, does, autonomy?, on_failure}`, with `untestable?` beside them: **Fleet gives the `scope`, which is the reach the person chose (`everywhere` for every repository, otherwise the repository's Manifest id), and the `id`, made from the name and never one that a rule Kit keeps or that applies to the repository already has**, and each act's `kind` and `autonomy` as a read of the rule's file works them out. The model is given the lifecycles that apply to the repository with their states, the steps of its workflows and the acts Fleet runs, and the rule is held to what a rule piece is held to when Fleet reads it: its file parses, and it names no lifecycle or state those lifecycles lack. **A condition outside `conditions`' closed set comes back as the person's own words in `untestable`, and no condition is made up**; a rule saved with `untestable` is saved without it. **Nothing is kept**: one model call on the retro model, client and budget; `save_teaching` keeps it.

**What a source may produce.** Agent text (`words`, `command`, `task`, `check`, `pull_request`) may produce a `note` and a `words` rule. A `notice` source may produce a `note` and a `fleet` rule, naming the notice from `source.ids[0]`. A `pull_request`, `notice` or `ticket` source may also produce a `rule`, and a `ticket`, whose `ids` hold its key, produces a `note` and a `rule` and no `words`. A Bridge source (`panel`, `row`, `title_bar`) may produce a `tweak` and a `layout`, and no `note`: the model is given the token names from `packages/tokens/tokens.json` and the regions and ids of `packages/shell/layout-registry.json`. A part a source cannot make is dropped, not refused.

Fleet fills a tweak's `was` from the token's current value, and `used_in` and `note` from the tokens file: `used_in` names the tokens that alias this one, and `note` is the token's description, which is all the tokens file says about where it is used.

**Refused as a 422**: `fleet.teaching_words_refused` where a pattern does not compile, uses lookaround, a backreference or an inline flag (Bridge runs it as a JavaScript RegExp), does not match all of `example`, matches the empty string, repeats a group that holds a repeat or a choice, is over 200 characters, or has an address that is not an http or https address with `{match}` and a host of its own; `fleet.teaching_note_refused` for a note that does not fit; `fleet.teaching_rule_refused` for a notice word no `Notice` has, a `where` that does not parse, a `matches` that a Words pattern's rules refuse or that finds nothing in the notice, a condition tested twice, or a `rule` that a read of its file would refuse or set aside (the parser's own sentence, or the lifecycle or state it names that does not apply); `fleet.teaching_tweak_refused` for a token that is not in the tokens file, a value `theme.css` would refuse, or more than 12 tokens; `fleet.teaching_layout_refused` for a layout `validate_mod` would refuse or one naming a region the registry lacks; `fleet.teaching_input_refused` for an empty or overlong input or a `repository` reach with no repository; `fleet.teaching_nothing_read` for an answer with no part left. A root Fleet does not serve is a 404 `fleet.run_memory_repository_not_served`. A call that fails or answers something unreadable is a 500 `fleet.teaching_read_failed`.
"""
