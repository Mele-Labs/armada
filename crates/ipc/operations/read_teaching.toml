[operations.read_teaching]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Read words a person selected and what they said about them into a proposal: a link rule, an agent note, or both"
notes = """
`POST /teachings/read`, body `{words, message, said, repository?, reach}`, where `words` are the selected words, `message` the message they came from, `said` what the person wrote, `reach` is `repository` or `everywhere`, and `repository` is a root `list_repositories` names, required for `repository`. Answers `{link?, note?}` with at least one present: `link` is `{pattern, address, example}` and `note` is `{section, kind, text}`, the section and kind `teach_logbook_entry` takes. **Nothing is kept**: one model call on the retro model, client and budget, and Bridge files the note itself and saves the link with `save_teaching`.

`example` is always the selected words. A `repository` reach takes a `repo` note and `everywhere` a `habits` or `machine` one. A link is refused as a 422 `fleet.teaching_link_refused` where its pattern does not compile, uses lookaround, a backreference or an inline flag (Bridge runs it as a JavaScript RegExp), does not match all of `words`, matches the empty string, repeats a group that holds a repeat or a choice (`(a+)+`, `(a|aa)+`, which can hang Bridge) or is over 200 characters, or where its address is not an http or https address with a host of its own. A note that does not fit is a 422 `fleet.teaching_note_refused`. An empty or overlong input, or a `repository` reach with no repository, is a 422 `fleet.teaching_input_refused`. An answer with neither is a 422 `fleet.teaching_nothing_read`. A root Fleet does not serve is a 404 `fleet.run_memory_repository_not_served`. A call that fails or answers something unreadable is a 500 `fleet.teaching_read_failed`.
"""
