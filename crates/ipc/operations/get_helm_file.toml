[operations.get_helm_file]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "A picture or file that was sent to Helm, as it was sent"
notes = """
`GET /helm/file?manifest_id=&file=`, `file` a `SentFile.id` from an `asked` row of that repository's Helm thread; `manifest_id` absent is the first served, as `ask_helm`'s. The bytes, under the media type they were sent as. A file Helm's thread never held, or one no longer kept, is refused with a 422 `fleet.session_attachment_refused`, as `get_session_file` refuses.
"""
