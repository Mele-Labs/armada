[operations.get_job_timeline]
ask_tool = "none"
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "One Job's burn from start to finish: bars by time split main thread and subagents, the context size, compactions, and the pauses with what each waited on"
notes = """
`GET /usage/job_timeline?session_id=`. `JobTimeline` for one Job: `session_id`, `started`, `ended?` (absent while it runs), `bucket_seconds`, `total_units`, `week_units`, `buckets`, `context`, `compactions`, `pauses`, `peak_context`, `cold_wakes` and `subagent_share`. **Units** are weighed as `get_usage_summary` weighs them, so `total_units` is the summary's for the Job, and `week_units` is every Job's burn over the 7 days ending at `ended`, or now, for a page to say what share of the week the Job was. `bucket_seconds` is 60, 300, 600, 900, 1800 or 3600, the smallest that cuts the span from `started` to `ended` (or now) into at most 120 buckets, and `buckets` is every one of them oldest first, `{ at, main_units, subagent_units }`, one with no burn included; a compaction's own request is the main thread's. `context` is the main thread's input, cache writes and cache read at each request, `{ at, tokens }`, thinned to at most 400 by keeping the largest of each equal share, so the peak stays. `compactions` are the stamps of the Job's compactions. A pause is a gap of more than 5 minutes between two main-thread requests: `{ from, to, waited_on, label, cold }`. `waited_on` is `command` where the request before it ended on a shell command, `subagent` where it ended on Agent or Task, `you` where it ended with no call pending, and `other` for any other call; `label` is Fleet's words for it, `Command ran`, `Subagent ran`, `Waited on you` and `Paused`. `cold` is true where the request after it found the cache cold, the same rule as the `cold_cache` waste. `peak_context` is the largest the main thread held, `cold_wakes` the requests that found the cache cold, and `subagent_share` the part of `total_units` subagents burned, 0 to 1. A Job with no turns answers one bucket of zero. 422 `fleet.session_unnamed` for a Job Fleet does not know. **Names and counts only.**
"""
