[operations.get_artifact_page]
kind = "query"
transport = "HTTP"
agent_access = "Bridge only"
description = "One kept revision of a Job's page as one sealed HTML answer, for a client with a web view: no network, the page's own scripts inert, and the kit's script drawing its actions and votes. With host_kit, the page's own inline scripts run and the host draws the kit"
notes = """
`GET /sessions/artifacts/page?session_id=&artifact=&revision=&host_kit=`. `artifact` is the page's path, its `JobArtifact` id, and `revision` is a kept revision's number, the newest where it is left out. `host_kit` is `true` for a host that draws the kit itself, `false` where it is left out. **Answered as the page itself**, as `get_session_file` answers its bytes: 200 with `Content-Type: text/html; charset=utf-8`, `X-Content-Type-Options: nosniff`, and the page's policy again as the `Content-Security-Policy` header. An archived page still serves: reading changes nothing, and nothing is published.

**The page is the kept revision, sealed.** `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; script-src 'nonce-<n>'; connect-src 'none'; form-action 'none'; base-uri 'none'">` is the first child of its `<head>`, `<n>` fresh for each answer, and a `<style>` of every design token at its shipped value and the kit's own look follows it. A `<link rel="stylesheet" href="armada-kit.css">` becomes a `<style>` holding the kit's rules, where the link was. The first `<link rel="stylesheet">` that names a repository path, where Fleet kept a style set for the page, becomes a `<style>` of those sheets' rules after the kit's, each kept font an `@font-face` with its bytes in a `data:` address; this is only the newest revision. Every other `<link>`, every `<base>` and every `<meta http-equiv>` is dropped. A `src`, `href`, `srcset`, `poster`, `action`, `formaction`, `data`, `xlink:href`, `background` or `ping` that is relative (no scheme, and not a `#` fragment) is taken off its tag, as is every `nonce` the page wrote. **The page's own scripts stay, with no nonce, so the policy refuses them.** A sketch's `<script type="application/json">` scene is data and never ran.

**With `host_kit=true` the page's own inline scripts run.** The native Bridge asks for it. The policy's script source is then `'sha256-<hash>'` for each page `<script>` with no `src`, `href` or `xlink:href`, or `'none'` where there is none, and its every other wall is the same; no nonce is served, since a page script that read one could load a script from anywhere. A script with an address is refused, as is every `on*=` handler. The kit's script is left out, since the host draws the kit in a content world the page cannot reach, and the record stays, with no nonce.

The body closes with two scripts carrying the nonce, or with `host_kit` the record alone, carrying none: `<script type="application/json" id="armada-page-record">` holding `{ artifact, revision, presses, votes }`, the `PagePress`es made on this revision or an earlier one whose action is still on it, and the newest `VoteCast` per vote cast on this revision or an earlier one where that vote is still on it in the same form with the takes the cast names, and the kit's script (`crates/fleet/src/session_host/page_kit.js`). The kit draws each `<armada-action>` as a labelled button and each `<armada-vote>` as a vote, and talks to the host only through the channels below, each message carrying `armada: 1`:
- To the host, decided once at load: `window.webkit.messageHandlers.armada.postMessage(message)` where the host has that handler (Native's WKWebView, a top-level page with no parent), otherwise `window.parent.postMessage(message, "*")` (Classic's iframe). The messages are `{ armada: 1, kind: "press", artifact, revision, action, words? }` and `{ armada: 1, kind: "vote", artifact, revision, vote, result }`, `result` a `VoteResult`. The host calls `press_page_action` or `cast_page_vote` with them and the Job's `session_id`.
- From the host: `window.armadaHost(message)`, which Native calls with `evaluateJavaScript`, or a `message` event from the parent frame, read only where `event.source` is `window.parent`. Both run one handler. The messages are `{ armada: 1, kind: "pressed", press }` with the `PagePress`, `{ armada: 1, kind: "voted", cast }` with the `VoteCast`, or `{ armada: 1, kind: "refused", action?, vote?, code, message }` with the refusal. Their Rust types are `PageMessage<PageToHost>` and `PageMessage<HostToPage>` in `ipc`, and not route bodies.

Refused with 422: `fleet.artifact_not_held` for an artifact the Job does not hold, naming at most 20 it does, or one that is a sketch or a draft; `fleet.artifact_revision_unknown` for a revision never kept, or one whose file is gone; `fleet.session_unnamed` for a Job Fleet does not know.

`agent_access` is `Bridge only`: the agent has its own page on disk.

**A Job held from another Mac is read from that Mac's Fleet each time**, as `share_job_artifact_page` answers there, and nothing of it is kept here. What that Mac refuses is passed on as it said it. Since 18 Nov 2026.
"""
