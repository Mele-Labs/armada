[operations.get_artifact_page]
kind = "query"
transport = "HTTP"
agent_access = "Bridge only"
description = "One kept revision of a Job's page as one sealed HTML answer, for a client with a web view: no network, the page's own scripts inert, and the kit's script drawing its actions and votes"
notes = """
`GET /sessions/artifacts/page?session_id=&artifact=&revision=`. `artifact` is the page's path, its `JobArtifact` id, and `revision` is a kept revision's number, the newest where it is left out. **Answered as the page itself**, as `get_session_file` answers its bytes: 200 with `Content-Type: text/html; charset=utf-8`, `X-Content-Type-Options: nosniff`, and the page's policy again as the `Content-Security-Policy` header. An archived page still serves: reading changes nothing, and nothing is published.

**The page is the kept revision, sealed.** `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'nonce-<n>'; connect-src 'none'; form-action 'none'; base-uri 'none'">` is the first child of its `<head>`, `<n>` fresh for each answer, and a `<style>` of every design token at its shipped value and the kit's own look follows it. A `<link rel="stylesheet" href="armada-kit.css">` becomes a `<style>` holding the kit's rules, where the link was. Every other `<link>`, every `<base>` and every `<meta http-equiv>` is dropped. A `src`, `href`, `srcset`, `poster`, `action`, `formaction`, `data`, `xlink:href`, `background` or `ping` that is relative (no scheme, and not a `#` fragment) is taken off its tag, as is every `nonce` the page wrote. **The page's own scripts stay, with no nonce, so the policy refuses them.** A sketch's `<script type="application/json">` scene is data and never ran.

The body closes with two scripts carrying the nonce: `<script type="application/json" id="armada-page-record">` holding `{ artifact, revision, presses, votes }`, the `PagePress`es made on this revision and the newest `VoteCast` per vote cast on it, and the kit's script (`crates/fleet/src/session_host/page_kit.js`). The kit draws each `<armada-action>` as a labelled button and each `<armada-vote>` as a vote, and talks to the host only with `window.parent.postMessage`:
- To the host: `{ armada: 1, kind: "press", artifact, revision, action, words? }` and `{ armada: 1, kind: "vote", artifact, revision, vote, result }`, `result` a `VoteResult`. The host calls `press_page_action` or `cast_page_vote` with them and the Job's `session_id`.
- From the host: `{ armada: 1, kind: "pressed", press }` with the `PagePress`, `{ armada: 1, kind: "voted", cast }` with the `VoteCast`, or `{ armada: 1, kind: "refused", action?, vote?, code, message }` with the refusal.

Refused with 422: `fleet.artifact_not_held` for an artifact the Job does not hold, naming at most 20 it does, or one that is a sketch or a draft; `fleet.artifact_revision_unknown` for a revision never kept, or one whose file is gone; `fleet.session_unnamed` for a Job Fleet does not know.

`agent_access` is `Bridge only`: the agent has its own page on disk.
"""
