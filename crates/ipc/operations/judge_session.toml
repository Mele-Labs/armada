[operations.judge_session]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Run a judge now on a Session's work so far, against its plan"
notes = """
`POST /sessions/judge`, body `JudgeSession`: `session_id`. Since 23.92. **Answers at once** with the `SessionRecord`, `judging` true; the reading runs in a task and `SessionChanged` is published when it ends.

The judge is the stateless call a Job's step is judged by, on the Judge model setting: it is shown the dispatched request (the Session's first message from the person), the plan, and the Session's diff against its base, and **never the transcript**. It asks the current step's `judge_checks` where the Session has a workflow and a step, and otherwise whether the work carries out the plan and stays inside the request. When it returns, `judging` is gone and `judge` is `{at, concerns}`; zero concerns is how Bridge says "No concerns". Each concern is a waiting item of source `judge` (see `send_concern`). A concern the same as one still waiting is not raised twice. A call that fails or answers in a shape that cannot be read raises nothing and leaves `judge` as it was; the reason goes to Fleet's log.

A judge is advisory: nothing it says blocks the Session. 409 `fleet.session_closed` for a Session that ended, 422 `fleet.session_command_refused` for a terminal Session, whose work Fleet does not read.
"""
