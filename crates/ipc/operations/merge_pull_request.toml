[operations.merge_pull_request]
kind = "command"
transport = "HTTP"
agent_access = "Helm only"
description = "A person merges the pull request their Job opened, and Fleet runs what follows"
notes = """
**The fourth answer at a human gate, and the only act in Armada that writes into a repository Fleet did not make.** Every other act is confined to a worktree Fleet cut; this changes what everybody else builds on, so it is the loudest thing in the Job's log and it is written there before the write happens rather than after.

**It exists under `auto_merge: never`, and that is not a contradiction.** The policy governs whether a *machine* decides that work lands. This is a person deciding — and Fleet performing it is what makes the after-merge Checks run at all, because the only other path is Fleet noticing the merge on a rotation that asks about one pull request per sweep. A person who merges on the forge instead skips them. `#523`.

**It is `approve_review` with a write to the forge in front of it.** What it adds is the merge, the record of it and the Checks over what merged; what it does to the two machines is that route's, called rather than restated — the step advances beneath the gate and the Job is `queued` at the next step, or `completed_success` where the step that passed was the workflow's last.

**Pressed while the forge's checks still run, the gate sends `enable_job_auto_merge` instead** (since 23.67): the forge merges when they pass, and the sweep then takes the work off the gate, so this route is the press for a pull request whose checks have passed or that has none.

**Not a `recourse`.** `core_model::Stuck` classifies a Job that *stopped*, and `awaiting_review` is not one of the five statuses it is asked of: nothing went wrong, and what the Job needs is in the status itself. A surface draws this where it draws the other three answers, off `status`.

**Everything after the merge is `noticing`'s, reached rather than repeated.** The record, the fast-forward of the base branch, the run of `after_merge.checks` and the `job.landed` event are one path whether Fleet noticed a merge or a person pressed for one. So the Checks cannot run twice for one commit — the dedupe is keyed by the commit, not by the Job, because two Jobs merging within a minute are two merges into one commit.

**A refused merge says which of the reasons it was, and nothing retries.** A protected base, a conflict, a check the forge requires that has not passed, a pull request that is not open, no tool on the machine, a base that kept moving under `merge_by: push`, the Job's Checks going red on that base merged in, a need another Job or branch declared first that has not landed (`fleet.merge_waiting_behind`, since 23.36), and a refusal this vocabulary has no word for are nine codes rather than one — each sends a person somewhere different, and a button that failed silently on a protected branch would be worse than no button. The Job is left exactly where the press found it, answerable by the three acts it was answerable by a moment earlier.

**A need holds the press under `forge` as under `push`** (#1059, `docs/concepts/fleet.md`, *Declared needs*). It is Fleet that asks the forge to merge, so Fleet refuses before it does while a need ahead of the Job's on the same file stands, naming what it waits behind. The forge's own button is not held, and a person pressing it lands the work out of order.

Refused with a 409 on a Job that is not at `awaiting_review`, sharing that refusal with the three acts beside it, and with a 409 where the Job's record holds no pull request — a workflow that declares no delivering step opened none, and the act a person wants on one of those is `approve_review`.

`agent_access` is `Helm only` now, like every other act at this gate. Deciding that work lands is still the owner's, and this one lands it in somebody else's repository — Nick's ruling grants it to Helm on request anyway, which is named here rather than resolved: this row's own argument is that landing work elsewhere is the loudest act in the file, and asking Helm to press it is a person deciding through words rather than through a button, not a different decision.
"""
