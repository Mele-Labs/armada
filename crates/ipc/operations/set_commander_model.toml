[operations.set_commander_model]
kind = "command"
transport = "HTTP"
agent_access = "Helm only"
description = "Choose the model and effort one Job's Commander runs on, or clear either choice"
notes = """
`set_model`'s terms, for the agent that steers the Job (#2166). **A chosen value beats the machine's** `models.commander` and `effort.commander`, each on its own: a Job may name a model and leave the effort to the machine. The body is `model` and `effort`, both sent: a name `list_models` offers, an effort the setting spells (`harness default`, `low`, `medium`, `high`), or `null` to clear that half. A body missing either key does not decode, so a client that dropped one cannot clear it by accident. `JobDetail.commander_model_override` and `JobDetail.commander_effort_override` read the choice back.

**Read by the next turn.** A turn running when it was chosen keeps the model it started with.

Refused with a 409 on a model `list_models` does not offer, and on an effort the setting does not spell. `agent_access` is `Helm only`, `set_model`'s reason; a Commander may not choose its own model, and the allowlist does not offer it.
"""
