[operations.get_artifact_page_source]
kind = "query"
transport = "HTTP"
agent_access = "Bridge only"
description = "One kept revision of a Job's page as the HTML the Job wrote, unsealed, so a client that edits its words keeps the markup and save_artifact_edit can check them against it"
notes = """
`GET /sessions/artifacts/page/source?session_id=&artifact=&revision=`, the query of `get_artifact_page`. **Answered as the page itself**: 200 with `Content-Type: text/html; charset=utf-8`, the revision's file read as kept, with no policy, no kit and no record added. `get_artifact_page` answers the sealed page for a web view; this one is for an editor, which reads the source and sends back `save_artifact_edit` the page it changed. An archived page still serves.

Refused with 422 as `get_artifact_page` is: `fleet.artifact_not_held` for an artifact the Job does not hold, one that is a sketch, a draft or an artifact of parts, and `fleet.artifact_revision_unknown` for a revision never kept. `fleet.session_unnamed` for a Job Fleet does not know.

`agent_access` is `Bridge only`: the agent has its own page on disk.
"""
