[operations.show_graph]
ask_tool = "none"
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Put a live graph in your Job's thread, where you call it, for numbers that move while you watch a deploy, a service or metrics. Body: id (lower case letters, digits and dashes; showing the same id again replaces the graph in place), title, and either spec or strip, optional headline and source, and session_id. spec is Vega-Lite, a subset: mark is one of line, area, bar, point, rule, text, arc, as a word or {type, interpolate, strokeDash, innerRadius, point, opacity, filled, align, baseline, dx, dy, text, tooltip}; encoding channels are x, y, color, theta, tooltip, strokeDash, text, each {field, type, datum, value, title, aggregate, stack, axis, scale, legend, sort, format}; type is quantitative, temporal, ordinal or nominal; aggregate is sum, mean, count, min or max; layer is a list of specs; data is {name} for a feed of your Job, or {values} for rows given once. A transform, a selection, a facet or any other key is refused by name; width, height, $schema, config and colours are read and left, because Bridge's tokens size and colour it. headline: {field, unit?, since?: {label, at}, better?: up|down} shows the latest value of the spec's data.name feed large over the chart, and Fleet works out its change since the value at since.at (or the first row), in points where unit is % and as a percentage otherwise; better says which way is good news. strip, in place of a spec: a list of up to 8 stats {label, feed, field, unit?, shown?, since?, better?}, each a sparkline with its value and change. A feed is filled by graph_points, or by source: {recipe: {call, map, every_secs, credential?}}, which Fleet runs every every_secs (10 to 86400) with no model while the Job lives: call is {transport: cli, argv, env?}, {transport: http, method, url, headers?, body?} or {transport: mcp, server, tool, arguments?}, as a project metric's is; credential is {name, how, url?}, the tool whose token from this Mac's keychain fills {credential} in env, arguments, headers or body, and where the keychain holds none the card says so; and map is a jq filter printing {\"<feed>\": [rows]}, or a list of rows where the graph reads one feed. A row already in a feed is not added again, so a map may print a whole window each time. Each feed keeps its newest 2000 rows. Rows are objects; a temporal field is RFC 3339 text or milliseconds. Example, a p99 area with an SLO rule and a deploy marker, fed every 15 s: {\"id\": \"p99\", \"title\": \"p99 latency\", \"spec\": {\"data\": {\"name\": \"checkout/latency\"}, \"layer\": [{\"mark\": {\"type\": \"area\", \"interpolate\": \"monotone\"}, \"encoding\": {\"x\": {\"field\": \"at\", \"type\": \"temporal\"}, \"y\": {\"field\": \"p99\", \"type\": \"quantitative\", \"title\": \"p99 (ms)\"}}}, {\"mark\": {\"type\": \"rule\", \"strokeDash\": [4, 4]}, \"encoding\": {\"y\": {\"datum\": 250}}}, {\"mark\": \"text\", \"encoding\": {\"y\": {\"datum\": 250}, \"text\": {\"value\": \"SLO 250 ms\"}}}, {\"mark\": \"rule\", \"encoding\": {\"x\": {\"datum\": \"2026-11-27T14:05:00Z\"}}}, {\"mark\": {\"type\": \"text\", \"align\": \"left\"}, \"encoding\": {\"x\": {\"datum\": \"2026-11-27T14:05:00Z\"}, \"text\": {\"value\": \"Deploy 4.12\"}}}]}, \"headline\": {\"field\": \"p99\", \"unit\": \"ms\", \"since\": {\"label\": \"deploy\", \"at\": \"2026-11-27T14:05:00Z\"}, \"better\": \"down\"}, \"source\": {\"recipe\": {\"call\": {\"transport\": \"http\", \"method\": \"GET\", \"url\": \"http://localhost:9090/api/v1/query?query=histogram_quantile(0.99,rate(http_duration_seconds_bucket[1m]))\"}, \"map\": \"{\\\"checkout/latency\\\": [{at: (now | todate), p99: (.data.result[0].value[1] | tonumber * 1000 | round)}]}\", \"every_secs\": 15}}}. A spec that breaks a rule is refused with what is allowed, and nothing is shown. withdraw_graph stops its recipe."
notes = """
`POST /sessions/graph`, body `ShowGraph`: `id`, `title`, one of `spec` (Vega-Lite as JSON) and `strip`, an optional `headline`, `source` and `session_id`. Answered with the graph's `GraphShown` as `list_graphs` carries it, and publishes `graphs.changed`.

**Checked in `ipc` (`graphs.rs`) before anything is kept**: the spec through `ipc::graph::read_spec`, whose refusal names the first key Bridge would not draw and the words that place takes; an `id` that is not lower case letters, digits and dashes; a blank or long `title`; both `spec` and `strip`, or neither; a spec that reads no data; a `headline` on a strip or on a spec that names no feed; more than 8 stats; a `since.at` that is not RFC 3339; a recipe whose `every_secs` is outside 10 to 86400, whose `map` is blank, or on a graph that reads no feed; and the recipe's call, held to a metric recipe's rules (`adapters::problem_with`): no shell, `GET` or `POST`, a credential named by letters, digits, dashes and underscores, and no placeholder but `{credential}`, filled only in `env`, `arguments`, `headers` and `body` and only where the recipe names a `credential`. Every problem is said in one 422 `fleet.graph_refused`. A Job holds at most 24 graphs; the 25th id is 422 `fleet.graph_too_many`.

**The feeds are the Job's, by name**, so two graphs may read one feed. A chart's feed is the spec's `data.name`, a layer's included; a strip's is each stat's `feed`. A spec with `data.values` draws those and needs no feed.

**The recipe's map prints `{"<feed>": [rows]}`**, an object of feed names to lists of rows, so one call can feed several feeds, or a bare list of rows where the graph reads exactly one. A key that names a feed no graph reads is kept all the same, for a graph shown later. **A row the feed holds already is not added again**, so a map may print the whole window a query answers each time and only its new rows are kept. A map printing more than 2000 rows of one feed gives its last 2000.

**The headline's and each stat's change is Fleet's**, worked out each time its feed takes rows and carried on the card as `delta`: `said`, `since` and `tone`. It runs from the value at `since.at` (the latest row at or before it, read by the chart's first temporal `x` field, else `at`) or, with no `since`, the feed's first row, to the latest. A unit of `%` is said in points (`+2.1 pts`), anything else as a percentage (`+41%`); a start of 0 gives no percentage and no `delta`. `better` `up` makes a rise `better` and a fall `worse`, `down` the other way, and with none every change is `steady`.

**Showing the same `id` again replaces it in place**: the card keeps its place in the Job's graphs, its feeds keep their rows, and a recipe it had is replaced by the new one, or stopped where the new call has none. A withdrawn graph shown again is live again.

**A recipe's `credential` is read from this Mac's keychain for each run**, as a metric recipe's token is, and every why is scrubbed of it. Where the keychain holds none the recipe is not run: the card carries the credential as `no_token`, and its `broken` says which token is missing, so a restart says it too.

**Kept in the store per Job**, `job_graphs` and `job_graph_rows`, so a restart keeps the graphs, the rows and when each recipe last ran. The call's row in the thread names the id (`show_graph <id>`), which is the thread's `graph` item (`ThreadGraph`).

`agent_access` is `Yes`: the Job is the one reading the numbers. `ask_tool` is `none`: a person asks for a graph in words, and the message box's list holds no graph tool yet.

`docs/practices/protocol/a-job-shows-a-live-graph.md`.
"""
