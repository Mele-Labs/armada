[operations.raise_cost_cap]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Give one Job a higher cost ceiling than the tier above it allows"
notes = """
**The act the `over_budget` label has always pointed at and nothing performed.** `docs/concepts/machine.md` says a Job past its cost cap waits at `queued` until somebody raises the cap, and `job-statuses.toml` says the same thing one file over — it is the one reason a `queued` Job carries that does not clear on its own. Until this there was no key, no route and no control: the tiers above the Job govern every Job in the installation or in the repository, so the Job in front of you could only be helped by moving a number for all of them.

**It moves a number and never the Job.** No status changes, no step advances and no Drone is asked for — admission was already going to start one and was refused for money. What comes back is the summary, and the fact a caller is reading it for is `queued_reason`: `over_budget` before the raise, absent or `waiting_on_resources` after it. That is the whole answer to *did this unblock it*, and it is answered by the same predicate admission asks rather than by a second reading here.

**Only the dollar cap**, and `raise_turn_cap` below is the other. One route moving either would be a body that means two things and an outcome nobody could attribute — which is the same argument that keeps them two rows in `crates/config/settings.toml`.

**It raises. 422 on a value at or under the cap in force**, which is not pedantry about a word: the act exists because work is stopped, and a call that leaves the Job stopped while answering 200 is the failure this route was built against. Lowering a running Job's ceiling is a different act nobody has asked for, and it would strand work mid-flight rather than let it finish.

**409 on a terminal Job.** There is nothing left to spend, so the number would be a value nothing will ever read.

**`agent_access` is `Yes`, one of the acts `fleet::helm::may` (`#73`) admits.** The owner asked for both surfaces by name, and the reason is the Job that produced this route: it hit its cap on its last step, on the cheapest model, summarising work three gates had already passed. A person is not always at the screen when that happens.

**And an agent is bounded where a person is not, and the body does not say which it is.** Fleet places the caller from the connection the call arrived on (`api::commands::raised_by`): a Helm session is Helm, and a call through no door Fleet placed is a person's. `CapRaise` carries the figure and nothing else, so there is no field to claim a ceiling away; the field used to ride in the body, and a Helm call that sent `person` met none (#2165). `crates/fleet/src/raising.rs` carries the ceilings (twice what the Job would inherit for Helm, none for a person) and defends their shape. A raise past the ceiling is 422 and the refusal names it.
"""
