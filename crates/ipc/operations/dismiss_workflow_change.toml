[operations.dismiss_workflow_change]
kind = "command"
transport = "HTTP"
agent_access = "Bridge only"
description = "Put an open change to a workflow aside"
notes = """
`POST /workflows/changes/dismiss`, since 27 Oct 2026. The body is `WorkflowChangeRef`: `change`. The answer is the `WorkflowChange`, `dismissed`.

**Any open change can be dismissed**, drafting, ready or failed; the draft in flight is dropped when it comes. A dismissed suggestion does not stop the next one: a step that drifts again, with nudges that count, is drafted for again.

404 `fleet.no_such_workflow_change` where Fleet kept none by that id. 409 `fleet.workflow_change_settled` where it is already approved or dismissed.

`agent_access` is `Bridge only`: it is the person's press.
"""
