[operations."operator.dispatched"]
kind = "event"
transport = "WebSocket"
agent_access = "Bridge only"
description = "A dispatch an earlier Fleet held was started as asked"
notes = """
Published when a dispatch kept for the Operator is started as it was asked, which is what an earlier Fleet's held dispatch becomes when Fleet starts. The body is `OperatorDispatched`: `dispatch_id` (the id the dispatch was kept under), `manifest_id`, `way` (`started`; `handed`, `asked` and `parked` are no longer sent), and `session_id` and `title` of the Job started. Bridge draws a toast from it. Not replayed.
"""
