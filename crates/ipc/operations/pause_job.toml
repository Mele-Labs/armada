[operations.pause_job]
kind = "command"
transport = "HTTP"
agent_access = "Helm only"
description = "Retired 2026-09-03. Never built, and no longer promised"
notes = """
**Retired, not pending.** The row said *not yet built* for months, which read as
work somebody had scheduled — and nothing was: no route, no operation
implementation, no binding in `actions.toml`. `#395` deleted the name from the
six documents that counted it as an act, `docs/concepts/drone.md` first, and
that page carries the dated note. Redirect and Kill are what a person does to a
working Drone: say something to it, or stop it.

The name is kept here rather than deleted for `packages/icons/icons/`'s
reason — a reader who finds no row cannot tell a call that was refused from one
nobody thought of, and `docs/contracts/system-architecture.md` sends them here.

What it would have been, so that whoever proposes it again starts from the
argument rather than from the gap: a hold on a healthy Drone with its worktree
intact. It only ever meant something there — anything escalated is already
held, because Fleet never auto-kills — and it carried no Intervention Ladder
rung, so Helm never reached it directly. Moot for now: nothing serves this row,
so `agent_access` moving to `Helm only` with the rest of this ruling changes
nothing until somebody builds it.
"""
