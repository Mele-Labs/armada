[operations.dispatch_job]
kind = "command"
transport = "HTTP"
agent_access = "Bridge only"
description = "The person dispatches work to a repository: Fleet starts a Job on it, or, with the Operator on, lets the Operator start one, fold the work into a live Job, ask him, or keep it for later as an idea"
notes = """
`POST /sessions/dispatch`, body `DispatchJob`: every field of `StartSession`, flat, and `then`, the sends Bridge makes into the Job once it exists, in order. Each is `{ "notes": [SessionNote] }`, sent as `send_session_notes`, or `{ "message": { text, attachments?, mentions?, sketches? } }`, sent as `send_session_message` to the Job. `kind` is optional, `idea`, `feature` or `bug`: what he calls it. Answered with `JobDispatched`: `session`, the `SessionRecord` of the Job started, `operator`, the dispatch's id while the Operator holds it, or `parked`, the id of the idea it was kept as. **Exactly one is present.**

**Everything but the Operator's case is `start_session`.** A body with `held`, `fork`, `root` or `after`, or no `request`, is started as `start_session` starts it, its `then` sent into the new Job, and answered with `session`. So is every dispatch while the Operator is off or not seated, whatever `kind` says.

**With the Operator on and seated, a dispatch goes to it before any Job exists.** Fleet weighs the `request` against the live Jobs in the repository as it weighs any start. **`kind` decides what is asked.** `idea` is kept for later at once, with no call: `operator.dispatched` with `way` `parked` is published and the answer is `parked`. `feature` and `bug` are never parked. Left out, the Operator reads the words and pictures and may park it. Where `feature` or `bug` is named and no live Job shares a path, an issue or its words with it, the Job starts at once with no call, `operator.dispatched` with `way` `started` is published, and the answer is `session`. A `feature` or `bug` Job starts on the repository's workflow of that name where it holds one and it is on; the person's choice stands over the proposer's reading. Left out, the call is made even where no live Job is near. Where one does, or `kind` is left out, the whole body is kept and the Operator rules: **start a Job** (as `start_session` starts it, `then` sent, `way` `started`), **fold it into the live Job** (its words are told to that Job, `then` is sent into it, `way` `handed`), **keep it for later** (`way` `parked`, as `idea` does), or **ask him** (a go-ahead in the Operator's own list, `Hand to <Job>` or `Keep both`, `way` `asked`; Keep both and Skip start the Job as asked). The answer is `operator`, and `operator.dispatched` follows. A start or a fold the Operator rules is done at once and is not a suggestion to press.

**His work is never lost.** A ruling that does not come in `NEEDS_YOU_WAIT`, a call that fails, an Operator that is switched off or paused, or an act that could not be carried out starts the Job at once as it was asked. A dispatch still kept when Fleet starts is started then. The Job a held dispatch becomes is not weighed against the live Jobs again.

`agent_access` is `Bridge only`: a dispatch is the person's own work.
"""
