[operations.dispatch_job]
kind = "command"
transport = "HTTP"
agent_access = "Bridge only"
description = "The person dispatches work to a repository: Fleet starts a Job on it, or, with the Operator's session running, tells it to the session"
notes = """
`POST /sessions/dispatch`, body `DispatchJob`: every field of `StartSession`, flat, and `then`, the sends Bridge makes into the Job once it exists, in order. Each is `{ "notes": [SessionNote] }`, sent as `send_session_notes`, or `{ "message": { text, attachments?, mentions?, sketches? } }`, sent as `send_session_message` to the Job. `kind` is optional, `idea`, `feature` or `bug`: what he calls it. **It is a plain field**: it picks no way and no workflow. Answered with `JobDispatched`: `session`, the `SessionRecord` of the Job started, `operator`, the dispatch's id when it was told to the Operator's session, or `parked`, always absent now. **Exactly one of `session` and `operator` is present.**

**A dispatch is `start_session` unless the Operator's session is running.** A body with `held`, `fork`, `root` or `after`, with no `request`, or carrying `then`, is started as `start_session` starts it, its `then` sent into the new Job, and answered with `session`. **So is every dispatch while the Operator is off or its session is not running**: his work is never lost, and the Job starts as he asked.

**With the Operator's session running**, a plain dispatch is told to it as a message in its thread, and the answer is `operator`: the session starts the Job itself, or puts a card in front of him. Fleet rules nothing and starts no Job of its own on it.

`agent_access` is `Bridge only`: a dispatch is the person's own work.
"""
