[operations.operator_turn_order]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "The person drags Your turn into a new order"
notes = """
`POST /operator/page/order`, body `OperatorTurnOrder`: `ids`, the items first to last. Answered with the `OperatorPage`. An id that is not an open item is left out, and the open items it does not name follow in the order they had. Publishes `operator.page_changed`.
"""
