[operations.observe_commander]
kind = "query"
transport = "WebSocket"
agent_access = "No"
description = "One Job's Commander conversation: the thread so far, then every message after it, on a socket of its own"
notes = """
**`observe_helm`'s shape with a Job for its subject**: `opened`, the thread, then what follows, with `missed` where a viewer fell behind. The session's own output arrives as `row`s in the transcript's vocabulary; `asked`, `woke`, `fresh` and `unanswered` are the words only a conversation has. `woke` is the one Helm's socket has no word for: Fleet started a turn, and the fact that did. #2166.

**No end to close on.** A Commander outlives every process that answers in it, so the socket stays open for as long as a viewer holds it. A Job that has not woken its Commander and has not been written to opens on an empty thread.

**Nothing on it advances the Job.** A Commander claims nothing: the Checks and the Judge decide whether work advances, and what it said is read as what it said.

`agent_access` is `No`: a session must not read another session.
"""
