[operations.get_helm_debug_info]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "One repository's Helm Job as one quotable record, taken at a moment"
notes = """
**The error treatment's debug payload, one subject over** — `docs/contracts/design-system.md`, *The debug payload*, and `#1367`. It answers what decides why the Job answered as it did: the repository, its authority and model; the note appended to its system prompt; the tools the door offered it, by name; the thread; what has crossed since the cursor its last poll named; and the protocol Fleet speaks beside the Fleet process that answered.

**Fields, not text.** Bridge formats them, so one producer writes the artifact and the expanded view renders the same string the clipboard takes — `packages/components/src/errors/ErrorNotice/payload.ts` is the precedent and the reason.

**Changed with Helm becoming a Job.** `brief` is now `note`; `servers` is gone, a Job's own thread not saying; `session` is the Helm Job's id and absent where none is live; the thread's lines are `asked`, `said`, `called`, `refused` and `sent` (a turn's cost is on the Job's record). The record is taken whether or not a Job is live.

The thread is bounded and says what it cut, and a long reply is cut with its own length beside it. `polled` is what the Job's own poll was answered, kept as the door answers it rather than recounted here.

`agent_access` is `No`, for `ask_helm`'s reason and one further: a job reading its own note and roster would be reading a record kept about it.
"""
