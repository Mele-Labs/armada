[operations.approve_dispatch]
kind = "command"
transport = "HTTP"
agent_access = "Helm only"
description = "Releases a Job to spawn, as the person left its proposal"
notes = """
The primary autonomy control.

**Since 23.8 the body is the proposal as the person left it** (#1641, spike 022 slice 4), `ApproveDispatch`: `title?`, `facts?`, `workflow_id?`, `gates?` (`GateChoice`: `step_id`, `checks`, `judge`, `you`, `overridden?`), `criteria?` (`CriterionWritten`: `criterion_id?`, `text`, `source`), `tiers?`, `drone_cap?` and `landing?` (`LandingChoice`: `target?`, `from_ref?`, `branching`, `pr_mode?`, `complete_when`). **An empty body is the proposal as it stands**, which is every Bridge before 23.8 and Helm's press. A field left out keeps what the proposal holds, except `drone_cap`, which is the machine's cap where left out, the body being the whole proposal.

**Kept whole or refused whole, before anything moves.** The title, facts, workflow, each step's gate and the criteria are rewritten on the record, and freeze at this press (#1581); the tier map, the Drone cap, the landing and the policy overrides are kept beside the Job. Then `awaiting_approval -> queued`, as before. A criterion with an id is that line, reworded or not, and keeps its origin and how it is answered; one without is new, minted the next `c<n>`, the person's, and answered by the Judge or a person, never a Check. An overridden step keeps deferring on the record and the override wins at every gate however the repository's rule moves (answer 4): `auto_merge` reads `never` with `you`, else `checks-pass`; `review_gate` reads `human_always` with `you`, else `auto_if_judge_passes` with `judge`. The Drone cap is kept and enforced from slice 5.

409 `fleet.proposal_frozen` on a Job past `awaiting_approval`, and the existing 409 on a move the machine refuses. 422 `fleet.no_such_branch` on a landing branch the repository does not hold, and 422 `fleet.unacceptable_proposal` on a blank title, a criterion the Job does not hold or sent twice, a Check on a typed line, `judge` alone on a step giving the Judge nothing to read, an override on a step deferring to no rule, `branching: group`, `complete_when` `pr_merged` or `pr_opened` (`all_members_landed` is kept since 23.13), and a cap of zero. 409 `fleet.wave_refused` on one Job of an Epic's wave, which is released with its wave by `approve_wave`. A model `list_models` does not offer is refused as `set_tiers` refuses one.

**Since 23.20 a step may be tuned**: `tuning?`, a `StepTuning` per step (`step_id`, `model?`, `effort?`, `context?`, `judges?`, `checks_off?`), frozen into the step after its gate. 422 `fleet.unacceptable_proposal` on a step the workflow lacks or tuned twice, a blank model, `judges` of zero or on a step with no Judge, and a Check the step does not run or one of Fleet's own; an unknown field does not decode; since 23.23 `harness` is read and refused unless `list_models` lists it under `harnesses`. **Since 23.21 `LandingChoice` takes `start_point?`**: a `from_ref` the repository lacks is made there at the press, and 422 `fleet.no_such_branch` names a `start_point` it lacks. **Since 23.24 it takes `local?` and `auto_merge?`**: stop at the Job's branch with no pull request, or have the forge merge the pull request itself; 422 on both together.

**Since 23.68 the body may carry `additions?`**, a list of `AddStep` (`runs`, `when`, `step`, `block?`, `repair?`): steps for this Job only, placed at the press and kept beside the frozen workflow and never in it. Left out keeps what was placed, `[]` clears it, and every place is ahead at the gate. 422 `fleet.unacceptable_proposal` on one that names nothing to run, a step the (possibly new) workflow lacks, or `pr_opened` on a step that is not the delivering one. A Job underway takes them through `add_job_step`.
"""
