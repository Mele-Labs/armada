[operations.change_feature]
kind = "command"
transport = "HTTP"
agent_access = "Operator"
description = "Merge a feature into another, or rename it. Give project, feature (its slug), and either into (the slug to fold it into) or slug and title (what it becomes). Use it for a pending feature a Job named, once he has chosen, and for two seeded features that are one"
notes = """
`POST /features/change`, body `ChangeFeature` `{ project, feature, into?, slug?, title? }`. Answers `FeatureChanged` `{ feature, merged_into? }`: the slug the feature has now.

**`into` folds the feature into another.** Its path prefixes and entry points join the target's, its links, the files Jobs wrote under it and the asks filed under it become the target's, and a section the target never wrote is copied. The target keeps its id, its state and its `added_at`, so a merge never back-dates the catalog. **`slug` renames it** and `title` retitles it; either alone is allowed. `into` with `slug` or `title`, and a call that changes nothing, are refused 422 `fleet.feature_change`.

**The old slug stays as an alias** of the feature it became, so a `Feature:` trailer already in git, or an act that still names it, files under the right feature and makes no new pending one. `list_features`, the pages and `file_ask` all take an alias. `upsert_features` of a slug that is an alias keeps a feature by it and takes the alias away: that is how a merge is undone.

**To confirm a pending feature, call `upsert_features`** with `state` `confirmed`, an area, a title and a line: there is no other act to confirm one.

**Only the Operator's own session may call it**, placed by its connection: any other caller is refused 422 `fleet.not_the_operator`. 404 `fleet.feature_unknown` for a slug or target the project does not hold, 409 `fleet.feature_slug_taken` for a new slug a feature holds, 422 `fleet.feature_slug` for a slug a trailer cannot carry. Nothing is kept on a refusal.

The library lives on this Mac. Sharing it with teammates is not built.
"""
