[operations.get_accounts]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "The profiles this machine has joined, the repositories chosen for each, and the sign-in in flight"
notes = """
`GET /accounts`, answered with `Accounts`: `profiles`, each `account_id` (the forge's numeric id), `login`, `orgs` (the organisations kept at sign-in, lowercase; empty where the forge would not list them), `chosen`, `home` (`{ account, repository, made }`: the copy of its shared home here with `made` set, else where it will be made, as `set_home_repository` recorded it and else `<login>/armada-home`) and `repositories` (`root`, `name` and `how`, always `chosen` since 19 Nov 2026), in the order they were joined; `unmatched`, always empty since 19 Nov 2026 and kept for an older Bridge; and `flow`, tagged on `phase`.

**There is no active profile: a project picks the login that joins its store** (`set_project_store`), and its repositories claim as it. A repository listed under a profile is one `set_repository_profile` chose it for, over its project's login. A repository's owner binds nothing.

**`flow` is the sign-in in flight, and nothing else.** `idle` is nothing in flight, with `ended` naming how the last one finished (`signed_in`, `denied`, `expired`, `unreachable` or `refused`, and `said` for the ones that failed) until the next starts. `code` is the short code to type with the `address` to type it at and `expires_in_seconds` it has left. `setup` is the code typed and Fleet setting the account up: `login`, `repository` (**empty until a shared home exists**) and `steps`, each of `identity`, `store` and `home` one of `waiting`, `working` or `done`. `repository` is the copy here, `<owner>/<name>`, and `home` is `done` once this machine holds one. A sign-in that finishes goes straight to `idle` with the profile in `profiles`, so a client polling this sees `ended.outcome` of `signed_in` rather than a last `setup` frame.

`chosen` is every profile after the first one joined: added beside the machine's own, so what it syncs is a choice. `agent_access` is `No`: which accounts a machine acts as is the person's.
"""
