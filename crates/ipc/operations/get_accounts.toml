[operations.get_accounts]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "The profiles this machine has joined, which is active, and the sign-in in flight"
notes = """
`GET /accounts`, answered with `Accounts`: `profiles`, each `account_id` (the forge's numeric id), `login`, `active` and `chosen`, in the order they were joined, and `flow`, tagged on `phase`.

**`flow` is the sign-in in flight, and nothing else.** `idle` is nothing in flight, with `ended` naming how the last one finished (`signed_in`, `denied`, `expired`, `unreachable` or `refused`, and `said` for the ones that failed) until the next starts. `code` is the short code to type with the `address` to type it at and `expires_in_seconds` it has left. `setup` is the code typed and Fleet setting the account up: `login`, `repository` (**empty until a shared home exists**) and `steps`, each of `identity`, `store` and `home` one of `waiting`, `working` or `done`. **`home` stays `waiting`**: the shared home is not built. A sign-in that finishes goes straight to `idle` with the profile in `profiles`, so a client polling this sees `ended.outcome` of `signed_in` rather than a last `setup` frame.

`chosen` is every profile after the first one joined: added beside the machine's own, so what it syncs is a choice. `agent_access` is `No`: which accounts a machine acts as is the person's.
"""
