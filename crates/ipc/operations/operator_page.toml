[operations.operator_page]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "The Operator's page: Your turn, and the digest Since you last looked"
notes = """
`GET /operator/page`, answered with `OperatorPage`: `on`; `top`, the page's one line, rewritten each time he comes back; `looked_at`, when he last looked, which the digest counts from; `on_it`, `{ reading, since }`, present while the Operator is reading something to review; `turn`, Your turn in the order he left it; `digest`; `mains`; and `slots`.

**Fleet keeps everything the page needs, and Bridge only draws it.** An `OperatorTurnItem` is `id` (`turn:<n>`, which every act names), `kind` (`decision`, his to decide, or `go_ahead`, what the Operator would do itself), `urgency` (`urgent` on a red main, else `decision` or `go_ahead` as its kind; Fleet decides it so no screen works it out, and no stopped Job is queued today, so none reads urgent), `session_id`, `job`, `manifest_id` and `repository` where it has them, `item` (the `WaitingItem` as it was raised: its `source` is its kind, `text` the thing, `act` and `options` what it asks), `read` (`{ read, pick }`, the Operator's one or two sentences and its pick; absent where no call read it, and an empty `pick` is none. **A pick is a button that does what it says**: one of the item's own options, exactly as labelled, or `Later`, which a Yes does; never a sentence), `raised_at`, `later_until`, `then`, `keeps`, `also_raised_by`, what else raised the same ask and was folded into this item, each in a few words for its tooltip, oldest first, and `group`, the Job's id where that Job has two or more asks waiting. **A Job's asks are one entry**: `turn` lists a group's asks together, at the place of the first of them in his order, oldest first, so an order naming any one of them moves them all.

**`then`** is on a go-ahead to file an issue only: `just_file`, `file_and_start` and, **only where a live Job already works on the same files**, `file_and_hand` with `hand_to` `{ session_id, job }`. Fleet finds that Job from the paths each live Job has written and its plan names, as it does for a clash. The Operator's read marks one `pick`. **`keeps`** says Always here and Always are offered: they are, for a go-ahead and a red main, which Fleet can do by itself, and not for a decision.

**A red main nobody is on is an item**: a `go_ahead` with no Job, its `item.id` `red:<repository>:<commit>`, its one option `Start a fix`. It is the one ask for that red: Autopilot's red kind raises it too and hands the Operator nothing to start.

**Every act the Operator would take is an item.** A new Job, words to a live Job and a new issue are `go_ahead` items, until a rule the person kept covers them. A link writes nothing and is not asked.

**The order**: the order he left, with an item he put Later after the rest until its `later_until`.

**One ask, one item.** A suggestion that would do what an earlier open one does (file or close the same issue, whatever raised it) is folded into it and named in its `also_raised_by`; answering it answers them all. One that repeats a suggestion already answered is dropped with no item, nor a row under Answered, and Fleet's log says so. An ask read off a Job's reply is not queued while one of Fleet's own items for that Job stands (a held Job's start, a plan, a walk, a draft, a sketch or a document), since the reply repeats it. Yes on a held Job's start starts that Job, with the landing its card picked. **Nothing is queued while the Operator is off** and `turn` is then empty; what waits is queued when it comes on. Where the review call fails, or the week's plan is paused, the item is still queued, with no `read`.

**`mains`** is the head's pills, one `OperatorMain` for each repository Fleet serves, first first: `manifest_id`, `repository` (the name an item gives), `state` (`green`, `red`, `running` or `nothing_ran`, as the merge line's `main_ci_state`; a red a newer commit's run is still on is `red`), `commit` (whole: the one the state was decided from, the red's own on a red) and `since` (`red` only: when main first read red). `state` and `commit` are absent where Fleet has not read main yet. It is read from what main's CI kept, so no call is made. **`slots`** is `{ used, total }` across every pool, from the list Cleanup reads: `used` counts the slots a Job or a process holds, work stranded in one, or a take or release under way, and `total` every slot, free, unmade or closed ones too. It is absent where no pool is read.

**`digest`**: `landed`, the pull requests that merged since `looked_at`, each `{ session_id, job, number, title, at }` with `at` the time it merged; `handled`, the Operator's own acts since then, newest first, each `{ at, title, outcome }`, and `log`, `{ week, path }` of the week's journal, which the Operator writes as it works; `running`, the live Jobs; `coming_up`, the Jobs waiting to start with `needs`; `learned`, the Always and Always here rules across projects, each with its repository where it holds in one, and rules only; and `holds`, the holds that stand, each `{ id, manifest_id, repository, said, at }`, which `remove_operator_order` lifts and the chat can lift.

The page changes under him, so `operator.page_changed` is sent when an item joins or settles, when the order, a Later, a rule or a hold moves, when a Later runs out, and when a rule is forgotten, and when `top` or `on_it` changes, and when a repository's main turns red or green, once for each reading that changed it. **It is not sent when the slot count moves**: slots move with every lease and every release, and Bridge reads `slots` with the page whenever it reads the page. The digest's other sections are read, not announced.
"""
