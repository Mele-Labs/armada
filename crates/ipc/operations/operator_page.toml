[operations.operator_page]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "The Operator's page: Your turn, and the digest Since you last looked"
notes = """
`GET /operator/page`, answered with `OperatorPage`: `on`; `top`, a line the page once rewrote each time he came back and that nothing writes now, so it stays as it was kept or absent; `looked_at`, when he last looked, which the digest counts from; `on_it`, always absent; `turn`, Your turn in the order he left it; `digest`; `mains`; `slots`; and what the Operator's own session adds, below.

**The Operator is one agent session, and Fleet rules nothing.** An `OperatorTurnItem` is `id` (the card's id, `red:<repository>:<commit>` or `disk-hold:<repository>`, which every act names), `kind` (`decision`, or `urgent` on a red main), `session_id`, `job`, `manifest_id` and `repository` where it has them, `item` (the `WaitingItem` as it was raised: its `source` is its kind, `text` the thing, `act` and `options` what it asks), `read` (a card's `{ read, pick }`, the session's own words; its pick is the first option), `raised_at` and `later_until`. `then` is always empty, `keeps` false and `follows` absent: they stay on the wire for a client that reads them.

**What Your turn holds.** A card the Operator's session raised (`raise_card`), a red main nobody is on (`red:<repository>:<commit>`, one option `Start a fix`) and a disk hold. **No Job's own Needs you item is queued here**: it stands in that Job's list, and the session reads it with its tools. A Job's conflict or landing question the session was not told of stands in the sending Job's own Needs you.

**The order**: the order he left, cards first. **An item he put Later is left out of `turn` until its `later_until` passes**, and then comes back where he left it; so is every item of a Job that is paused or snoozed, until it wakes.

**`mains`** is the head's pills, one `OperatorMain` for each repository Fleet serves, first first: `manifest_id`, `repository` (the name an item gives), `state` (`green`, `red`, `running` or `nothing_ran`, as the merge line's `main_ci_state`; a red a newer commit's run is still on is `red`), `commit` (whole: the one the state was decided from, the red's own on a red) and `since` (`red` only: when main first read red). `state` and `commit` are absent where Fleet has not read main yet. It is read from what main's CI kept, so no call is made. **`slots`** is `{ used, total }` across every pool, from the list Cleanup reads: `used` counts the slots a Job or a process holds, work stranded in one, or a take or release under way, and `total` every slot, free, unmade or closed ones too. It is absent where no pool is read.

**`digest`**: `landed`, the pull requests that merged since `looked_at`, each `{ session_id, job, number, title, at }` with `at` the time it merged; `running`, the live Jobs; `coming_up`, the Jobs waiting to start with `needs`; and `holds`, the holds that stand, each `{ id, manifest_id, repository, said, at }`, which `remove_operator_order` lifts. `handled.acts`, `learned` and `ruled` stay on the wire and are empty, and `handled.log` names the week's journal file.

The page changes under him, so `operator.page_changed` is sent when a card joins or settles, when the order, a Later or a hold moves, when a Later runs out, and when a repository's main turns red or green, once for each reading that changed it. **It is not sent when the slot count moves**: slots move with every lease and every release, and Bridge reads `slots` with the page whenever it reads the page. The digest's other sections are read, not announced.

**The session** (since 14 Nov 2026): `session_id` is the live Operator session whose thread is the talk, absent while none runs; `talk_session_id` (since 28 Nov 2026) is the newest Operator session, ended ones too, whose thread the page draws while none runs; `feed` is what happened since `looked_at` that needs no decision, newest first, each `{ at, kind, title, session_id?, number?, said? }` with `kind` `dispatched` (the Operator started a Job), `merged`, `ended`, `asked` (a Job's conflict or landing question), `told` (a note, report, error or issue told to the session) or `settled` (a card the Operator settled, `said` how); `operator_acts` is each served project and its `operator_acts` value, `acts` absent where he has not said. A turn item that is a card carries `card` `{ kind, talk_of?, sessions? }`.
"""
