[operations.list_bug_reports]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "Every bug report agents made of Armada on this Mac, newest first, each with the Job that made it, and whether the owner kept it"
notes = """
`GET /bug_reports`. Answers 200 with `BugReports`: `reports`, each a `BugReport` `{ id, session_id, job_title, title, what, steps[], errors[], logs[], at, kept?, fixed? }`. `job_title` is the Job's title when it reported, empty where it had none; the Job may be gone. `kept` is when the owner kept the report, and absent is not kept. `fixed` is `{ at, pull_request, title, url }`, the merge that fixed the report: a pull request one of the Jobs started on it held, merged. It is absent while the report stands open and is set once, by the first merge. Newest `at` first, ties by id. Whether the owner has read one is Bridge's own and is not kept here. `bug_reports.changed` carries the same list whole.
"""
