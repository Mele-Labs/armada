[operations."projects.changed"]
kind = "event"
transport = "WebSocket"
agent_access = "Bridge only"
description = "His projects changed, and this is all of them now, with the tasks in none"
notes = """
Carries `Projects` itself, the answer to `list_projects`, so a client replaces what it holds. Published on every write: `add_project`, `rename_project`, `delete_project`, `add_project_task`, `add_project_subtask`, `edit_project_task`, `link_project_issue`, `link_task_issue`, `unlink_task_issue`, `link_task_job`, `unlink_task_job`, `link_task_pull`, `unlink_task_pull`, `remove_project_row`, `move_project_row` and `tick_project_task`. Not published when only the tracker's word on a linked issue, or the forge's on a linked pull request, moved. Published too when a Job holds, asks about or lets go of tasks, and when a linked pull request's merge asks about one. A Bridge that missed one reads `list_projects` on the resync that follows a `Missed`.
"""
