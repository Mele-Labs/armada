[operations.get_app_run_draft]
kind = "query"
transport = "HTTP"
agent_access = "Bridge only"
description = "The processes Fleet proposes that no saved run already starts, and where saving them would put them - nothing is saved"
notes = """
`GET /app_runs/draft?manifest_id=`, answered with `AppRunDraft`: `root`, `place`, `processes`, each `{name, dir?, command, port_env?}`, and `links`.

**Run memory first, then the repository's files**: a dev server a Job brought up on a port beats a guess from `package.json`. A repository whose files and Jobs suggest nothing is answered with no `processes`, and a person writes their own.

**`${port}` in `command` is the port Fleet leases the checkout**, so a person never edits a number, and a process listens exactly where its command holds it. `port_env` is the variable Armada sets to that port for a program that reads it from the environment; it is handed back to `save_app_run` as it was read.

`place` is where the repository's Kit is kept, which is where a saved run goes: `RunPlace`, worded by Bridge's `placePhrase`.

**Answered where the repository already declares runs**, for *Add a way to run*: `processes` is then only what no saved run starts, matched by folder, and an empty list is a draft too. A proposed name never clashes with a Command, server or port the repository declares.

`links` is where a proposed process expects another, proposed or already saved, on a port it would not get, each `{from, to, port, found_in, brief}`; the same shape as on `AppRun`.
"""
