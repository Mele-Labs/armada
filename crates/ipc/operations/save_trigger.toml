[operations.save_trigger]
kind = "command"
transport = "HTTP"
agent_access = "Bridge only"
description = "Check one Trigger against the repository's Commands and write it in the repository's own folder or this machine's"
notes = """
`POST /triggers/save`, protocol 23.58, with `?manifest_id=`. The body is `SaveTrigger`: `scope` (`repository` for `<repository>/.armada/triggers/`, `machine` for `~/.armada/machine/triggers/`), `definition` (the whole file as YAML text) and `overwrite`. The answer is a `TriggerSaved`: the identity, the scope, the file as written, whether it replaced one, `runs_from` (the level whose copy of that identity runs now), `waits_for_main` and `skipped?`.

**Checked before anything is written**, with the loader's rules: `config::fit_trigger` parses the text and resolves it against the repository's Manifest. A refusal carries the loader's own sentence, every fault of it, and nothing is written. 422 `fleet.trigger_unfit`; `fleet.trigger_name_not_a_name` where the name or step cannot be part of a file's name (letters, digits, `-` and `_`).

**A Command this repository does not declare refuses a repository save and not a machine one.** The loader skips such a Trigger and marks it on the Job, because the same file is right in the next repository. A machine's applies to every repository, so refusing it for the one in front of Bridge would put that reasoning back; its answer carries `skipped` instead.

**Replacing is said.** 422 `fleet.trigger_exists`, naming the file, unless `overwrite` is `true`. The file is found by the identity it declares and not by its name. 500 `fleet.trigger_unwritable` where it cannot be written.

**A repository's file waits for `main`.** It is written in the checkout and Fleet reads a repository's Triggers from the base branch, so `waits_for_main` is true until the base holds that text, and `runs_from` is what runs meanwhile. A machine's is on the next `list_triggers`.

`agent_access` is `Bridge only`: what is saved decides what runs on a person's machine at every Job's moments, and Helm has no ask for it yet.

**Since 23.59 `kept_from?` keeps a Job's added step for every Job**: `{ job_id, addition_id }`. The definition is the Trigger the editor drew from the addition, and it is checked and written as any other. Fleet then records on the addition where it went (`AddedStep.kept`) and publishes `job.addition_changed`. 422 `fleet.no_such_addition`, and `fleet.unacceptable_addition` for a Drone step, which is not a Trigger. Both are asked before anything is written. A Trigger kept this way applies from the next Job, as every saved one does.
"""
