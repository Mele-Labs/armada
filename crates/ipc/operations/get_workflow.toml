[operations.get_workflow]
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "One workflow definition as its file holds it, for an editor, from any of the three places"
notes = """
`GET /workflows/definition?workflow_id=&source=&of=&project=&manifest_id=`, protocol 23.33. The answer is a `WorkflowDefinition`: the id, the place (`armada`, `kit` or `repository`), the file as Fleet read it, `definition` and `overridden_by`. **`definition` is the file's text and not a tree**, the shape `save_workflow` takes, so what an editor changes is what it sends back and Fleet checks it with the loader's own rules.

`source` is optional. Absent is the definition that runs; present reads one a more specific place replaced, which `list_workflows` names on the winner's `overrides`. A definition left out is not here: it is on `list_left_out_workflows` with its reason, and a file that did not parse has no id to ask for. 422 `fleet.no_such_workflow_definition` where Fleet holds none by that id and place. Per repository, by `?manifest_id=`, the one Fleet started in where absent.

**Since 23.96 the answer carries `based_on`** where the copy has a base: `{ version, hash }`, the `version` Armada's definition declared when the copy was made and the sha256 of its text. Absent on Armada's own and on a copy made before Fleet kept it; nothing is guessed.

**`source=base` reads that text.** `of` names the copy's place (`kit`, `repository` or `project`) and `project` names the project where `of` is `project`; the answer is a `WorkflowDefinition` with `source: "base"`, `definition` the carried text the copy began from and `based_on` its own `version` and `hash`. Armada's current text is `source=armada`, so a client holds the two to diff. 404 `fleet.workflow_base_none` where the copy has no base; 422 `fleet.workflow_base_of_needed` without `of`; the project refusals of `get_workflow_draft`. A base is recorded by a publish of a draft of Armada's, by a `save_workflow` into a place with no base whose text is Armada's carried text byte for byte (how Make a copy saves), and by `reset_workflow_copy`; `delete_workflow_copy` drops it. The agent's tool names `workflow_id` and `source` only, so it reads a base only without `of`, which is the 422.

`agent_access` is `Yes` on `list_workflows`' terms: a Job on your words helping to edit a workflow reads the file it is editing.
"""
