[operations.list_manifests]
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "The Manifests Fleet holds, with the repository each was read from"
notes = """
Added because nothing joined a Job's `owner_manifest_id` to a Manifest. A proposal could name any ULID and it was stored, and Bridge could only render the ULID back. Fleet now refuses a proposal naming a Manifest it does not hold, and this is how a composer offers the one it does.

There is no name here because `armada.yml` declares none — `version`, `id`, `checks` and `commands` are the whole schema `crates/config` reads, and every other key is refused. The repository directory is carried instead, which is a fact rather than an invention. What a Manifest should be called is a schema decision and is open.

Every Manifest Fleet serves, the one it was started in first: one Fleet serves many repositories and the rail's project picker switches between them. A repository added with no `armada.yml` is not here until one loads — `list_repositories` lists it.

It carries `auto_merge` and `review_gate` since 18.4, as words: a gate declaring `manifest_rule:<key>` is answered by one of them, and a screen drawing that gate had no way to say what the deference resolved to. Reported, not resolved — `fleet::policy` folds a Job's several gating Manifests at the gate. What a gate resolved them to is a different fact, kept on the run that reached it and served as `StepAttempt.resolved` since 21.9, with `decided` since 21.10 for a run an earlier gate stopped.
"""
