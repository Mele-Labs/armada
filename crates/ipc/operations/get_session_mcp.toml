[operations.get_session_mcp]
kind = "query"
transport = "HTTP"
agent_access = "Bridge only"
description = "The MCP servers a hosted job's process has, and where each stands"
notes = """
`GET /sessions/mcp?session_id=`. `SessionMcp`: `servers`, each a `SessionMcpServer` `{ name, state, error?, scope?, tools }`, `state` one of `connected`, `failed`, `needs_sign_in`, `connecting`, `off`.

**Asked of the job's process each time, never kept.** The harness pushes no line when a server's state changes, so nothing on the event stream says to read this again: Bridge reads it when the Loadout opens and after each act.

Refused, each with its words:
- 422 `fleet.session_mcp_unreachable`: the job runs in a terminal, or has no process running. "Its next message starts one."
- 422 `fleet.session_mcp_refused`: the process refused, ended before it answered, or did not answer within ten seconds.
- 409 `fleet.session_closed`: the job was closed, and takes nothing more.
- 422 `fleet.no_such_session`: no job Fleet hosts has that id.
"""
