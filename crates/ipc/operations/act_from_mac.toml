[operations.act_from_mac]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "An act another Mac made on one of this Mac's Jobs, or a Job it starts here, run here as the person's own"
notes = """
`POST /other_mac/act`, body `MacAct { id, act, at }`, `act` adjacently tagged, `{ kind, body }`, `kind` one of `message`, `ask_answer`, `waiting_answer`, `waiting_answer_parts`, `plan_approve`, `plan_changes`, `sketch_answer`, `document_answer`, `stop`, `merge`, `start`, `dispatch`, `job_message`, `move`, `arrive` and `move_settled`, each `body` the body its own operation takes (`merge` takes `{ session_id, repository, number }`; `job_message`, a Job's `SendMessage` to a Job of this Mac, takes `{ from, title, to, text }` and answers 204, or 409 `fleet.message_job_ended` for an ended Job; `move` takes `{ session_id }` and moves that Job to the sending Mac, as `move_job_to_mac`; `arrive` takes `ArrivingJob`, needs its project shared and holding its repository as a `start` does, and answers 202 with the row; `move_settled` takes `MoveSettled` and answers 204). The sending Mac's id is the `x-armada-mac` header, set by the Gateway from the signature. **The Job must be in a shared project**: one that is not, one this Mac does not hold, and one held from a third Mac are refused 404 `fleet.no_such_session` as an act on a Job that does not exist is, with nothing written. A `merge` needs the Job to own the pull request. A `start` or `dispatch` needs `project` to be shared, else 404 `fleet.no_such_project`, and is refused 422 when it names `fork`, `root` or `after`, which reach other Jobs or folders of this Mac; `on_your_words` is dropped. **Each `id` runs once**: the first answer, its status and body, is kept under the sending Mac and `id`, and a repeat is answered with it and not run again. Then the act runs by the code that runs it for the person here, with the door `mac`, and what it answers is passed back as it was said. Called on the port from inside a Job, around the door, it is a 403 `api.the_persons_own`.
"""
