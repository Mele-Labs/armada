[operations.share_job_artifacts]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "A shared Job's sketches, drafts and pages, for another Mac reading them through the link"
notes = """
`GET /other_mac/artifacts?session_id=`, answered as `get_job_artifacts` answers, with a list of `JobArtifact`. A Job in an unshared project, in none, or held from another Mac is refused 404 `fleet.no_such_session`, worded exactly as for a Job that does not exist. Since 18 Nov 2026.
"""
