[operations.get_workflow_lanes]
kind = "query"
transport = "HTTP"
agent_access = "Bridge only"
description = "A workflow's lanes as its editor draws them: the steps, a lane for each lifecycle with its states in columns, and an edge for each rule"
notes = """
`GET /workflows/lanes?workflow=&scope=&manifest_id=`, since 12 Nov 2026, for native Settings → Kit → Workflows. `manifest_id` is the repository Fleet started in where absent. Answers 200 with a `JobLanesView`, the type `SessionRecord::lanes` carries, so one canvas draws a Job's lanes and a workflow's alike.

**No Job stands in them.** `at` is -1, `working` and `skipped` are absent, and `job` holds only `copy`: the workflow's `steps` in order, the `lifecycles` the tab draws and the `rules` drawn that some place keeps. These are what the forms that add a step, a lifecycle or a rule pick from. `instances`, `fired` and `changes` are empty. `lanes` is the workflow's lane, titled by its id with a Start and an End, then one lane for each lifecycle with an id of its own. `rules` holds one `LaneEdge` for each rule, `id` and `rule` both the rule's id, `status` `waiting` and no `waits`. A rule that is off is drawn.

**Read as Classic's Workflows page reads it**: the projects that hold the repository, then the lifecycles and rules of every member Fleet serves. A lifecycle merges its states and moves at every level; its states sit in the columns the moves between them give, as on a Job's lanes. A rule is drawn from the piece of the nearest level the tab reads that keeps one, and only where a Job event or a gate does not set it off, it lands on a node, its `workflow` condition (if any) names this workflow, both of its ends are drawn, and a level the tab reads keeps it. Where it lands is the state a `tracker_move` moves to, the first ending state a `tracker_close` closes in, `ready` or `merged` for `forge_mark_ready` and `forge_merge`, the deploy lifecycle's first state for a `start_watch` with a deploy, else the step an `at_step` condition names.

**Marks**, each absent when empty: a state's `differs` and an edge's `differs` name the levels below that differ; `clash` says which Workspaces tie on a repository's tab; `proposed` is a rule only an open keep draft holds; `pending` is `keep` on a lifecycle lane or an edge whose piece has an open keep draft. Fleet never sets `removal`.

`scope` absent or `default` is the default level, `workspace:<id>` a project that holds the repository, and a Manifest id a repository read with it. Any other is 422 `fleet.no_such_lanes_level`, naming it. `workflow` names a workflow this repository runs. One it does not run is 422 `fleet.no_such_workflow_definition`.
"""
