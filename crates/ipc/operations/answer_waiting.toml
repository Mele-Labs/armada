[operations.answer_waiting]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Settle one thing a job is waiting on the person for: a numbered choice, their words, or leave it to the agent"
notes = """
`POST /sessions/waiting/answer`, body `AnswerWaiting`: `session_id`, `item_id`, and one of `choice` (an index into the item's `options`), `text`, or `mode` (`best` or `quick`). Answered with the `SessionRecord`.

**Routed by the item's source.** `ask_card` and `permission` items answer through the ask route underneath (`answer_session_ask`): a `choice` or `text` answers the card, a `mode` alone refuses it with the mode line as the note so the agent decides. A `walk` item sends the approval (`Approved: <url>`) as the person's message. An `agent` item becomes a message to the job: the item, the answer, the mode line, and a last line saying Fleet took the item off its waiting list. A `mode` with a `choice` or `text` adds its line to the message. A `choice` with `text` says both: the words go with the pick, to the agent as a second line and to an ask card as its note. Once that message is delivered the item is dismissed, as `dismiss_waiting` does: the returned record and the `SessionChanged` event no longer carry it, and the agent stating it again does not bring it back. A send that fails leaves the item standing. An item nothing holds is a 409; a body with none of the three is a 422.

A `slot_choice` item (id `slot-choice`) takes a `choice` only: 0 is *Wait for a slot*, which leaves the job where it is in the line for one, and 1 is *Add a slot*, which makes a slot and leases it to that job ahead of the line. **Neither sends the agent a message**: it ended its turn when it was queued and is moved into its slot once one is granted. Words or a mode alone are a 422, and a second answer is a 409 since the item is gone.

The mode lines: `best` tells the agent to decide for itself and think it through; `quick` tells it to just get it done: finish the work and land it, skipping the formalities.
"""
