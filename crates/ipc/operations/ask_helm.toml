[operations.ask_helm]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Say something to one repository's Helm, answered at once while the reply streams on its socket"
notes = """
**202, and the reply is not in the answer.** Fleet takes the message and answers with whether the next message resumes a session; the reply is written on `observe_helm`. A message sent while a reply is being written waits its turn rather than being refused.

**Resume, not keep-alive.** One process per message, exiting once it has answered; the next message resumes the stored session by id, after an idle exit, a Fleet restart or a reboot. A session the agent no longer has is forgotten and started again, and the thread is told so with `fresh`. A blank message does not decode.

`agent_access` is `No`: a session must not drive another session.
"""
