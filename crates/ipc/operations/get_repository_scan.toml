[operations.get_repository_scan]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "Scan: every workspace in the checkout, what each one's files declare, and the file each finding came from"
notes = """
The first thing Setup does, and a read of the repository rather than of `armada.yml` — it is for a repository nobody has written one for, so it reads no Manifest and needs none. `docs/concepts/manifest.md`, *Setup*.

Evidence, never a proposal. Every finding carries its file because every line of the proposal built on it (#823) must cite one, and nothing here says which script gates code. What was not read is said beside it, on drift's rule: a tool this read has never heard of reads as not followed, never as clean.

It writes nothing and runs nothing, and the first is a fact about the type: Fleet hands it a tree that reads a file and lists a directory, with no write on it. Served against the repository `?repository=` names — a root `list_repositories` answers with — and the one Fleet was started in where it names none.

`agent_access` is `No` on the checkout-run operations' terms, the reads among them included: the main checkout is the tree a Drone is confined out of, and Scan reads that same tree, uncommitted edits and all. The column is one set shared by Helm and every Drone, so `Yes` would let any agent read the owner's working tree through Fleet. Proposal's agent help needs another way to this answer, and that is #823's to settle.
"""
