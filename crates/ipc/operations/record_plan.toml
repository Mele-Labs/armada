[operations.record_plan]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Use this once you have planned the work with the owner, to record the plan he approves. Body: groups, in order, each {title, agent, paths, tasks} with optional id, and an optional sketch {title, scene} in the format show_sketch takes. agent is the subagent type that takes the group, one word such as rust-engineer. A group may name the issue it works as issue: the forge's number such as 7, or the tracker's key such as ABC-12. paths are where the group works, from the repository root. tasks are [{title}] with optional id. walk is optional: the url you passed to show_window for the page this plan depends on. While a page you showed is being changed, or he has not approved it, the plan is not put to him. A page you changed after showing it counts as changed until you show it again with show_window, and the plan reaches him once he has approved the page shown again; name a page in walk to hold it until he approves that walk, even before you show it. Recording again replaces the plan as a new version, and the owner approves it again: send each group's and task's id back to keep it the same one through a rename, and leave id out of what is new. The answer lists the ids. At most 24 groups, 40 tasks in a group and 200 in the plan; a plan that breaks a rule is refused with each part named, and nothing is recorded. Wait for his approval before you build. His changes arrive as one message listing marks against groups and tasks: weigh each, push back where you disagree, and record the plan again"
notes = """
`POST /sessions/plan`, body `RecordPlan`: `groups`, an optional `sketch`, an optional `walk` and an optional `session_id`. Answered with the `SessionRecord`; **through the agent's door, a receipt** of `session_id`, `plan` (the version) and each group and task with the id Fleet gave it.

**The plan is checked in `ipc` (`session_plan.rs`) before anything is kept**, and a refusal is 422 listing up to twelve problems, each naming the part (`groups[1].tasks[0]`). A group needs a title, a one-word `agent`, at least one task and paths that lie inside the repository; ids are letters, digits, `-` and `_`, and no two share one. **The `sketch` is `show_sketch`'s scene, checked by the same code**, and is also kept on the Job's ledger as an artifact `sketch:<title>`, which the plan's `sketch.id` names, so the scene is not carried twice.

**Fleet gives the ids.** A group or task the call names by `id` is matched to the version before by that id; the rest by their text. What is left is new and takes the next `g<n>` or `t<n>`. Fleet computes what changed against the version before, `added`, `renamed`, `moved` and `removed`, and keeps it on the new version as `changes`.

**A new version is pending until the owner approves it**, however the one before stood. While pending it is one of the Job's calls, a `waiting_for` item of source `plan`, **put to him only when it can be answered**: not while a window the Job showed is being changed or was changed and not shown again, not while a walk of the Job waits for his Approve (closing its window does not release it), and, when `walk` names a page, not before he has approved that walk. The item's `since` is the latest of the recording, when the windows were last changed or shown again and his Approves, so it calls even if he viewed the Job since the recording. A recording held at the time says so in the receipt's `held`. Recording again without `walk` clears it. Nothing blocks the agent's tools meanwhile. A task's state and a group's `worked_at` carry over by id.

`agent_access` is `Yes`: the Session is the one with a plan to record. A Job's Drone has no such door.
"""
