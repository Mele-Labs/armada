[operations.record_plan]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Use this once you have planned the work with the owner, to record the plan he approves. Body: summary, a few plain lines in the owner's own words saying what he gets, with no file names or types and at most 600 characters (a plan without one is refused); groups, in order, each {title, agent, paths, tasks} with optional id and an optional gives, one line of what that group gives him, at most 160 characters; and an optional sketch {title, scene} in the format show_sketch takes. agent is the subagent type that takes the group, one word such as rust-engineer. A group may name the issue it works as issue: the forge's number such as 7, or the tracker's key such as ABC-12. lands_in is optional: a short label, at most 24 characters, for the pull request the group lands in. Groups that ship together share a label such as PR 1; a group you hand to its own Job lands in that Job's pull request, so give it its own label; absent means PR 1. own_job is optional: true when the group goes to a Job of its own, which you start with start_another_job naming that group; Bridge draws it as that Job's card until it is handed. Absent means false. paths are where the group works, from the repository root. tasks are [{title}] with optional id. walk is optional: the url you passed to show_window for the page this plan depends on. While a page you showed is being changed, or he has not approved it, the plan is not put to him. A page you changed after showing it counts as changed until you show it again with show_window, and the plan reaches him once he has approved the page shown again; name a page in walk to hold it until he approves that walk, even before you show it. seen is optional: true when the person would see the change, so a walk follows approval; it holds nothing. walk names a page shown before the plan, and holds it until he approves that page. Recording again replaces the plan as a new version, and the owner approves it again: send each group's and task's id back to keep it the same one through a rename, and leave id out of what is new. The answer lists the ids. At most 24 groups, 40 tasks in a group and 200 in the plan; a plan that breaks a rule is refused with each part named, and nothing is recorded. Wait for his approval before you build. His changes arrive as one message listing marks against groups and tasks: weigh each, push back where you disagree, and record the plan again"
notes = """
`POST /sessions/plan`, body `RecordPlan`: `summary`, `groups` (each with an optional `gives`, an optional `lands_in` and an optional `own_job`), an optional `sketch`, an optional `walk` and an optional `session_id`. **`seen` is read beside it** by the route (`api/src/sessions.rs`), from the same body, and is no field of `RecordPlan`: it is kept on the plan row and means the change will be seen, so the rail expects a walk. It never holds the plan. Answered with the `SessionRecord`; **through the agent's door, a receipt** of `session_id`, `plan` (the version) and each group and task with the id Fleet gave it.

**The plan is checked in `ipc` (`session_plan.rs`) before anything is kept**, and a refusal is 422 listing up to twelve problems, each naming the part (`groups[1].tasks[0]`). The `summary` is trimmed and needed, at most 600 characters. A group needs a title, a one-word `agent`, at least one task and paths that lie inside the repository; ids are letters, digits, `-` and `_`, and no two share one. **The `sketch` is `show_sketch`'s scene, checked by the same code**, and is also kept on the Job's ledger as an artifact `sketch:<title>`, which the plan's `sketch.id` names, so the scene is not carried twice.

**`lands_in` is a label, not a pull request.** A group's `lands_in` is trimmed, at most 24 characters (a longer one is a refusal naming `groups[n]`), and blank or absent is `PR 1`. It is the new recording's, as `gives` is: send it again with the group. `SessionPlanGroup.lands_in` answers `{ label, pull_request? }` on every group, and Fleet binds a pull request to a label from the Job's ledger: a group handed to its own Job (`started_to` with `detail.group`) takes that Job's `pr` row; a `pr` row that followed a task takes that task's group's label; one that followed none takes the first label in plan order nothing has bound. Every group sharing the label reads that pull request's `number`, `title` and `state`.

**`own_job` is a mark, not a Job.** A group's `own_job` is a boolean, and absent is false; `SessionPlanGroup.own_job` answers it only where it is true. It is the new recording's, as `gives` is: send it again with the group. It starts nothing: the caller starts the Job with `start_another_job` naming the group, and until the group is handed Bridge draws it as that Job's card.

**Fleet gives the ids.** A group or task the call names by `id` is matched to the version before by that id; the rest by their text. What is left is new and takes the next `g<n>` or `t<n>`. Fleet computes what changed against the version before, `added`, `renamed`, `moved` and `removed`, and keeps it on the new version as `changes`.

**A new version is pending until the owner approves it**, however the one before stood. While pending it is one of the Job's calls, a `waiting_for` item of source `plan`, **put to him only when it can be answered**: not while a window the Job showed is being changed or was changed and not shown again, not while a walk of the Job waits for his Approve (closing its window does not release it), and, when `walk` names a page, not before he has approved that walk. The item's `since` is the latest of the recording, when the windows were last changed or shown again and his Approves, so it calls even if he viewed the Job since the recording. A recording held at the time says so in the receipt's `held`. Recording again without `walk` clears it. Nothing blocks the agent's tools meanwhile. A task's state and a group's `worked_at` carry over by id.

`agent_access` is `Yes`: the Session is the one with a plan to record. A Job's Drone has no such door.
"""
