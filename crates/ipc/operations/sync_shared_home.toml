[operations.sync_shared_home]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Make the shared home where it does not exist, bring this machine's copy up to date, and read it"
notes = """
`POST /shared_home/sync`, body `HomeProfile` `{ login }`, answered with `SharedHomeRead` as `get_shared_home` answers it. The home is the private repository `armada-home` under the profile's own login, and the forge is asked as that login, never as whichever account is active. Where the forge on this machine does not hold the login, a 422 `fleet.home_login_not_held` names it and how to add it, and the sign-in's home step stays waiting. Where it does not exist it is made, private; where this machine has no copy it is cloned into the machine directory, one folder a login; otherwise the copy is pulled. **Nothing is settled by a sync**: a row that differs still differs.

Refused with a 422 `fleet.home_refused` where no account is signed in to the forge here or the forge refused, and a 500 `fleet.home_unreachable` where the forge or the remote did not answer. `agent_access` is `No`, `get_shared_home`'s reason.
"""
