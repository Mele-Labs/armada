[operations.sync_shared_home]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Make the shared home where it does not exist, bring this machine's copy up to date, add this machine's new rows, and read it"
notes = """
`POST /shared_home/sync`, body `HomeProfile` `{ login }`, answered with `HomeSynced`: `SharedHomeRead` as `get_shared_home` answers it, flattened, and `left`, each row only on this machine that Sync did not add, `{ kind, name, repository?, why }`, `why` a sentence naming the row. The home is the private repository `armada-home` under the profile's own login, and the forge is asked as that login, never as whichever account is active. Where the forge on this machine does not hold the login, a 422 `fleet.home_login_not_held` names it and how to add it, and the sign-in's home step stays waiting. Where it does not exist it is made, private; where this machine has no copy it is cloned into the machine directory, one folder a login; otherwise the copy is pulled. Then every row only on this machine, of each kind switched on in What syncs, is written into the copy as `add_to_shared_home` writes one, and all of them go in one commit and one push; nothing is pushed where none was written. A row is left here, in `left`, where its text carries a credential (naming the host, never the value), where it is a mod that is not valid here, or where the home cannot take it; the others still go. **Nothing is settled by a sync**: a row that differs still differs, and a row only in the home stays there until it is brought.

Refused with a 422 `fleet.home_refused` where no account is signed in to the forge here or the forge refused, and a 500 `fleet.home_unreachable` where the forge or the remote did not answer. `agent_access` is `No`, `get_shared_home`'s reason.
"""
