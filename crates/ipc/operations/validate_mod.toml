[operations.validate_mod]
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "Check one mod's files and answer with every problem found, and the stylesheet or layout if there are none"
notes = """
`GET /mods/validate?name=`, answered with `ModChecked`: `valid`, `problems` (empty exactly when valid) and, only when it passed, `css`, the stylesheet as it was checked (a tweak's `tweak.css` too, which Bridge layers over the chosen theme), or for a layout mod `layout`, the `layout.json` as it was checked (never both). A valid Words mod answers `words`, its `words.toml` as typed data (`name`, `pattern`, `example`, and `address` as a list of `{repository, template, found}`), and a valid Fleet mod `fleet`, its `fleet.toml` (`rule` as a list of `{notice, does, where}`). A mod answers only what its kind has. Bridge applies that text and no other, so what loads is what passed, with no window between a check and a read. Every problem is returned, not the first.

`mod.toml` must be a flat file of `key = "value"` lines with `name` (the folder's name), `kind` (`theme`, `layout`, `words`, `fleet`, `tweak` or `tracker`), `version` and optionally `description`, `taught_on` (up to 120 characters) and `entry`; any other key is a problem. `theme.css` must be a regular file of at most 32 KiB holding only `:root { }` and `[data-theme] { }` blocks whose declarations are `--token: value;` with `--token` one of the design tokens in `packages/tokens/tokens.json` as compiled into this build. A value may not contain `url(`, `image-set(`, `@`, a backslash, `<`, `>`, `{`, `}`, `!` or a script. An `@import`, an at-rule of any kind, a selector, a property that is not a token and a block left open are each a problem with a line number.

A `layout.json` is read in place of `theme.css` for a mod whose kind is `layout`. It must be a regular file of at most 4 KiB, a JSON object with `version` 1, whose keys other than `version` are regions: a region this build does not have is ignored, and one it has must be an object of `order` and `hidden` (lists of up to 32 ids) and `first` (an id), each id a slug of at most 40 characters. An id this build does not have is ignored too, so a layout written before a panel was removed stays valid. `ipc::layout` is the one reader, and `parseLayout` in `packages/shell/src/layout.tsx` applies the same rules to the text it is handed.

A `words.toml` (at most 16 KiB) or a `fleet.toml` (at most 8 KiB) is read in place of the stylesheet for those kinds, as `docs/concepts/mods.md` describes: a Words pattern is held to what Bridge and Fleet both read and matches its example whole, its addresses are web addresses with `{match}` outside the host, and a Fleet rule names a notice Fleet sends. Neither has stylesheet or layout text to hand back; each hands back its file as `words` or `fleet`. A tweak's `tweak.css` is checked as a theme's is and its problems name `tweak.css`.

A `tracker.toml` is read in place of `theme.css` for a mod whose kind is `tracker`: at most 32 KiB, TOML with `[guide]`, `[search]` and `[read]`, an optional `[credential]` and `[list]`, and nothing else. Each call section names a `transport` this build has (`cli` or `http`), only the keys that transport takes, a `map`, and only the placeholders it can fill. Nothing is run: passing here is not passing a try, see `try_tracker_mod`. No text is returned for a tracker, since Bridge applies none. `docs/concepts/mods.md`, *Tracker mods*.

**A mod that cannot be read at all is `valid: false` with the reason, not an error.** A name that is not a slug is a 422 `fleet.unacceptable_mod`, a slug naming no folder a 404 `fleet.no_such_mod`.

`agent_access` is `Yes`: a job checks its own work with this before it says it is done.
"""
