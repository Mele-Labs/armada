[operations.delete_workflow_copy]
kind = "command"
transport = "HTTP"
agent_access = "Bridge only"
description = "Delete the file of a repository's or Kit's copy of a workflow; Armada's own is refused"
notes = """
`POST /workflows/delete`, since 27 Oct 2026, with `?manifest_id=`. The body is `WorkflowCopy`: `workflow_id` and `source` (`repository` or `kit`). The answer is a `WorkflowCopyDeleted`: the id, the place, the file deleted and `runs_from`, the place whose definition of that id runs now, absent where none does.

**Every file in that place that defines the id is deleted**, found by the id it declares and not by its name, as `save_workflow` finds the one it replaces. Fleet reads the three places again before answering, so `list_workflows` shows what runs now. Jobs already started keep the workflow frozen onto them.

422 `fleet.workflow_is_armadas` where `source` is `armada`: Armada's definitions are carried in the binary and are not deleted. 422 `fleet.no_such_workflow_definition` where that place holds no definition of the id; a definition that was left out is on `list_left_out_workflows` and is not here. 500 `fleet.workflow_unwritable` where a file cannot be deleted.

`agent_access` is `Bridge only`, `remove_trigger`'s reason: it is the person's press, and it cannot be undone.
"""
