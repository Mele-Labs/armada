[operations.get_fleet_build]
kind = "query"
transport = "HTTP"
agent_access = "Bridge only"
description = "Which build Fleet runs on, the commit it was built from, where that stands against origin/main, and the restart under way or the one that failed"
notes = """
`GET /fleet/build`, answered `FleetBuildReport`. Fleet-wide, `get_capacity`'s reason: the build is a fact about Fleet and no Job's.

**`on` is read off `Armada/restart-source`**, which `scripts/restart --from` writes and a plain restart removes: a path ending in `.armada/preview` is `preview`, no file is `main`. A record naming any other tree is not a build this panel offers, and is a 409 `fleet.build_not_offered`, as is a Fleet serving no checkout that holds `scripts/restart-build`.

**`commit` is `Armada/restart-commit`**, written by `scripts/restart` once the new Fleet speaks the protocol its tree hashes to. Absent for a Fleet nothing restarted.

**`position` counts `origin/main...commit`**: `ahead` is what the build holds that origin/main lacks, `behind` what origin/main holds that the build lacks. Fleet fetches `origin main` at most every ten minutes, in the background, so a read never waits on the network and the counts are as fresh as the last fetch. Absent where it cannot be counted.

**`restarting` and `failed` come from `Armada/restart-build.status`**, the file `scripts/restart-build` keeps, because the Fleet that started a restart is not the Fleet that reads it back. **`stage` is the status file's third line**, the heading `scripts/restart-build` last read off the output of the scripts it runs: `merging`, `fetching_main`, `building_fleet`, `building_bridge`, `restarting_fleet`, `reopening_bridge` or `retrying`. Absent while `restarting` is absent, and absent from a status file without one or with a word this Fleet does not know. A status `running` older than twenty minutes is a wrapper that died and is ignored. `failed` is one line of plain facts and is dropped once the recorded commit is no longer the one it failed on.

**`left_out` is the branches `scripts/preview` left out of the running build, and why**, read off `Armada/preview-left-out` when its first line names `commit`. Sorted by branch; omitted on `main`, with no file, and where the file was written for another build.

**`running` and `previous` are read off the kept builds**, `Armada/builds/current` and `Armada/builds/previous` and the `build.toml` each holds. `running` is `{built_at, commit}`, absent where no build is kept. `previous` adds `bridge_reopens` (the two `bridge` hashes differ, or either is missing), `takes_out` (the Jobs whose branch is a `[[job]]` row of current and not of previous) and `brings_back` (the reverse). Each Job is named by the title of the live Job that holds the branch, or by the branch where none does. `previous` is absent where no previous build is kept and where launchd does not run Fleet from `builds/current`, the check `revert_fleet_build` makes.

**`carried` is the titles of the hosted Jobs with a turn under way**, sorted: the Jobs a restart's keepers carry. A live process between turns, or an agent still working after the turn ended, is not counted. **`reverting` is `Armada/revert.status` reading `running`** for less than two minutes. A `failed` status puts its line in `failed` where the restart has none of its own. Each of the four is left out when empty or false.

**`picked`, `snapshot`, `trying` and `swapping` are the snapshot's four.** `picked` is `Armada/preview-picked`, a branch to a line, each with the title of the live Job holding it; until the person picks it is the running build's own `[[job]]` rows. `snapshot` is `{state, stage?, built_at?, commit?, jobs?, bridge_reopens?, failed?}`: `building` while `Armada/snapshot.status` reads `running` for under 20 minutes (with `stage` off its third line), `failed` where it reads `failed` (with `failed` its last line), `ready` where `Armada/snapshot` names a kept build Swap could move onto (with `built_at`, `commit`, `jobs` and `bridge_reopens` from that build against the running one), and absent otherwise. `trying` is the titles of the running build's Jobs until Keep is pressed on it. `swapping` is `Armada/swap.status` reading `running` for under two minutes, and a failed swap's line fills `failed` where there is none of the restart's. Each is left out when empty or false.

No event. A build changes when a Fleet restarts, and Bridge reads this again on every connection and on a minute's interval.
"""
