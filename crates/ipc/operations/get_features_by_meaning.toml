[operations.get_features_by_meaning]
kind = "query"
transport = "HTTP"
agent_access = "Bridge only"
description = "Read which features of a project some typed words are about, by meaning, so a feature is found by what it does and not by its name. Give project and words"
notes = """
`GET /features/match?project=&words=`, answered with `FeaturesByMeaning`: `project` and `slugs`, the slugs of the project's features that are not pending, the nearest first, at most 8, each at or above the similarity floor of 0.70.

**It reads each feature as `title: summary` and, where it has a written `runs` section, as its title and that section's first paragraph, each against the words and the nearer counts with Fleet's local language model**, the vector of each text kept so a feature is embedded once. The model embeds on a thread of its own.

**It never refuses for want of the model.** Where the model is not loaded yet, or the words are blank, or the model could not read, the answer is an empty `slugs`. Bridge's own word match stands without it.

Bridge asks it once the person's typing in a sentence's feature blank has rested, and adds the features it names after the ones the words matched.

`project` is optional as it is for `list_features`: a call that places none and names none is refused 422 `fleet.feature_project`.
"""
