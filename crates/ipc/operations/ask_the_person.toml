[operations.ask_the_person]
kind = "command"
transport = "HTTP"
agent_access = "Helm only"
description = "Put one call a Helm session's own settings do not cover to the person, and hold it open until they answer"
notes = """
**The only tool on this door a model never sees.** It is what `--permission-prompt-tool` names, so the CLI calls it and the session is not offered it — spike 15 measured that the `init` line lists none of a permission server's tools. `agent_access` is `Helm only` because a Drone's permission path is `crates/ipc/src/mcp` and is a different seam, and no other agent at this door has a person attached to ask.

**Its arguments are the harness's, not this file's.** `tool_name`, `input` and `tool_use_id` arrive at the top level; `ipc::door::ASKS_A_PERSON` is the one name both the schema and the body-filling are keyed on. The answer is the harness's vocabulary too — `{"behavior":"allow","updatedInput":…}` or `{"behavior":"deny","message":…}` — and Fleet never rewrites `input`, because the CLI runs what comes back.

**The call is held open while a person answers**, which is the whole point and is why this row has no sibling that polls. The bound is Fleet's and is on the answer: `helm_ask_hold` in `settings.toml`. Silence answers `deny`, never `allow`. Spike 19 measured a 120-second hold surviving; the door a Helm session holds is stdio, so spike 15's stdio column applies and not its 60-second HTTP one.
"""
