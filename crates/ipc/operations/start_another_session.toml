[operations.start_another_session]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Start a new job in any repository with a first message, which waits on its start card for the person to press Start. Nothing runs until he does. Fleet lists the start in your own Needs you itself and tells you when the job starts, so add no waiting_for item for it. Body: manifest_id, title, message, group to hand a group of your plan to it, and after to make it wait on a Job"
notes = """
`POST /sessions/start_another`, body `StartAnotherSession`: `manifest_id`, `title`, `message` and optionally `group`. Since 23.80. Answered with `SessionHeld`: the new job's id, its title and `fork` false.

**The job is created and listed at once, held on its start card, and nothing runs.** No process starts and no turn begins. The message is the agent's first message and the person's to send: Fleet keeps it as the held job's first turn, off its thread, and serves it as `hosted.start.message`, which Bridge puts in the job's message box. While held the job raises a waiting item `unsent:<session id>` with source `first_message` and an `act` of `message` on the job, labelled "First message". `begin_session` sends the box as he left it (`message`, his edit where he made one), starts the first turn and settles the item. `close_session` discards it.

**The caller waits on it too.** While the new job is live and held, the caller's own list carries a Fleet item, id `start:<new id>`, text `Press Start on "<title>"`, source `held_child`, an `act` of `message` on the new job, read off the new job on every read. Start or ending the new job takes it off. So the caller's agent adds no `waiting_for` item for the start: one whose `act` is `message` on a held job it started is left off its list. Start pressed while the proposer is still reading the brief is queued (`hosted.start.queued`): the job stays held and begins when the reading ends, with the landing the card then picks where the press named none. When it begins the caller is told once, with a `linked` row `started` in its thread and a message that wakes it.

**The caller is placed as `show_window` places it**, by the connection of a hosted job's process, and the call names no job. A call that places no hosted job is refused with 422 `fleet.agent_start_unplaced`. A blank `title` or `message` is refused with 422 `fleet.agent_start_empty`, and a `manifest_id` Fleet does not serve with the refusal `start_session` gives.

**Both ledgers record it.** The new job carries a `started_by` attachment naming the caller and the caller a `started_to` naming the new one, both `spent`. The caller's thread gets a `started` row, `{ session: { id, title }, fork: false }`, which Bridge draws as the press that opens it.

**With `group`, the new Job is a linked Job the caller follows.** `group` is the id of a group of the caller's recorded plan, in the caller's own repository. Fleet titles the Job with the group's title, whatever `title` says, and its held first message is the group's tasks word for word, the caller's handoff (title and id, slot, branches, open pull requests and the last rows of its thread) and `message` after them. Both ledgers keep the group as `detail.group` on the `started_by` and `started_to` rows, so Bridge draws the Job on the group in the Plan and under the caller in Work. **Fleet then tells the caller** when the linked Job ends or has a pull request merged: a message that wakes the caller if it is idle, and a `linked` row in its thread (`event` `done` or `merged`). A linked Job that needs the owner is not told to the caller; that call stays on the Job's own row. Every Job an agent starts is followed in that way, with or without a group. Refused 422 `fleet.group_unknown` where the caller's plan holds no such group, and 409 `fleet.group_handed` where the group has a Job already.

**With `after`, the new Job waits on another Job first.** `after` is `{"session": "<id>", "condition": ..., "base": "main" | "branch", "needs": "<what it needs of that Session>"}`; `condition` is `{"kind": "ends"}` (the default), `{"kind": "group_done", "group": "<id>"}`, `{"kind": "task_done", "task": "<id>"}`, `{"kind": "pr_pushed"}` or `{"kind": "pr_lands"}`. The Job is made and listed with a `waits` fact and **no first message yet**: `message` is its brief, kept. Fleet reads the condition from what it observes of the Job waited on, and when it is met **the Job is held with the handoff of that Job followed by `message` as its first message**, so nothing runs until he presses Start, as every start an agent makes. The Job waited on is told what `needs` says, and may change the condition with `change_waiting`; it need not be the caller. Refused as `start_session`'s `after` is, before anything is made.

`agent_access` is `Yes`: starting work in another repository is the agent's to propose, and holding the first message for the person is what keeps it his to start. `start_session` stays `No`, since that one starts a process.
"""
