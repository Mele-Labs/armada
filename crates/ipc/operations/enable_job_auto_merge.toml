[operations.enable_job_auto_merge]
kind = "command"
transport = "HTTP"
agent_access = "Helm only"
description = "A person presses Merge on a Job's pull request while its checks run, and the forge is asked to merge it when they pass"
notes = """
`POST /jobs/:job_id/auto_merge`, no body. Answers the `PullRequestState` the forge shows afterwards. **`merge_pull_request` for a pull request whose checks have not finished**: the press at the gate is Merge when they have passed and this when they are still running, and the Job stays at `awaiting_review` either way until the pull request has merged.

**The ask is recorded on the Job.** When Fleet's sweep next sees that pull request merged, it takes the work off the gate as `approve_review` does, with `fleet` as the actor on the record. A pull request merged on the forge by hand, or one this was never pressed for, is left for a person to take as before. Pressed twice, the second answers as it stands.

It does what `enable_auto_merge` does for a pull request that is nobody's Job, so the refusals are that route's: `fleet.merge_checks_not_passed` when one failed, a draft, a pull request that is not open, and `fleet.auto_merge_refused` with the forge's own words. Refused with a 409 on a Job that is not at `awaiting_review` and where its record holds no pull request. A write to the forge, so Helm asks first (`writes off machine`).
"""
