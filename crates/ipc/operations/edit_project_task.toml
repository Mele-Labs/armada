[operations.edit_project_task]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Change a task's title and notes"
notes = """
`POST /projects/:repository/:project/rows/:row/edit`, body `ProjectTask`: `title` and `notes`, whole and trimmed. Its state and place are kept. `docs/practices/protocol/projects.md`. Answers `Projects` as `list_projects` does, and publishes it as `projects.changed`.

A 422 `fleet.project_blank` for a blank title, a 422 `fleet.project_row_not_a_task` for an issue row, whose title is its tracker's. A 404 `fleet.no_such_project` for a `project` the repository has none of, a 404 `fleet.no_such_project_row` for a `row` the project has none of, and a 422 for a repository Fleet does not serve.
"""
