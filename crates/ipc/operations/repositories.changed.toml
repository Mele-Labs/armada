[operations."repositories.changed"]
kind = "event"
transport = "WebSocket"
agent_access = "Bridge only"
description = "The repositories Fleet serves changed, and this is the list now"
notes = """
Published when a repository is added by folder, when a clone lands and is added, when a repository served without a Manifest gains one, and when a repository's workflows are read again, so a workflow saved to the Kit or the repository reaches Bridge's pickers, which read `list_workflows` again on it. It carries `RepositoryList` itself, the answer to `list_repositories`, for `manifest.reread`'s reason: the route and the event are the same fact, and a client replaces its list rather than folding a delta.

Names no Job, no Drone and no step. No actor and no `at`: the add that caused it answered its own caller, and every other Bridge only needs the list.

A resync does not carry it. A client that reconnects asks `list_repositories` again, as it did before this existed.
"""
