[operations.get_shown_file]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "A file a job showed with show_file, read for the phone: its text, or a picture's bytes"
notes = """
`GET /sessions/shown?session_id=&path=`, `path` the absolute path the job's `show_file` kept, as its attachment's `target` holds it. Pocket v2: the phone cannot read the Mac's disk, as Bridge's panel does (`apps/desktop/src/main/file-panel.ts`), so Fleet reads it.

**Only a file the job showed**: an attachment of kind `artifact`, `form` `file`, carrying `shown`. Any other path, a job Fleet does not know, or a file gone since it was shown is a 404, `fleet.shown_file_not_shown` or `fleet.shown_file_gone`. A file the job wrote and never showed is refused like any other path.

**Answered by what the file is.** A picture (`png`, `jpg`, `jpeg`, `gif`, `webp`, `heic`) is its bytes under its media type. Anything else that is UTF-8 is `ShownText` `{ path, text }`. Over 1 MiB is a 413, `fleet.shown_file_too_large`, naming the size; bytes that are neither are a 422, `fleet.shown_file_not_text`.

Sketches are not read here: the job's record carries each scene on its attachment. The phone calls it through the Phone Gateway, which forwards it with `x-armada-caller: phone`.
"""
