[operations.start_session_run]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Run a shell block from a Session's thread, in the Session's slot worktree or directory"
notes = """
`POST /sessions/run/start`, body `StartSessionRun`: `session_id` and `command`. Answered 202 with `SessionRunUnderway`: `run_id`. The output is on `observe_session_run`.

`command` runs as `$SHELL -lc <command>` (`/bin/zsh` where `SHELL` is unset or empty), in its own process group, in the worktree of the slot the Session holds, or in the Session's directory where it holds none. Output and errors are one stream, read as lines. A Session that has ended, or that Fleet has no row for, is refused with 422 and nothing runs.

**Nothing is written down.** The output is held in memory for the run and a short tail after it, and a run is forgotten a minute or two after it exits.

`agent_access` is `No`: running a block is the person's own act.
"""
