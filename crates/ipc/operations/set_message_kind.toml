[operations.set_message_kind]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "The owner changes how one of his messages was sorted, and the ask it joins"
notes = """
`POST /sessions/message_kind/set`, body `SetMessageKind` `{ session_id, row_id, kind, ask_kind?, ask_id? }`. Answers the `MessageSorting` as kept, `sorted_by` `owner`. Since 16 Nov 2026.

**The change is kept as a correction**, and the newest few ride in the sorting prompt as examples. A message Fleet has not sorted can be set too: it is kept as his.

`kind` `new_ask` opens an ask from the message, or changes the kind of the one it opened: `ask_kind` is that kind, absent keeps the ask's own, else `change_request`. A message first sorted as anything else gets an ask titled from its first line, which `change_ask` renames. `kind` `revision` or `answer` joins the ask named by `ask_id`, which the Job holds, and `ask_id` is required. `kind` `question` makes it a question of `list_job_questions`, read against the Job's replies from then; a question set to any other kind loses its answer. `kind` `talk` takes the message off its ask, and an ask it opened is removed with its features and merges, its other words staying as talk.

404 `fleet.no_such_session` for no such Job, and `fleet.no_such_message` where the Job's thread holds no message of his with that `row_id`. 404 `fleet.no_such_ask` for an `ask_id` the Job does not hold. 422 `fleet.ask_needed` for a `revision` or `answer` with no `ask_id`. 409 `fleet.ask_has_words` where an ask the message opened has revisions or answers of its own and `kind` would remove it.

`agent_access` is `No`.
"""
