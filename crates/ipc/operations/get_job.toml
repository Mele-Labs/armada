[operations.get_job]
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "One Job in full, including Facts, shape, and each step's declared gates with what they did"
notes = """
A step carries both what it declares and what ran: `checks` is the workflow's declaration and `check_runs` is what the gate found. Empty `checks` is an ungated step and an absent `checks` is Fleet unable to say — the Job named a workflow this Fleet does not hold, or holds one that no longer declares the step. Those are different sentences and a client that saw a gap either way could not tell them apart.

The declaration is read from the workflow and never from the Job's frozen rows, which carry where a step got to and nothing about what gates it. Two sources for one fact is how a registry drifts.

All three of a step's gates are declared here before any of them acts. `judge_checks` is the semantic tier's declaration, standing to `judged` exactly as `checks` stands to `check_runs`, and `advance_gate` is what says whether the tiers decide at all. Reading only what had already happened is how a step gated `human_always` — where the Job halts and waits for a person, which six of seven shipped workflows now do — rendered as a step with no check on it.

A judge criterion's question does not cross, and neither does a gaming pattern's. What crosses is how many criteria are asked, how many judges answer each where that is more than one, and whether a second look at the evidence rides along. The mechanical tier's `run` crosses because a person reproduces a failure by running it; a criterion's question is a prompt, and there is nothing a rail does with one.

`footprint` is here rather than on a read of its own, which is the opposite of what the history and the patch decided. Both of those are unbounded and this is a path and a word per file, and Fleet asks the store for it only where a Job has one — which is only once it is over — so an open of a running Job costs exactly what it did before. It is what the worktree held at the terminal transition, written down then because `armada clean` gives worktrees back and a reading taken later is a guess about a directory that may not exist. It carries no drift mark: a declared plan belongs to the step that declared it, and this is the Job's whole work since the branch was cut.

`redirect_waiting` is the note a person wrote where no Drone was there to take it and none has opened with it yet, and it is the other half of `redirecting`: that one is an instruction with a session to go into, this one is an instruction with none. **Two acts write it** — `request_changes` at a human gate and `restart_step` on a step that stopped — and it reads the same from here either way, because what a person has done in both is say something to a Drone that does not exist yet. It carries the words rather than a flag, because a Job holding one sits at `queued` looking exactly like a Job nobody typed into, and "some note is waiting" would leave a person who wrote two of them no better off. It is not a new exposure — both writers refuse a second note by quoting the held one back. Present is waiting and absent is both never-written and already-delivered, because the record clears it the instant the next Drone's brief is built from it; there is no delivered flag and no instant, so no surface drawn from this can keep a badge for a note that has gone.

`write_scope_overlaps` names the other unfinished Jobs claiming paths this one claims, with each shared path and the status of the Job on the other side. **A fact and never a verdict** — `docs/concepts/fleet.md` holds "surfaced, never serialised", nothing about it refuses a dispatch, and no surface may read it as one. It compares two declarations: a Job that writes where it never said is not in it and cannot be. Absent is not empty. Absent is a Job that has claimed nothing, so no comparison was made — which is every Job at its approval gate, because this file's `propose_from_request` says the proposer does not fill `write_targets` in; empty is a comparison that ran and found nobody.

`deliverables` names the copies of a step's deliverable Fleet kept, one row per run of the step, beside `check_runs[].output_path` and `judged[].brief_path`. **Three records and a person reads each because a verdict went against them** — what the Judge read, what the Checks printed, what the Judge was asked — and one without the others cannot separate a bad Judge from a bad brief. All three cross as paths relative to the repository root, and none of them carries bytes.

**A path, and Bridge opens it. The assumption is that Bridge and Fleet share a machine**, which is true today and is a thing `Reach` will change. Serving the bytes instead is a larger operation with its own size bound and its own `agent_access`, and it would have to answer what a 16 KiB deliverable, an unbounded Check log and a brief carrying a whole branch diff each cost over a link. That is not settled here; it is named here so whoever revisits it finds the reasoning rather than rediscovering it. What changes when it does: these three fields become the id half of a fetch rather than a path, and every reachability question below is re-asked.

**Reachability is keyed on the row, deliberately, and retention is `#69`'s.** A brief and a kept deliverable outlive `armada clean`, which forgets the Job's rows and does not touch the repository root — so after a clean the files are there and no row names them. That is the right way round and it is not a gap this fills: a cleaned Job has no screen either, so nothing is named-but-unreachable. What a person keeps is a directory they can still open by hand.

**Every path here was checked before it was answered.** `output_path` and `brief_path` are absent where nothing was written, and `deliverables` names only files that were on disk when the answer was built — nothing on the far side of this seam reads a filesystem, so this is the only side that can tell. It can still be gone by the time somebody clicks it, and Bridge says so rather than doing nothing.

`stuck` is why the Job stopped and what moves it, and it is Fleet's to decide rather than a client's to derive. The trigger it carries is the registry's own spelling and nothing new is minted on top of it; what is added is `recourse`, the acts Fleet will take on this Job now, each spelled as the key of the operation that performs it. Deriving that from `status`, `current_step_id` and `assigned_drone` gets four of the five refusals right and cannot get the fifth — whether the worktree survived is a `path.is_dir()`, and a client that reads no filesystem offered a restart on a Job that had none. `worktree_on_disk` is that fact, beside the acts rather than only inside them, so a surface can say why an act is missing. Absent is a Job that has not stopped; empty `recourse` is a dead end, and the two are different sentences.

`drone_unheard` is the second such fact and it exists because a sentence went stale under the acts. A Drone that outlived the Fleet holding its pipes is put back on its Job alive and unreadable; nothing on the wire said so, so a client offering the restart described it as taking over from a Drone that had gone, on the one Job where the Drone is right there. It is a condition and never a cause — what a client may say is that this agent cannot be reached, not that it was adopted — and `false` includes every ordinary stopped Job, where the Drone really has gone. The trigger does not answer this: a Job in exactly this state reads `gate_failure` where its step stopped first, and the restart means something different in the two cases while doing the right thing in both.
"""
