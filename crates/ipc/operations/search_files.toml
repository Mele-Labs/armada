[operations.search_files]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "Paths under the checkout narrowed against typed text, for the @ mention popup"
notes = """
The read behind Bridge's `@` mention — a person typing a request or a brief narrows this as they type, and picking a result inserts the path rather than making them recall or paste it by hand. `?manifest_id=` names the checkout, the one Fleet was started in where absent: a request is written before any Job, and therefore any worktree, exists to read one from instead.

It reads the checkout at rest, not a Job's worktree — crates/fleet/src/files.rs walks host().repo_root. Capped and not exhaustive, and the walk stops as soon as it has enough rather than reading the whole tree first and cutting the list after. .git, node_modules and target are excluded by name; nothing here is .gitignore-aware, and that is a real gap rather than a decision — the bound and the ignore rules both need a repository sized in the design workspace before either is settled properly, and this ships the excludes that make an uninformed walk usable in the meantime.

Matching is a case-insensitive substring test against the relative path, not a fuzzy or ranked search — the simplest thing that lets "compo" find components/. It never refuses: a directory it cannot read is skipped rather than failing the whole search, on get_capacity's own reasoning that a panel which 500s over one bad subtree is one a person stops opening.
"""
