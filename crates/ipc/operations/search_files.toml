[operations.search_files]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "Paths under the checkout narrowed against typed text, for the @ mention popup"
notes = """
The read behind Bridge's `@` mention — a person typing a request or a brief narrows this as they type, and picking a result inserts the path rather than making them recall or paste it by hand. `?manifest_id=` names the checkout, the one Fleet was started in where absent: a request is written before any Job, and therefore any worktree, exists to read one from instead.

It reads the checkout at rest, not a Job's worktree — crates/fleet/src/files.rs lists host().repo_root. The list is whatever `git ls-files --cached --others --exclude-standard` names, so .gitignore decides what is a candidate: each slot under .armada/ is a full copy of the repository and a .venv is thousands of files, and either one answered every query with copies of the same name when this walked the disk. A folder that is not a repository (a Session runs in any folder) is walked instead, skipping .git, .armada, node_modules and target and stopping after 20,000 files read. Reading the whole list on every keystroke is deliberate: git lists the armada repository's 6,335 paths in 30 ms, and ranking needs every candidate to see the best one.

Matching is a case-insensitive subsequence test against the relative path: the typed letters in order, so "sesscomp" finds SessionComposer.tsx. Results come back ranked, best first, and cut to 50 after ranking, because Bridge shows the rows in the order given. A match scores higher at a word start, in consecutive letters, in the file name, and most of all where the file name contains the query whole; a longer path scores slightly lower, and equal scores go to the shorter path, then alphabetical. It never refuses: a directory it cannot read is skipped rather than failing the whole search, on get_capacity's own reasoning that a panel which 500s over one bad subtree is one a person stops opening.
"""
