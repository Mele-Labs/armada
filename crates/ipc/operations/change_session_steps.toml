[operations.change_session_steps]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Add, move, reword or drop a step in your own copy of this job's workflow. Body: {session_id, change}. session_id is your job id. change is one of {kind: \"add\", label, after?, id?, about?, instructions?, ends_on?}, {kind: \"move\", step, after?}, {kind: \"reword\", step, label?, about?, instructions?} or {kind: \"drop\", step}. A step is named by its id, which get_job_copy lists. after names the step it goes after, and leaving it out puts it first. instructions is what you are told on entering the step, about is a line for the person, and ends_on lists what ends it: a word such as replied or walk_approved, or a lifecycle and its state such as \"job: landed\". It applies to this job only, at once, and the step is marked on its lanes. The step that delivers cannot be dropped. To skip a step use skip_session_step, and to follow another workflow use set_session_workflow"
notes = """
`POST /sessions/workflow/steps`, body `ChangeSessionSteps`: `session_id` and `change`, a `StepChange` tagged by `kind`: `add` (`label`, and optionally `after`, `id`, `about`, `instructions` and `ends_on`), `move` (`step`, and `after`), `reword` (`step`, and any of `label`, `about` and `instructions`) or `drop` (`step`). Since 30 Oct 2026. Answers the Job's `JobCopy`.

**The Job holds its own copy of its workflow from its first change.** Fleet takes the definition the Job follows as the repository holds it, makes the edit to that text, and checks the result as `save_workflow` checks one: the parse and the resolve a loader applies, and that every lifecycle a step ends on is one that applies to the repository. A copy that does not fit is refused with the loader's own sentence and the Job keeps what it had. Once it has a copy, a change to the workflow in the repository or in Kit reaches only the Jobs started after it.

**It applies at once, to this Job only.** The rail re-reads the steps, so `workflow_step`, `skipped_steps` and `workflow_waiting_on` are read against the copy, and `SessionRecord.workflow_copy` carries it for the rail and the lanes. A step skipped by its index is skipped by the step it was, so an added or moved step does not skip another. The step added, moved or reworded is marked on the Job's lanes (`JobLifecycles.changes`), and the timeline enters `session.copy` with `says` naming what changed (`step added: Dispatch after Approve plan`) and `detail` `by the Job` or `by you`. A Job that has run is told by Fleet only where the person made the change.

**The Job is the one whose process holds the connection** when Fleet hosts it, whatever `session_id` says; the person's request names it. 422 `fleet.job_copy_unplaced` where a call through the door places no Job, 422 `fleet.session_command_refused` for a Job that follows no workflow and for a terminal one, 422 `fleet.job_workflow_unfit` for an edit the loader refuses (`reason` carries its sentence), 422 `fleet.job_copy_step_refused` for a step that is not there, one already there, a blank label and the step that delivers, 422 `fleet.workflow_not_copyable` where Fleet holds no file for the workflow, 422 `fleet.session_workflows_off` while `features.workflows` is off, and 409 `fleet.session_closed` for a Job that ended.

`agent_access` is `Yes`: the agent is the one that knows the steps its work needs, and the change is its own Job's. Keeping it for every Job is `keep_job_workflow`, and it waits on the owner's Approve.
"""
