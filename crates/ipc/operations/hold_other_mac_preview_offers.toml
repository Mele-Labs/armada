[operations.hold_other_mac_preview_offers]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "The ready preview offers another Mac shares, handed in by this Mac's Phone Gateway, replacing all held from that Mac"
notes = """
`PUT /other_macs/preview_offers`, body `OtherMacPreviewOffers`: `mac` and `offers`, each a `PreviewOfferRow`. Answered with `MacNamed`. Each offer is kept by branch with `mac` set to the sender and a row that is not `ready` is left out. A change in what is held asks for a check of this Mac's offers and that Mac's together, and `preview_offers.changed` follows. 422 `fleet.other_mac_unnamed` for a blank `mac`. Called on the port from inside a Job, around the door, it is a 403 `api.the_persons_own`: only the person pairs his other Macs, from Bridge. This Mac's Phone Gateway calls it from inside Fleet's own process.
"""
