[operations.open_other_mac_page]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "A walk or dev server of a Job held from another Mac, opened on this Mac through the signed link: answers where it opens here"
notes = """
`POST /sessions/other_mac_page`, body `OpenOtherMacPage { session_id, url }`, `url` as the Job's row names it. Answers `OtherMacPageOpened { url }`, an address on this Mac's loopback whose path and query are the page's own: this Mac's Gateway holds one port for each Job and page port, and signs every request to it through to the Mac that holds the Job, which answers it as `share_job_page` allows. A page of a Job of this Mac, and a page not on the other Mac's loopback, is answered with `url` as it is. A Job no Mac holds is 404 `fleet.no_such_session`. **That Mac asleep is 409 `fleet.other_mac_asleep`**, "<name> is asleep. Its pages open when it wakes.", with `fields.since` in Unix seconds and `fields.mac`, so the row says so in place of a blank page. What that Mac refuses is passed on with its own code and sentence, so an unshared Job is 404 `fleet.no_such_session`; a link that cannot reach it is 500 `fleet.other_mac_unreachable`. Pages are read whole, and a dev server's live-reload socket does not cross.
"""
