[operations.restart_task]
kind = "command"
transport = "HTTP"
agent_access = "Helm only"
description = "Restart this task: a fresh Drone on one failed task of the plan, or one done task in a group the Judge refused, with an optional note it reads first. Refused with `fleet.task_not_failed` on any other task"
notes = """
`POST /jobs/:job_id/tasks/:task_id/restart`, spike 022 slice 2 (`#1656`). The body is `RestartTask`, an optional `note`; **no body is valid**, and is the plain restart, `restart_step`'s rule. A blank note is refused as `restart_step` refuses one. Answers the Job's `JobSummary`.

**A failed task**, which is a task whose group's Checks were still red when the step's retries ran out (answer 9). A task working or handed in is its group's own round to finish, so this is a 409 `fleet.task_not_failed` before the retries run out, as it is on a task open, done or dropped.

**Or a done task in a group the Judge refused**, the owner's decision of 2 Oct 2026: the group's last run ended `gate_failure` over tasks still `done`, with the step that run was filed under `stopped`, which only a Judge refusal after green Checks leaves. **A group the Judge only questioned is refused**, the owner's decision of the same day: the question writes `gate_failure` too, but holds the step at `awaiting_human` until a person answers, and a refusal from him stops it as a refusal does. The Drone the refusal left idle is ended rather than redirected, so the press is one new agent on that task, and it opens with the refusal as any restarted step does. A suspect or undecided gate writes a trigger of its own and is still refused.

**The task reopens, then `restart_step`'s own act runs**, so every refusal that act has is this one's too, and a refusal puts the task back to failed as it was. The Drone spawned is put on that task alone; the group's gate waits for it to hand in again and then runs over the whole group. A person's restart does not reset the group's retry budget, as `restart_step` does not reset a step's.

`agent_access` is `Helm only`, `restart_step`'s own reason.
"""
