[operations.get_repository_flight_controls]
kind = "query"
transport = "HTTP"
agent_access = "Bridge only"
description = "The Cockpit's own actions a person kept for one repository, read from where that repository's Armada configuration is kept"
notes = """
Since 19 Oct 2026. `GET /repositories/flight_controls?repository=&session_id=`: `repository` a root `list_repositories` names, `session_id` an open Job in it, optional and read only by the place `repository`. `RepositoryFlightControls`: `repository`, `place` (`RunPlace`, the place chosen for the repository's remembered runs, which says where this was read) and `read`, a `FlightControlsRead` tagged by `what` as `get_flight_controls` answers.

Read on each call from the place, never cached: `this_mac` is `~/.armada/flight-controls/<key>.toml`, `synced` the same layout under the synced folder, and `cloud` with a bucket the object `<prefix>/flight-controls/<key>.toml`. `<key>` is the repository's remote as `owner--name`, or its path where it has none, as the runs are keyed. **An absent file is `read` with both lists empty.** A file that will not read, a synced folder that is not there or a bucket that does not answer is `not_read` with why, never the empty lists. `repository` is `.armada/flight-controls.toml` in the repository: read from the tree of the Job `session_id` names where it is in this repository and holds a slot, and from the repository's checkout at its root otherwise. `cloud` with Armada's store is not built yet, and answers `not_read` saying so.

**Every tile in a repository's file carries a `kind`**: it holds a person's own actions only. Reordering and hiding Armada's built-in tiles stays machine-wide in `get_flight_controls`. A tile with none is `not_read`, naming the field. A 404 `fleet.run_memory_repository_not_served` for a repository Fleet does not serve.

`agent_access` is `Bridge only`, `get_flight_controls`' reason.
"""
