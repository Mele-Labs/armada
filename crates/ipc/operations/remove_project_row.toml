[operations.remove_project_row]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Take a task or a linked issue out of a project"
notes = """
`POST /projects/rows/:row/remove`, no body. A linked issue is untouched on the tracker. The rows after it move up one. `docs/practices/protocol/projects.md`. Answers `Projects` as `list_projects` does, and publishes it as `projects.changed`.

A a 404 `fleet.no_such_project_row` for a `row` there is none of.
"""
