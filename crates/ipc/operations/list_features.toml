[operations.list_features]
ask_tool = "features"
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "List a project's feature areas and the features in each, with the Jobs working on each now and the oldest merge a written section is stale since. Give project, or leave it out for the project this job works in"
notes = """
`GET /features?project=`, answered with `FeatureLibrary`: `project` and `areas`, each `FeatureAreaRow` holding its `features` in order. A `FeatureRow` is `id`, `slug`, `area`, `title`, a one-line `summary`, `state` (`seeded`, `confirmed` or `pending`, a feature a Job named that waits on his word, listed in the area `pending`), `jobs_now`, `stale_since`, `health`, `retire` and `planned`. `retire` is the librarian's proposal to retire it, `why` (`code_gone` or `unused`) and one line of `evidence`, absent where none stands or the owner kept it on that evidence; answer it with `answer_retire`. `planned` is set where its paths match no file at HEAD and never did, and clears at its first file.

**`project` is optional.** Left out, Fleet reads the project the calling Job was started for, or the projects that hold its repository. A call that places none and names none is refused with 422.

**`jobs_now` is the live Jobs that wrote a file of the feature since they started**, seen from the write gate and the pull requests Fleet attached, never from what a Job said.

**`health` is `mark` (`good`, `watch` or `poor`) and `reasons`**, each a `kind`, a short `fact` and a `target` where there is something to open. It is read from what Fleet keeps: flaky tests that reach the feature, stale sections, open bugs, no test reaching its files, and the last run of each Check in the Jobs working in it. A source Fleet holds nothing for adds no reason. `good` has no reasons.

**`stale_since` is a pull request's number**: the oldest merge after a written section's commit that changed a file of the feature, over its sections. Absent where nothing is stale.

**`librarian` is where the project's librarian stands**, `LibrarianState`: `last_run`, `read_through`, `merged_since`, `steps` (the steps a run would take now, each `id`, `title`, a one-line `detail` and `model` where it spends a model call) and `running`. `running` is the run going now, kept in Fleet's memory as it moves: its `run` and each step it has reached so far as `step`, `state` and `said`, the latest `librarian.step` told of it. Absent where no run is going, so a Bridge that reads mid-run redraws the steps and Stop. See `run_librarian`.

The library lives on this Mac. Sharing it with teammates is not built.

`agent_access` is `Yes`: a Job reads what exists before it files its work.
"""
