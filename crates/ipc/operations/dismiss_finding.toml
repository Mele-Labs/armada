[operations.dismiss_finding]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Dismiss an adversarial review's finding, telling the Job's agent nothing"
notes = """
`POST /adversarial_review/dismiss`, body `DismissFinding`: `subject` and `finding_id`. Since 25 Oct 2026. Answers the `AdversarialReview` with the finding settled `{how: "dismissed", at}`, and `SessionChanged` is published. **The agent is told nothing.** A finding already settled is answered as it stands.

The same 404 `fleet.review_subject_unknown`, 409 `fleet.review_subject_stale` and 404 `fleet.finding_unknown` as `send_finding`.
"""
