[operations.press_page_action]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "His press of a button, one of a buttons part of a Job's artifact or a page's <armada-action>: the Job is sent it as a message, a Job starts at once, one of the Job's asks is answered, or the issues it lists are closed"
notes = """
`POST /sessions/artifacts/press`, body `PressPageAction`: `session_id`, `artifact` (the page's path, its `JobArtifact` id), `revision` (the kept revision he pressed it on), `action` (the action's `id`) and `words?`. Answered with `PagePress` `{ revision, action, item?, act, at, did }`, and `SessionChanged` is published on the page's Job.

**The markup.** `<armada-action id="..." act="message|start|answer|close" label="Investigate" item="row-7">`, anywhere on the page, a `<tr>` too. `start` also takes `brief` and `repository` (a Manifest id, the Job's own where absent). `answer` takes `ask` (the ask's waiting id) and `option` (one of its options' labels). `close` takes `issues` (the references it closes, separated by spaces) and `repository` as `start` does. **Read off the kept revision `revision`, never off a call** or the file as it is now. The first action with the id is the one pressed. Each action carries the text of the `<tr>`, else the `<li>`, it sits in, cut to 300 characters.

**The list of acts is Fleet's**: `message`, `start`, `answer` and `close`. Anything that lands, merges, deletes or stops is a `message` button whose label says what the Job will do. When a page is kept, each action with no id, an id an earlier action holds, an act off the list, or a `close` that lists no issues or whose repository's tracker cannot close one is named to the Job in the `document_sketch` notice, `In the page <path>, action "<label>" will not run: <why>.`, and the page is never refused.

**What a press does**, `did` tagged by `kind`:
- `message`: the Job is sent, as his message, `He pressed "<label>" on <item> in "<title>".`, the row's text on the next line, and his words after. `{ kind: "sent" }`.
- `start`: a Job starts at once, as his own start from the dispatch sheet: unheld, past the Operator, its request and first message the action's `brief`, then `From "<title>", <item>: <row text>`, then his words, each a paragraph. In the Job's repository it takes the Job's project. The page's Job is then sent `He started Job <first 8 of its id> from "<label>" on <item>.` `{ kind: "started", job }`.
- `answer`: the ask is answered with the option, and his words as the answer's words, exactly as `answer_waiting` answers his pick. `{ kind: "answered", item }`, the ask's id.
- `close`: his press, and nothing else, closes each listed issue in the repository's tracker (`TrackerWrites::write` with `IssueWrite::Close`, the word for closed resolved as a saved rule's close resolves it). The page's Job is then sent `He pressed "<label>" in "<title>". Closed <issues>.`, then `<issue> was not closed: <why>.` for each the tracker refused. `{ kind: "closed", issues }`, those closed.

**Each press is kept** in Fleet's store, `page_presses`, and `get_job_artifacts` serves them on the page as `presses`, oldest first. A press that is refused keeps nothing.

Refused with 422: `fleet.page_action_unknown` for a revision not kept, an artifact that is not a page, or an action id the revision does not hold, naming at most 20 it does; `fleet.page_act_refused` for an act off the list, "a page runs start, answer, message and close only. Anything that lands, merges, deletes or stops goes to the Job as a message"; `fleet.page_ask_not_open` for an ask the Job no longer waits on, or an option not one of its options, naming them; `fleet.page_close_refused` for a close that lists no issues, names a repository Fleet does not serve, or whose tracker cannot close; `fleet.page_archived` for a page archived; `fleet.artifact_not_held` and `fleet.session_unnamed` as `archive_artifact` refuses them. A start or an answer refused by its own route answers that refusal.

**A buttons part is pressed as a page's action is.** `artifact` may be an artifact of parts, `sketch:<title>`, with the action's id as `action` and the part's `revision` as `revision`; a button acts at once and settles nothing. A buttons part takes no `close`. A revision that is not the part's now is a 409, `fleet.part_redrawn`.

`agent_access` is `No`: it is his press.
"""
