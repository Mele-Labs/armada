[operations.get_events_since]
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "A count plus one line per event kind since the cursor, not the events themselves"
notes = """
An agent's substitute for the event stream, called at the start of each turn; Bridge does not use it, having the socket. It fetches detail through the other queries only where it bears on what was asked — the query is cheap, the tokens are not, and every returned event stays in the job for its remainder. Fleet waking the job was rejected: it would make the job a second notification channel alongside Alerts.
"""
