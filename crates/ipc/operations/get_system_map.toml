[operations.get_system_map]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "One level of a project's system map: what it is made of and how the parts reach each other"
notes = """
`GET /projects/project/:project/system?part=&feature=&lit=`. Answers `SystemMap { project, part?, feature?, parts, links, features, stops, librarian_at?, lit? }`. **Read from the project's own files with no model**: build manifests and workspaces, compose services, Kit runs, CI commands and the code's own routes. Held per repository `HEAD`, so a read after the first costs nothing until a commit lands. `docs/practices/protocol/projects.md`, *The system map*.

No query is level one: the people, the entry points, the services behind them, the stores and what the project reaches outside. `part` is level two: that part's pieces (`kind` `piece`, `within` the part), the pieces of other parts they call (`within` that part), the stores they reach, and the links between them, `label` the route or operation the code names. `feature` is level three: the feature's files grouped by the part they fall in as `stops`, numbered from 1 in level one's order (entry, service, store), with links stepped 1 to n. `lit=<slug>` is the whole of level one with `lit` `{ slug, title, owned, called, links }`: `owned` the parts the feature owns files in, as level three's stops; `called` the parts its own files call directly, one hop, that it owns no file in; `links` the level-one links its files make. `feature` wins over `part`, `part` over `lit`. A part the librarian added and he has not kept answers `origin` `librarian` until he keeps it.

404 `fleet.no_such_project` for a project he has none of. 404 `fleet.system_part_unknown` and `fleet.feature_unknown` for a part or feature it holds none of. 422 `fleet.project_unreadable` where its file did not read.
"""
