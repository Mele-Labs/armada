[operations.add_task]
kind = "command"
transport = "HTTP"
agent_access = "Helm only"
description = "A person adds a task to the Job's plan, and answers with the plan it leaves"
notes = """
`#897`. `title`, an optional `detail` and `after` — the id it comes after, or `""` for the end — the same three fields the Drone-facing `add_task` MCP tool takes, so a person's add and a Drone's are one shape read two ways. The change is kept under `store::PlanHand::Person`, which is the whole of what tells the two apart on the record.

**Refused with a 422 where the plan itself refuses it** — no plan recorded for the Job (`fleet.no_plan`), or `after` naming a task the plan does not hold (`fleet.no_such_task`) — and with the same 422 as `redirect_drone`'s blank instruction where the title is blank or `after` does not read as a task id at all.

**Delivery follows `redirect_drone`'s rule.** With a working Drone mid-step, a turn is injected saying what changed — the task's id and title, stated as settled rather than as something to argue with, and it carries `crate::session::Occasion::Plan` rather than `Redirect` so the log shows it was not one. At a step boundary, or with no session, nothing is sent: the next brief's THE PLAN carries it, because a plan is read from the record at every spawn. It never respawns to deliver itself.

Publishes `job.plan_changed` either way, `actor` `human`.

`agent_access` is `Helm only`: this changes the Job, `redirect_drone`'s own reason and every other command on this table that moves a Job — and, like `redirect_drone`, it is Helm's to call when a person asks it to.
"""
