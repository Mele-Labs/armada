[operations.stop_autopilot]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Stop a repository's Autopilot: no new picks, what it picked but has not started withdrawn, and the end"
notes = """
`POST /autopilots/:repository/stop`. Answers the `Autopilot`, `stopped` with `ended_at`, and publishes `autopilot.changed`. #2092; `.claude/decisions/2026-10-11-pause-drains-stop-withdraws.md`.

**Withdrawn is a started pick whose Job has never had a Drone**: the Job is killed, as a person's act, and the pick reads `withdrawn`. A Job that has run, including one waiting on an answer, finishes. **It does not stop a Job that is spending**; that is the Job's own Pause. Set-aside picks stay on the pile. A 409 `fleet.autopilot_stopped` where it is already stopped, and `fleet.no_autopilot` where there is none.
"""
