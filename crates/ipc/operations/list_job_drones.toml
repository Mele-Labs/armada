[operations.list_job_drones]
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "Every Drone one Job has had — running, done, failed or killed — with its step, when it started and stopped, and its turns and cost"
notes = """
**`list_drones` answers off the roster, so a Drone is gone from it the moment it exits.** This answers off the Job's own history, where `drone_spawned` and `drone_exited` name every Drone the Job has had, and off `job_drone_spend`, the per-Drone row the Job's spend is summed from. It is a route and not a reading Bridge derives from `get_job_events`, because the turns and the cost are on neither the history nor any other read.

**`killed` is a person ending it, and `failed` is not.** A Drone is `killed` where the next move after its exit is its step stopping under `drone_killed` or the Job going to `killed`, the two orders `kill_drone` and `kill_job` write. It is `done` where its step passed its advance gate or reached a person's gate while it was the one on it, and `failed` where it left without either. A kill that lands while evidence is waiting stops no step, so it reads by what the gate then does.

**Cost and turns, and when each arrives.** A stopped Drone carries its row. A running one carries what its transcript's terminating lines add up to: turns summed and cost the last figure, `fleet::allowance::spent`'s fold. A Drone still in its first invocation has no terminating line yet and carries neither; that is absent, never nought. So is a stopped Drone whose row saw none, since 23.11: it read `turns: 0` before. A task's Drone that handed in is let come to rest before Fleet ends it, within the report grace, so its terminating line is on its row.

**`running` is a Drone Fleet still holds, and `at_rest_since` says whether it is working.** Since 23.11. A Drone that submitted and ended its run stays on its step while the gate's Checks run, as the Drone a red Check is handed back to, and an escalated Job keeps an idle one. `at_rest_since` is when its last run ended, off its transcript's last terminating line with no run started or turn sent after it; absent while it works and on a Drone that has left. A new field and not a fifth state, so a Bridge that matches on the four reads on unchanged.

**A Drone beside a Job's kept one is listed too**, since 23.10: it ran a task marked safe to run at once, and is on no record of moves, so its row is read off its task binding and how it left — `done` where it handed in, `killed` where a person stopped it, `failed` otherwise.

**`task` names the plan task a Drone was put on**, since 23.1, on a step that declares `drone_per_task`, off the binding Fleet keeps at the spawn (`store::TaskDrone`). Absent on a Drone that worked its whole step. A task's Drone that handed its task in and left reads `done`: the next task's Drone ends its tenure on the step, and leaving is what its hand-in asks of it.
"""
