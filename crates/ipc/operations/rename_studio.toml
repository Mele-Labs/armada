[operations.rename_studio]
kind = "command"
transport = "HTTP"
agent_access = "On your words"
description = "Name a Studio, or name it again, and answer with it"
notes = """
A blank name is refused as `fleet.studio_name_blank`. `On your words` because naming an untitled Studio is one of the things `studio.md` lets a Job on your words do unasked — `fleet::on_your_words::UNASKED`. From a Job on your words it also publishes `studio.job_acted`.

**A person names a Studio too, and that is what the column does not say** (#1364). `agent_access` narrows which *agents* reach a route; a person on Bridge reaches every command, and this one had no capability on Bridge at all until then — so the owner clicked "Untitled Studio", nothing happened, and the only way to name one was to ask a Job on your words. The name is editable where it is drawn, on the list row and on the open Studio, and a Job on your words keeps naming an untitled one unasked.
"""
