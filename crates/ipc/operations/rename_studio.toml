[operations.rename_studio]
kind = "command"
transport = "HTTP"
agent_access = "Helm only"
description = "Name a Studio, or name it again, and answer with it"
notes = """
A blank name is refused as `fleet.studio_name_blank`. `Helm only` because naming an untitled Studio is one of the things `studio.md` lets Helm do unasked — `fleet::helm::reach::UNASKED`. From Helm it also publishes `studio.helm_acted`.

**A person names a Studio too, and that is what the column does not say** (#1364). `agent_access` narrows which *agents* reach a route; a person on Bridge reaches every command, and this one had no capability on Bridge at all until then — so the owner clicked "Untitled Studio", nothing happened, and the only way to name one was to ask Helm. The name is editable where it is drawn, on the list row and on the open Studio, and Helm keeps naming an untitled one unasked.
"""
