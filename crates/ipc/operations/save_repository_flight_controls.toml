[operations.save_repository_flight_controls]
kind = "command"
transport = "HTTP"
agent_access = "Bridge only"
description = "Write the Cockpit's own actions for one repository, whole, to where that repository's Armada configuration is kept"
notes = """
Since 19 Oct 2026. `POST /repositories/flight_controls`, body `SaveRepositoryFlightControls`: `repository`, `controls`, the whole file as `FlightControls`, never a patch, and `session_id`, optional, the open Job the place `repository` writes on. Answers `RepositoryFlightControls` read again from the place, so the caller sees what was kept and where.

**Checked before anything is written**, by `save_flight_controls`' rules and one more: every tile carries a `kind` (`job[0].kind`), since a repository holds a person's own actions only. A 422 `fleet.flight_controls_refused` naming the field. 500 `fleet.flight_controls_unwritable` where a file cannot be written.

Written to the place `get_repository_flight_controls` reads: a file is written to `<key>.toml.writing` and renamed over the real one, one writer at a time, and a bucket object is put whole. **`repository` never writes the checkout**: `.armada/flight-controls.toml` is written in the tree of the Job `session_id` names and committed alone on its branch, so it lands with the pull request, as `armada.yml`'s remembered runs do; a commit git refuses is a 500 `fleet.flight_controls_unwritable`. A 422 `fleet.flight_controls_unplaced` where the place cannot take it now: a synced folder that is not there, a cloud place with no address, `repository` with no Job named that is open in the repository and holds a slot ("waits for a Job's branch to write it on"), and for now `cloud` with Armada's store, which is not built yet. A bucket that cannot be used is a 422 `fleet.run_cloud_unsigned`, `fleet.run_cloud_unreachable` or `fleet.run_cloud_refused`, as `set_run_memory_place` words it. A 404 `fleet.run_memory_repository_not_served` for a repository Fleet does not serve.

`agent_access` is `Bridge only`, `save_flight_controls`' reason: what is saved can run a shell line.
"""
