[operations.window_failed]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Tell the job that showed a window that the window could not show its page, so it fixes the page rather than waiting on a walk that cannot happen"
notes = """
`POST /sessions/window/failed`, body `WindowFailed`: `session_id`, `url`, the address the window was loading, and `why`, what Bridge saw in one line. Answered with `WalkTold`.

**Bridge detects it; no agent is asked.** Bridge's main process sends it when the page in a job's window does not load, answers with an HTTP status of 400 or more, its process goes away, or, once loaded, it shows Vite's error overlay or draws nothing. Bridge looks at a loaded page every two seconds, never while it is still changing, and the look answers a fixed word rather than the page's text. Once per window until the page is seen working again, so a person pressing Reload on a dead server does not tell the job twice.

**Fleet tells the job in its own voice**, as a Fleet notice that wakes it, never as the person's message: the person said nothing. A hosted job takes a turn; a terminal one has it held for its mod. `told` is `false` where the job has ended or a terminal one is not listening. The walk stays open: the window is still on the person's screen, and the job's next `show_window` replaces it. A job Fleet does not know is refused.
"""
