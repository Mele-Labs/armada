[operations.save_kit_manifest]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Keep a person's own armada.yml for a repository in Kit, at the place their tiles are kept, and commit nothing"
notes = """
Since 19 Oct 2026. `POST /repositories/kit_manifest`, body `SaveKitManifest`: `repository`, the root path `list_repositories` names (never the Manifest's id or a slot's path), and `text`, the file whole. Answers 200 with `KitManifestSaved`: `repository` and `file`, where it was written (a path on this Mac, or the bucket's address).

**This is how a setup Session keeps a person's own `armada.yml`**, where `onboard-repo` asked whose it is and the answer was theirs. `docs/concepts/manifest.md`, *Kit's copy*. The file gate on a Session that has no `armada.yml` yet allows only a file named `armada.yml` or `.gitignore` under the repository's root and `.git/info/exclude`, and Kit's copy may be in a synced folder or a bucket, so the write is Fleet's and not the Session's file tool.

**It writes through `KitManifest::write`, so it follows the place.** The folder, synced folder or bucket the repository's tiles are kept in. A copy there is replaced whole. Nothing is written to the repository, and nothing is committed.

**The text is checked before anything is written.** It is a whole Manifest, read as the repository's own file would be, or a copy naming only what it changes: a mapping holding only `checks` and `commands`, each entry with a `run` line, and `tracker` and `ci_gate`, which replace the repository's whole.

**Through the agent's door, only for the repository of the Job that calls.** A person's own copy wins over the repository's and can replace a Check, so an agent that could keep one for another repository could weaken that repository's gate. The Job is placed by its connection, as `show_window`'s is, and its repository is the root a setup Job was started in, or the root of the Manifest it is bound to. Bridge's own call carries no connection and may keep one for any repository Fleet serves.

Refusals: a 422 `fleet.kit_manifest_elsewhere` for a repository that is not the calling Job's, whose message names the root to send, or a call the door cannot place on a Job, and nothing is written; a 422 `fleet.kit_manifest_refused`, whose message starts "Nothing was saved." and says in plain words why the text is not an `armada.yml`; a 422 `fleet.kit_manifest_unplaced` where the place Kit keeps the copy in would not answer (a synced folder not mounted, a bucket out of reach), and nothing is written; a 404 `fleet.run_memory_repository_not_served`; a 500 `fleet.kit_manifest_unwritable` where the place answered and would not take the write.

`agent_access` is `Yes`: the person confirmed the whole file in the conversation before the Session wrote it, and what is written runs for that person alone, never for a colleague. The door offers it to a Session standing in a repository with no `armada.yml` yet, as it offers `record_plan`.
"""
