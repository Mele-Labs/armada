[operations.get_sleep]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "Whether sleep mode is on, and what the night has decided, held, landed and shown"
notes = """
`GET /sleep`, answered with `SleepState`: `on`, and the night's rows as `decided`, `blocked`, `landed` and `walks`.

**What the night holds.** While sleep is on, a periodic pass answers a session's `ask:` or agent item once it has waited two minutes, but only where an option is labelled "(Recommended)", and picks that one; `chose` is its label and `session_id` names the session. An item with no such option, whether a question or an errand, is left in the session's own list, neither decided nor held. **A destructive or irreversible question is never decided**, nor is a `perm:` permission: each is recorded under `blocked` and left. Destructive is read conservatively from the item's text and options, and an unsure reading holds. A `walk:` item is recorded under `walks`; a pull request the pull reading sees merge, under `landed`; an escalated Job, under `blocked`, because no route answers an escalation with words.
"""
