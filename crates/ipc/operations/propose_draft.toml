[operations.propose_draft]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Put a draft to the person for approval: a pull request description, a comment, a message, any text they should OK before you use it. Body: title, one short line naming what it is and where it goes; text, the draft in markdown; before, optional, the text it replaces; pull_request, optional, the number of the pull request whose description this is, refused where the job holds no such pull request. Where before is the body of a pull request the job holds, Fleet links the draft to it without being told. Returns at once; end your turn. The answer comes as a message: approved as written, approved with their fixes and the exact text to use, sent back with a note to rewrite and propose again, or withdrawn, and then you do not propose it again. Take back your own with withdraw_draft."
notes = """
`POST /sessions/draft`, body `ProposeDraft`: `title`, one short line naming what the draft is and where it goes; `text`, the draft in markdown; an optional `before`, the text it replaces; an optional `pull_request`, the number of the pull request whose description it is; and an optional `session_id`. Answered with the `SessionRecord`; **through the agent's door, a receipt** of `session_id` and `draft`, the item's `draft:<row id>`, because the row grows with every attachment and an agent keeps each answer.

**It does not wait.** Fleet keeps a `draft` row on the thread with `title`, `text` and `before`, answers at once, and the job ends its turn. The open draft is `draft:<row id>` in `SessionRecord.waiting_for`, source `draft`, so it shows under Waiting on you as well as on the thread. `answer_waiting` settles it: a `choice` of 0 approves it as written, `fixed` approves it with the person's text, and `text` alone sends it back with that note. The job gets the person's message saying which, with the exact text to use or the note to rewrite by, and the row is replaced by id with its `settled`: `how` (`approved`, `fixed`, `sent_back` or `withdrawn`), `words` (the fixed text, the note or the reason, absent for `approved` and for `withdrawn` with no reason) and `at`. `dismiss_waiting` withdraws it: the job is sent `Withdrawn: <title>` and `Do not propose it again.`, with his reason on the next line where he gave one, and the row settles `withdrawn`. `withdraw_draft` settles it the same way with no words and sends nothing.

**A draft is also an artifact keyed by its title.** Fleet upserts an `artifact` of form `draft` at `draft:<title>` on the job's ledger, its `detail` holding `form`, `by`, `title`, `revisions` (each text kept as `r<n>.md` in Fleet's attachments folder, oldest first, an identical text keeping none) and `row`, the newest row's id; `get_job_artifacts` reads it. **A draft proposed under the title of one still open is its next revision**: the earlier row settles `withdrawn` with no words and the job is sent nothing, so one item waits for the title. A row he is answering at that moment is left to his answer. A draft Fleet raises for a workflow change is neither.

**A draft knows the pull request it describes.** Where the job names `pull_request`, Fleet links the draft to that pull request among the `pr` rows it holds and has not given back, and refuses 422 `fleet.draft_pull_request_not_held` with nothing kept where there is none. Where it names none and `before`, whitespace runs taken as one space, is the body Fleet last read of one of them, the draft is linked to the newest such. The link is a `pr_draft` row on the job's ledger, its target the draft's row id, kept out of `attachments` and served as `SessionRecord.pull_request_drafts` and `PullRequestPage.draft`: repository, number, `draft`, `text`, `before` and `revision`, one more than the job's earlier drafts for that pull request. **Settling the draft, however it is settled, gives the row back.** Fleet never writes the description: the job edits it once the person approves, as with any draft.

**The job is the one whose process holds the connection** when Fleet hosts it, whatever the body says; `session_id` is read only for a job in a terminal, as `show_window`'s is.

`agent_access` is `Yes`: the job is the one with the draft, and the one that uses the text once it is settled.
"""
