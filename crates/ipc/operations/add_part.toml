[operations.add_part]
ask_tool = "takes"
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Put a part on an artifact you are showing the owner: words he approves or asks for changes on, takes he picks between (two to six, each a scene), or buttons he presses. Body: title (the artifact's title; a sketch you showed under it is the same artifact), part {id, kind, ...}, optional asks (words and takes ask by default, buttons never do; false makes words an aside that asks nothing), question (the ask in plain words ending in ?, such as Which layout reads better?, which titles his item; required on a part that asks, and on takes it may sit in the part), optional for (one sentence of at most 200 characters on what it is for), optional links and optional feature (a slug or a list of slugs of the features it serves). kind is words (text, markdown), takes (takes: [{id, title, scene}], optional question, optional form pick, rank or score, and parts for a score) or buttons (actions: [{id, act, label, ...}] as a page's armada-action). One ask is one item: each part that asks is its own item on his list, titled by its question, so give each ask its own title. Takes stand alone: put them under a title of their own, with the background in their question or for line, never a drawing or another part beside them, which is refused. Draw a take about a screen as a mock of that screen with short, plausible content and its parts named by data-part, and labelled blocks only for a choice that is not a screen; your pick first. He answers takes with a pick (Send pick) or asks for changes with his words, and Approve never stands in for a pick. A drawing is not added here: call show_sketch, which shows it as its own artifact. Beside a sketch that asks, add only asides (asks false) and buttons. A part put again under the same id is that part's next revision and asks again. His answer comes to you as a message naming the artifact and the part. At most 12 parts, 6 takes and 12 buttons; a part that breaks a rule is refused with every reason"
notes = """
`POST /sessions/artifacts/part`, body `AddPart`: `title`, `part` (`NewPart`: an optional `id`, its kind where left out, and `kind` with that kind's fields), optional `asks`, a `question` required where the part asks, an optional `feature`, optional `for` and `links` (`docs/practices/protocol/what-an-artifact-is-for.md`) and an optional `session_id`. Answered with the `SessionRecord`; **through the agent's door, a receipt** of `session_id` and `part`, the id it was kept under.

**The job is the one whose process holds the connection** when Fleet hosts it, whatever the body says; `session_id` is read only for a job in a terminal, as `show_sketch`'s is.

**Where it goes is the job's title** (`docs/concepts/artifact.md`, *Parts*). A part put under an id the artifact holds is that part's next revision. Otherwise it goes on the artifact of this job titled `title`, and where none is, it starts one. **Nothing joins another on its own** (the owner, 19 Nov 2026: one ask, one item, one place).

**One artifact asks one thing**: a part that asks, onto an artifact whose drawing or another part still asks, is refused, naming what asks there. **Takes stand alone**: takes onto an artifact holding a drawing or any other part are refused, and so is any part onto one holding takes, each saying to put the background in the takes' `question` or `for` line.

**A part that asks carries its `question`**, from `question` or, on takes, the part's own: at most 200 characters, one line, no backticks, ending in `?` (`ipc::question_checked`). It is kept on the part (`ArtifactPart.question`) and titles his item. **`feature`** files it under the features it names, as `show_sketch`'s does.

**A take's mocks are kept with their style set**, as `show_sketch` keeps a sketch's, and each carries `kept`, so native draws it in the repository's styles; a mock that cannot be drawn is refused with `fleet.sketch_refused`, saying what to change.

**Refused with 422 and nothing written**: `fleet.part_refused`, naming every rule broken at once (a drawing sent here, a part that asks with no question or one not worded as a question, a part beside takes or takes beside another part, a second ask on one artifact, a blank title, takes under two or over six, a `score` with no `parts`, an `asks` on buttons, an id holding `:` or `/`, a part over 48 KiB, more than twelve parts, a kind changed under an id); `fleet.part_unnamed` for a call that places no job.

`agent_access` is `Yes`: it is the job's own words and pictures, and the owner answers them in Bridge with `answer_part`.
"""
