[operations.add_part]
ask_tool = "takes"
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Put one more part on the artifact you are showing the owner: words he approves or sends back, takes he picks between (two to six, each a scene), or buttons he presses. Body: title (the artifact's title; a sketch or draft you showed under it is the same artifact), part {id, kind, ...}, optional asks (words and takes ask by default, buttons never do; false makes words an aside that asks nothing), optional for (one sentence of at most 200 characters on what it is for) and optional links. kind is words (text, markdown), takes (takes: [{id, title, scene}], optional question, optional form pick, rank or score, and parts for a score) or buttons (actions: [{id, act, label, ...}] as a page's armada-action). Open the artifact with one sentence in for saying what he decides, then the takes, and fold detail below in a words part with asks false. Draw a take about a screen as a mock of that screen with short, plausible content and its parts named by data-part, and labelled blocks only for a choice that is not a screen; your pick first. He answers takes with a pick (Send pick) and Approve never stands in for it. A drawing is not added here: show_sketch draws it, and it joins the artifact as a part. In an artifact that holds takes, his pick is its one answer: every drawing in it informs and asks nothing, whether drawn before the takes or after, and only words or a page you marked as asking wait beside the pick. One artifact is open at a time: while one still asks him, anything you show, a sketch under any title, a draft, a page that asks or a part, joins it instead of starting a second, so he reads one thing and answers each ask on its own. A part put again under the same id is that part's next revision and asks again. He answers each asking part alone, and each answer comes to you as a message naming the artifact and the part. At most 12 parts, 6 takes and 12 buttons; a part that breaks a rule is refused with every reason"
notes = """
`POST /sessions/artifacts/part`, body `AddPart`: `title`, `part` (`NewPart`: an optional `id`, its kind where left out, and `kind` with that kind's fields), optional `asks`, optional `for` and `links` (`docs/practices/protocol/what-an-artifact-is-for.md`) and an optional `session_id`. Answered with the `SessionRecord`; **through the agent's door, a receipt** of `session_id` and `part`, the id it was kept under.

**The job is the one whose process holds the connection** when Fleet hosts it, whatever the body says; `session_id` is read only for a job in a terminal, as `show_sketch`'s is.

**Where it goes is Fleet's to say, not the job's** (`docs/concepts/artifact.md`, *Parts*). A part put under an id the artifact holds is that part's next revision. Otherwise it joins the artifact of this job that still asks him, whatever `title` says, and where none asks it starts one titled `title`. A lone draft or page that still asks becomes a part of it, so the job never leaves him two things to read.

**Takes make every drawing of the artifact inform**: a drawing still asking when a takes part joins stops asking, one shown later into it asks nothing, and a pick settles any left open, so his pick alone settles the artifact where no words or page ask (`docs/concepts/artifact.md`, *Parts*).

**A take's mocks are kept with their style set**, as `show_sketch` keeps a sketch's, and each carries `kept`, so native draws it in the repository's styles; a mock that cannot be drawn is refused with `fleet.sketch_refused`, saying what to change.

**Refused with 422 and nothing written**: `fleet.part_refused`, naming every rule broken at once (a drawing sent here, a blank title, takes under two or over six, a `score` with no `parts`, an `asks` on buttons, an id holding `:` or `/`, a part over 48 KiB, more than twelve parts, a kind changed under an id); `fleet.part_unnamed` for a call that places no job.

`agent_access` is `Yes`: it is the job's own words and pictures, and the owner answers them in Bridge with `answer_part`.
"""
