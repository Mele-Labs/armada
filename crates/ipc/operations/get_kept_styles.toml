[operations.get_kept_styles]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "The style set Fleet kept with a sketch, by the hash a mock node's kept names: its stylesheets in the order they apply, and its fonts"
notes = """
`GET /sessions/kept_styles?hash=`. Answers 200 with `KeptStyles`: `sheets`, each `{ path, css, edited }` in the order they apply, `edited` true where the Job's checkout held uncommitted changes to the file when it was kept; and `fonts`, each `{ family, weight, style?, bytes }` with `bytes` base64.

**Read on demand and never on a record**: a sketch's scene carries only the hash, so a record that is published whole on every change does not carry the sheets. **The hash is content addressed, so an answer never changes** and Bridge may keep it for good. A hash Fleet does not hold is a 404.

**Bridge only.** The agent names sheets in `styles` and never reads them back. Fleet's behaviour behind this route is not built yet: until it is, the route answers 404 for every hash.
"""
