[operations."terminal.exited"]
kind = "event"
transport = "WebSocket"
agent_access = "Bridge only"
description = "One of a Job's terminals ended: it exited, it was stopped, or its Job ended. Its session_id, terminal and run_id"
notes = """
`JobTerminal`: `session_id`, `terminal` and `run_id`. Published once the shell's process has gone and after `observe_session_run` has sent `exited` on its socket. The next open of that terminal, the person's or the agent's, starts a new shell under a new `run_id` and the same `terminal`.
"""
