[operations.read_loadout_item]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "What one row of a job's Loadout says: a skill's SKILL.md, an agent's file, a memory file, Armada's job rules"
notes = """
`GET /sessions/loadout/item?session_id=&kind=&name=&source=&from=`, the row as `get_session_loadout` names it; a use's `skill`, `tool` or `subagent` is asked as the kind of that name. `LoadoutItemBody`, tagged on `what`: `read` with `path?`, `format` (`markdown` or `text`), `body` and `truncated?`, or `not_read` with `why`, a sentence a person reads. **Read from disk where Fleet runs, one row at a time, when a person opens it**: the mod still reports names only.

**Only a row the job's Loadout lists**, and only the one file its kind and source imply: a skill's `SKILL.md`, an agent's file and an output style's file in the repository's `.claude`, the harness home or an installed plugin's folder; a memory file at the path the mod reported it at, under the job's directory or the harness home and nowhere else. Armada's `rules` are the compiled job rules and its `injection` the note the mod adds with the id as `<job id>`, both `text` with no `path`. An MCP server, a tool, a built-in, a managed or an MCP server's own item is `not_read`. A name that could climb (`..`, a separator in a skill's, an agent's or a style's, an absolute memory path outside those two folders) is `not_read`, and so is a file a link takes outside both its folder and the person's home. The body stops at 256 KiB with `truncated`. `path` is from the repository's root, `~/…` under the home, or from the plugin's own folder.

Refused, 422 `fleet.session_unnamed`, where Fleet knows no such job. `agent_access` is `No`: what a person's setup says is theirs to read.
"""
