[operations.get_session]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "One hosted job and its thread, oldest row first"
notes = """
`GET /sessions/one?session_id=&last=&before=`. Since 23.49. `SessionThread`: the `SessionRecord` and its `rows`. A client reads this once and follows `session.row`. A `retro` row left going by a Fleet that has restarted is returned `failed`, with `why` "Fleet restarted while it was written". Since 23.78.

`last` and `before` cut the thread to the newest `last` rows, or the `last` before the row `before`, and `older` is true when more stand before them. A `before` the thread does not hold is the end. Since 19 Nov 2026.

**A Job held from another Mac is read from that Mac's Fleet each time**, as `share_job_session` answers there, and nothing of it is kept here. With `last` the window is cut there, so only it crosses the link. The row carries that Mac's `mac`. What that Mac refuses is passed on as it said it. Since 19 Nov 2026.
"""
