[operations.send_judge_note]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Send a Judge's note to the Job's agent as the person's message"
notes = """
`POST /sessions/judge/send`, body `SendJudgeNote`: `session_id`, `reading` (the reading's `id`) and `note` (the note's `id`). Since 31 Oct 2026. Answers the `JudgeReading` with the note settled `{how: "sent", at}`, and `SessionChanged` is published.

**The note becomes his message to the agent**, sent before it is settled, so a failed send leaves it waiting. A note already settled is answered as it stands, with nothing sent twice.

404 `fleet.no_such_session` where no Job has that id, 404 `fleet.no_such_judge_reading` for a reading the Job does not hold (a reading asked again for the same artifact is gone), and 404 `fleet.no_such_judge_note` for a note the reading does not hold.
"""
