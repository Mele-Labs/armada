[operations.get_home_layout]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "The layout of the Cockpit home, one per user"
notes = """
`GET /home/layout`. Answers `HomeLayout { layout? }`, `layout` being `{ blocks: [{ kind, x, y, w, h, view }] }` in the grid's columns and rows, the project board's own shape (`BoardLayout`). **A user who saved none answers no `layout`**, and Bridge draws its preset. It is read from `bridge.homeLayout` in settings.json, so a layout kept there by hand reads too, and a value that is not a layout reads as none. `kind` and `view` are text as Bridge spells them, so a block kind a later Bridge adds crosses without a wire change, and a kind this build does not know is read back as it was saved. `docs/practices/protocol/projects.md`, *The Cockpit home's layout*.
"""
