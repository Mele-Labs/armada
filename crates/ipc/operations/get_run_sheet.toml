[operations.get_run_sheet]
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "What a person can run in one Job's worktree — its Setup, Checks and Commands — and the facts the run sheet's header draws"
notes = """
**The Job's frozen Manifest, not the file on disk.** A Check the Job's workflow names is listed as the Job froze it at creation — `run`, `requires`, `narrow` and the bar — because the gate judges the Job against that, and rehearsing anything else answers a question the gate never asks. Nothing a Job holds freezes a Command, or a Check its workflow does not name, so those come from the Manifest Fleet holds now and say so: `frozen` is false on each.

`narrow_run` is resolved the way a Drone's dry run resolves it — the worktree's own diff through `checks_runner::narrowed` — so the command shown is the one a Drone narrowing the same Check would run.

`worktree_differs` compares the worktree's own `armada.yml` against these lists; `start_run` runs that version only when asked. `manifest_edited_at` is read from git: the newest commit at or before the Job's creation that changed the file.

`seeding` is what the worktree's build directories started from, read from what Fleet wrote beside the Job's log when it cut the worktree, and absent where the Job's Manifest declares no `setup.seed` (#1064).

`agent_access` is `Yes` since `#697`. `start_run` has read `Yes` since `#695`, so the refusal here left an agent able to run something in a worktree and unable to see what there was to run — which is the shape of a guess. The sheet is a list of entries rather than a payload, so the door's cap is not what makes it safe to open.
"""
