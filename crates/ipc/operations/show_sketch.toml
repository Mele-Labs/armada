[operations.show_sketch]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Use this to show the owner any diagram, flow, architecture or layout, drawn in Bridge. Never draw ASCII art. Body: title (a second sketch with the same title replaces the first), scene, a JSON object {nodes, edges}, and optional against. Node: id (unique), kind, x, y (numbers, 240 wide and 90 tall by default), optional w, h, title, body, icon, lang, wire, screen, html, css, styles, step, shape, color. Place boxes on a grid of rows and columns: a box grows to its words, and Bridge moves rows and columns apart so none touches another. kind is one of box, group, lane, label, code, wire, screen, mock; group and lane need w and h; a mock needs w and html, and takes optional css and styles. icon is one of activity, bot, box, clock, cpu, eye, file, git-branch, git-merge, globe, hammer, hard-drive, layers, lock, package, rocket, scale, scroll-text, server, settings, shield-check, terminal, webhook, wrench, zap. wire is one of button, input, list, card, nav, text, for a wire node. shape is one of box, pill, circle, diamond, cylinder, hexagon, for a box node: a pill to start or end, a diamond to decide, a cylinder for a store, a hexagon for a process, a circle for a short step; only box has a title band. color is one of blue, teal, green, amber, orange, red, grey, on a node or an edge. Pick the kind by what the sketch shows. A flow, sequence or architecture is boxes and edges. A screen or component of a repository that has stylesheets is a mock: HTML drawn with that repository's own styles, on the canvas like any box, so one sketch can hold mocks, edges and tables. A screen of a repository with no styles is a screen, a grey wireframe; never wire nodes or boxes placed by pixel for a layout. Something the owner must press and move through is a walk (show_window), because a sketch is a still picture and clicks nothing; a visual change still gets its walk after he approves the sketch. A mock takes id, x, y, w (its width) and html, and optionally title, css and styles; its height follows the content. Write html with the app's real class names, read from the component's own markup and stylesheet: Fleet draws it with the repository's stylesheets, and a mock is only as true as the markup you type. styles is a list of repository paths; leave it out and Fleet finds the closest stylesheets from your work. get_style_sources (optional path) lists them with token names and values and never file text; nothing waits on it, and where it lists several packages, name one with a path inside it. css holds rules the stylesheets lack. Where a stylesheet is not usable (SCSS, Less, a theme module) or Tailwind has no build output, write the rules in css from the tokens get_style_sources gave, because no build runs for a sketch. Scripts, handlers, inline style and addresses are dropped, so put layout in css. <i data-icon=\"bot\"> draws a lucide glyph and data-size sets its size; a name outside this list draws nothing and no error says so: activity, bell, bot, box, check, chevron-down, chevron-right, circle, circle-alert, circle-check, circle-dot, circle-help, circle-pause, circle-x, clock, cpu, ellipsis, eye, file, file-text, filter, folder, git-branch, git-merge, git-pull-request, globe, hammer, hard-drive, layers, link, loader-circle, lock, package, pencil, play, plus, refresh-cw, rocket, scale, scroll-text, search, server, settings, shield-check, sliders-horizontal, terminal, ticket, triangle-alert, user, webhook, wrench, x, zap. A repository with its own icons writes inline SVG. data-part=\"name\" names an element, and the owner's note on it arrives under that name. A sketch holds at most 12 mocks, and html and css count toward the 32768 bytes, so split a big picture into two sketches. A mock is refused when it sends kept, which is Fleet's, when it has no usable stylesheet and no css (draw a screen), or when Fleet would have to guess the package. A screen node is the wireframe: its `screen` field is a layout tree that sizes itself, so give x, y and optionally w (its width) and no h. Every element is {type, ...} with optional id, step, size (auto, fill, or a number: its share of what is left) and align (start, center, end, stretch); an element's step joins the scene's numbering. Types: row and column (gap and pad: none, sm, md, lg; border; children), grid (cols 1 to 12, and the same), window (chrome: desktop, browser or phone; title, url, children), nav (brand, items, active, actions, vertical; items and actions are strings or {text, icon}), panel (title, icon, actions, gap, pad, children), tabs (items, active), list (rows of {text, meta, icon, selected}), table (columns, rows of strings), button (text, variant: primary, secondary, ghost; icon), field (label, kind: input, textarea, select, checkbox, toggle, search; value, placeholder), text (style: heading, title, body, caption; text, lines), image (label), avatar (text), badge (text), divider, spacer, chat (messages of {from: me or them, text}), modal (title, children). Screen icons are lucide names such as search, bell or settings; an unknown one is refused with the allowed list. Example: {\"id\": \"team\", \"kind\": \"screen\", \"x\": 0, \"y\": 0, \"screen\": {\"type\": \"window\", \"chrome\": \"browser\", \"children\": [{\"type\": \"nav\", \"brand\": \"Acme\", \"items\": [\"Home\", \"Team\"], \"active\": \"Team\"}, {\"type\": \"column\", \"size\": \"fill\", \"pad\": \"md\", \"children\": [{\"type\": \"text\", \"style\": \"heading\", \"text\": \"Team\"}, {\"type\": \"button\", \"text\": \"Invite\", \"variant\": \"primary\", \"icon\": \"plus\"}]}]}}. lang names a code node's language. Edge: id (unique), from and to (node ids), optional label, flow (true animates it), step, color. step is a number on a node or an edge, and nodes and edges share one numbering: everything with the same step number plays together, in ascending order, and the dot travels the edge from `from` to `to`. An edge with no step never pulses. For a sequence diagram use group nodes as lifelines, label nodes as points on them, and stepped edges as the arrows between them. For a workflow, step the nodes and the arrows. against is the title of an earlier sketch of this job: the owner reads the new scene as a change to it, and Fleet keeps that earlier scene whole, so redrawing it later does not move the diff. It is refused if this job holds no sketch of that title. At most 80 nodes, 120 edges and 32768 bytes, the scene and against together; a scene that breaks a rule is refused with the part and the allowed values, and nothing is drawn. The owner approves the sketch or sends it back with a note on its card, and his answer comes to you as a message"
notes = """
`POST /sessions/sketch`, body `ShowSketch`: `title`, `scene`, an optional `against` and an optional `session_id`. Answered with the `SessionRecord`; **through the agent's door, a receipt** of `session_id` and `sketch`, the title it was kept under.

**The scene is checked in `ipc` (`sketch.rs`) against the rules of `parseScene`** in `packages/components/src/compositions/SketchScene/scene.ts`, which draws a scene that fails as an empty frame and says nothing. A refusal is 422 and lists up to twelve problems, each naming the part (`nodes[1] `b``, `edges[0] `e1``), what it holds and what is allowed. It is stricter than `parseScene` in one way: a field the format has no name for is refused, where `parseScene` drops it, so a misspelt `titel` is heard of. A scene with no nodes is refused too. `tests/sketch.rs` reads the kinds, wire parts and icons out of `scene.ts` and fails when they differ, and checks that this description names every one.

**A `screen` node carries a layout tree in `screen`**, checked against `readScreen` in `packages/components/src/compositions/SketchScene/screen.ts` by `crates/ipc/src/sketch/screen.rs`: each element is refused with its path (`nodes[2] `team` screen.children[1].rows[0].icon is `home`. Allowed: ...`) for an unknown `type`, a field it does not take, a bad `size`, `align`, `gap`, `pad` or icon, or the wrong shape. A tree nests at most 12 levels. The test reads the element types, their fields and readers, the enums and the screen glyph list out of `screen.ts`. The description names the types and not the glyphs, which a refusal lists.

**`step` is a finite number on a node or an edge**, one numbering for both. **`against` names an earlier sketch of this job by title.** Fleet resolves it at the call and keeps that scene whole in `detail.against`, so a later replacement does not move the diff; a title the job holds no sketch of is refused with 422, `fleet.sketch_against_unknown`, naming the titles it does hold, and a blank one with `fleet.sketch_refused`.

**A `mock` node draws HTML in a sealed frame `w` wide** with the repository's stylesheets: `html` (not blank), an optional `css` string for what those lack, and an optional `styles` list of repository paths, which `get_style_sources` names. `html`, `css` and `styles` on any other kind are refused, as `screen` is. **`kept` is Fleet's**: it names the kept style set a mock was drawn with, and a scene that sends it is refused. At most 12 `mock` nodes per sketch; past that, split it. `html` and `css` count in the 32768 bytes. **Fleet draws the mock with the stylesheets it keeps for it** and writes their hash in `kept`: the `styles` named, else the closest to the Job's work. A mock with no stylesheet a browser can use and no `css` is refused, as is one in a repository of several packages with no file to start from, and a `styles` entry outside the checkout or not usable; the 422 `fleet.sketch_refused` says what to change. Bridge drops scripts, handlers, inline `style`, addresses and tags that load, swaps `<i data-icon>` for its glyph (the names in `mock-icons.ts`; an unknown one is left empty) and names a part by `data-part`. A document's `armada-sketch` may hold `mock` nodes, drawn the same way.

**Capped**: 80 nodes, 120 edges, 20 strokes, 32768 bytes written (the scene and `against` together), 120 characters of title. The scene rides on the job's record, which is published whole on every change.

**The job is the one whose process holds the connection** when Fleet hosts it, whatever the body says; `session_id` is read only for a job in a terminal, as `show_window`'s is.

**Kept as an attachment of kind `artifact`**, `target` `sketch:<title>`, `detail` of `form` `sketch`, `by` `agent`, `title`, `scene` (the scene as JSON text, because `detail` holds strings only) and, where `against` was given, `against` (a JSON object `{"title", "scene"}` written as text, `scene` being the earlier scene's JSON text as it was kept), `asked` `"true"` and `drawn`, an id new on every call, which put it to the person to approve or send back (`answer_sketch`). A second call with the same title replaces the detail of the same row, so the sketch is replaced where it stands. It is held after the job ends and survives a restart. Nothing is written to the thread and no window opens.

`agent_access` is `Yes`: the job is the one with something to show.
"""
