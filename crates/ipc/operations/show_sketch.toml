[operations.show_sketch]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Use this to show the owner any diagram, flow, architecture or layout, drawn in Bridge. Never draw ASCII art. Body: title (a second sketch with the same title replaces the first), scene, a JSON object {nodes, edges}, and optional against. Node: id (unique), kind, x, y (numbers, 240 wide and 90 tall by default), optional w, h, title, body, icon, lang, wire, screen, step. kind is one of box, group, lane, label, code, wire, screen; group and lane need w and h. icon is one of activity, bot, box, clock, cpu, eye, file, git-branch, git-merge, globe, hammer, hard-drive, layers, lock, package, rocket, scale, scroll-text, server, settings, shield-check, terminal, webhook, wrench, zap. wire is one of button, input, list, card, nav, text, for a wire node. For any screen or app layout use kind screen, never wire nodes or boxes placed by pixel: its `screen` field is a layout tree that sizes itself, so give x, y and optionally w (its width) and no h. Every element is {type, ...} with optional id, step, size (auto, fill, or a number: its share of what is left) and align (start, center, end, stretch); an element's step joins the scene's numbering. Types: row and column (gap and pad: none, sm, md, lg; border; children), grid (cols 1 to 12, and the same), window (chrome: desktop, browser or phone; title, url, children), nav (brand, items, active, actions, vertical; items and actions are strings or {text, icon}), panel (title, icon, actions, gap, pad, children), tabs (items, active), list (rows of {text, meta, icon, selected}), table (columns, rows of strings), button (text, variant: primary, secondary, ghost; icon), field (label, kind: input, textarea, select, checkbox, toggle, search; value, placeholder), text (style: heading, title, body, caption; text, lines), image (label), avatar (text), badge (text), divider, spacer, chat (messages of {from: me or them, text}), modal (title, children). Screen icons are lucide names such as search, bell or settings; an unknown one is refused with the allowed list. Example: {\"id\": \"team\", \"kind\": \"screen\", \"x\": 0, \"y\": 0, \"screen\": {\"type\": \"window\", \"chrome\": \"browser\", \"children\": [{\"type\": \"nav\", \"brand\": \"Acme\", \"items\": [\"Home\", \"Team\"], \"active\": \"Team\"}, {\"type\": \"column\", \"size\": \"fill\", \"pad\": \"md\", \"children\": [{\"type\": \"text\", \"style\": \"heading\", \"text\": \"Team\"}, {\"type\": \"button\", \"text\": \"Invite\", \"variant\": \"primary\", \"icon\": \"plus\"}]}]}}. lang names a code node's language. Edge: id (unique), from and to (node ids), optional label, flow (true animates it), step. step is a number on a node or an edge, and nodes and edges share one numbering: everything with the same step number plays together, in ascending order, and the dot travels the edge from `from` to `to`. An edge with no step never pulses. For a sequence diagram use group nodes as lifelines, label nodes as points on them, and stepped edges as the arrows between them. For a workflow, step the nodes and the arrows. against is the title of an earlier sketch of this job: the owner reads the new scene as a change to it, and Fleet keeps that earlier scene whole, so redrawing it later does not move the diff. It is refused if this job holds no sketch of that title. At most 80 nodes, 120 edges and 32768 bytes, the scene and against together; a scene that breaks a rule is refused with the part and the allowed values, and nothing is drawn"
notes = """
`POST /sessions/sketch`, body `ShowSketch`: `title`, `scene`, an optional `against` and an optional `session_id`. Answered with the `SessionRecord`; **through the agent's door, a receipt** of `session_id` and `sketch`, the title it was kept under.

**The scene is checked in `ipc` (`sketch.rs`) against the rules of `parseScene`** in `packages/components/src/compositions/SketchScene/scene.ts`, which draws a scene that fails as an empty frame and says nothing. A refusal is 422 and lists up to twelve problems, each naming the part (`nodes[1] `b``, `edges[0] `e1``), what it holds and what is allowed. It is stricter than `parseScene` in one way: a field the format has no name for is refused, where `parseScene` drops it, so a misspelt `titel` is heard of. A scene with no nodes is refused too. `tests/sketch.rs` reads the kinds, wire parts and icons out of `scene.ts` and fails when they differ, and checks that this description names every one.

**A `screen` node carries a layout tree in `screen`**, checked against `readScreen` in `packages/components/src/compositions/SketchScene/screen.ts` by `crates/ipc/src/sketch/screen.rs`: each element is refused with its path (`nodes[2] `team` screen.children[1].rows[0].icon is `home`. Allowed: ...`) for an unknown `type`, a field it does not take, a bad `size`, `align`, `gap`, `pad` or icon, or the wrong shape. A tree nests at most 12 levels. The test reads the element types, their fields and readers, the enums and the screen glyph list out of `screen.ts`. The description names the types and not the glyphs, which a refusal lists.

**`step` is a finite number on a node or an edge**, one numbering for both. **`against` names an earlier sketch of this job by title.** Fleet resolves it at the call and keeps that scene whole in `detail.against`, so a later replacement does not move the diff; a title the job holds no sketch of is refused with 422, `fleet.sketch_against_unknown`, naming the titles it does hold, and a blank one with `fleet.sketch_refused`.

**Capped**: 80 nodes, 120 edges, 20 strokes, 32768 bytes written (the scene and `against` together), 120 characters of title. The scene rides on the job's record, which is published whole on every change.

**The job is the one whose process holds the connection** when Fleet hosts it, whatever the body says; `session_id` is read only for a job in a terminal, as `show_window`'s is.

**Kept as an attachment of kind `artifact`**, `target` `sketch:<title>`, `detail` of `form` `sketch`, `by` `agent`, `title`, `scene` (the scene as JSON text, because `detail` holds strings only) and, where `against` was given, `against` (a JSON object `{"title", "scene"}` written as text, `scene` being the earlier scene's JSON text as it was kept). A second call with the same title replaces the detail of the same row, so the sketch is replaced where it stands. It is held after the job ends and survives a restart. Nothing is written to the thread and no window opens.

`agent_access` is `Yes`: the job is the one with something to show.
"""
