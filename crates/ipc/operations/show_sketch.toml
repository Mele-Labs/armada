[operations.show_sketch]
ask_tool = ["sketch", "diagram"]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Use this to show the owner any diagram, flow, architecture or layout, drawn in Bridge. Never draw ASCII art. Body: title (a second sketch with the same title replaces the first), scene, a JSON object {nodes, edges}, optional against, optional asks (default true), question, the ask in plain words ending in ?, such as Which layout reads better?, which titles his item and is required on a sketch that asks, and optional for, one sentence of at most 200 characters on what it is for and what the owner's answer changes, shown under the title; and optional links, at most 5 of {label, url}, each url http:// or https://. Fleet adds the task in progress, its plan step and the open pull requests this job holds. A longer for or another url is refused. Node: id (unique), kind, x, y (numbers, 240 wide and 90 tall by default), optional w, h, title, body, icon, lang, wire, screen, html, css, styles, step, shape, color. Place boxes on a grid of rows and columns: a box grows to its words, and Bridge moves rows and columns apart so none touches another. kind is one of box, group, lane, label, code, wire, screen, mock; group and lane need w and h; a mock needs w and html, and takes optional css and styles. icon is one of activity, bot, box, clock, cpu, eye, file, git-branch, git-merge, globe, hammer, hard-drive, layers, lock, package, rocket, scale, scroll-text, server, settings, shield-check, terminal, webhook, wrench, zap. wire is one of button, input, list, card, nav, text, for a wire node. shape is one of box, pill, circle, diamond, cylinder, hexagon, for a box node: a pill to start or end, a diamond to decide, a cylinder for a store, a hexagon for a process, a circle for a short step; only box has a title band. color is one of blue, teal, green, amber, orange, red, grey, on a node or an edge. state is one of done, running, checking, waiting, failed, on a node: where the thing it draws stands, so a flow can show what is finished, what is running and what failed; a word outside this list is refused with the list. Pick the kind by what the sketch shows. A flow, sequence or architecture is boxes and edges. A screen or component of a repository that has stylesheets is a mock: HTML drawn with that repository's own styles, on the canvas like any box, so one sketch can hold mocks, edges and tables. A screen of a repository with no styles is a screen, a grey wireframe; never wire nodes or boxes placed by pixel for a layout. Something the owner must press and move through is a walk (show_window), because a sketch is a still picture and clicks nothing; a visual change still gets its walk after he approves the sketch. A mock takes id, x, y, w (its width) and html, and optionally title, css and styles; its height follows the content. Before the first mock, call get_design_catalogue instead of reading stylesheets yourself: one call answers the repository's tokens by role with each theme's value, its components with their real class names and a markup sample, the glyphs below and its house patterns; ask for one area, narrowed with match. Write html with the app's real class names, read from the catalogue or the component's own markup and stylesheet: Fleet draws it with the repository's stylesheets, and a mock is only as true as the markup you type. Never mark a box, card, callout, table cell or node with a coloured stripe on one side (border-left, border-top or an inset box-shadow): the owner hates them, so use a tint fill, a full hairline outline in the hue, a coloured glyph or dot, a chip, or a header band across the whole top. styles is a list of repository paths; leave it out and Fleet finds the closest stylesheets from your work. get_style_sources (optional path) lists them with token names and values and never file text; nothing waits on it, and where it lists several packages, name one with a path inside it. css holds rules the stylesheets lack. Where a stylesheet is not usable (SCSS, Less, a theme module) or Tailwind has no build output, write the rules in css from the tokens get_style_sources gave, because no build runs for a sketch. Scripts, handlers, inline style and addresses are dropped, so put layout in css. <i data-icon=\"bot\"> draws a lucide glyph and data-size sets its size; a name outside this list draws nothing and no error says so: activity, bell, bot, box, check, chevron-down, chevron-right, circle, circle-alert, circle-check, circle-dot, circle-help, circle-pause, circle-x, clock, cpu, ellipsis, eye, file, file-text, filter, folder, git-branch, git-merge, git-pull-request, globe, hammer, hard-drive, layers, link, loader-circle, lock, package, pencil, play, plus, refresh-cw, rocket, scale, scroll-text, search, server, settings, shield-check, sliders-horizontal, terminal, ticket, triangle-alert, user, webhook, wrench, x, zap. A repository with its own icons writes inline SVG. data-part=\"name\" names an element, and the owner's note on it arrives under that name. A sketch holds at most 12 mocks, and html and css count toward the 32768 bytes, so split a big picture into two sketches. A mock is refused when it sends kept, which is Fleet's, when it has no usable stylesheet and no css (draw a screen), or when Fleet would have to guess the package. A screen node is the wireframe: its `screen` field is a layout tree that sizes itself, so give x, y and optionally w (its width) and no h. Every element is {type, ...} with optional id, step, size (auto, fill, or a number: its share of what is left) and align (start, center, end, stretch); an element's step joins the scene's numbering. Types: row and column (gap and pad: none, sm, md, lg; border; children), grid (cols 1 to 12, and the same), window (chrome: desktop, browser or phone; title, url, children), nav (brand, items, active, actions, vertical; items and actions are strings or {text, icon}), panel (title, icon, actions, gap, pad, children), tabs (items, active), list (rows of {text, meta, icon, selected}), table (columns, rows of strings), button (text, variant: primary, secondary, ghost; icon), field (label, kind: input, textarea, select, checkbox, toggle, search; value, placeholder), text (style: heading, title, body, caption; text, lines), image (label), avatar (text), badge (text), divider, spacer, chat (messages of {from: me or them, text}), modal (title, children). Screen icons are lucide names such as search, bell or settings; an unknown one is refused with the allowed list. Example: {\"id\": \"team\", \"kind\": \"screen\", \"x\": 0, \"y\": 0, \"screen\": {\"type\": \"window\", \"chrome\": \"browser\", \"children\": [{\"type\": \"nav\", \"brand\": \"Acme\", \"items\": [\"Home\", \"Team\"], \"active\": \"Team\"}, {\"type\": \"column\", \"size\": \"fill\", \"pad\": \"md\", \"children\": [{\"type\": \"text\", \"style\": \"heading\", \"text\": \"Team\"}, {\"type\": \"button\", \"text\": \"Invite\", \"variant\": \"primary\", \"icon\": \"plus\"}]}]}}. lang names a code node's language. Edge: id (unique), from and to (node ids), optional label, flow (true animates it), step, color, line, head, path. line is solid, dashed or dotted: dotted for an optional or later step, and flow true draws it dashed. head is end, start, both or none: both for a two-way exchange, none for a plain link. path is elbow, straight or curve: straight for a short hop, curve where elbows would cross. step is a number on a node or an edge, and nodes and edges share one numbering: everything with the same step number plays together, in ascending order, and the dot travels the edge from `from` to `to`. An edge with no step never pulses. For a sequence diagram use group nodes as lifelines, label nodes as points on them, and stepped edges as the arrows between them. For a workflow, step the nodes and the arrows. against is the title of an earlier sketch of this job: the owner reads the new scene as a change to it, and Fleet keeps that earlier scene whole, so redrawing it later does not move the diff. It is refused if this job holds no sketch of that title; and where this title is new, against names the sketch it replaces, so the new drawing is that sketch's next revision under the new title, not a second sketch. One ask is one item: each sketch that asks is its own artifact and its own item on his list, and nothing joins another, so ask one thing per sketch. A sketch that asks with no question, or with one not worded as a question, is refused. To put takes to him as a vote, so he picks one with Send pick, do not draw them as a sketch to approve, which is refused: call add_part with kind takes, each take a scene, your pick first, a take about a screen drawn as a mock of that screen with short, plausible content. Takes stand alone: a sketch under the title of takes is refused, so put the background in the takes' question or for line, never in a drawing beside them. At most 80 nodes, 120 edges and 32768 bytes, the scene and against together; a scene that breaks a rule is refused with the part and the allowed values, and nothing is drawn. The owner approves the sketch or asks for changes with a note on its card, and his answer comes to you as a message. Pass asks: false for a sketch that explains, such as a cause, a map or a result, and leave it on for one that needs his OK: a sketch with asks false never waits on him, needs no question, has no Approve, and is kept in the thread and Artifacts; his note on it reaches you as a message. Redrawn under the same title it still asks nothing. The sketch you lead a result with is the exception: it rides on the done card, and all_done takes it off his list with no verdict, so draw it, call all_done and do not wait for an approval Optional feature: a slug or a list of slugs of the features this serves; Fleet files it under them, and a slug the project does not hold is kept for the Operator to confirm."
notes = """
`POST /sessions/sketch`, body `ShowSketch`: `title`, `scene`, an optional `against`, an optional `asks` (default `true`), a `question` required where it asks, an optional `for` and `links` (`docs/practices/protocol/what-an-artifact-is-for.md`) and an optional `session_id`. Answered with the `SessionRecord`; **through the agent's door, a receipt** of `session_id` and `sketch`, the title it was kept under.

**The scene is checked in `ipc` (`sketch.rs`) against the rules Bridge draws it by**, which draws a scene that fails as an empty frame and says nothing. A refusal is 422 and lists up to twelve problems, each naming the part (`nodes[1] `b``, `edges[0] `e1``), what it holds and what is allowed. It is stricter than the drawing in one way: a field the format has no name for is refused, where the drawing drops it, so a misspelt `titel` is heard of. A scene with no nodes is refused too. `tests/sketch.rs` checks that this description names every kind, wire part and icon.

**A `screen` node carries a layout tree in `screen`**, checked by `crates/ipc/src/sketch/screen.rs`: each element is refused with its path (`nodes[2] `team` screen.children[1].rows[0].icon is `home`. Allowed: ...`) for an unknown `type`, a field it does not take, a bad `size`, `align`, `gap`, `pad` or icon, or the wrong shape. A tree nests at most 12 levels. The description names the types and not the glyphs, which a refusal lists.

**`step` is a finite number on a node or an edge**, one numbering for both. **`against` names an earlier sketch of this job by title.** Fleet resolves it at the call and keeps that scene whole in `detail.against`, so a later replacement does not move the diff; a title the job holds no sketch of is refused with 422, `fleet.sketch_against_unknown`, naming the titles it does hold, and a blank one with `fleet.sketch_refused`.

**A `mock` node draws HTML in a sealed frame `w` wide** with the repository's stylesheets: `html` (not blank), an optional `css` string for what those lack, and an optional `styles` list of repository paths, which `get_style_sources` names. `html`, `css` and `styles` on any other kind are refused, as `screen` is. **`kept` is Fleet's**: it names the kept style set a mock was drawn with, and a scene that sends it is refused. At most 12 `mock` nodes per sketch; past that, split it. `html` and `css` count in the 32768 bytes. **Fleet draws the mock with the stylesheets it keeps for it** and writes their hash in `kept`: the `styles` named, else the closest to the Job's work, else the checkout's usable sheets that set the most tokens. A mock with no stylesheet a browser can use and no `css` is refused, as is one in a repository of several packages with no file to start from, and a `styles` entry outside the checkout or not usable; the 422 `fleet.sketch_refused` says what to change. Bridge drops scripts, handlers, inline `style`, addresses and tags that load, swaps `<i data-icon>` for its glyph (the names in `mock-icons.ts`; an unknown one is left empty) and names a part by `data-part`. A document's `armada-sketch` may hold `mock` nodes, drawn the same way.

**Takes drawn side by side are refused**, because Approve never stands in for a pick (the owner, 14 Nov 2026): a scene of two or more `mock` or `screen` nodes where two lead with different take letters (`A` to `F`, past an introducing `Take` or `Option`, then a space, `:`, `·`, `.` or `)`), by their own title or a `label`'s just above them, or where one says `(my pick)`, is a 422 `fleet.sketch_takes` naming the titles and saying to put them with `add_part`, `kind` `takes`. `record_plan`'s `sketch` is held to the same rule. Boxes are never takes.

**Capped**: 80 nodes, 120 edges, 20 strokes, 32768 bytes written (the scene and `against` together), 120 characters of title. The scene rides on the job's record, which is published whole on every change.

**The job is the one whose process holds the connection** when Fleet hosts it, whatever the body says; `session_id` is read only for a job in a terminal, as `show_window`'s is.

**Kept as an attachment of kind `artifact`**, `target` `sketch:<title>`, `detail` of `form` `sketch`, `by` `agent`, `title`, `scene` (the scene as JSON text, because `detail` holds strings only) and, where `against` was given, `against` (a JSON object `{"title", "scene"}` written as text, `scene` being the earlier scene's JSON text as it was kept), `drawn`, an id new on every call, and `asked` `"true"` unless the call passed `asks: false`, which put it to the person to approve or send back (`answer_sketch`). A second call with the same title replaces the detail of the same row, so the sketch is replaced where it stands. It is held after the job ends and survives a restart. Nothing is written to the thread and no window opens.

**A sketch that asks carries its `question`**, the ask in plain words: at most 200 characters, one line, no backticks, ending in `?` (`ipc::question_checked`). It is kept in `detail.question` and titles his Needs you item. Missing or not a question is a 422 `fleet.sketch_refused` saying how to word one. A sketch the pending plan names is approved with the plan and needs none.

**One ask is one item** (the owner, 19 Nov 2026): a sketch under a new title is its own artifact and its own item, whatever else of the Job still asks. **Takes stand alone**: a sketch under the title of an artifact holding takes is 422 `fleet.sketch_takes`, and one under the title of an artifact whose part still asks, with `asks` left on, is refused the same way.

**`asks: false` is for a sketch that only explains** (a cause, a map, a result). Fleet writes no `asked`, so the sketch raises no Needs you item, its card has no Approve or Ask for changes, and `answer_sketch` on it is refused 409 `fleet.sketch_not_open`. It is still an artifact of the Job, in state `reading`, and opens like any sketch. A redraw of its title carries no `asked`, whether the earlier drawing asked or not; a redraw with `asks` left out asks again. His note on it, made on the sketch as for any, is an ordinary message of his to the job and changes nothing on the sketch, as the words of a part with `asks: false` do not ask (`add_part`).


**`feature` files it under the features it names**, a slug or a list of slugs (`FeatureNames`, trimmed and lower case). Fleet keeps `detail.feature` and links the artifact to each feature the project holds, as a link of kind `sketch` (`docs/concepts/feature-catalog.md`). A slug the project holds no feature of is not refused: it is kept as a proposal for the Operator to confirm, and only where the project has a library.

`agent_access` is `Yes`: the job is the one with something to show.
"""
