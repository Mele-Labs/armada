[operations.share_job_margin]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "A shared Job's margin threads on one page, for another Mac reading them through the link"
notes = """
`GET /other_mac/margin?session_id=&document=`, the query of `get_margin_threads`, answered as it answers, with `MarginThreads`. A Job in an unshared project, in none, or held from another Mac is refused 404 `fleet.no_such_session`, worded exactly as for a Job that does not exist, and what `get_margin_threads` refuses is refused as it does. Since 26 Nov 2026.
"""
