[operations.list_issues]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "A repository's open issues as its tracker lists them, each with the Job dispatched from it where one is still going"
notes = """
`GET /issues/:repository`, `repository` a manifest id, and `?refresh=true` to read the tracker again whatever is held. #91, `docs/concepts/tracker.md`. Answers `IssueList`: `manifest_id`, `fetched_at`, `issues` newest edit first, and `stale` where the read just tried failed and an older list is answered instead, in the tracker's words.

Each `TrackedIssue` carries `number`, `title`, `url`, `labels`, `assignees`, `updated_at`, `excerpt` (the body's first 240 characters, whitespace folded), `linked_pull_request` where the tracker says a pull request closes it, and `job_id`, the Job dispatched from it that has not ended, read from Fleet's own record.

**Read on ask, not polled.** Fleet keeps the last list a repository was read for and answers it again for five minutes; past that, or with `refresh`, it reads the tracker. **A view and nothing more**: listing creates no Job and writes nothing. A dispatch from an issue is `propose_from_request` with the issue's `url` as the request.

Refused with a 500 `fleet.issues_unreadable` where the tracker would not answer and nothing is held (no tool, nobody signed in, no tracker for the repository), and a 422 for a repository Fleet does not serve.
"""
