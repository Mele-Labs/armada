[operations.examine_job]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Go and look at this Job now, and answer with what was found"
notes = """
**The rung below intervene, and there was none.** Every other act on a Job either changes it or reads what it already recorded, so a person who suspected a Job was wedged had one move — end it — and no way to find out first whether ending it was warranted. That is why the Board milestone's Job was killed: not because killing was known to be right, but because establishing anything else meant leaving Armada.

Five looks, each saying whether it could tell working from not: whether the process Fleet believes is running exists, whether the worktree is on disk, when anything was last written to the Job's own log, which span the Job is in and what is supposed to end it, and what Fleet's own liveness watch currently reads.

**`cannot_tell` is a real answer and is never rounded up.** One look that cannot separate the two keeps the whole examination off `working` — an answer of "everything looks fine" on a plainly hung Job spends a person's suspicion and returns nothing. Two of the five can never say `not_working` at all and say so where they are drawn: a Job's log is quiet while a Drone works steadily, and a quiet Drone is what a long command looks like.

**`working` reads as "this is as it should be"**, not as "a processor is busy". A Job that is over is over and a Job waiting for a person is waiting for a person; neither holds a process and neither is a fault. Under the other reading every finished Job would examine as broken.

**A command rather than a query, and the line is worth stating.** It decodes no body and answers no 201, which are two of the three marks of a read. What makes it an act is what it leaves: the answer is written into the Job's own log, so it is on the record beside everything else Fleet did rather than in one person's terminal — the same reason a question a Drone asks is an event on a Job.

**It costs no model call and cannot hang.** The reading underneath it is bounded and so is each look. An act pressed by somebody who already suspects a hang must not be the next thing that stops answering, which is `#428` read as a rule rather than as a bug.

**Every status is examinable, terminal ones included.** The span it was found in is where a Job stalls before its first agent, and a Job can be wrong at every other point too — the act means *check this Job*, not *check preparation*.

`agent_access` is `Yes`, which is where it differs from every other command but `redirect_drone`. Nothing it does changes the Job, and the whole value of the rung is that it is reachable before the ladder's destructive rungs are.
"""
