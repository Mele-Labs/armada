[operations.start_watch]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Have Fleet watch something this Job is waiting on, such as a deploy, an environment or a pipeline a push to another branch started, instead of polling it yourself. Fleet runs a command every so often and wakes you only when it fails, passes and is finished, gives up, or breaks. Not for a pull request's own checks: Fleet already tells you when those fail. Where it runs: the command's folder is this Job's slot, so gh reads {owner}/{repo} from its remote; its environment is your login shell's, read when the watch starts and kept for its life, so your PATH and exported tokens are there; keychain-backed CLIs such as gh work because Fleet runs as you. Try a command first with try_watch, which runs it once the same way. The command's last line on standard output is one JSON object: state (waiting, running, passed or failed), finished (true once nothing will change), says (one sentence), optional link, and optional parts, a list of name and state, read one by one when the overall state misleads. Body: name (what the person reads, \"QA deploy\"); then one of: recipe (a recipe's name) with values (an object filling each {name} argument of its command); your own command (a list of arguments, never a shell line) with every (\"60s\", \"2m\") and optional gives_up_after (\"2h\", at most \"24h\"); or in_terminal, text to wait for in this Job's terminal (regex true reads it as a regular expression) with optional gives_up_after, which passes when output arriving after the start matches and fails if the terminal ends first. Armada ships two recipes: github-checks (values sha and context, a prefix of the check runs' and commit statuses' names) and buildkite-build (values organization, pipeline and build, with BUILDKITE_API_TOKEN in your login shell); list_watch_recipes names the rest. Optional follows (a pull request number); optional set_aside, a list of part and sentence, for parts a last watch showed are not yours. A live watch holds this Job open: do not call all_done while one runs, and add no waiting_for item for it"
notes = """
`POST /watches/start`, body `StartWatch`: `name`, then `recipe` with `values`, `command` with `every` and an optional `gives_up_after`, or `in_terminal` with an optional `regex` and `gives_up_after`, flat; an optional `session_id`, `follows` and `set_aside` (each `{ part, sentence }`). A recipe with any of `command`, `every` or `gives_up_after`, `values` with a command, `in_terminal` with a recipe, a command, `values` or `every`, `regex` without `in_terminal`, no shape, or a key the body has no name for is refused as the body is read, 400. Answers 200 with the `WatchSummary`, whose `login_shell` says whether the login shell's environment was read or Fleet's own stands in, and why.

**A recipe** is found by name among the ones Armada ships, the repository's `.armada/watches/`, read from the base branch, and this machine's `~/.armada/machine/watches/`, the most specific copy winning whole (`config::WatchRecipes`). A shipped recipe's `armada` is Fleet's own binary, run by its whole path. **A value fills one whole argument**: an item written `{sha}` is replaced by `values.sha`, and nothing is read by a shell. A value the command does not name, one it names and is not given, and a blank one or one holding a NUL are each a 422 `fleet.watch_value_refused`. A name with no recipe is a 422 `fleet.watch_recipe_unknown`, naming the recipes there are and any file left out with why.

**A terminal watch** (`in_terminal`) runs nothing: it hears the Job's terminal from its start, each line as the pane draws it, and its reading is `passed` and finished on the first that matches, `says` quoting it. A terminal that ends first, or is not open when it listens again, is a `failed` reading. No terminal open at the start is a 409 `fleet.watch_terminal_closed`; a blank `in_terminal` or a pattern that will not compile is a 422 `fleet.watch_refused`. It listens again `timeouts.watchEverySeconds` after a failed reading, and is not among the commands `limits.watchesAtOnce` bounds.

**Limits, from settings.json.** `every` below `timeouts.watchEverySeconds` is a 422 `fleet.watch_too_often`; `gives_up_after` past a day, the ceiling of `timeouts.watchGiveUpMinutes`, a 422 `fleet.watch_gives_up_too_late`, and absent it is that setting. A Job already holding `limits.watchesPerJob` live watches is a 409 `fleet.watch_limit_reached`. A blank `name`, an empty command or blank item, a span that is not a count and `s`, `m` or `h`, and a `set_aside` with a blank part or sentence are a 422 `fleet.watch_refused`.

**The Job** is the one whose process holds the connection when Fleet hosts it, whatever the body says; `session_id` is read only for a Job in a terminal, as `waiting_for`'s is, and one Fleet holds no Job by is a 422 `fleet.no_such_session`. Nothing placing a Job is a 422 `fleet.watches_unplaced`.

**Run, and kept.** The watch is kept in the store and its first reading taken within `fleet::watches::EVERY`, 5 seconds, then every `every`, slowing to 2 minutes after 30 unchanged and 5 after an hour. A run is a Check's: no shell, its own process group, `timeouts.watchRunSeconds`, utility priority, in the Job's folder, with the person's login shell's environment (`$SHELL -lic`, read at the start within 15 seconds and kept for the watch's life, read again at its first run after Fleet restarts; Fleet's own where that fails) over Fleet's, the `ARMADA_SPAWNED_BY` mark and, where the recipe names `environment`, that Requests environment's variables, secrets included and taken back out of every reading. At most `limits.watchesAtOnce` run at once across the machine. The Job is told once each time it fails (by the failing parts), passes and is finished, gives up, or breaks three readings in a row; it ends with its Job. `watches.changed` publishes every change.

`agent_access` is `Yes`: the agent is who knows what its change is waiting on, and the person decided a watch needs no one's sign-off.
"""
always_loaded = true
