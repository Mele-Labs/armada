[operations.talk_to_operator]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "The person says one message to the Operator, in the box at the foot of its panel"
notes = """
`POST /operator/talk`, body `TalkToOperator`: `words`, `about` where the person is talking about one card (`turn:<n>`'s own id, which is how Ask on the Operator's page opens the chat about that card), and `attachments` and `mentions`, the files and tags he sent with the words, each absent when empty. **It delivers his words to the Operator's own session** as a message in its thread, as the person's own, with the files kept and named to the session as a Job's message's are, and answers with `OperatorSaid` with every field empty: the answer is the session's thread. Where `about` names a card the message carries a tag naming it, `[About card <id> "<title>"]`.

**Refused**, 422 `fleet.operator_session_not_running`, with nothing kept, **while the session is not running**, whether the Operator is on or off, since nothing would hear the words. No fresh call is made and nothing is ruled: the one-shot call that read his words, offered to start a Job, read an order or forgot a rule went with the Policy.

A hold is never made to stand here: `confirm_operator_order` is his press.

**Whose Operator hears it** (since 28 Nov 2026): each project has its own Operator, and `project` and `looking_at` are what he tells Fleet beside the words. Fleet routes with no memory and no model, by these signals in order, the first that names one project deciding: the card `about` names; `project`, the screen he is on; the project of the Job `looking_at` names; one project or one repository named by name in his words, as a whole word, ignoring case; one project's feature named as `#slug`; a file path in his words that exists under exactly one project's repository; the one project whose Operator runs. **Where none decides**, his words are kept with no project and Fleet raises one card of its own, "Which project is this for?", with up to four of the likeliest projects as its options, most signal hits first, then the project he last talked to. His pick delivers the kept words to that project's Operator and no other, starting its session where none runs. With one candidate the words go there at once; with none this is refused as above.
"""
