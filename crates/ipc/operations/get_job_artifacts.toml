[operations.get_job_artifacts]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "One Job's sketches, drafts and pages as one list, each with its revisions and where its newest stands"
notes = """
`GET /sessions/artifacts?session_id=`. Answered with a list of `JobArtifact`, newest first by when its newest revision was kept: `id`, `title`, `form`, `revisions`, `state`, `words?`, `item?`, `in_plan?`, `presses?` and `votes?`.

**`id`** is the ledger target the artifact is kept under and stays the same across revisions: `sketch:<title>`, the page's path, or `draft:<title>`. **`form`** is `sketch`, `draft` or `page`. **`revisions`**, oldest first, are `ArtifactRevision`: `number` from 1, `at`, `by` (`owner` for one he saved with `save_artifact_edit`, read off `artifact_owner_revisions`, else `agent`) and `form`. A revision's `at` is when he saved it where it is his, else when the attachment's `revisions` list first held it, read off the attachment's history (`get_attachment_history`); one kept before that history began reads its row's `since` for the first revision and `changed_at` for any other.

**`state`** is for the newest revision: `reading`, `asking`, `approved`, `sent_back`, `withdrawn` or `dismissed`, with `words` where he gave any. A sketch reads its `settled`, then `withdrawn_by` `agent` as `withdrawn`, then a dismissal, then `withdrawn`, then `asked`. A page reads its `settled`, then `withdrawn_by` `agent` as `withdrawn`, then a dismissal, then `asked` with its file gone as `withdrawn`, then `asked`, else `reading`. A draft reads its newest row's `settled`: `approved` and `fixed` are `approved`, `sent_back` is `sent_back`, `withdrawn` is `dismissed` where he dismissed it and `withdrawn` otherwise, and an open row is `asking`. **`withdraw_sketch` and `withdraw_document` write the dismissal his Dismiss writes, and mark the attachment `withdrawn_by` `agent`**, so a sketch or a page the Job took back reads `withdrawn`; one withdrawn before the mark existed reads `dismissed`.

**`archived`**, absent unless archived, is `ArtifactArchived`: `by` (`agent` or `owner`) and `at` (`archive_artifact`). A dismissal the archive wrote is not read as his: the artifact reads as it stood, and names no `item` while that dismissal stands.

**`item`** is the Needs you id that answers it now, the one Classic answers: `sketch:<title>`, `document:<path>`, or `draft:<row id>` of the newest draft row. Absent unless `state` is `asking`, and for a page also absent where Needs you leaves it out. **A sketch the pending plan names is `plan:<version>`**, the plan's item, since that plan's Approve settles it; while a walk still holds the plan, Needs you lists neither.

**`in_plan`** is the plan version a sketch goes with: the pending one naming it while it asks, or the one whose Approve settled it, read off its `in_plan` detail. Absent for every other artifact, and for a sketch drawn again after that Approve, since a new drawing does not carry it.

**`presses`** is every press of an action a page declares, oldest first, each a `PagePress` (`press_page_action`), read off `page_presses`. Absent where there is none, and for every form but a page.

**`votes`** is the newest cast of each vote a page declares, in the order each vote was first cast, each a `VoteCast` (`cast_page_vote`), read off `page_votes`. A recast replaces the earlier one in place. Absent where there is none, and for every form but a page.

**`seen`** is the newest revision he opened, as `mark_artifact_seen` kept it, read off `artifact_seen`. Absent while he has opened none, and it only moves forward.

Only artifacts of form `sketch`, `document` and `draft` are listed; a file, an image, a window or a note shown to him is not. Read on demand and never carried on a `SessionRecord`; a `session.changed` is when to read it again.

Refused: 422 `fleet.session_unnamed`, a job Fleet does not know.
"""
