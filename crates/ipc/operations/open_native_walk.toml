[operations.open_native_walk]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Start the native Bridge of the build the person runs on a job's native walk, when he presses it"
notes = """
`POST /sessions/window/open`, body `OpenNativeWalk`: `session_id` and `url`, the `armada://walk/<name>` address `show_window` named. Answered with `NativeWalkOpened`: `started`, false where the app was already running for that walk. Bridge sends it on the person's press of Open on the job's tab, and nothing else does: Fleet never starts the app on its own.

**The app is the native Bridge Fleet built from the job's own commit**, kept as `Armada/walk-builds/<repository>/bins/<commit>/bridge-native`, the last three of each repository. A row that carries no build, written before walks were built from a job's branch, runs from the build he keeps: `Armada/builds/current/Armada.app`.

**Refused with 422 and nothing started** unless the job has an open `window` row on that address (not ended, not withdrawn) and the address is a native walk's; and unless the row's build is ready: `<url> is still building from commit <sha>` while it builds, `<url> did not build from commit <sha>: <why>` after it failed, and where the kept binary was pruned, `the build of <sha> is no longer kept, so <url> is building again`. A row with no build is refused only where the build he keeps has no native Bridge: `the build he runs has no native Bridge at <path>`.

**Fleet starts** `<app> --walk <name> --job <session_id> --url <url> --fleet-port <port>` with the build's folder as its working directory, the app hard-linked into a bundle of the walk's own under the support folder, so its menu bar and Dock stay apart from his running native Bridge's. **Fleet owns the process**: it is stopped when the walk ends (the window closed, withdrawn, approved or replaced), when the job ends and when Fleet stops. Opening again while it runs starts no second process; a press after the job's walk was built from a newer commit, or his preview restarted onto a newer build, stops it and starts that one.
"""
