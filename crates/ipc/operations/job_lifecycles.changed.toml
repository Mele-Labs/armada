[operations."job_lifecycles.changed"]
kind = "event"
transport = "WebSocket"
agent_access = "Bridge only"
description = "What a Job holds changed: an instance was taken on or moved, and this is everything it holds now"
notes = """
Carries `JobLifecycles` itself, the answer to `get_job_lifecycles`, so a client replaces what it holds for `session_id`. Published when the Job takes a ticket, a pull request or a Job it started on, when a link is added to one it holds, and when a read finds an instance standing somewhere else. **A read that finds it where it stood publishes nothing.** A Job that holds nothing publishes nothing. Moves are rare (a status changed at the tracker, a review landed at the forge), so a Job publishes a handful in its life. A Bridge that missed one reads `get_job_lifecycles` on the resync that follows a `Missed`.
"""
