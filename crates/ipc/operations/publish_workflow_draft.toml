[operations.publish_workflow_draft]
kind = "command"
transport = "HTTP"
agent_access = "Bridge only"
description = "Write the draft of a workflow through the save path, at the scope the owner picks for Armada's and in its own place for any other, then delete the draft"
notes = """
`POST /workflows/draft/publish?manifest_id=`, protocol 23.95. The body is `PublishWorkflowDraft`: `workflow_id`, `source`, `project`, `scope` and `overwrite` (`repository`, `kit` or `{"project":{"id":"…"}}`). The answer is a `WorkflowPublished` `{ saved }`, `saved` being the `WorkflowSaved` the save made (a struct, so what a publish adds to it has room).

**The scope.** For a draft of an `armada` workflow, `scope` is required and may be any of the three, since a draft of Armada's has none until the copy is made; 422 `fleet.workflow_draft_scope_needed` without it. For any other source it is absent or names that same place; 422 `fleet.workflow_draft_scope_differs` where it names another, so a publish never moves a draft to a place it was not made in.

**A stale draft is refused.** 409 `fleet.workflow_draft_stale` where the text published in the draft's place no longer equals `base`, because a hand edit, a `save_workflow` or another publish came in between. Nothing is written, and the draft stays so the owner can see what changed. A draft of Armada's is stale where Armada's carried text is not its `base`; it is not held against a copy already in the scope picked, which a publish replaces only with `overwrite`.

**Saved by the existing save.** A draft of any source but `armada` always replaces its own place (the save's `overwrite`), since that is the copy it was drafted from and the stale check guards it. For a draft of `armada`, `overwrite` (default false) says whether to replace a definition the scope already holds; without it the save's own refusal comes back, 422 `fleet.workflow_exists` naming the file, nothing written and the draft kept. The loader's refusals pass through unchanged and nothing is written on one: 422 `fleet.workflow_unfit` with its sentence (a draft whose `unfit` is set is refused here, and also where its `workflow_id` is not the draft's), 422 `fleet.workflow_id_not_a_name`, 500 `fleet.workflow_unwritable`, 404 `fleet.workflow_project_unknown` and 422 `fleet.workflow_project_not_member` for a project's scope. The draft is deleted only once the file is written. Fleet reads the places again before answering, so the repository runs it at once, as it does for `save_workflow`.

404 `fleet.workflow_draft_none` where no draft is kept. `save_workflow` is unchanged and still writes at once; the Classic Bridge uses it.

`agent_access` is `Bridge only`: what is written decides what every Job here is gated on, and it is the owner's press.
"""
