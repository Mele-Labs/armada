[operations.release_session_holds]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Give back everything a job holds on the ledger, or hand it to another live job of the same repository"
notes = """
`POST /sessions/release_holds`, body `ReleaseSessionHolds`: `session_id`, an optional `to_session_id`, and an optional `rows`, each a `ChosenHold` of `kind` and `target`. Answered with `SessionHoldsReleased`: `moved`, each row given back or handed over (a slot given back carries `released`, the branch and what was committed to it), and `kept`, each row that stayed with why. `docs/concepts/session.md`, *Releasing what a Job holds*.

**It acts on the `standing` `slot`, `branch` and `pr` rows `rows` names, and on every one where `rows` is absent.** A slot the pool holds for the Job counts though its ledger has no row for it, and a slot takes the `branch` row of what it has checked out with it. A row the Job does not hold standing is refused with a 409, `fleet.hold_not_standing`, before anything changes. Artifacts, messages, subagents and the links between Jobs are left alone. Where a slot is among the rows, a hosted Job whose turn is running is stopped first, as `stop_session` stops it, and only then; the Job stays live and its next message resumes it. Nothing is deleted: no branch and no file.

**With no `to_session_id`, each row is given back.** Each slot the pool holds for the Job is released as `change_slot_pool`'s `release` releases it: what is uncommitted is committed to the slot's branch and the slot is freed. A slot that release refuses stays held and is named in `kept`.

**With one, each row is given back by the Job and written standing for the target**, `detail.handed` reading `session <id>`. Each slot's lease moves to the target as it stands, with nothing committed; the target holds it as a hosted Job holds its own. Refused with a 409 and nothing changed where the target is the Job itself (`fleet.hand_to_itself`), has ended (`fleet.hand_to_ended`) or is of another repository (`fleet.hand_to_other_repository`). A target Fleet has no row for is a 422.

A Job Fleet has no row for is a 422, `fleet.no_such_session`.

`agent_access` is `No`: it is the person's act from Bridge, for when an agent cannot give back what it holds.
"""
