[operations.save_limits]
kind = "command"
transport = "HTTP"
agent_access = "Helm only"
description = "Save any of the four limits, and answer with what is now in force"
notes = """
**Changed while Fleet runs, and kept across a restart.** The save is written into settings.json, under the four `limits.*` keys `get_settings` describes, before anything in memory moves, and the next admission turn reads the new values; no restart, and nothing already running is stopped. A bound lowered below how many Drones are working holds new starts until enough finish.

**An omitted field keeps its current value**, saved or shipped. A key nobody saved stays out of the file, so a later build shipping a different number still reaches it. A hand edit to the file that is refused leaves the last good values in force, and a save over it writes the good values back.

**A value out of range is a 400 and nothing is saved** — including an in-range field sent beside it. The body does not decode, because `ipc::SaveLimits` cannot hold such a value; the daemon is never asked. Concurrency is 1 to 8, the memory share 0 to 50 percent, the disk floor 0 to 100 GiB, Checks at once 1 to 8. A saved Checks at once counts from the next Check to start anywhere on the machine; one already running finishes.

Publishes `settings.changed`, since it writes the file `get_settings` reads. `get_capacity` is computed at every read, so it reflects a saved bound the moment the save answers.
"""
