[operations.mark_build_note_looked_at]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Mark the note of a branch at a tip as looked at, good or needing work, so the next build shows only what is new"
notes = """
`POST /fleet/build/notes/looked_at`, body `MarkBuildNoteLookedAt {branch, tip, verdict?}`, the `branch` and `tip` of a note of `get_build_notes`, and `verdict` `good` or `needs_work` (since 15 Nov 2026). Answered `BuildNotes`: the notes now.

Fleet keeps the mark against the (branch, tip), so it holds across a restart, and **a branch offered again at another tip is a new note, not looked at**. Marking twice keeps the first time; a verdict replaces the one kept, and none keeps it. The first mark and each change of verdict tell the note's Job, where it is live, as `build_moved` news: good says its work is fine, and needs work tells it to wait for his words. Publishes `build_notes.changed`.

Refused 404 `fleet.build_note_unknown` where no note is kept for that (branch, tip). The note need not be in the running build: a Bridge that is a build behind marks what it drew.

`agent_access` is `No`, and from inside a Job the route is a 403 `api.the_persons_own`: whether he has looked is his to say.
"""
