[operations.commit_to_repository]
kind = "command"
transport = "HTTP"
agent_access = "Bridge only"
description = "Commit a copy of one piece a person keeps for a repository into the repository, by a Job of its own with a pull request for that alone"
notes = """
Since 19 Oct 2026; since 21 Oct 2026 by a Job of its own. `POST /repositories/commit`, body `CommitToRepository`: `repository`, a root `list_repositories` names; `piece`, a `PieceToCommit` tagged by `kind`; `overwrite`, false where absent; and `remove`, false where absent. No Job need be open, and none is named. One route for every kind of piece. Answers `CommittedToRepository`: `repository`, `session_id` (the Job made for this commit), `branch` (its own), and `paths` (each file written or removed, relative to the repository's root). **Answered once the Job and its branch exist**: the commit, the push and the pull request follow in a task of their own. The pull request goes on the Job's row when it opens, and a failure after the answer is `act.failed` with act `commit_to_repository` and that Job's `session_id`. Until 24 Oct 2026 the answer waited for them and carried `commit`, `pull_request` and `pull_request_not_opened`.

| `kind` | Carries | Copied from | Written to |
|---|---|---|---|
| `flight_controls` | `job[]`, `deck[]`: tile ids | the person's own tiles for the repository, where `get_repository_flight_controls` reads them | `.armada/flight-controls.toml`, beside the tiles main already holds |
| `workflow` | `workflow_id` | Kit's `~/.armada/workflows/`, a definition this repository runs | `.armada/workflows/`, under the Kit file's own name |
| `review_tool` | `id`, the dashed name | Kit's `~/.armada/review-tools/` | `.armada/review-tools/<id>.md` |
| `requests` | `collections[]` by `id`, `environments[]` by `name` (since 21 Oct 2026) | the person's own requests file for the repository, where `get_requests` reads it | `.armada/requests.toml`, beside what main already holds, written as `get_requests` reads it |
| `lifecycle` | `id`, `scope?` | Kit's `~/.armada/lifecycles/`, the file that declares that id and scope | `.armada/lifecycles/`, under the Kit file's own name |
| `lifecycle_rule` | `id`, `scope?` | Kit's `~/.armada/rules/` | `.armada/rules/`, the same |
| `workspace` | `id` | Kit's `~/.armada/workspaces/` | `.armada/workspaces/`, the same |
| `autonomy` | `id`, `scope?` | Kit's `~/.armada/autonomy/` | `.armada/autonomy/`, the same |

**The last four are found by what a file declares, and not by its name**, as `save_lifecycle_piece` finds one: `scope` is a `PieceScope` (`{ kind: "everywhere" }` where absent, `{ kind: "within", id }`), and `ticket` everywhere and `ticket` within a scope are different pieces. A Workspace has no scope. The file on main that declares the piece is the one replaced, whatever it is called, and with `overwrite` only; a file under the Kit file's own name that declares something else is never written over, with or without it.

**Where a piece may be committed follows its scope.** A piece scoped within a Workspace is read by every repository in it from the Workspace's home, the one served repository whose `.armada/workspaces/` holds the Workspace file, so it is committed there and nowhere else; a refusal names the home, and one for a Workspace only Kit holds says it has none yet. A piece scoped within a repository's Manifest id is that repository's. A scope naming neither is refused. A Workspace is committed to one repository: a second that already holds the id is refused, since two repositories holding one Workspace leave both set aside.

**`remove` takes a piece out of the repository.** The file on main that declares it is deleted on the Job's branch, in one commit that names the path as a deletion, and the pull request carries that alone (`Remove the rule nudge`). Only the four kinds above can be removed; `remove` with any other kind is refused, and so is a piece main does not hold under that id and scope. `overwrite` means nothing with it, and Kit's copy is not read or touched.

**A secret variable goes as its name and `secret = true`, never its value**: the requests file has nowhere to hold one, and the value stays in the Keychain of the person who kept it. A colleague's checkout reads the secret as named and not set until they give it a value.

**A copy, never a move.** The person's own piece is read and left as it is. **A Job of its own**: every refusal is decided against the checkout, which is read and never written, before anything is made. Fleet then starts a hosted Job titled for the piece (`Commit the tile Run tests`) whose agent never starts, leases it a slot and its own branch, writes the files in its tree, commits them alone with a message saying what was added (`Add the tile specs`), pushes the branch and opens a pull request into the base. The pull request goes on the Job's row, so it is watched, merged and reported as every Job's is. A workflow or review tool is copied as its file is written; tiles are written whole, as `save_flight_controls` writes.

**A pull request that does not open loses nothing**: no remote, a push or forge that refuses, or no tool on the machine leaves the Job holding its branch with the commit on it, and `act.failed` says which, as a 500 `fleet.commit_pull_request_not_opened` carrying the words.

Refusals, each a 422 unless named, and none but the last leaves a Job: `fleet.commit_not_yours` for a tile, workflow, review tool, lifecycle, rule, Workspace, autonomy default, collection or environment the person does not keep, no tiles chosen, no collection or environment chosen, or a person's own requests file that will not read; `fleet.commit_exists` where main already holds the id and `overwrite` is not set, naming the file, or holds every file exactly as it would be written, or a file under the same name that declares something else; `fleet.commit_refused` where main's own tile or requests file will not read, the tiles together break `save_repository_flight_controls`' rules, a piece is committed to a repository its scope does not belong to, a Workspace is committed to a second repository, `remove` is asked of a kind that cannot be removed or of a piece main does not hold, or no slot could be leased for the Job, which is then closed; a 404 `fleet.run_memory_repository_not_served` for a repository Fleet does not serve; and, only as `act.failed` once the Job exists, a 500 `fleet.commit_unwritable` where a file cannot be written or git refuses the commit, which leaves the file written and uncommitted in the Job's tree.

`agent_access` is `Bridge only`, `save_flight_controls`' reason: what is committed can run a shell line, for everyone on the repository.
"""
