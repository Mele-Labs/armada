[operations.commit_to_repository]
kind = "command"
transport = "HTTP"
agent_access = "Bridge only"
description = "Commit a copy of one piece a person keeps for a repository into the repository, on the branch of the Job they are in"
notes = """
Since 19 Oct 2026. `POST /repositories/commit`, body `CommitToRepository`: `repository`, a root `list_repositories` names; `session_id`, the open Job whose branch takes the commit; `piece`, a `PieceToCommit` tagged by `kind`; and `overwrite`, false where absent. One route for every kind of piece. Answers `CommittedToRepository`: `repository`, `branch`, `paths` (each file written, relative to the repository's root) and `commit`, absent where the branch already held the files as written.

| `kind` | Carries | Copied from | Written to |
|---|---|---|---|
| `flight_controls` | `job[]`, `deck[]`: tile ids | the person's own tiles for the repository, where `get_repository_flight_controls` reads them | `.armada/flight-controls.toml`, beside the tiles the branch already holds |
| `workflow` | `workflow_id` | Kit's `~/.armada/workflows/`, a definition this repository runs | `.armada/workflows/`, under the Kit file's own name |
| `review_tool` | `id`, the dashed name | Kit's `~/.armada/review-tools/` | `.armada/review-tools/<id>.md` |

**A copy, never a move.** The person's own piece is read and left as it is. **Never the checkout**: the files are written in the tree of the Job `session_id` names and committed alone on its branch, with a message saying what was added (`Add the tile specs`), so they land with that Job's pull request. A workflow or review tool is copied as its file is written; tiles are written whole, as `save_flight_controls` writes.

Refusals, each a 422 unless named: `fleet.commit_no_job` with no `session_id`, or one that is not in this repository or holds no slot ("No Job is named. Commit from a Job open in this repository."); `fleet.commit_not_yours` for a tile, workflow or review tool the person does not keep, or no tiles chosen; `fleet.commit_exists` where the branch already holds the id and `overwrite` is not set, naming the file; `fleet.commit_refused` where the branch's own tile file will not read, or the tiles together break `save_repository_flight_controls`' rules; a 404 `fleet.run_memory_repository_not_served` for a repository Fleet does not serve; a 500 `fleet.commit_unwritable` where a file cannot be written or git refuses the commit, which leaves the file written and uncommitted in the Job's tree.

`agent_access` is `Bridge only`, `save_flight_controls`' reason: what is committed can run a shell line, for everyone on the repository.
"""
