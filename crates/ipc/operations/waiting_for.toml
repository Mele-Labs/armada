[operations.waiting_for]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Set the whole list of what this job is waiting on the person for, so Bridge shows it without being asked. Body: {items: [{id, text, act?: {kind, target}, options?: [{label, description?}], approves?: true, steps?: [line]}], session_id?}. id is yours and stays the same while the item is open; text is one short line. act kind is answer (target the question's call), approve_pr (target the pull request's number), run (target the command) or message (target a job's id); walk is refused, since a walk is show_window's. options are the choices of an answer item. An option may carry picture: {image, width, height, parts?: [{name, label, x, y, w, h}]}, only where your Logbook says he looks at questions. To draw one, render each option's mock at one set width with the browser tools, save a PNG with browser_screenshot, read each [data-part] element's box with browser_evaluate (getBoundingClientRect, scaled to the PNG's pixels) and take the label from data-label or the element's text. Pass the PNG's path as image with its real width and height. Fleet checks the file and every box, refuses a bad picture by name, and keeps the rest. approves: true asks for his approval: Fleet gives the item two options, Approve then Ask for changes, in place of any you pass, and his Approve closes your plan's first open you_approved gate; Ask for changes, words alone or a removal leave it open. An item the person must carry out as several steps in order passes steps, a list of short lines, with the command in act and a step's own command in backticks. Every call states the whole list, and an empty items clears it. The answer is each of your items as Fleet kept it, then `fleet`: the items Fleet added for this job (id, kind, text), read-only to you. State only your own; Fleet's are never yours to repeat or clear"
notes = """
`POST /sessions/waiting`, body `SetWaitingFor`: `items` (each `id`, `text`, an optional `act`, an object of `kind` (`answer`, `approve_pr`, `run` or `message`; `walk` is refused) and `target`, optional `options`, an optional `approves`, and optional `steps`, a list of short lines the person follows in order, which Fleet trims and drops blanks from) and an optional `session_id`. Answered with the `SessionRecord`; **through the agent's door, a receipt** of `session_id` and `waiting_for`, the agent's own items as Fleet kept them, each `id`, `text`, and `act`, `options`, `approves` and `steps` where it has them, so an agent sees what Fleet made of each, then `fleet`, Fleet's own items on the list (`id`, `source` as `kind`, `text`), read-only and never the agent's, so its count matches Bridge's; the receipt and not the row, because the row grows with every attachment and an agent keeps each answer.

**Replace-all.** Every call states the whole list; an empty list clears it. A non-empty list also clears `SessionRecord.done_since`, the agent's word from `all_done` that nothing was left. An item keeps the `since` Fleet first stamped for its `id`. Fleet adds its own items to what is read back (`SessionRecord.waiting_for`): `ask:<call>` for an open question, `perm:<call>` for an open permission, `walk:<url>` for a walk window not yet approved. **Where an agent item names the same target as one of those, Fleet's wins** and the agent's is left off. **An item that asks the person to walk is refused**, whether by a `walk` act or in its words (`docs/spikes/walk-item-classifier.md` has the rules), since a walk reaches the list only as the window `show_window` attached; one kept before the rule is left off.

**`approves: true` is an item asking for his approval.** Fleet replaces its `options` with *Approve* then *Ask for changes*, keeps the mark with the item through a restart and a reopen, and keeps his Approve (choice 0) beside the dismissal it makes. That Approve, made at or after the plan was first recorded, closes the plan's first open `you_approved` gate, once. Ask for changes, words alone, a dismissal, and an answer the Operator or Autopilot gives in his place close nothing.

**An option may carry a `picture`**: `{image, width, height, parts?}`, where `image` is a URL or a path Fleet serves, `width` and `height` are the still's pixels, and each of `parts` is a box `{name, label, x, y, w, h}` on the still in those pixels, `name` unique within the picture. Fleet keeps the pictures with the options, through a restart and a reopen, and serves them on `SessionRecord.waiting_for` and the closed list. **Fleet checks and keeps the still, and draws nothing.** `image` names a PNG or JPEG on disk (an absolute path, or one relative to the job's folder) or a file the job already showed; the file must exist, be at most 8 MiB, and be `width` by `height` pixels, read from its header. Every part's box must lie inside the still and `name` must be unique within the option. A bad picture is a 422 naming the option: `fleet.picture_missing`, `fleet.picture_too_large`, `fleet.picture_not_an_image`, `fleet.picture_size`, `fleet.picture_part_outside` or `fleet.picture_part_repeated`. A good one is copied into the job's own kept files, and **`image` is stored and served as `/sessions/shown?session_id=<id>&path=<kept path>`**, the route `GET /sessions/shown` answers; a file the job showed is served where it is. An `image` already of that form for the same job is kept as it is, so a list stated again keeps its pictures. The tool's description above offers `picture` only where the Logbook says he looks at questions.

**The job is the one whose process holds the connection** when Fleet hosts it, whatever the body says; `session_id` is read only for a job in a terminal, as `show_window`'s is. An ended job holds nothing.

`agent_access` is `Yes`: the agent is the one that knows what it needs from the person.
"""
always_loaded = true
