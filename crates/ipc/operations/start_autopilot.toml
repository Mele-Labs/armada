[operations.start_autopilot]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Start a repository's Autopilot with the settings a person confirmed"
notes = """
`POST /autopilots/:repository`, body `AutopilotSettings`. A 201 with the `Autopilot`, `running`, and `autopilot.changed` is published. #2092, `docs/concepts/autopilot.md`.

From the next noticing interval it picks: one model call per pick, reading the instruction, the repository's open issues that no Job, pull request or pick of this run holds, and the workflows. **A pick it is sure of becomes a Job that starts with no approval**, drafted as a dispatch from the issue would be, with the issue as its source and origin `autopilot_picked`, and queued. **A pick it is unsure of is set aside** with its reason, and the next issue is taken in the same pass.

**Each cap stops the next pick and never a running Job.** `until`, `spend_cap_micros` (summed across its Jobs) and `job_cap` (Jobs started) are each optional; the first reached stops it with `capped_by` naming it, and the Jobs it already started carry on. Autopilot can therefore overshoot by as many Jobs as it runs at once, as #51's per-Job cap does.

A 409 `fleet.autopilot_running` where the repository's Autopilot is running or paused: stop it first. A 422 `fleet.autopilot_unsettable` for a blank instruction, `at_once` of 0, or `until` already past, and for a repository Fleet does not serve. Starting again after a stop replaces the record; the old run's picks are no longer served.
"""
