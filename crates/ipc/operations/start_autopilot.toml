[operations.start_autopilot]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Start a repository's Autopilot with the settings a person confirmed"
notes = """
`POST /autopilots/:repository`, body `AutopilotSettings`. A 201 with the `Autopilot`, `running`, and `autopilot.changed` is published. #2092, `docs/concepts/autopilot.md`.

From the next noticing interval it picks: one model call per pick, reading the instruction, the repository's open issues that no Job, pull request or pick of this run holds, and the workflows. **A pick it is sure of becomes a Job that starts with no one asked**: titled with the issue, on the workflow the picker chose, and sent the issue as its first message, its link, its body and the picker's reason, from `Autopilot`. **A pick it is unsure of is set aside** with its reason, and the next issue is taken in the same pass.

**Each cap stops the next pick and never a running Job.** `until`, `spend_cap_micros` (summed across its Jobs' costs), `session_cap` (Jobs started) and `weekly_cap_percent` (the account's `seven_day` window as last read, whole percent) are each optional; the first reached **pauses** it with `capped_by` naming it (#2105, the owner's 12 Oct 2026), and the Jobs it already started carry on. `update_autopilot` raising that cap is what lets Resume through. Autopilot can therefore overshoot by as many Jobs as it runs at once.

`on_autopilot` (`backlog`, `running` and `reports`, each a boolean; `reports` offers the bugs agents reported, on the armada repository's Autopilot only, and a body without it reads as off) and `decisions` (the kinds a helper may answer: `recommended`, `open`, `plan`, `draft`, `walk`, `land`, `unsure`, `red`, `reads`, `writes`) are what the person checked, and the `Autopilot` reports them as they were checked. What a running Autopilot answers is `get_autopilot_decisions`'s. A body without them reads as `backlog` true, `running` false and no decisions, so a start that sends none behaves as before. There is no `destructive` kind: it always waits for a person, and a body naming it or any other word is refused. A start replaces the boxes.

**`project` names the project of his the Autopilot is for.** Each Job it starts is for that project, as a Job started with `StartSession.project` is, and `hosted.project` serves it. It is checked before anything is made, as `start_session` checks it: a 404 `fleet.no_such_project` where he has none by that id, a 422 `fleet.project_not_member` where the repository is not one of its members, and a 422 `fleet.project_unreadable` where the project's file did not read. A start keeps it and `update_autopilot` ignores it.

A 409 `fleet.autopilot_running` where the repository's Autopilot is running or paused: stop it first. A 422 `fleet.autopilot_unsettable` for a blank instruction, `at_once` of 0, or `until` already past, and for a repository Fleet does not serve. Starting again after a stop replaces the record; the old run's picks are no longer served.
"""
