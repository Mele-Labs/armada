[operations.delete_project]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Delete a project, its rows and its file"
notes = """
`POST /projects/project/:project/delete`, no body. `docs/practices/protocol/projects.md`. **Its file goes too** where Fleet keeps it itself, in Kit's folder; a file in a synced folder or a bucket is the person's, and is left. The issues it linked are untouched on the tracker. The loose tasks are no project's, and stay. Answers `Projects` as `list_projects` does, and publishes it as `projects.changed`.

A 404 `fleet.no_such_project` for a `project` he has none of. A 500 `fleet.project_unwritable` where the file could not be removed, and then the project stays.
"""
