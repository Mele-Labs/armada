[operations.save_workflow]
kind = "command"
transport = "HTTP"
agent_access = "On your words"
description = "Check one workflow definition against the repository's Checks and this machine's models, and write it in the repository's own folder or in Kit's"
notes = """
`POST /workflows/save`, protocol 23.28, with `?manifest_id=` as the other Manifest-scoped routes take it. The body is `SaveWorkflow`: `scope` (`repository` for `<repository>/.armada/workflows/`, `kit` for `~/.armada/workflows/`, and `{"project":{"id":"…"}}` for `~/.armada/workflows/projects/<id>/`, one project's copy, since 23.94), `definition` (the whole definition as JSON text) and `overwrite`. The answer is a `WorkflowSaved`: the id, the scope, the file as written, whether it replaced one, and whose definition of that id runs in this repository now.

**Checked before anything is written, with the rules a loader applies.** `config::fit` parses the definition against this machine's models and resolves it against the repository's Manifest, the parse and the resolve a catalogue does, so a definition that is saved is one that loads. A refusal carries the loader's own sentence, every fault of it, and nothing is written: not the file, not the folder, not a temporary one. 422 `fleet.workflow_unfit` where it does not fit, and `fleet.workflow_id_not_a_name` where its `workflow_id` is not letters, digits, `-` and `_`.

**Replacing is said.** A definition that already holds the id in that scope is found by the id it declares and not by the file's name, since two files in one place naming one id leave both out. 422 `fleet.workflow_exists`, naming the file, unless `overwrite` is `true`; with it the file that held the id is the one replaced. A file named for the id that defines something else is never replaced. 500 `fleet.workflow_unwritable` where the file cannot be written.

**A project's copy is for a project Fleet holds that holds this repository.** 404 `fleet.workflow_project_unknown` where Fleet holds no such project, and 422 `fleet.workflow_project_not_member` where the repository named by `manifest_id` is not one of its members; nothing is written. A repository runs, for each id, the first of: a project it belongs to, Kit's, its own, Armada's.

**Held when it answers.** Fleet reads the places again before answering, so the workflow is dispatchable at once and `list_workflows` shows it. A file written by hand is read again by the watch on both folders, after the same settle window `armada.yml`'s has. Either way a definition that does not fit is left out with its reason on `list_left_out_workflows` and the rest stand; start does the same, and since 23.29 no longer refuses a repository whose own definition does not fit.

**Since 23.96 a save into a place with no base records one where the text is Armada's carried text of that id byte for byte**, which is how a copy is made from Armada's (`get_workflow` with `source=armada`, saved as it is): the carried `version` and text are kept as what the copy began from, and `list_workflows` then says `armada_changed` once Armada moves. A save of any other text records none, and a save writes no version: `get_workflow_versions` is a publish's.

`agent_access` is `On your words`, `edit_manifest`'s reason: what is written decides what every Job here is gated on. A Job on your words calls it on a person's ask and never unasked. **A save that carries `overwrite: true` is put to the person**, as destructive, and a first save is not, because the call without it cannot replace anything — `fleet::auto_gate`.
"""
