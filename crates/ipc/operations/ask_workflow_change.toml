[operations.ask_workflow_change]
kind = "command"
transport = "HTTP"
agent_access = "Bridge only"
description = "Ask an agent to rewrite a workflow in any place as the owner words it, and land the result in his draft of it, or keep it for him to approve"
notes = """
`POST /workflows/changes/ask`, since 27 Oct 2026, with `?manifest_id=`. The body is `AskWorkflowChange`: `workflow_id`, `source` (`repository`, `kit`, `project` or `armada`), `project` (required where `source` is `project`) and `text`, his words. The answer is a `WorkflowChange` with `origin` `asked`, `before` and `state` `drafting`. **Since 23.95 `before` is the text of his draft of the workflow where he has one**, else the file's text now, or Armada's carried text for `armada`.

**It answers at once and the draft comes after.** One short model run, not a Job, on `models.proposer`: the definition's text and his words in, the whole new definition out. Fleet checks it with the parse and resolve `save_workflow` uses; one that does not fit is drafted once more with the loader's sentence, and then the change is `failed` with that sentence as `reason`. `list_workflow_changes` is how the page sees it become `ready`.

**Nothing is saved, and where it lands is his draft.** When the drafting finishes and the change is `ready`, Fleet writes `after` into the draft of that workflow in that place as a change by `agent` (`put_workflow_draft`'s list), with `change` the id of this `WorkflowChange` and `summary` his words, and begins the draft if there is none. **Only where the draft's text still equals `before`**, or, with no draft, where the published text still equals `before`; anywhere else the change stays `ready` for `approve_workflow_change`, as before. `WorkflowChange.drafted` is `true` once it landed, and `get_workflow_draft` shows it. A change to one of Armada's own lands in a draft that has no scope; the copy is made by `publish_workflow_draft` at the scope he picks. `approve_workflow_change` still saves directly, for the Classic Bridge, and refuses an `armada` change with 422 `fleet.workflow_is_armadas`.

422 `fleet.no_such_workflow_definition` where that place holds no definition of the id, or a source that is none of the four. 422 `fleet.workflow_project_unnamed`, 404 `fleet.workflow_project_unknown` and 422 `fleet.workflow_project_not_member` for a project's, as `save_workflow` refuses them. 422 `fleet.workflow_change_empty` where `text` is blank. 422 `fleet.workflow_change_no_agent` where no model could be asked.

`agent_access` is `Bridge only`: it spends a model run, and the person asked for it.
"""
