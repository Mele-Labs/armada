[operations.get_shared_home]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "Read each Kit row this machine syncs as it stands against the shared home"
notes = """
`GET /shared_home?login=`, the profile whose home it is: a Mac can hold two profiles, and each has its own home. A login that is not a profile here is a 404 `fleet.no_such_profile`. Answered with `SharedHomeRead`: `home` names the home this machine holds a copy of, `{ account, repository }`, or is left out where it holds none yet, and then `planned` is served in its place, `{ account, repository, exists }`: where the home is or will be, the owner (the login or one of its organisations) and the name, as `set_home_repository` recorded them and else `<login>/armada-home`. `exists` is set where the forge already has the home, made on another Mac. Where this machine holds no copy and nothing is recorded for the login, Fleet asks the forge once per login per run for a repository marked as a home (topic `armada-home`) that the login owns or belongs to through an organisation, and records one found; a forge that does not answer leaves the default and is no error on a read; `rows` is every row of every kind switched on in What syncs, kind by kind in `HomeKind`'s order and by name within one; `unreadable` names each file of a kind that would not read, with where and why.

A row is `HomeRow` `{ kind, name, state, says?, source?, repository?, key_here?, mod_kind?, here?, there? }`. `state` is `same`, `differs`, `here` (only on this machine) or `home` (only in the home). A row that differs carries both versions, `here` and `there`. A memory note carries its `repository`, by its folder's name, which names it in an act. `key_here` is on an MCP server alone: `false` where this machine has no server of that name, since the home carries a server's name and host and never its key. `mod_kind` is on a mod alone: the kind its `mod.toml` names, this machine's where it has one and else the home's.

**Reaches nothing**: it reads the copy here as it was last synced. A kind switched off has no rows, and with no copy here there are none at all. `agent_access` is `No`: the shared home is the owner's own setup across his machines.
"""
