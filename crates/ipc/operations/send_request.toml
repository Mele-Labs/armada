[operations.send_request]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Send an HTTP request and read the answer: one saved in a collection (saved with its collection and request, each an id or a name, from get_requests), or your own method and url with an optional collection whose headers go with it. Every {{name}} in the address, headers and body is filled from the environment you name, secrets included, which you never see: a secret reads as {{name}} in everything you get back. Body: saved or method and url, optional collection, optional environment, headers as a list of name and value, optional body as text"
notes = """
Since 19 Oct 2026; since 21 Oct 2026 from collections and environments. `POST /requests/send`, body `SendRequest`: an optional `session_id` and `repository`, then either `saved` (`{ collection, request }`, each an id or a name, as `get_requests` lists them) or the request's own `method` (`GET`, `POST`, `PUT`, `PATCH`, `DELETE`, `HEAD` or `OPTIONS`, any case) and `url` with an optional `collection`; then an optional `environment`, `headers` (each `name` and `value`) and an optional `body` as text. Both `saved` and any of `method`, `url` or `collection`, or neither shape, is refused as the body is read. Answers 200 with `RequestSent`: the filled `url`, `status` (absent where nothing answered), `ms`, the answer's `headers`, `body` as text with `truncated`, `error` and `note`.

**What is sent.** A saved request is sent as kept, its collection's headers under its own; `headers` given here go over both, a name given here winning, and a `body` given here replaces the kept one. Its own request takes the `collection`'s headers under its own, a name the request carries winning. `repository` names whose collections and environments are read, as `get_requests` takes it; absent, the Job's.

**Every `{{name}}` is filled in Fleet**, in the address, every header and the body, from `environment`: a saved one by name, the person's own over the repository's, or `server:<name>` for a server the Job runs, whose one variable is `base`. A secret is read from the Keychain at the send and never leaves Fleet but on the request. **A `{{name}}` that is not filled is sent as written**, an environment lacking it or a secret with no value kept, and `note` names each one: `{{token}} was not filled.`

A saved request, collection or environment that is not there, an address that is not `http` or `https` once filled, a method not listed above and a body over 64 KiB are a 422 `fleet.request_refused`, and nothing is sent. A Keychain that would not read a secret is a 500 `fleet.request_secret_unkept`, never carrying the value, and a send whose own thread failed a 500 `fleet.request_unsent`.

**A secret is `{{name}}` in everything answered and written**: the answer's `url`, headers and body, the thread's row, the words a Job is told and any error. Fleet puts each secret's value back as `{{name}}` wherever it appears. **A value shorter than six characters is not hidden**, as kept cookie values were not, so a short one is not matched inside ordinary words. Redirects are not followed, so a secret goes to the host named and nowhere else, and the 3xx is the answer.

**An error is an answer.** Refused, timed out (30 seconds) or a name that did not resolve is a 200 with `error` and no `status`, never a 500. The body is cut at 256 KiB, and at 32 KiB through the agent's door, so the answer fits the door's own cap; `set-cookie` is dropped from the headers through the door.

**The Job** is the one whose process holds the connection when Fleet hosts it, whatever the body says; `session_id` is read only for a Job in a terminal, as `waiting_for`'s is. A placed Job's thread gets a `requested` row. **The person's send is told to the Job's agent**, in the shape a run is; **the agent's own is not told**, since it holds the answer. A send placing no Job writes nothing.

`agent_access` is `Yes`: an agent checking its own work against a running server or a staging address is the reason Requests exists, and a secret is what it may use and not read. Fleet's HTTP surface is reachable by any process on this machine, so a secret is usable, never readable, by anything local.
"""
