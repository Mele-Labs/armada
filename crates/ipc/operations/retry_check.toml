[operations.retry_check]
kind = "command"
transport = "HTTP"
agent_access = "Helm only"
description = "Runs one Check of a step's gate again, and only that one"
notes = """
A quick act on a Check row of a Job's Now. The body is `check`: the name `CheckUnderway.name` carries. The other Checks of the gate are left as they are, and the ruling waits for the retried one as it waited for the first run.

Refused with a 409 where no gate is running Checks for the Job, and where the gate has no Check of that name.

`agent_access` is `Helm only`, `kill_one_drone`'s reason: it spends a run the person did not ask for by name, so Helm may press it only when asked.
"""
