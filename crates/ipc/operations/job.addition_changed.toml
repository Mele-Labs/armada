[operations."job.addition_changed"]
kind = "event"
transport = "WebSocket"
agent_access = "Bridge only"
description = "One of a Job's added steps moved: it was added, removed, kept for every Job, started, was skipped, is held for the owner, or ended"
notes = """
Protocol 23.68. `JobAdditionChanged`: `job_id`, `addition` (an `AddedStep`, the row whole), `removed?` and `at`. Published when a step is added or placed, when it is removed (`removed` true, the row as it was), when it is kept for every Job, when Fleet opens its firing (`running`, `skipped` or `awaiting_owner`) and when a running one ends. `get_job`'s `additions` is the same rows.

`job.trigger_changed` is not this one's carrier: an addition has no level, so it is not a `JobTrigger`.

**Effect on the unbounded-sink risk `docs/practices/protocol.md` names: slightly worse, and bounded.** At most two messages per firing and one per act a person makes, on the one drop-oldest channel every Job shares. Nothing a Drone produces rides it. A Bridge that missed some re-reads `get_job`, where the rows are whole.

`agent_access` is `Bridge only`, `job.trigger_changed`'s reason.
"""
