[operations.link_task_pull]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Link a pull request to a task or subtask"
notes = """
`POST /projects/rows/:row/pulls`, body `LinkTaskPull`: `number`, a pull request of the task's repository. Only the number is kept: its title and whether it is open, merged or closed are the forge's, read when the rows are and held five minutes. The forge is not asked whether the pull request exists. A task may carry several, and linking one again changes nothing. When it merges, an open or held task is asked about, as a Job's finish asks, once per link; one that had merged already asks at the link, and the answer shows it. `docs/practices/protocol/projects.md`. Answers `Projects` as `list_projects` does, and publishes it as `projects.changed`.

A 422 `fleet.project_pull_unreadable` for a number that is 0, a 422 `fleet.project_row_not_a_task` for a `row` that is an issue row, and a 404 `fleet.no_such_project_row` for a `row` there is none of.
"""
