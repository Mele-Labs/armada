[operations.get_feature_page]
ask_tool = "features"
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "Read one feature's full page: its prefixes, entry points, written sections, links and the files Jobs wrote most. Give feature as its slug, section (test, runs, observe or debt) for that one section alone, and project where the repository is in more than one"
notes = """
`GET /features/page?feature=<slug>&section=&project=&files=`, answered with `FeaturePage`: `project`, `feature` (a `FeatureRow`, with its `health`), `manifest_id`, `paths`, `entry_points`, `sections`, `links`, `files`, `docs`, `tickets` and `floor_plan`.

**`sections` holds only what was written**, in the order a page shows them: test, runs, observe, debt. Each carries `text`, `job`, `written_at`, `commit` and `stale_since`, a pull request's number where a merge after the section's commit changed a file of the feature.

**`section` names one of `test`, `runs`, `observe` or `debt`** (any case, trimmed; blank is none) and answers the page with that section alone in `sections` and with no `links` or `files`, which is the full section the condensed page's last line tells a Job to fetch. A section nobody has written leaves `sections` empty. Any other name is 422 `fleet.feature_section_unknown`, nothing read.

**`floor_plan` is the project's code map with the feature's rooms lit**: `rooms` (`module`, `path`, `kind`, `lit`, `files`, and `manifest_id` where the project holds more than one repository) and `doors` (`from`, `to`, `contract`). A room is a module read from the repository's build manifests, or a top folder where it has none. It is lit where the feature owns a file in it. A door is a dependency out of a lit module to another module, and `contract` is true where that module carries a wire or API contract. **`files=true` fills each room's `files`**, which are otherwise empty and cost no git read; Bridge asks with it and an agent's read does not, so its page stays small. A room's `files` are its tracked files at the checkout's `HEAD`, largest first, each a `FloorFile`: `path`, `bytes` (git's size; no file is opened), `lit` (the feature owns it), `changing` (a live Job wrote it) and `grouped`. Lock files, images, fonts and test snapshots are left out. A plan carries about 1500 entries: every lit or changing file stands alone, then the largest, and the rest are taken together by folder as one entry whose `path` ends in `/`, whose `bytes` are summed and whose `grouped` counts its files; `grouped` is absent for a single file. It is read on every page read, and absent on a read by `section` or where no repository reads.

**`links` are oldest first.** A `FeatureLink` is `kind` (`job`, `pull_request`, `merge`, `sketch`, `page`, `walk`, `draft`, `commit` or `bug`), `target`, `title`, `state`, `job`, `via` and `at`.

**`docs` and `tickets` are what a Job read before it changed a file of the feature**, newest first, each once, and empty where none: a `FeatureRead` is `target` (an address, a path or an id), `title`, `gist` (the result's first sentence, empty where Fleet did not see the result), `job`, `at` and `state` (`gone` once a check finds the address dead, or finds a document that is a file of the repository no longer at HEAD; empty until then) and `drifted` (the names a document gives that the code had when it was last changed and no longer has, from the librarian's drift part; absent where none). Fleet saw the order of the read and the write, not that the Job used what it read. They are not in `links`, and a section read leaves them out with the rest.

404 `fleet.feature_unknown` where the project has no feature by that slug.

`agent_access` is `Yes`: this is the full section the condensed page tells a Job how to fetch.
"""
