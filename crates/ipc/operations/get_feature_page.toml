[operations.get_feature_page]
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "Read one feature's full page: its prefixes, entry points, written sections, links and the files Jobs wrote most. Give feature as its slug, and project where the repository is in more than one"
notes = """
`GET /features/page?feature=<slug>&project=`, answered with `FeaturePage`: `project`, `feature` (a `FeatureRow`), `manifest_id`, `paths`, `entry_points`, `sections`, `links` and `files`.

**`sections` holds only what was written**, in the order a page shows them: test, runs, observe, debt. Each carries `text`, `job`, `written_at`, `commit` and `stale_since`, a pull request's number where a merge after the section's commit changed a file of the feature.

**`links` are oldest first.** A `FeatureLink` is `kind` (`job`, `pull_request`, `merge`, `sketch`, `page`, `walk`, `draft`, `commit` or `bug`), `target`, `title`, `state`, `job`, `via` and `at`.

404 `fleet.feature_unknown` where the project has no feature by that slug.

`agent_access` is `Yes`: this is the full section the condensed page tells a Job how to fetch.
"""
