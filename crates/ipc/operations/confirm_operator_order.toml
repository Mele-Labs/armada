[operations.confirm_operator_order]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "The person presses to have a standing order he has seen stand"
notes = """
`POST /operator/orders`, body `ConfirmOperatorOrder`: `form`, which is `hold_paths` (`manifest_id`, `paths`, `job`, `until`: `pushes` or `ends`) and no other. Answered with `OperatorOrders`. **A `role_off` or an `always_raise` is no form**: the levels and those two orders went, and one kept before then is read by nothing.

**Orders are rules Fleet enforces, never prose a call reads.** A hold refuses a write from a file tool under its paths by any Job but `job`, until it pushes or ends; a Job that ends always releases it, and the Log says so. A shell's writes cannot be read ahead of time and go through.

**Only the person's press.** No agent reaches this.

**Refused**, 422, with nothing kept: `fleet.operator_off` while the Operator is off, and `fleet.operator_order_not_a_form` where the form names a repository, a live Job or a kind Fleet does not know, or no paths.
"""
