[operations.begin_session]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Press Start on a held Job's start card: settle how its work lands, lift the hold and send the messages that waited"
notes = """
`POST /sessions/begin`, body `BeginSession`: `session_id`, `delivery` (`auto_land`, `open_pr` or `keep_local`), the landing the person settled on the card, and `message`, the first message as he left it in the box. Answers the `SessionRecord`, whose `hosted.start` is gone.

**A Job is held when `start_session` carried `held`**, and every Job an agent starts or forks, and one whose wait is met, is held too. Until this call no agent runs, and a proposer reading that ends meanwhile settles the title, workflow, model and effort but sends nothing. **The first turn to reach it** (a message, a note or another Job's message) is kept with the Job, its files with it, off the thread, and served as `hosted.start.message`; a later one is written to the thread and kept behind it. The hold and the first turn are kept with the Job, so a Fleet that restarts keeps both; the later messages are then read back off the thread. While held the Job raises one waiting item, `unsent:<session id>`, source `first_message`, settled by this call or by ending the Job. A held Job with no workflow takes the repository's `feature` workflow, else its first, once the proposer's reading is done or at once where none runs; one the person set, custom too, is left alone.

**`message` replaces the first turn where it differs from `hosted.start.message`**, trimmed: the thread row and what the agent reads are then his words alone, in his voice, and the first turn's files stay with them. The same, or absent, the first turn goes as it was kept. Where nothing was kept, a `message` with words is the first turn. The first turn is written to the thread and sent first, then the rest in the order they came.

**`delivery` is read where `hosted.start.asks_delivery` holds**, that is where the Job's workflow has a step that asks how the work lands. It is kept as the answer to that question, so the step asks nothing; `auto_land` turns Auto land on as `set_session_auto_land` does; and the pick is recorded, from which `hosted.start.picked` offers the usual landing of the next Job of that workflow in that repository. Where `asks_delivery` holds `hosted.start.picked` is always present: named by the first message, else the usual, else Auto land `from` `default`. Where the workflow asks nothing, `delivery` is ignored and nothing is written.

422 `fleet.session_waiting_empty` where `asks_delivery` holds and `delivery` is absent. 409 `fleet.session_waiting_unheld` for a Job that is not held, begun already or never held, and 409 `fleet.session_closed` for one that ended. 422 `fleet.no_such_session` for one Fleet does not host. Nothing is changed by a refusal.
"""
