[operations.answer_session_ask]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Answer the call a hosted job is held on: allow once, allow and remember, refuse, always allow or block a folder, or allow calls like it for the job"
notes = """
`POST /sessions/ask/answer`, body `AnswerSessionAsk`: `session_id`, the ask's `call`, one of its `offers` and a `note` on a refusal. Since 23.49. Answered with the `SessionRecord`. **A second table from Helm's**: the ask is on the job's thread and never in the dock, and `answer_helm_call` does not find it. A call nothing is waiting under is a 409.

**`always_allow` and `always_block` carry `folder`**, offered only where the ask names `reaches`: the path or a folder above it, which Fleet puts on `features.reachFolders`. One without a folder holding `reaches` is a 422 `fleet.session_answer_not_a_folder`, and the ask stays. #2441.

**`allow_like_this_for_session` carries `kind`**, offered only where the ask names `kind`: the ask's own, or its `program` with no `script`, and an optional `folder` held to the same rule. Any other kind is a 422 `fleet.session_answer_not_its_kind`, and the ask stays.
"""
