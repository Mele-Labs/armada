[operations.link_repository]
ask_tool = "none"
kind = "command"
transport = "HTTP"
agent_access = "On your words"
description = "Read a repository a pull request link names, without adding it: a stub Fleet serves unlisted"
notes = """
Open a pull request link, `armada://pull/<owner>/<name>/<n>`, for a repository nobody added. The body is `owner` and `name`. Answers 201 with the repository as `add_repository` answers it: a Job-free read of its pull requests names it by `implicit_id`, or by `manifest.id` where the repository is served for real.

**A repository served already is answered as it is**, found by its `origin` (`owner/name`, any case), and nothing is made. Otherwise Fleet makes a stub: a git repository under Fleet's own folder with that `origin` and nothing fetched, which the forge reads run in as they do in any checkout. **The stub is hidden from `list_repositories` and from the repositories a Job is started in**, and is not remembered: a restart forgets it, and linking again makes it again. Adding the repository by folder or by clone drops the stub.

**A stub has no clone**, so an agent review there is refused with `Add owner/name to run an agent review.` (`fleet.repository_not_added`, a 422). Reading and commenting work.

Refused with a 422 where `owner` or `name` is not one path segment (`fleet.link_refused`), or the stub could not be made (`fleet.repository_refused`).
"""
