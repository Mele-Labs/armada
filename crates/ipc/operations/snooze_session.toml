[operations.snooze_session]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Snoozes a Job until an instant, pausing it, or wakes it now: it raises nothing to the person until then, and is resumed when it wakes"
notes = """
`POST /sessions/snooze`, body `SnoozeSession`: `session_id`, `until` (an RFC3339 instant, or absent to wake it now). Answers the `SessionRecord` with `snoozed_until` set, or without it on a wake. `docs/concepts/session/snoozing-a-job.md`.

**A snooze pauses the Job** as `pause_session` does: a running turn is ended, the work parked and the slot given back, and `hosted.paused` is set. A Job the person paused before stays paused as it was; a Job running in a terminal is snoozed without a pause. Its `waiting_for` items stay on the record. While `snoozed_until` stands, Pocket pushes nothing for its new items and the Operator raises nothing for it; a client leaves it out of its banners, sound and dock count by reading `snoozed_until`. The presets (an hour, three hours, tomorrow) are the client's to work out: Fleet takes the instant.

**When the time comes, or on a wake, `snoozed_until` is cleared** and `session.changed` is published, and Pocket sends one push for the Job if it raised anything while snoozed. If the snooze paused the Job and its pause is still that one, Fleet resumes it as `resume_session` does; a Job the person paused before the snooze, or resumed during it, is left as he left it. Fleet checks on each tick of its notice loop. The snooze is kept in the store with the pause it set, so a Fleet restart keeps it and still resumes the Job at its time, and ending, pausing or repairing the Job leaves it standing.

Refused with nothing changed: 409 `fleet.session_not_snoozable` for an ended Job ("This Job has ended, so it cannot be snoozed."); 422 `fleet.snooze_unreadable` for an `until` that is not a time; 422 `fleet.no_such_session`; and a pause `pause_session` refuses, such as 409 `fleet.session_pause_refused`. A wake of an ended Job, or of one not snoozed, is not refused and answers its row. Snoozing again moves the time.

Publishes `session.changed`. `agent_access` is `No`: a snooze is the person's.
"""
