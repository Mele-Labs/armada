[operations.retry_handoff]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Run again the hand off to a new job that failed. The person's press is the consent"
notes = """
`POST /sessions/handoff/retry`, body `RetryHandoff`: `session_id`, the old Job. Answers the new Job's `SessionRecord`. `docs/concepts/session/a-handed-off-job.md`.

**The same steps as the yes on the Job's card**, with no card: a fresh Job is started from the handoff and the brief the failed row kept (`detail.brief`), the two are linked, the ledger is handed to it, the old Job is ended and the new one is told to carry on. On success the `handoff_failed` row is given back. A step that fails puts back what moved and closes the new Job, so the old Job stands live as it was; the failure is a 422, `fleet.handoff_failed`, with the reason as its message, and a fresh `handoff_failed` row (its own `detail.reason`, a bare fact in lowercase) replaces the old one. A Job with no standing `handoff_failed` row is a 409, `fleet.handoff_not_failed`; one whose hand is running, `fleet.handoff_running`. A job that does not exist or runs in a terminal is refused as for `stop_session`.
"""
