[operations.operator_answer]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "The person presses an answer on an item of Your turn"
notes = """
`POST /operator/page/answer`, body `OperatorAnswerPress`: `id` (the item's id), `answer` (`yes` or `no`; `always_here` and `always` are refused, since no rule is kept), `option` (the label of one option the item lists; absent takes the item's pick, and one the item does not list is refused with `fleet.operator_answer_not_offered`), and `then` and `project`, which are read by nothing. Answered with `OperatorAnswered`: `open`, `started` and `page`, the page as `operator_page` serves it after the press; `filed` and `handed_to` are absent.

**A card** (since 14 Nov 2026): `OperatorTurnItem.card` marks one the Operator's own session raised, answered only with `Yes` and `option` naming one of its options (absent takes the pick). The press settles the card and tells the Operator's session which option on which card. **Refused 422 `fleet.operator_session_not_running`, with the card standing,** where the session is not running. Later on a card tells the session until when.

**A red main** nobody is on: Yes starts a Job titled `Fix main` **at once with no plan step**, briefed to get the fix in and a pull request ready. **A disk hold**: the option names what is done with it. **An item Fleet cannot perform itself**, such as a walk to open, is left to Bridge: `open` is its `WaitingAct`, and the item stays until its Job's list drops it. **No** drops the item.

**404** `fleet.operator_turn_unknown`, with nothing done, where no open item has `id`. **422** `fleet.operator_answer_not_offered` where the answer is not offered on the item (Always on anything), and `fleet.operator_turn_not_done` where the pick could not be carried out, with the item left standing.
"""
