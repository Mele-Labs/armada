[operations.operator_answer]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "The person presses an answer on an item of Your turn"
notes = """
`POST /operator/page/answer`, body `OperatorAnswerPress`: `id` (the item's `turn:<n>`), `answer` (`yes`, `always_here`, `always` or `no`) and, on a go-ahead to file an issue, `then` (`just_file`, `file_and_start` or `file_and_hand`; absent takes the Operator's pick, else `just_file`). Answered with `OperatorAnswered`: `open`, `started`, `filed`, `handed_to` and `page`, the page as `operator_page` serves it after the press.

**Yes does the pick.** On a go-ahead that is what the Operator would have done: for a note or an error to file, the filing and the Then; for a red main, a Job titled `Fix main` started **at once with no plan step**, briefed to get the fix in and a pull request ready, whether its pull request merges by itself being what it is now. On a question or a card with options, the option the Operator picked is answered on the Job's list. **An item Fleet cannot perform itself**, such as a walk to open or a pull request, is left to Bridge: `open` is its `WaitingAct`, and the item stays in Your turn until its Job's list drops it.

**Always here** and **Always** do the pick and keep it as a rule, for that item's repository or for every one. A rule is kept only for a go-ahead and a red main, so on a decision they are refused. From then on that thing, arriving while the Operator is on, is done with no press, is in `handled` as `By a rule`, and has a row of the Log signed by the Operator that says which rule; a rule is not applied while the Operator is off. **No** drops the item; on the Operator's own go-ahead it is a Skip.

**404** `fleet.operator_turn_unknown`, with nothing done, where no open item has `id`. **422** `fleet.operator_off` while the Operator is off, `fleet.operator_answer_not_offered` where the answer is not offered on the item (Always on a decision, `file_and_hand` with no live Job to hand to, a `then` on anything but a file), and `fleet.operator_turn_not_done` where the pick could not be carried out, with the item left standing.
"""
