[operations.show_prototype]
ask_tool = "prototype"
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Use this to show the owner a screen he can click through, in place of a still mock. A scene is a file of HTML-shaped markup that names the app's own parts, with fixture files of JSON beside it for the data it shows. Write both under $ARMADA_SCRATCH/scenes/ and call this with the scene's file name. Fleet reads the scene and each fixture it names, and the native app draws them in a Prototype tab. Saving the scene or a fixture again redraws it at once, as that part's next revision, so you edit the files and need not call this again. Body: title (the artifact's title; one artifact is open at a time, so a prototype joins the one that still asks him), scene (a plain file name such as ready.html, never a path), optional state (the state to step him to; the scene's first where left out), optional for (one sentence of at most 200 characters on what it is for). The scene is at most 64 KiB and the scene with the fixtures it names at most 256 KiB; a file past that, or one that is missing, refuses the call and says which. He approves or sends back the part as he does any other, and the revision he approved is kept after your scratch folder is gone. The scene vocabulary is in docs/concepts/scenes.md"
notes = """
`POST /sessions/artifacts/prototype`, body `ShowPrototype`: `title`, `scene`, optional `state`, optional `for` and an optional `session_id`. Answered with the `SessionRecord`; **through the agent's door, a receipt** of `session_id` and `part`, the part's id, which is the scene's file name.

**The job is the one whose process holds the connection** when Fleet hosts it, whatever the body says, as `add_part`'s. It is `add_part` of one kind with the content read off disk: the part joins the artifact of this job that still asks him, asks by default, and a call for a scene already shown is that part's next revision.

**Fleet reads `<job scratch>/scenes/<scene>`** and, from each `<fixture src="x.json">` element in it, the file `x.json` beside it. `src` is read by a light scan of the text and nothing more: the real parse is the native app's. A symlink is not read.

**Redraw on save.** Fleet watches every job's scratch folder for a write under `scenes/` (from the first prototype shown), waits for a quiet moment and reads the files again, so it needs no word from the mod. A save of the scene, or of a fixture it names, by a job that showed it puts the part again as its next revision with the same `scene_state`, and publishes `session.changed`. A part he approved or withdrew is left as it is. A save that reads as the part already does changes nothing.

**Refused with 422 and nothing written**: `fleet.part_refused`, naming every rule broken at once: a blank title, a `scene` that is a path, holds `..` or starts with a dot, a scene or fixture that is missing, is not text, is a symlink or is a directory, a scene over 64 KiB, a scene and its fixtures over 256 KiB together, a `src` that is a path, and the rules of any part (at most twelve parts; a prototype's own 256 KB is held apart from the 48 KiB the other parts weigh together); `fleet.part_unnamed` for a call that places no job.

`agent_access` is `Yes`: it is the job's own screen, and the owner answers it in the native app with `answer_part`.
"""
