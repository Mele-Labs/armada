[operations.write_feature_sections]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Write what you know of a feature before you end: how to test it, how it runs, how to observe it and its tech debt. Give the feature's slug and each section's text. Rewrite a section whose text is still true as it stands; all_done is refused while a feature your commits named in a Feature: line has a section you have not written since you started. Also give `glossary`, a list of `{term, meaning, not}` for any word you introduced that the project should keep using, with `not` the words that mean the same and should not be used; it is never required. Also give `gists`, a list of `{target, gist}` for a doc or ticket you read before you changed the feature's files: one line of what it says that bears on the feature, in your own words; it is never required"
notes = """
`POST /features/write_sections`, body `WriteFeatureSections`: `feature` (a slug), `sections` (a list of `{section, text}`, where `section` is `test`, `runs`, `observe` or `debt`), an optional `glossary`, an optional `gists` and an optional `project` and `session_id`. Answered with `FeatureSectionsWritten`: `feature`, `written`, `glossary`, the terms kept, `gists`, how many gists were kept, and `owed`, what this Job still owes across features, each with the `docs` it read that are linked under the feature and have no gist of its own, at most eight in all.

**`glossary` is a list of `{term, meaning, not?}`** for a word you introduced that the project should keep using: `term` the word, `meaning` a sentence, `not` the words that mean the same and should not be used. It is kept in the project's glossary that holds the feature, and read back with `get_glossary`. A term the project holds under the same word, in any case, is replaced. `sections` may be empty where `glossary` is not, and `all_done` never asks for a glossary. Fleet flags a Job that later uses a `not` word in a commit message, on the features it is on, and never refuses the commit.

**`gists` is a list of `{target, gist}`** for a doc or ticket you read before you changed the feature's files: `target` the address, path or id as `owed` names it, `gist` one line of what the doc says that bears on the feature, in your own words, cut to 200 characters. It replaces the result's first sentence on every read link this Job made, under any feature its projects hold, and a first sentence heard later does not replace it; the page serves it with `gist_by_job`. `sections` and `glossary` may be empty where `gists` is not, and `all_done` never asks for a gist: where it is refused for sections owed, it names the docs you read under those features and says a gist is welcome.

**The job is the one whose process holds the connection**, as `all_done`'s is. Only a Job Fleet hosts writes, and an ended one is refused. Nobody else reaches this operation, so a section always names the Job that wrote it.

**Fleet keeps who wrote it, when, and the commit the Job's checkout stood at.** A section is replaced whole by the next write of it; the text is kept as written, trimmed.

422 `fleet.feature_unknown` where no feature the Job's projects hold has that slug, `fleet.feature_section_empty` for a blank text, and `fleet.glossary_blank` for a term with no word or no meaning, `fleet.gist_blank` for a gist with no target or no text, and `fleet.gist_not_read` for a target this Job never read and linked, which it names. A call with no sections, no glossary and no gists is `fleet.feature_section_empty`.

`agent_access` is `Yes`: only the Job that did the work knows how the feature runs and what it owes.
"""
