[operations.write_feature_sections]
kind = "command"
transport = "HTTP"
agent_access = "Yes"
description = "Write what you know of a feature before you end: how to test it, how it runs, how to observe it and its tech debt. Give the feature's slug and each section's text. Rewrite a section whose text is still true as it stands; all_done is refused while a feature your commits named in a Feature: line has a section you have not written since you started"
notes = """
`POST /features/write_sections`, body `WriteFeatureSections`: `feature` (a slug), `sections` (a list of `{section, text}`, where `section` is `test`, `runs`, `observe` or `debt`), and an optional `project` and `session_id`. Answered with `FeatureSectionsWritten`: `feature`, `written`, and `owed`, what this Job still owes across features.

**The job is the one whose process holds the connection**, as `all_done`'s is. Only a Job Fleet hosts writes, and an ended one is refused. Nobody else reaches this operation, so a section always names the Job that wrote it.

**Fleet keeps who wrote it, when, and the commit the Job's checkout stood at.** A section is replaced whole by the next write of it; the text is kept as written, trimmed.

422 `fleet.feature_unknown` where no feature the Job's projects hold has that slug, and `fleet.feature_section_empty` for a blank text.

`agent_access` is `Yes`: only the Job that did the work knows how the feature runs and what it owes.
"""
