[operations.start_session]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Start a session Fleet hosts for Bridge in one repository, with no slot and no branch until the agent writes"
notes = """
`POST /sessions/start`, body `StartSession`: `manifest_id`, and `title`, `model`, `effort` and `mode` where the person chose them. Since 23.49. Answered with the `SessionRecord`, `origin` `bridge`, `hosted` set. **No process starts**: the first message does. `mode` absent is `auto`.

**`pilot` (`job_id`, `outcome`), since 23.51, takes the Job over and starts the session on its worktree.** `manifest_id` is not read: the repository is the Job's. The refusals are `take_over`'s (409, nothing written). The session holds the Job's slot and branch from the start and takes no lease on a first write, its thread opens with a `handoff` row, and the bundle as the agent reads it goes ahead of the person's first message.

**`fork` (`session_id`), since 23.69, starts the session as a copy of an ended or dead one's conversation.** The old session is a terminal one whose mod has stopped asking, or one that ended, or a closed hosted one; a live one is refused 409 `fleet.session_fork_live`, an unknown one 422 `fleet.no_such_session`. The new session has its own id, ledger and slot, holds none of the old one's, and takes the old title unless `title` is given. Its first process starts with the old id forked under its own, and the two ledgers carry a `forked_to` and a `forked_from` row, `spent`.

**`fork.at`, since 23.79, forks at a message, and the old session may be live.** `at` is the id of a row of the old session's thread, a message, and the copy ends at it, included. The live refusal is not made and the old session is untouched. No message with that id, or one the agent's conversation does not hold, is refused 422 `fleet.fork_point_unwritten`, before anything is written. The `forked_from` row's detail carries `at` and `cut`, the transcript line the first process is told to end at.

**`root` starts Setup's session, in a served repository with no `armada.yml` yet.** The session runs in that root, carries no `manifest_id`, and `manifest_id` is not read; a root that has a Manifest by now starts as a plain start on it. A root Fleet does not serve is refused 422 `fleet.no_such_repository`. With no Manifest there is no pool, so the session leases no slot: until its root's Manifest is served it writes only a file named `armada.yml` or `.gitignore` at any depth under the root, and `<root>/.git/info/exclude`, and is refused anything else. Fleet loads that Manifest when one of its turns ends, and from its next write the session leases a slot like any other, save those same files, which it still writes in the checkout.

`agent_access` is `No` for all of the hosted-session commands: a session is the person's own conversation, and an agent that could start, tune or close one could drive another's. **The two exceptions are `start_another_session` and `fork_this_session`, since 23.80**, which start a session with no process and an unsent first message, and the second only of the caller's own conversation. Tune, close and the rest stay `No`.
"""
