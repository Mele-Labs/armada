[operations.start_session]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Start a job Fleet hosts for Bridge in one repository, with no slot and no branch until the agent writes"
notes = """
`POST /sessions/start`, body `StartSession`: `manifest_id`, and `title`, `model`, `effort` and `mode` where the person chose them. Since 23.49. Answered with the `SessionRecord`, `origin` `bridge`, `hosted` set. **No process starts**: the first message does. `mode` absent is `auto`. **`manifest_id` may be a repository's `implicit_id`** (`list_repositories`), the id Fleet gives one with no Manifest, no `armada.yml` and no Kit copy: the job there writes in a slot from the default pool of eight like any other, has no Checks and no Commands, and nothing gates on them.

**`fork` (`session_id`), since 23.69, starts the job as a copy of an ended or dead one's conversation.** The old job is a terminal one whose mod has stopped asking, or one that ended, or a closed hosted one; a live one is refused 409 `fleet.session_fork_live`, an unknown one 422 `fleet.no_such_session`. The new job has its own id, ledger and slot, holds none of the old one's, and takes the old title unless `title` is given. Its first process starts with the old id forked under its own, and the two ledgers carry a `forked_to` and a `forked_from` row, `spent`.

**`fork.at`, since 23.79, forks at a message, and the old job may be live.** `at` is the id of a row of the old job's thread, a message, and the copy ends at it, included. The live refusal is not made and the old job is untouched. No message with that id, or one the agent's conversation does not hold, is refused 422 `fleet.fork_point_unwritten`, before anything is written. The `forked_from` row's detail carries `at` and `cut`, the transcript line the first process is told to end at.

**`root` starts Setup's job, in a served repository with no Manifest yet, no `armada.yml` and no Kit copy** (a plain job there is `manifest_id` with the `implicit_id`). The job runs in that root, carries no `manifest_id`, and `manifest_id` is not read; a root that has a Manifest by now starts as a plain start on it. A root Fleet does not serve is refused 422 `fleet.no_such_repository`. With no Manifest there is no pool, so the job leases no slot: until its root's Manifest is served it writes only a file named `armada.yml` or `.gitignore` at any depth under the root, and `<root>/.git/info/exclude`, and is refused anything else. Fleet loads that Manifest when one of its turns ends, and from its next write the job leases a slot like any other, save those same files, which it still writes in the checkout.

**`request`, since 23.91, is the words the person dispatched, and Fleet reads them once.** The Job proposer's model reads them against the repository's workflows and the models this machine runs, and fills in what `title`, `model` and `effort` left unset, plus the Session's `workflow` (none, a custom Session, where nothing fits). **The press does not wait**: the Session is answered at once with `proposal.reading` true and no process, and the process starts when the answer lands, on the values it settled. A first message sent meanwhile is written to the thread and its turn is held until then. A call that fails, times out or answers in a shape that cannot be read starts the Session on the machine's defaults, and the reason goes to Fleet's log; nothing is refused. What the start itself set stands over the answer. `proposal.picked` lists the fields the proposer filled, per field, until the person changes each. Not read with `pilot`, `fork` or `root`.

**`after` (`session`, `condition`, `base`, `needs`) makes the Job wait on another.** `request` is then its brief and nothing is sent. The Job is made at once and listed with a `waits` fact: it holds its brief, no slot and no process until the condition is met, and Fleet then starts it with the other Job's handoff followed by the brief. `condition` is `ends` (the default), `group_done`, `task_done`, `pr_pushed` or `pr_lands`; `base` is `main` (the default) or `branch`. The Job waited on is checked first and the Job is not made when it is refused: 422 `fleet.wait_session_unknown`, `fleet.wait_part_unknown` for a plan part its plan lacks, or 409 `fleet.session_closed` for one that ended. The Job waited on is told what `needs` says. `read_session_wait` is how Bridge fills `after` in from the brief; `change_waiting` and `start_waiting_now` are what move it. `docs/concepts/session.md`, *A Job that waits on another*. Not read with `pilot`, `fork` or `root`.

**`project_rows` (`row`) names rows of his projects, or loose rows, the Job starts with.** Each written task among them is held by the Job: it reads `held` with the Job's id and title (`list_projects`, `projects.changed`) until the Job ends or says it is done. A linked issue row keeps no state and is only accepted, so the person's brief can carry it. All rows are checked before anything is made: a row that is not there is refused 404 `fleet.no_such_project_row`. A row of any repository is held, whatever the Job's own. A row id is unique across projects and the loose rows, so it is the whole address. Naming a task that has subtasks holds them too. A task another Job held is taken over. Not read with `fork` or `root`. `docs/practices/protocol/projects.md`.

`agent_access` is `No` for all of the hosted-session commands: a job is the person's own conversation, and an agent that could start, tune or close one could drive another's. **The two exceptions are `start_another_session` and `fork_this_session`, since 23.80**, which start a job with no process and an unsent first message, and the second only of the caller's own conversation. Tune, close and the rest stay `No`.
"""
