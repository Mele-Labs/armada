[operations.list_judge_types]
kind = "query"
transport = "HTTP"
agent_access = "Bridge only"
description = "The judge types a project sees for a repository, resolved most specific first, and the files left out"
notes = """
`GET /judge_types/:repository?project=`, `repository` a manifest id, `project` a project id and optional. `JudgeTypes`. Since 23 Nov 2026. **Four places, merged by id, the most specific winning**: the set Armada carries (Adversarial, Code, Design, System design, API review), then the repository's own `.armada/judges/`, then Kit's `~/.armada/judges/` for every project, then Kit's `~/.armada/judges/projects/<project>/` for the one named. A type that replaces an earlier place's names it in `replaces`; one nobody had is added at the end. A Kit type that hides a repository type saying something else carries `hides: "repository"`. A type from Kit's folder for the project carries `project`.

One file a type, `<id>.md`: front matter naming `name`, then the prompt. **A file that will not read is left out, never fatal**: it is named in `left_out` with its place and the reason, and the next place down answers for its id. Two files in one place that share an id are both left out.

Read from disk on each call, so a file written by hand is held without a restart. A 422 `fleet.judge_type_misplaced` for a `project` that is no one folder's name, and a 422 for a repository Fleet does not serve.
"""
