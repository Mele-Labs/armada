[operations.get_issue]
kind = "query"
transport = "HTTP"
agent_access = "No"
description = "One issue of a repository by number, open or closed, as its tracker has it"
notes = """
`GET /issues/:repository/:number`, `repository` a manifest id. Answers `IssueRead`: `number`, `title`, `url` and `state` (`open` or `closed`). It exists for a `#` that names a number `list_issues` does not hold, which is closed or is not an issue.

Read from the tracker each time and not kept. A number that is a pull request is not an issue: 404 `fleet.no_such_issue`, as it is for a number the tracker does not have. 500 `fleet.issues_unreadable` where the tracker would not answer, and a 422 for a repository Fleet does not serve.
"""
