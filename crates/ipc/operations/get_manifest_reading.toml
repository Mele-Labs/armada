[operations.get_manifest_reading]
kind = "query"
transport = "HTTP"
agent_access = "Yes"
description = "What Fleet's last read of armada.yml came to, and whether it took"
notes = """
Fleet-wide, and there is no Job to hang it off. Every Envelope in the workspace is written into one Job's transcript and a Manifest reload belongs to none of them, which is why `crates/armada/src/watching.rs` had nowhere to put this and printed it on the daemon's console — a terminal window a person running Bridge does not have open.

A query as well as an event, and that is the point rather than belt-and-braces. A refusal is not an instant that passes: the file on disk and the values Fleet is running with disagree, and they go on disagreeing until somebody corrects the file. Fleet holds its last reading and answers for it here, so a Bridge opened after the save learns it, and so does one that reconnected through a drop. An event alone would mean a person who was not looking at the window in the second it fired never finds out at all, which is the defect one window over from the one being fixed.

Refusal is the absent field, not a flag: `refused` present is the read that did not take. That is `job.judging`'s shape, and it is here for the same reason — a boolean beside a reason that means nothing when it is false is two fields for one fact.

Every fault crosses, not the first. `config::LoadError` finds them all, and a person correcting a file from a message naming one saves, waits, and meets the next — the same silence one round longer.

`agent_access` is `Yes` on `get_capacity`'s terms: it is one small answer about Fleet's own state, and a Helm whose dispatch is running against configuration the repository no longer describes should be able to find that out.
"""
