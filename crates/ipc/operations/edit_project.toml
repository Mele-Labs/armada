[operations.edit_project]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Change a project's name, its members or where its file is kept"
notes = """
`POST /projects/project/:project/edit`, body `EditProject`: `name?`, `members?` and `place?`, and only what is present changes. `members` present replaces the whole list, `[]` clearing it; each is `{ manifest_id, folder? }`. `place` is `{ place, synced_folder?, cloud? }` as `set_run_memory_place` takes a repository's, and moves the file: the one Fleet kept in Kit's folder is taken away, and one in a synced folder or a bucket is left. `docs/practices/protocol/projects.md`. It replaces `rename_project`. Answers `Projects` as `list_projects` does, and publishes it as `projects.changed`.

A 404 `fleet.no_such_project` for a `project` he has none of. A 422 `fleet.project_blank` for a blank `name`. A 422 `fleet.project_malformed` for members that do not make a project: a folder that is not a path inside its repository, a member listed twice, a whole repository beside a folder of it, or the project's own id as a member. A 422 `fleet.project_place_refused` for a place that cannot be used: `repository`, a synced folder that is not there, a cloud place with no address, a bucket that cannot be reached. A 422 `fleet.project_unwritable` where the project's file did not read, since **a file that will not read is not written over**; a 500 under the same code where the file could not be written.
"""
