[operations.edit_project]
kind = "command"
transport = "HTTP"
agent_access = "No"
description = "Change a project's name, its members, the values it sets, where its file is kept or whether it is shared with his other Macs"
notes = """
`POST /projects/project/:project/edit`, body `EditProject`: `name?`, `members?`, `place?`, `values?` and `shared_with_macs?`, and only what is present changes. `shared_with_macs` turns sharing with his other Macs on or off; it is written in the project's file only while on. `members` present replaces the whole list, `[]` clearing it; `values` present replaces the whole block of values the project sets (`{ pr_mode?, auto_merge?, review_model?, look?, tracker?, reviews?, agent_starts? }`, `reviews` `{ plans?, pull_requests?, walks? }` each `off`, `review` or `review_and_approve` and a walk's only `off` or `review`, a kind left out falling through to Kit's and then `off` (so a block without a kind clears it, and one naming none is dropped from the file), `tracker` the Manifest's `tracker:` block as a map of text: `provider` and every other key, carried as written), `{}` taking every value back; each is `{ manifest_id, folder? }`. `place` is `{ place, synced_folder?, cloud? }` as `set_run_memory_place` takes a repository's, and moves the file: the one Fleet kept in Kit's folder is taken away, and one in a synced folder or a bucket is left. `docs/practices/protocol/projects.md`. It replaces `rename_project`. Answers `Projects` as `list_projects` does, and publishes it as `projects.changed`.

A 404 `fleet.no_such_project` for a `project` he has none of. A 422 `fleet.project_blank` for a blank `name`. A 422 `fleet.project_malformed` for members that do not make a project: a folder that is not a path inside its repository, a member listed twice, a whole repository beside a folder of it, or the project's own id as a member. A 422 `fleet.project_values_refused` for a value its key does not take, and nothing is written. A 422 `fleet.project_place_refused` for a place that cannot be used: `repository`, a synced folder that is not there, a cloud place with no address, a bucket that cannot be reached. A 422 `fleet.project_unwritable` where the project's file did not read, since **a file that will not read is not written over**; a 500 under the same code where the file could not be written.
"""
