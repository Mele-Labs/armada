[package]
name = "pocket"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Nothing here is new to the workspace: `axum` and `tokio` are already under
# `api` and `armada`. No `reqwest`, `hyper` client or `fleet`: Fleet's port is
# handed in by the composition root, and the one request this crate makes of it
# is written by hand in `fleet_client`, as `armada::loopback` does, so that no
# header is ever added that a caller did not write.
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
