[package]
name = "pocket"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Apart from `p256` and `sha2`, nothing here is new to the workspace: every other crate is already in `Cargo.lock`
# under `api`, `fleet` or `armada`. No `reqwest`, `fleet` or WebSocket crate:
# Fleet's port is handed in by the composition root, and the requests this
# crate makes of it go through hyper's bare HTTP/1 client, which adds no header
# a caller did not write (Fleet refuses `Origin`). `/events` is a WebSocket, so
# its upgrade and the few frame kinds Fleet sends are read in `fleet_events`.
axum = "0.7"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
# `service` hands the router to hyper on the Wi-Fi door, where `axum::serve` cannot take a TLS stream.
hyper-util = { version = "0.1", features = ["tokio", "service"] }
# `Secret`, for a VAPID key another Mac's subscription carries. No dependencies of its own.
adapter-traits = { path = "../adapter-traits" }
ipc = { path = "../ipc" }
store = { path = "../store" }
serde = { version = "1", features = ["derive"] }
# Request signing and the pairing key. `p256` reads the SPKI WebCrypto exports and
# verifies its raw r||s signature; `sha2` hashes the body. Approved 8 Oct 2026.
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
sha2 = "0.10"
# Web Push (RFC 8030/8291/8292): `hkdf` and `aes-gcm` encrypt the payload, `reqwest`
# (rustls, nothing else) posts it. `base64` is already in the lock. Approved 8 Oct 2026.
aes-gcm = "0.10"
base64 = "0.22"
hkdf = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "sync"] }
# Gzip on the phone's reads: Tailscale Funnel passes the body as it is, and a long Job's thread is
# hundreds of kilobytes of JSON. `tower-http` is already in the lock; `compression-gzip` adds
# `async-compression` and `flate2`. Approved 12 Nov 2026.
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip"] }
# The Wi-Fi door: another Mac on the same network reaches this one with no tunnel (`door`).
# `rustls` and `tokio-rustls` are already in the lock under `reqwest`, with the same `ring`
# provider; they are named here to serve TLS and to pin the other Mac's certificate.
# `rcgen` is new: it makes the Mac's one self-signed certificate, which no CA could sign for an
# address on a home network. It adds `yasna` and `pem`; `ring` is already in the lock.
# `mdns-sd` is new: Bonjour, to advertise and browse `_armada._tcp`. The workspace forbids
# `unsafe`, so the system's own `dns_sd` cannot be called, and the `dns-sd` command's output is
# documented as not for scripts. Pure Rust, no async runtime; it adds `flume` and `if-addrs`.
# Asked for on 13 Nov 2026 (armada-hu76.25).
mdns-sd = "0.21"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util"] }
