[package]
name = "adapters"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
adapter-traits = { path = "../adapter-traits" }
# The node an address makes. A forge's shapes are this crate's to know and the
# kinds are the domain's, so what `forge_node` hands back is the domain's own
# content rather than a second spelling of the same three names — `#1394`.
core-model = { path = "../core-model" }
# `Priority`, for the `git` and `gh` Fleet runs on its own account: `background.rs`.
checks-runner = { path = "../checks-runner" }
git2 = { version = "0.19", default-features = false }
# Which slots of a pool changed, so a reader reads those and not all of them —
# `leasing/watching.rs`. Here and not in `fleet` because what to watch is git's
# layout (a slot's git dir, the refs every slot shares). Not vendor-specific, so
# it needs no seam; `armada` takes the same crate with the same features.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# Not the wire, the codec. A Drone's stdout is a third place bytes enter the
# process, and `ipc::decode`/`ipc::encode` is the one route that reads and
# writes them — which is how this crate stays off gate rule five's list.
# `fleet` already reaches for it the same way, for its runtime file.
ipc = { path = "../ipc" }
serde = { version = "1", features = ["derive"] }
# CI workflow files. The version `config` already reads `armada.yml` with.
serde_yaml_ng = "0.10"
# The central store: a blocking client, and the signature on each request it
# makes. `reqwest` is `pocket`'s posture (rustls, nothing else) with `blocking`
# added, because Fleet's ports are plain sync traits. `p256` and `sha2` are the
# versions `pocket` already verifies Bridge's requests with. `reqwest` approved
# by the owner for the central store, as for `pocket` on 8 Oct 2026.
base64 = "0.22"
# A bucket in the cloud, signed by hand rather than with an SDK: `hmac` is the version 4
# signature's chain and `ring` signs a service account's token request. Both are already in the
# build, `hmac` under `p256` and `ring` under `rustls`, so neither compiles anything new.
hmac = "0.12"
ring = "0.17"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
