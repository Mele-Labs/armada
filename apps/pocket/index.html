<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- armada-allow-off-contract: a meta tag cannot read a custom property; this is --bg-base
         docs/contracts/design-system.md -->
    <meta name="theme-color" content="#0F1419" />
    <!-- armada-allow-off-contract: painted before any stylesheet or script loads, so a slow first request shows the dark ground and not a white page; this is --bg-base
         docs/contracts/design-system.md -->
    <style>html { background: #0F1419; }</style>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-256.png" />
    <title>Armada</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- armada-allow-off-contract: shown where the app's own files never arrived, so it cannot read a stylesheet; these are --fg-default and --space-4
         docs/contracts/design-system.md -->
    <p id="stuck" hidden style="margin: 0; padding: 16px; color: #E4E9EF; font: 16px/1.5 -apple-system, system-ui, sans-serif">
      Armada could not open. <a href="/" style="color: inherit">Try again</a>
    </p>
    <script>
      // The app draws into #root. Still empty after 8 s, it never started: its files did not arrive or it threw.
      setTimeout(() => { if (!document.getElementById("root").hasChildNodes()) document.getElementById("stuck").hidden = false; }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
