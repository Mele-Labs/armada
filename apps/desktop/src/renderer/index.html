<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `default-src 'self'` and one addition. An image is drawn from a `blob:` this
      window made itself, out of bytes that came over the preload from main.

      Neither `http://127.0.0.1:*` nor `data:` is admitted. The first is refused
      on purpose: it would let the renderer fetch from Fleet directly and make the
      surface that draws a file the surface that opens a port. `data:` would
      carry the bytes too, and costs a third more of them to say the same thing.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' blob:; media-src 'self' blob:"
    />
    <title>Armada</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
