# Bridge itself: main, preload, `App` and the mock harness. Commands run here,
# in this directory. `docs/concepts/manifest.md`, *Workspace gating*; the
# comments on `${width}` and `exec` are the root's, at the top of its `checks:`.
version: 1
id: armada-desktop

# What Bridge reads from elsewhere, repo-relative. Every package is bundled
# into it, so any of them gates it. A hit runs every Check below, since none
# declares a `when`. **That is why `desktop_test` is not here**: a `depends_on`
# is the manifest's and not a Check's, so the tests that read no surface are in
# `unit/armada.yml`, which lists only what they read.
#
# `crates/core-model/domain/**` and `protocol-version.toml`: codegen emits
# TypeScript from them, so a change there is a change to compiled code.
depends_on:
  - "packages/**"
  - "crates/core-model/domain/**"
  - "protocol-version.toml"
  - "package.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"

setup:
  requires:
    - bootstrap
    - browsers

checks:
  typecheck:
    # `-b`: this tsconfig owns only referenced projects. `-b` is incremental
    # and re-checks a project whose inputs changed, so `--force` is not needed;
    # its build info lives in the uncommitted `out/`, so a fresh worktree
    # checks everything. A script rather than the command here, as the root's
    # was: a `run` gets no shell. No `narrow`, as the other typechecks.
    run: pnpm typecheck

  bridge_build:
    # Catches what `typecheck` cannot: an import that resolves in the editor
    # and not in the bundle.
    run: pnpm build

  app_smoke:
    # The tests that load a surface's code: every one under `mock/` mounts `App`
    # on the mock Fleet, which composes every surface, and two more reach one
    # surface directly. `vitest.config.ts` says which and why. The rest of
    # Bridge's tests are `unit/`'s `desktop_test`, which a surface does not hit.
    run: pnpm exec vitest run --maxWorkers=${width} --project smoke*
    # No `dir`: a Check here runs in this directory, and a Drone's narrowed run
    # puts `.` in the runner's `{dir}` and the paths relative to it in `{files}`.
    runner:
      name: vitest
    # One test by name, which Fleet runs against a checkout of main
    # before a Drone's `draft_fix` drafts anything — same shape as the two
    # Rust one_test lines in the root, `vitest -t` in place of `nextest -E`.
    # #1203. `-t` is a regex matching anywhere in a test's name; `{}` arrives
    # escaped, so an apostrophe, a quote or a bracket matches itself.
    #
    # **One worker, because `-t` still loads every file.** Vitest imports all
    # the project's browser files to find the one test, about 650 modules each,
    # and every request is an event on the one Playwright connection the running
    # test's presses go through. Unbounded, the other workers' loading kept that
    # test's first press from reaching the page for over three seconds: "reading
    # an epic in" passed 3 runs in 10, and 4 in 10 at four workers. A failed file
    # runs first the next time, in the thick of it, so one failure made the
    # next. At one worker nothing loads while the test runs: 5 in 5, and in
    # 12s rather than 20 to 30.
    one_test:
      run: pnpm exec vitest run --maxWorkers=1 --project smoke* -t {}
    # Chromium beside the other browser suites, as every surface's `test`: #1102.
    places: 3

  # **The root's `test` no longer sees a Bridge change.** The root gates only
  # paths no workspace claims, and `components`, `screens` and this package
  # claim everything under `apps/desktop` and those two. `xtask`'s own tests
  # read that tree — the error-code rule collects declarations from it and the
  # vocabulary rules read `packages/components/src/generated/` — so the run the
  # root's `test` narrows to for `apps/` and `packages/` (`outside`) is kept
  # here. Every Bridge change hits this manifest, either by owning the path or
  # by `packages/**` above. `cargo` finds the workspace from any directory in
  # it, and `xtask` finds the tree from its own manifest.
  xtask_test:
    run: cargo nextest run -p xtask --test-threads ${width}
    one_test:
      run: cargo nextest run -p xtask -E test(/(^|::){}(::|$)/)
