# Bridge itself: main, preload, `App` and the mock harness. Commands run here,
# in this directory. `docs/concepts/manifest.md`, *Workspace gating*; the
# comments on `${width}` and `exec` are the root's, at the top of its `checks:`.
version: 1
id: armada-desktop

# What Bridge reads from elsewhere, repo-relative. Every package is bundled
# into it, so any of them gates it. A hit runs every Check below, since none
# declares a `when`. **That is why `desktop_test` is not here**: a `depends_on`
# is the manifest's and not a Check's, so the tests that read no surface are in
# `unit/armada.yml`, which lists only what they read.
#
# `crates/core-model/domain/**`: codegen emits TypeScript from it, so a
# change there is a change to compiled code.
#
# `crates/ipc/**` and `crates/api/src/routes/**`: the build hashes them into
# the protocol ID Bridge compares with Fleet's (`codegen/protocol-id.mjs`).
depends_on:
  - ".github/**"
  - "packages/**"
  - "crates/core-model/domain/**"
  - "crates/ipc/**"
  - "crates/api/src/routes/**"
  - "package.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"

setup:
  requires:
    - bootstrap
    - browsers

checks:
  typecheck:
    # `-b`: this tsconfig owns only referenced projects. `-b` is incremental
    # and re-checks a project whose inputs changed, so `--force` is not needed;
    # its build info lives in the uncommitted `out/`, so a fresh worktree
    # checks everything. A script rather than the command here, as the root's
    # was: a `run` gets no shell. No `narrow`, as the other typechecks.
    run: pnpm typecheck

  bridge_build:
    # Catches what `typecheck` cannot: an import that resolves in the editor
    # and not in the bundle.
    run: pnpm build

  # **The root's `test` no longer sees a Bridge change.** The root gates only
  # paths no workspace claims, and `components`, `screens` and this package
  # claim everything under `apps/desktop` and those two. `xtask`'s own tests
  # read that tree — the error-code rule collects declarations from it and the
  # vocabulary rules read `packages/components/src/generated/` — so the run the
  # root's `test` narrows to for `apps/` and `packages/` (`outside`) is kept
  # here. Every Bridge change hits this manifest, either by owning the path or
  # by `packages/**` above. `cargo` finds the workspace from any directory in
  # it, and `xtask` finds the tree from its own manifest.
  xtask_test:
    run: cargo nextest run -p xtask --test-threads ${width}
    one_test:
      run: cargo nextest run -p xtask --test-threads ${width} -E test(/(^|::){}(::|$)/)
