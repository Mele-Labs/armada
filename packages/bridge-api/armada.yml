# What a surface and the app share about Bridge's Fleet API: types and tiny
# helpers, no React. Commands run here, in this directory.
# `docs/concepts/manifest.md`, *Workspace gating*.
version: 1
id: armada-bridge-api

# What this package reads from elsewhere, repo-relative. `tsc` follows its
# imports into the screens' fixtures, and those into the components, the shell
# and the tokens, so a change in any of them can break it. A hit runs every
# Check below, since none declares a `when`.
depends_on:
  - "packages/screens/**"
  - "packages/components/**"
  - "packages/shell/**"
  - "packages/tokens/**"
  - "packages/brand/**"
  - "packages/protocol/**"
  - "crates/core-model/domain/**"
  - "protocol-version.toml"
  - "package.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"

setup:
  requires:
    - bootstrap
    - browsers

checks:
  typecheck:
    # `--noEmit -p`: one project, no build info. No `narrow`, as the other
    # typechecks.
    run: pnpm typecheck
