[icons.footprints]
  means = "Two footprints, one behind the other"
  group = "Sleep mode"
  size = "16px"
  status = "Specified"
  reserved = "A walk waiting for the owner to look at it, and the workflow step that shows one. Never a Job's progress."
  notes = "Approved 9 Oct 2026 with sleep mode."

  [[icons.footprints.usage]]
    means = "The Walk shown stop on a Session's road to main"
    group = "Session build"
    size = "16px"
    status = "Specified"
    notes = "Shared with the reservation above by the owner's choice on 15 Oct 2026 (kept the double use). Approved 14 Oct 2026 on the walk `battlefieldProgress`, the build ring (`.claude/decisions/2026-10-14-a-session-builds-a-ring.md`). Tooltip `Walk shown`. A walk shown after the first edit. Not a Job's progress."

  [[icons.footprints.usage]]
    means = "The Walk and Show steps' mark on a workflow step card"
    group = "Workflows"
    size = "12px"
    status = "Specified"
    notes = "Specified 27 Oct 2026 on the walk `workflowsManaged`, which the owner walked and approved (`.claude/decisions/2026-10-27-a-feature-job-walks-before-it-tests.md`). Drawn at 14px, stroke 2. It names the step that shows a walk. It is not a Job's progress. Kept by the owner's ruling on 27 Oct 2026."

[[icons.footprints.usage]]
  means = "A plan group's Walk approved gate, closed when you approve its walk"
  group = "Plan gates"
  size = "12px"
  status = "Specified"
  notes = "Specified 9 Nov 2026 on the walk `plan-as-progress`, which the owner walked and approved. Drawn at 12px, unframed, at the end of the last group's line in a chunk's row in Now, and leading the gate line that heads a finished chunk in Done. Tooltip `Ends when <what the gate waits for>`, `Gate, the Job is held on you` (pulsing in the Needs you hue) or `Gate, closed by Fleet`. The workflow step that shows a walk, as a gate. The chunk's progress is its circle mark, so this stays out of a Job's progress."
