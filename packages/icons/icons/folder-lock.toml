[icons.folder-lock]
  means = "A folder with a padlock on it"
  group = "Operator"
  size = "16px"
  status = "Proposed"
  reserved = "A hold the Operator keeps over paths, which only the Job it names writes under until it pushes or ends: the Holds tile's head on the Operator page. Never a locked file, a permission or a security state, and never a Logbook lock, which is `lock`."
  notes = "Proposed 10 Nov 2026 for the native walk `operator-page`, for the owner to rule on. `lock` was refused: it is reserved against anything that means access, and a hold is about who writes where. Tooltip-free: the tile's name, Holds, says it."
