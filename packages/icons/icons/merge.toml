[icons.merge]
  means = "The merge line: two paths bending into one and rising as a single arrow, branches taking their turn onto main"
  group = "Navigation"
  size = "16px"
  status = "Specified"
  reserved = "The Merge line surface only. Never the merge act at a gate, which is a button with its own word, and never a merged pull request, which is `git-merge`."
  notes = "Added 2 Oct 2026 for the Merge line's rail row, and chosen by the owner over `list-end` on the walk the same day. Every Navigation glyph is reserved to its own surface, so none could be borrowed. Against the set: `layout-dashboard` is a grid of panes, `hard-drive` a horizontal vessel, `presentation` a board on legs, `briefcase` a case, `book-open` two leaves; two strokes converging into an arrowhead is none of them. Against `git-merge`, the Pull request state badge: that is two nodes on strands, drawn at 12px in a Job header; this is open paths with an arrowhead at 16px in the rail, and the two never sit together. The other candidate was `list-end`, lines with a turn into the end, which says a queue but at 16px reads close to `menu`'s three bars. Refused: `list-ordered`, reserved to Studio outlines; `git-merge`, reserved to the badge; `waypoints`, the graph toggle."
