[icons.circle-pause]
  means = "A ring with two bars inside — a Job paused: its work saved on its branch and its slot given back"
  group = "Pause and resume"
  size = "12px"
  status = "Specified"
  reserved = "A paused Job, on the Board row, the Job card, Job detail and a Cleanup tile. Never Freeze dispatch, which is `pause`, and never a Drone held at a command."
  notes = "Minted 6 Oct 2026 for Pause and Resume, on the owner's words of 5 Oct: pause a Job without stopping it, since stopping is terminal. He named the glyph. It sits beside the real status badge and never replaces it, so a Job at a review gate reads Needs review with this beside it. **An exception to the `circle-*` reservation to Judge verdicts**, taken on his decision: the two never share a surface, because a verdict is drawn in a criterion's row and this beside a status badge. Refused: `pause`, Freeze dispatch's, which is a control for a different act and would promise the Job is held rather than parked."
