[icons.vector-square]
  means = "A square outline with a small square on each corner — a region ringed off, held by its corners"
  group = "Canvas rail"
  size = "16px"
  status = "Specified"
  reserved = "Placing a Zone on a Studio's whiteboard only. Never a selection, never a crop, and never a Cluster, which is `group` on the node bar."
  notes = "Added 2026-10-02 with the Zone (#1620). A Zone is a ringed-off region of the board that holds other nodes and moves with them, and a square held at its four corners is how every drawing tool draws a frame a person can drag — the literal depiction, which P1 asks of a glyph that is not a proper noun. Against the rail it joins: `sticky-note` peels a corner, `square-plus` carries a cross inside, `shapes` is three figures, `link` a chain; this is an empty outline whose difference is on the outline itself, at the corners, which rule 3 asks for. Against `group` on the node bar: that is a dashed frame round two figures, the act of making a Cluster, and the two never sit in one bar. Refused: `square-dashed`, a dashed outline that differs from `group` only inside it; `frame`, which reads as a crop and was refused for the Sketch for that reason; `scan`, whose four corner brackets are `maximize`'s silhouette turned inward; `layout-dashboard`, which says a screen's panes."
