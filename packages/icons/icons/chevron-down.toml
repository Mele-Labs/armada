[icons.chevron-down]
  means = "Disclosure — the caret segment of a split button"
  group = "Action"
  size = "16px"
  status = "Specified"
  reserved = "Disclosure only. Never an ornament on a label — a menu trigger's mark, the usage below, says the button opens a menu and is not ornament — and never a sort or direction indicator. Never an inline expander on a row of data — a Job row does not grow a caret. Expanding a nested structure in chrome is disclosure and is the paired use below; the distinction is whether the thing expanding is a record or a tree."
  notes = "Added 2026-08-21 with the split button. 16px in --fg-muted while the control is live, in its own 28px segment divided from the label by a 1px --border-default rule. The one exception to \"primary and secondary buttons are label-only\": a disclosure caret is the whole content of its own segment, structural rather than decorative, and never sits beside a label. A menu trigger is the second usage below: beside a label, by design, since 2026-09-17."
  # The reservation above was first written against the split button and
  # said "never an accordion chevron on a data row", which read as banning
  # the Chrome use below. It was wording, not a conflict: a record does not
  # grow a caret, a tree discloses. Reworded 25 Aug 2026.

  [[icons.chevron-down.usage]]
    means = "expand and collapse"
    group = "Chrome"
    size = "16px"
    status = "Specified"
    paired_with = "chevron-right"

  [[icons.chevron-down.usage]]
    means = "opens a menu — a menu trigger's mark"
    group = "Action"
    size = "12px"
    status = "Specified"
    reserved = "Right of the label on a button that opens a menu, drawn by the DropdownMenu primitive's trigger. Never on a trigger with no label, which would give an icon-only or split caret a second mark, and never on a button that acts rather than opens."
    notes = "Settled 2026-09-17 by the owner, on an annotation that the title bar's repository picker could not be told from a button. Widens the reservation: chevron-down now means two related things, the split button's caret and a menu trigger, and the owner accepted that the reservation is looser for it. 12px because it trails text at the text's own size, as chevron-right's goes-to usage does; 16px stays with the caret that is its segment's whole content. strokeWidth 2, and it inherits the label's colour rather than taking --fg-muted, so a disabled trigger dims its mark with its text."
