[icons.x]
  means = "A bare cross, two crossed strokes"
  group = "Job state"
  size = "12 and 16px"
  status = "Specified"
  reserved = "Two uses, told apart by which record it marks. System failure as a badge, and the shadcn dialog close as chrome; a Plan region's failed task, below. Never a human decision — that is ban."
  notes = "Bare cross. As a badge it is system failure only; as chrome it is the shadcn dialog close, unchanged."

  [[icons.x.usage]]
    means = "A plan task whose own agent stopped without finishing"
    group = "Step and Verdict"
    size = "12px"
    status = "Specified"
    reserved = "TaskMark's (packages/components) failed state only, docs/concepts/plan.md. Never a dropped task, which is minus, and never a Check outcome, which is shield-x."
    notes = "Added 2026-09-22 for #1535, once a Drone per task made a task able to fail on its own. Reuses the table above's claim one level below a Job: the system failed, nobody decided. It is the counterpart of check, which TaskMark already takes for done, so the pair reads at task level exactly as it does at Job level — and the pairing is what refused circle-x, which is reserved to Judge verdicts, and shield-x, which is reserved to Checks. A task's agent stopping is neither. Renders --step-failed, the declared alias of --status-completed-failed one level below a step, so no token was minted."

  [[icons.x.usage]]
    means = "A sign-in the forge or the store answered no to"
    group = "Account"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 15 Oct 2026 for the walk `sign-in-ended`. The system said no and nobody decided, which is this glyph's claim as a badge. Tooltip `Refused`. `ban` stays a person's decision and is used for denied."

  [[icons.x.usage]]
    means = "A message of the person's that Fleet did not take, on its band in a Session's thread, beside a Retry"
    group = "Session"
    size = "12px"
    status = "Specified"
    notes = "Specified 16 Oct 2026 for the walk `session-message-sending`, which the owner walked and approved, tooltip `Not sent`. The system did not take it and nobody decided, which is this glyph's claim as a badge. The Retry beside it is a text button with no glyph."

  [[icons.x.usage]]
    means = "A background command that exited with a non-zero code, on a Session's ledger row"
    group = "Session"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 16 Oct 2026 for the walk `ledger-background`, tooltip `Exit` and the code. The command failed and nobody decided, which is this glyph's claim as a badge. `shield-x` stays a Check's, so the row takes the cross and the failed hue."
