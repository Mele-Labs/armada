[icons.square-arrow-out-up-right]
  means = "A box with an arrow leaving its corner - this file, in another program"
  group = "Chrome"
  size = "16px"
  status = "Proposed"
  reserved = "Handing a file to the editor the machine opens it with, on the file panel's head. Never a link to a web address, which is `external-link`."
