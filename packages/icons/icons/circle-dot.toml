[icons.circle-dot]
  means = "Two concentric circles"
  group = "Job state"
  size = "12px"
  status = "Specified"
  notes = "Two concentric primitives, maximum legibility at 12px. Reads live, and unlike play it does not read as a button."

[[icons.circle-dot.usage]]
  means = "A Session's Checks that are running, counted in its header"
  group = "Session"
  size = "16px"
  status = "Specified"
  notes = "Approved 16 Oct 2026 on the walk `sessionRunningChecks`. The running glyph the thread's check rows wear, with the count in mono beside it, tooltip `2 checks running`. It does not pulse, since the Session's state mark already does in the header. A press lists the running Checks, each wearing the step mark for running."

[[icons.circle-dot.usage]]
  means = "Auto land on, in the corner of its flight control tile"
  group = "Session"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 19 Oct 2026, approved on the walk `flight-controls-custom`. Its accessible name is `Auto land on`, in --accent, against circle's empty ring for off. The tile also lights while on."

[[icons.circle-dot.usage]]
  means = "A Job this one's agent started has left its start card: the linked row in the parent's thread"
  group = "Session"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 28 Oct 2026 for the walk `child-job-start`, tooltip `Started`. Beside `eye`, `power` and `git-merge` on the same row: a Job running is this glyph's own meaning."

[[icons.circle-dot.usage]]
  means = "A reported bug on the Issues tab that nobody has opened yet, in the muted ink"
  group = "Issues"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 29 Oct 2026 for the walk `reported-bugs`, tooltip `Unread`. It asks nothing of the owner, so it is neither a pulse nor the awaiting review hue, and it goes once the report is opened. Borrowed and not minted: `reply` is a reply the agent made, and `mail` is reserved to a stranded slot. The owner may rule otherwise."
