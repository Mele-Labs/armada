[icons.git-pull-request]
  means = "pull request"
  group = "Git and config"
  size = "12px"
  status = "Specified"

[[icons.git-pull-request.usage]]
  means = "A failed Trigger's repair that became a pull request of its own, with its number"
  group = "Trigger"
  size = "12px"
  status = "Specified"
  notes = "Added 7 Oct 2026 with Self repair. Tooltip `New PR`. Ends the repair branch on a canvas; the number beside it is the forge's."

  [[icons.git-pull-request.usage]]
    means = "The tile for pull request owners, on what signing in turns on"
    group = "Account"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 15 Oct 2026 for the walk `account-page`. Which Session or Job owned a pull request, across machines. Tooltip on the tile's mark is `Off` until a profile exists, then `On`."

  [[icons.git-pull-request.usage]]
    means = "The Pull request opened stop on a Session's road to main; the phase glyph while the road is laid and that is the stop last reached"
    group = "Session build"
    size = "16px"
    status = "Specified"
    notes = "Approved 14 Oct 2026 on the walk `battlefieldProgress`, the build ring (`.claude/decisions/2026-10-14-a-session-builds-a-ring.md`). Tooltip `Pull request opened`."

  [[icons.git-pull-request.usage]]
    means = "The Deliver step's mark on a workflow step card"
    group = "Workflows"
    size = "12px"
    status = "Specified"
    notes = "Specified 27 Oct 2026 on the walk `workflowsManaged`, which the owner walked and approved (`.claude/decisions/2026-10-27-a-feature-job-walks-before-it-tests.md`). Drawn at 14px, stroke 2. Deliver ends in a pull request, which is what the glyph already says."
