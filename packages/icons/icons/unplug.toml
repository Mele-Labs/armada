[icons.unplug]
  means = "A plug and socket with a visible gap between the two fragments"
  group = "Escalation reason"
  size = "12px"
  status = "Specified"
  notes = "The visible gap between two fragments reads as connection lost, which is the precise distinction against killed."

  [[icons.unplug.usage]]
    means = "A branch on the merge line that main does not merge into cleanly"
    group = "Land state"
    size = "12px"
    status = "Specified"
    notes = "Added 2 Oct 2026 with `land_state` in `crates/core-model/domain/enum-verbs.toml`, after the owner refused `split` on the walk, and chosen by him over `wrench` on the next walk the same day. Two halves with a gap where they should join is the merge that would not close. The row carries no reservation. It meets `interrupted` and a `signalled` Check in neither place: those mark a Job and a Check, and this marks a branch on the merge line. `wrench`, the other candidate, stays reserved to `job_status.awaiting_repair`. Refused: `split`, by the owner; `git-merge` and `git-pull-request-closed`, each reserved to a pull request's badge, and a closed-PR mark beside a row's own `#1770` would read as that pull request closed; `x`, which `red` takes; `triangle-alert`, reserved to Doctor."
