[icons.unplug]
  means = "A plug and socket with a visible gap between the two fragments"
  group = "Escalation reason"
  size = "12px"
  status = "Specified"
  notes = "The visible gap between two fragments reads as connection lost, which is the precise distinction against killed."

  [[icons.unplug.usage]]
    means = "A branch on the merge line that main does not merge into cleanly"
    group = "Land state"
    size = "12px"
    status = "Specified"
    notes = "Added 2 Oct 2026 with `land_state` in `crates/core-model/domain/enum-verbs.toml`, after the owner refused `split` on the walk, and chosen by him over `wrench` on the next walk the same day. Two halves with a gap where they should join is the merge that would not close. The row carries no reservation. It meets `interrupted` and a `signalled` Check in neither place: those mark a Job and a Check, and this marks a branch on the merge line. `wrench`, the other candidate, stays reserved to `job_status.awaiting_repair`. Refused: `split`, by the owner; `git-merge` and `git-pull-request-closed`, each reserved to a pull request's badge, and a closed-PR mark beside a row's own `#1770` would read as that pull request closed; `x`, which `red` takes; `triangle-alert`, reserved to Doctor."

  [[icons.unplug.usage]]
    means = "A Drone that is working when Fleet restarts: its pipes die and it cannot be redirected until it finishes, on the Fleet panel's restart confirm"
    group = "Fleet"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 8 Oct 2026, with the wiring of the Fleet panel's build section. The mock had no confirm; the owner has not seen this line. A connection that is gone is what `unplug` already says for a Job that lost its Drone. Tooltip carries the rest of what adopting costs. The row carries no reservation."

  [[icons.unplug.usage]]
    means = "The last holder of a stranded worktree slot is gone: its Session closed or its Job ended"
    group = "Worktree slot"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 13 Oct 2026 with the last holder on a stranded bay. The same gap `unplug` already draws for a Session that ended. Tooltip is Session closed or Job ended. The row carries no reservation."

  [[icons.unplug.usage]]
    means = "A sign-in that could not reach the forge or the store, and a store that kept its row on sign-out"
    group = "Account"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 15 Oct 2026 for the walks `sign-in-ended` and `sign-out`. A connection that is gone is what this glyph already says. Tooltips `Not reached` on the sign-in, and Fleet's own sentence on the store row."
  [[icons.unplug.usage]]
    means = "Release, the tile on an open Session's flight controls that gives back or hands over everything the Session holds"
    group = "Flight control"
    size = "16px"
    status = "Specified"
    notes = "Proposed 16 Oct 2026 for the walk `cockpit-release-holds`, and kept by the owner the same day. Cleanup's slot Release already draws this glyph for taking a checkout from a session. Tooltip `Release or hand over everything the Session holds`, and `The Session holds nothing` where it is off. Refused: `hand`, reserved to a slot a piloted Job handed over; `door-open`, a free slot only; `key-round`, a slot held."

  [[icons.unplug.usage]]
    means = "Release on one held row of a Session's ledger, and the mark of a row given back from there"
    group = "Session"
    size = "12px"
    status = "Specified"
    notes = "Proposed 16 Oct 2026 for the walk `session-ledger-release-row`, after the owner asked to release ledger items one by one, and approved on its walk the same day. The same glyph as the flight control's Release, so the act reads the same in both places. Tooltip `Release <item>` on the act, shown on the row's hover or focus, and `Given back` on the mark. The row carries no reservation."

  [[icons.unplug.usage]]
    means = "The forge has stopped answering Fleet: the merge queue's main chip is held from the last visit that was answered, since the time its tooltip names"
    group = "Merge line"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 16 Oct 2026 for the walk `merge-line-freshness`. The sign-in that could not reach the forge already draws this glyph for a connection that is gone. The registry has no cloud-off or wifi-off, and a new glyph for the same silence would be a second answer. Tooltip `GitHub not answering since 18:40`. The row carries no reservation."

  [[icons.unplug.usage]]
    means = "An MCP server in a Session's Loadout that failed to connect"
    group = "Session"
    size = "12px"
    status = "Specified"
    notes = "Proposed 17 Oct 2026 for the walk `session-loadout`, approved by the owner 18 Oct 2026. A connection that is not there, in `--status-completed-failed`. Tooltip `Failed`. A server connected draws no mark."

  [[icons.unplug.usage]]
    means = "A request nothing answered: refused, timed out or a name that did not resolve, on its row in a Job's thread and in Requests' history"
    group = "Session"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 19 Oct 2026 for the walk `requests-with-the-owners-header`. A connection that is not there, as a sign-in that could not reach the forge draws it. Failed hue, tooltip `No answer` and Fleet's words. That walk is replaced by `requests-collections-and-environments`, which sends no request nothing answers."
