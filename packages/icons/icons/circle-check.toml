[icons.circle-check]
  means = "A circle with a check inside"
  group = "Step and Verdict"
  size = "12px"
  status = "Specified"
  reserved = "Judge verdicts only. Never a Check result, never a generic success mark, never a completed step — that is bare check in --step-advanced."
  notes = "Added 2026-08-21. In --verdict-met. circle-* is the Judge's own glyph family, beside shield-* for Checks and file-* for evidence artifacts — a verdict on a criterion is neither a gate nor an artifact, so the silhouette carries hedge-by-source before the label is read. Rendered as \"no objection\" rather than \"accepted\": the Judge declines to refuse, it never grants."

  [[icons.circle-check.usage]]
    means = "A piece Import added or replaced, tooltip `Added` or `Replaced`"
    group = "Kit"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 21 Oct 2026 for the walk `sharing-in-bridge`, after the owner asked Import to show each piece as it will look, with colour. `docs/design/who-sees-each-piece-of-configuration.md`, *Share is a package*."

[[icons.circle-check.usage]]
  means = "A ticket that is closed or done, on the card of the Job started for it"
  group = "Workspace lanes"
  size = "14px"
  status = "Proposed"
  notes = "Proposed 30 Oct 2026 for the walk `ticket-on-job-lane`, the owner's answer of a glyph for each state. It ends the ticket's line on the card of a Job that was started for it, after the key, at 14px stroke 2 as the `ticket` glyph is, and the tooltip names the state in words: `Ticket state: Done`. It is the ticket's own end state, not a Judge verdict."
