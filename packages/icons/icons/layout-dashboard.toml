[icons.layout-dashboard]
  means = "Overview — a rectangle split into panes, like the tile band and lists it opens on"
  group = "Navigation"
  size = "16px"
  status = "Specified"
  notes = "Added 2026-09-13 with Overview, Bridge's first surface (#921). The only Navigation glyph built from a grid of panes rather than a single bounded shape, which is what keeps it clear of clipboard-list (an upright board), hard-drive (a horizontal vessel), and the outline-with-something-inside family — message-square, bell, stethoscope, file-cog."
