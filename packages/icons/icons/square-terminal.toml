[icons.square-terminal]
  means = "A square with a prompt caret inside it — a Session, a raw conversation with a hosted agent"
  group = "Navigation"
  size = "12 and 16px"
  status = "Proposed"
  reserved = "A Session: its rail row, its band, its card. Never Pilot, which is `terminal`'s, and never Helm, which is `message-square`."
  notes = "Proposed 6 Oct 2026 for the walk `sessions`, for the owner to rule on. A Session sits beside Helm and is not Helm, and it is a conversation and not a Pilot window, so neither of their glyphs could carry it. The square keeps it a different outline from `terminal` at 12px. A Navigation glyph is the owner's to mint, as `shield-check` on Checks was."

  [[icons.square-terminal.usage]]
    means = "The Session that held a stranded worktree slot last, leading its title on Cleanup"
    group = "Worktree slot"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 13 Oct 2026 beside the Job's `box` in the same row. --accent with the title as a link while the Session is open, --fg-muted when it is closed."

  [[icons.square-terminal.usage]]
    means = "A shell command the Session's agent ran in the background, on its ledger row"
    group = "Session"
    size = "12px"
    status = "Specified"
    notes = "Chosen by the owner on 16 Oct 2026 for the walk `ledger-background`, tooltip `Background command`. A command run is not a Session and not Pilot, and the ledger already holds a piloted Job's `terminal` mark, so the square keeps the two apart at 12px. An exception to the reservation to a Session, on his word."
