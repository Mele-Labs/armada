[icons.git-compare]
  means = "Two nodes joined by a path each way"
  group = "Workflows"
  size = "12px"
  status = "Specified"
  notes = "Specified 27 Oct 2026 on the walk `workflowsManaged`, which the owner walked and approved (`.claude/decisions/2026-10-27-a-feature-job-walks-before-it-tests.md`). Marks a step in the Workflows page's compare that differs from the same step in Armada's workflow. Two ends and a path between them is a comparison. Tooltip `Differs from Armada's`. Drawn at 14px, stroke 2. Refused: `pencil-line`, reserved to a Drone's write on the flight deck, and `diff`, reserved to an edited issue."

[[icons.git-compare.usage]]
  means = "A step a proposed change to a workflow alters, on its card in the Proposed change region"
  group = "Workflows"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 28 Oct 2026 for the walk `workflows`. Tooltip `Changed`. Drawn at 14px, stroke 2. The same comparison the step's `Differs from Armada's` mark draws, between a step before and after the change. `list-plus` and `list-minus` mark an added and a removed step's card, tooltips `Added` and `Removed`."

[[icons.git-compare.usage]]
  means = "A state of a lane changed on this Job"
  group = "Workspace lanes"
  size = "14px"
  status = "Proposed"
  notes = "Proposed 28 Oct 2026 for the walk `workspaces-lanes`. Typing `skip the deploy watch` to the agent changes the Job's copy of the Deploy lane; the mark sits on the corner of the state it changes, which is drawn with a dashed frame, tooltip `Changed on this Job` and the change. The same comparison as the Workflows page's Differs from Armada's."

[[icons.git-compare.usage]]
  means = "Compare with Armada's, a toggle in the Workflows page's header toolbar"
  group = "Workflows"
  size = "16px"
  status = "Proposed"
  notes = "Proposed 29 Oct 2026 for the walk `workspaces-lanes`. Tooltip `Compare with Armada's`. Pressed, each step of the copy that differs from Armada's says so on its card, as the Differs from Armada's mark does."

[[icons.git-compare.usage]]
  means = "A rule or a lifecycle changed on this Job, on the rule's chip, on the lane's head and on a row of Changed on this Job"
  group = "Workspace lanes"
  size = "14px"
  status = "Proposed"
  notes = "Proposed 30 Oct 2026 for the walk `workspaces-lanes-copy`. Tooltip `Changed on this Job` and the change. The same comparison a changed state or step already wears."
