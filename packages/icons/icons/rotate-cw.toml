[icons.rotate-cw]
  means = "Redispatch"
  group = "Action"
  size = "16px"
  status = "Specified"
  notes = "Single arrow, distinct from refresh-cw. Also the proposed step-level retrying mark."

  [[icons.rotate-cw.usage]]
    means = "Refresh a reading — Pulse's own act, which asks Fleet to go and look at this job again"
    group = "Action"
    size = "12px"
    status = "Specified"
    notes = "Added 2026-09-28 with the owner's rename of that button from `Look now` to `Refresh`. Not a new claim: docs/contracts/iconography.md's reserved list already sends every refresh and poll control here, because refresh-cw is churning's alone. It replaced `search`, which meant search and had been borrowed for a button that goes and reads. Draws at 12px rather than the 16px above, matching the small button it sits in; the silhouette is one arrow and a gap, which rule 3 keeps at that size."

  [[icons.rotate-cw.usage]]
    means = "A terminal Session's mod is older than the repository's: reload the plugins in that session"
    group = "Session"
    size = "12 and 16px"
    status = "Specified"
    notes = "Added 7 Oct 2026. A reload is the same act a refresh is, and rotate-cw is the refresh mark. Tooltip `Mod out of date: run /reload-plugins`, on the Session's row and in its header."

  [[icons.rotate-cw.usage]]
    means = "Restart Fleet: ask launchd to restart the job that runs it, from the notice that says Fleet and Bridge do not match"
    group = "Action"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 8 Oct 2026 for the walk `fleetProtocolMismatch`. A restart is the same act a reload is, which the entry above already gives this glyph; `refresh-cw` stays churning's and `power` stays the stop. Tooltip `Restart Fleet. Working Drones are adopted and cannot be redirected until they finish.`"

  [[icons.rotate-cw.usage]]
    means = "Refresh preview or Update to main: restart Fleet and Bridge onto a refreshed preview or the latest main, from the Fleet panel"
    group = "Action"
    size = "16px"
    status = "Specified"
    notes = "Proposed 8 Oct 2026 for the walk `fleetBuildPreviewAhead`, approved by the owner the same day. A refresh is the same act a reload is, which the entries above already give this glyph. Tooltips `Merge in-flight branches and restart on the preview` and `Restart on latest main`. The button follows the selection, and on Main it is disabled with `On latest main` once Fleet is level with main."

  [[icons.rotate-cw.usage]]
    means = "The Commander restarted a task, on a Drone of its own"
    group = "Now"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 11 Oct 2026 with the Commander's act rows. Redispatch is this glyph's own meaning above, and a restarted task is a task dispatched again. Tooltip `Restarted task`."

  [[icons.rotate-cw.usage]]
    means = "Waiting on GitHub: Fleet is polling for the device code to be typed, then finishing the sign-in"
    group = "Account"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 14 Oct 2026 for the walks `onboarding-home` and `onboarding-work`. Every poll control is this glyph's. Turns while the poll runs, held still under reduced motion. Tooltip `Waiting for GitHub`. The same turn marks a set-up row in progress, tooltip `Setting up`, and a kind pulling on, tooltip `Pulling`."
