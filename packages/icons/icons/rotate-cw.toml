  [[icons.rotate-cw.usage]]
    means = "Rerun on a held Trigger: run its Command again, with no Drone"
    group = "Trigger"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 7 Oct 2026 for the walk `aTriggerHoldsTheJob`. A rerun is the same Command asked again, which is redispatch's one-arrow claim one level down. Tooltip `Rerun`. `refresh-cw` stays churning's."
