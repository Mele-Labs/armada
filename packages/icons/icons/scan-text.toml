  group = "Test map"
  size = "16px"
  status = "Proposed"
  reserved = "A test map edge a model read and named, on a changed file's row and on the tests under it; and a Needs you question Fleet read from a reply, tooltip `Read from the reply`. Never a search, a capture or the proposer, which is `scan-line`'s, and never a document, which is the file-* family."
