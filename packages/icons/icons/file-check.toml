[icons.file-check]
  means = "A page outline with a check — one submitted piece of evidence"
  group = "Evidence"
  size = "12px"
  status = "Specified"
  reserved = "A submission that landed. Never a Check result, which is the shield-* family."
  notes = "The check marks that evidence was submitted, not that anything passed — a submission returns a receipt and the verdict arrives later. Distinguishing those two is why this is not `shield-check`."

