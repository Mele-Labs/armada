[icons.package]
  means = "A box with a seam across its lid and a tape strip — something that ships whole"
  group = "Workflows"
  size = "12px"
  status = "Specified"
  reserved = "A workflow Armada carries, compiled in. Never an export, a release or an install, and never Kit, which is `briefcase`."
  notes = "Minted 5 Oct 2026 for the Workflow creator. A carried definition is the one the product ships with, and the tooltip says Ships with Armada. Against `archive`, the lidded box the badge set keeps as its own, this one has the seam and the strip, which hold at 12px. `briefcase`'s own row refused `package` as the Kit glyph for the same lidded-box reason, and this is a different thing, so the two do not meet."

  [[icons.package.usage]]
    means = "A Trigger Armada ships"
    group = "Trigger"
    size = "12px"
    status = "Specified"
    notes = "Added 7 Oct 2026 with Triggers on the Workflows surface. The level mark on a Trigger row, tooltip `Ships with Armada`. Armada ships none today, so the mark is drawn only for a Fleet that sends one."

  [[icons.package.usage]]
    means = "A mod Armada ships, on its row under Theme and in Kit's Mods"
    group = "Mods"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 23 Oct 2026 for the walk `mods-travel`. The same carried thing as a workflow Armada ships, tooltip `Ships with Armada`, in the column Promote holds on a mod of the mod folder, since a mod Armada ships is never promoted."

  [[icons.package.usage]]
    means = "A run setting up: a setup Command under way on its row of the running panel, and the run's mark on its pane, a repository's heading and a Job's header while setup runs"
    group = "Run"
    size = "12 and 16px"
    status = "Proposed"
    notes = "Proposed 26 Oct 2026 for the walk `run-setup`, tooltip `Setting up`. What setup does is bring a checkout's packages in, `npm ci` or a `.venv`, so the box is what is being made. Drawn still, in the serving hue: the open ring turning is the processes starting after it."
