[icons.user-check]
  means = "A human figure with a check beside it — the only human silhouette in the badge set"
  group = "Job state"
  size = "12px"
  status = "Specified"
  reserved = "Human required, or actor=human."
  notes = "The only human figure in the badge set, and a human being required is exactly the semantics."

  [[icons.user-check.usage]]
    means = "A retro item that got in the owner's way"
    group = "Retro"
    size = "12px"
    status = "Specified"
    notes = "Added 3 Oct 2026 with the Lessons page and a Job's retro sheet (`docs/concepts/retro.md`). Whose way an item got in is a mark with its word on hover, the owner's standing rule; the person's is this glyph because its own reservation is actor=human, which is what `who = owner` says. --fg-muted, never a status hue: the mark says who, not how bad. Tooltip: You."

  [[icons.user-check.usage]]
    means = "You, one of the ways a workflow step advances"
    group = "Workflows"
    size = "12px"
    status = "Specified"
    notes = "Added 5 Oct 2026 with the Workflow creator. A step that stops for a person, which is the glyph's own `actor=human`."

  [[icons.user-check.usage]]
    means = "The signed-in GitHub account, as the account chip and the identity row"
    group = "Account"
    size = "12 and 16px"
    status = "Proposed"
    notes = "Proposed 14 Oct 2026 for the walks `onboarding-home` and `onboarding-work`. Leads the login in mono on the title bar's account chip, a profile chip and the identity row of the set-up list, tooltip `Identity`. The glyph already means you, and an account is who you are. `Active` on a profile is a bare check beside it."

  [[icons.user-check.usage]]
    means = "A repository matched to a profile: its owner is the account or one of its organisations"
    group = "Account"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 15 Oct 2026 for the walk `account-repositories`. On a row in a profile's repositories, tooltip `Matched`. The glyph already says an account vouches for it; `user-pen` is the same row bound by the person's choice."

  [[icons.user-check.usage]]
    means = "A step of a walk Bridge plays, waiting while the page is signed in on a provider or in its popup"
    group = "Session"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 15 Oct 2026 with the walk's signing-in hold, for the walk row of the capture window's bar, beside where `search` marks a target not found. The page is on a sign-in the person does, which is `actor=human` and what this glyph already means; `lock`, `lock-keyhole` and `key` are reserved against an auth state and `log-in` is not in the registry. The owner has not seen it. Tooltip `Signing in`; no sentence. --fg-muted, a wait and not a fault. The row carries no reservation."

  [[icons.user-check.usage]]
    means = "A form edit's pull request the forge would not auto-merge: a person merges it"
    group = "Pull request state"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 15 Oct 2026 for the walk `mergeByHand` (#2396). Follows the number on the pull request's chip in the Cockpit's merge queue, tooltip `Needs merging by hand`, in `--status-awaiting-approval`. The glyph already means a person is required, and `hand` is reserved to a slot handed over with a Job. The same fact is a call and a line under the Manifest form's Save, which draw no glyph."
