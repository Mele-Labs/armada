[icons.play]
  means = "A right-pointing triangle — put a paused Job or Session back to work"
  group = "Pause and resume"
  size = "16px"
  status = "Specified"
  reserved = "Resume on a paused Job or Session, in a menu, a header and a confirm. Never a Drone running, which is `circle-dot`, and never starting a run or a server."
  notes = "Minted 6 Oct 2026 for Pause and Resume, with `circle-pause`, on the owner's decision. The ordinary counterpart of a pause bar, and the only one: Resume lifts the pause and starts nothing itself, since admission starts the Drone."

  [[icons.play.usage]]
    means = "Run on a Trigger that asks first: run its destructive Command once, now"
    group = "Trigger"
    size = "16px"
    status = "Specified"
    notes = "Owner ruled 8 Oct 2026: `play`, drawn red (`--run-failed`) because pressing it does the destructive thing. Proposed the same day for the walk `aDestructiveTriggerAsks`. A Trigger on a destructive Command waits on the owner, and Run is his yes for this one firing, with `skip-forward` as the no. The triangle keeps its one claim, go, one level down from a paused Job's Resume. Tooltip `Run`. Draws at 16px in a small button on the Trigger's leaf, the size of the Rerun and Skip acts."

  [[icons.play.usage]]
    means = "Run a code block from a Session's thread, in the Session's directory"
    group = "Run"
    size = "16px"
    status = "Specified"
    notes = "Proposed 11 Oct 2026 for the mock walk `runCodeBlock`. Tooltip `Run`, no text. Appears on hover and on keyboard focus of the block. The person's own act: nothing is sent to the agent. Approved 11 Oct 2026."

  [[icons.play.usage]]
    means = "Run an app: the face of the run control on a repository's heading in the Cockpit's list (main) and in a Job's header (its bay)"
    group = "Run"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 25 Oct 2026 for the mock walk `run-an-app`, on the owner's ask to start any repository's app without a Job. Tooltip names the run and where it runs, `Mock Bridge on main`, and `Run on main` where none is saved. Beside it `chevron-down` is the caret of the same split control. Contradicts this glyph's `reserved` line (`never starting a run or a server`), which the code-block and Trigger uses above already stepped past; the owner ruled the play glyph for this act."
