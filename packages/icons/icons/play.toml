[icons.play]
  means = "A right-pointing triangle — put a paused Job or Session back to work"
  group = "Pause and resume"
  size = "16px"
  status = "Specified"
  reserved = "Resume on a paused Job or Session, in a menu, a header and a confirm. Never a Drone running, which is `circle-dot`, and never starting a run or a server."
  notes = "Minted 6 Oct 2026 for Pause and Resume, with `circle-pause`, on the owner's decision. The ordinary counterpart of a pause bar, and the only one: Resume lifts the pause and starts nothing itself, since admission starts the Drone."

  [[icons.play.usage]]
    means = "Run a code block from a Session's thread, in the Session's directory"
    group = "Run"
    size = "16px"
    status = "Specified"
    notes = "Proposed 11 Oct 2026 for the mock walk `runCodeBlock`. Tooltip `Run`, no text. Appears on hover and on keyboard focus of the block. The person's own act: nothing is sent to the agent. Approved 11 Oct 2026."
