[icons.layers]
  means = "how many places a Job writes — one layer for one, stacked layers for several"
  group = "Graph"
  size = "12px"
  status = "Specified"
  notes = "At the approval gate and in the detail header only, never in a Job Board row \u2014 the row already names the first write target and counts the rest in text. Read `means = \"convoy\"` until 22 Sep 2026: the owner retired every kind name that day (#1530), and the glyph had always stood for blast radius rather than for a shape of Job. `docs/contracts/iconography.md`, Blast radius, is the rule."

  [[icons.layers.usage]]
    means = "The Implement phase of a Session's or Job's build, on its list row"
    group = "Session build"
    size = "16px"
    status = "Specified"
    notes = "Approved 14 Oct 2026 on the walk `battlefieldProgress`, the build ring (`.claude/decisions/2026-10-14-a-session-builds-a-ring.md`). Tooltip `Implement`. A Job shows it while its plan has tasks in it. This is the Cockpit's list row, not the Job Board's."

  [[icons.layers.usage]]
    means = "A Session's Loadout, the mark in its head: what its agent knows, was told and used"
    group = "Session"
    size = "16px"
    status = "Specified"
    notes = "Proposed 17 Oct 2026 for the walk `session-loadout`, approved by the owner 18 Oct 2026. What an agent carries is stacked on it in layers, from Kit, Armada, the repository and its plugins. Hover opens its inspect card, a press opens the Loadout sheet; the card's kind glyph is the same. The registry has no backpack, and `briefcase`, the case of tools you bring, is reserved to the Kit surface. Refused: `package`, Armada's own workflows; `puzzle`, Mods."

  [[icons.layers.usage]]
    means = "A workflow row that replaces a copy of the same id in a less specific place: Armada's, then the repository's, then Yours"
    group = "Workflows"
    size = "12px"
    status = "Specified"
    notes = "Specified 27 Oct 2026 on the walk `workflowsManaged`, which the owner walked and approved (`.claude/decisions/2026-10-27-a-feature-job-walks-before-it-tests.md`). Drawn at 14px, stroke 2. Stacked layers, the top one standing over those under it. The tooltip says what it replaces."
