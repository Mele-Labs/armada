[icons.triangle-alert]
  means = "a check warns"
  group = "Doctor"
  size = "16px"
  status = "Specified"
  notes = "The one place triangle-alert lives, plus generic warnings in toasts."
  reserved = "Reserved to Doctor. A release on the grounds that Doctor draws no glyphs was withdrawn 25 Aug 2026 — the reservation holds whether or not the health grid draws it. No other surface may adopt it as its own mark."

[[icons.triangle-alert.usage]]
  means = "The Unreadable row in a worktree's panel: version control would not say what is in the checkout"
  group = "Worktree slot"
  size = "12px"
  status = "Specified"
  notes = "Proposed 5 Oct 2026 with Cleanup's one grid. Tooltip `Version control would not say`."

[[icons.triangle-alert.usage]]
  means = "What a move of a Session leaves behind and that it ends the Session: the facts to read before pressing Move"
  group = "Session"
  size = "16px"
  status = "Specified"
  notes = "Accepted 15 Oct 2026 with the walks. Proposed 15 Oct 2026 for the walk `session-move-repository`, on the owner's note that the confirm should read as a warning. The glyph of a caution Alert in the layer a Session's repository opens. The same meaning it has everywhere else: a warning."

[[icons.triangle-alert.usage]]
  means = "An uncommitted file in the served checkout that main also changed, so an autostash could stop on a conflict"
  group = "Cockpit"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 15 Oct 2026 for the walk `checkoutHeldBack`. Beside a path in the Uncommitted row of the Your checkout section on main's card, tooltip `Also changed on main`, in the awaiting review hue. The registry has no other warning glyph, and the Worktree slot's Unreadable row already takes this one at 12px for a fact about a checkout."

[[icons.triangle-alert.usage]]
  means = "A variable in a request's address that the picked environment gives no value"
  group = "Requests"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 21 Oct 2026 for the walk `requests-collections-and-environments`. Leads the line under the send line in place of `Sends to`, in `--notice-caution`, tooltip `No value`, followed by `{{base}} has no value in this environment`. The same meaning it has everywhere else: a warning."
