[icons.blocks]
  means = "Three squares set together and a fourth lifted out: the parts a thing is made of"
  group = "Ask tools"
  size = "12px"
  status = "Proposed"
  reserved = "Features, the Armada tool a message asks the agent for: its row in the list the message box's + opens and its chip in the words. Never a mod, a package or a dependency."
  notes = "Proposed 19 Nov 2026 for the message box's Ask the agent for list, for the owner to rule on. The tool asks the agent to answer from the project's feature catalog, the parts the product is made of, one at a time. Refused: `library`, reserved to a Job's Artifacts view; `library-big`, the same shelf; `layers`, how many places a Job writes and a Session's Loadout; `book-marked`, a standing Logbook entry."
