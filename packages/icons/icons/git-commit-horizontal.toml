[icons.git-commit-horizontal]
  means = "commit"
  group = "Git and config"
  size = "12px"
  status = "Specified"

  [[icons.git-commit-horizontal.usage]]
    means = "The commit a rescue Scout read a stranded slot at, on its Finding"
    group = "Worktree slot"
    size = "12px"
    status = "Specified"
    notes = "Proposed 4 Oct 2026 with the rescue of a stranded slot. The one existing glyph for a commit, before its short hash in mono. Tooltip `Commit it read`."

  [[icons.git-commit-horizontal.usage]]
    means = "The Pushed stop on a Session's road to main"
    group = "Session build"
    size = "16px"
    status = "Specified"
    notes = "Approved 14 Oct 2026 on the walk `battlefieldProgress`, the build ring (`.claude/decisions/2026-10-14-a-session-builds-a-ring.md`). Tooltip `Pushed`. A `git push` that updated a ref. The nearest glyph this registry holds for a commit."

  [[icons.git-commit-horizontal.usage]]
    means = "A branch the preview left out that has commits since, on its row in the Fleet panel's build section"
    group = "Fleet"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 28 Oct 2026 for the walk `preview-offer-fleet-panel`. Tooltip `Moved since it was left out`. Drawn muted in a column of its own width, so an unmoved row lines up. Borrowed: a new commit on the branch is what moved it. Refused: `arrow-up`, reserved to ahead of main."

[[icons.git-commit-horizontal.usage]]
  means = "Commit to repository on a piece the person keeps, in a toolbar"
  group = "Kit"
  size = "16px"
  status = "Proposed"
  notes = "Proposed 29 Oct 2026 for the walk `workspaces-lanes`. Tooltip `Commit to repository`. Starts a Job that commits the piece alone and opens a pull request for it."
