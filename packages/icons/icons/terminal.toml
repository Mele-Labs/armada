[icons.terminal]
  means = "A window with a prompt caret inside it"
  group = "Job state"
  size = "12 and 16px"
  status = "Specified"
  reserved = "Pilot, and a burst of commands run on the Cockpit's timeline. Nothing else."

[[icons.terminal.usage]]
  means = "A Job a Session is piloting, on its ledger row"
  group = "Session"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 7 Oct 2026 for the walk `sessions`. `terminal` is Pilot's alone and this is Pilot: the same mark the piloted badge wears, so the row and the Board say one thing."

[[icons.terminal.usage]]
  means = "A Session or a Job's Drone ran shell commands: one row for a burst of commands on the Cockpit's timeline"
  group = "Session"
  size = "12px"
  status = "Specified"
  notes = "Proposed 14 Oct 2026 for the walk `cockpit-feed-more-kinds`, tooltip `Ran`. **An exception to the reservation to Pilot, ruled by the owner on 14 Oct 2026** (\"Keep terminal\"): a command run is not Pilot, and the two never share a surface, since Pilot is drawn on a Job's ledger row and this on a timeline row. Draws in `--fg-subtle` on a muted row. The row opens to its commands, newest first."

[[icons.terminal.usage]]
  means = "A repository's command Fleet saw pass, not yet remembered: a job's row in How a repository runs"
  group = "Repository"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 18 Oct 2026 for the walk `first-run`. Tooltip `Seen in a Job`. Once remembered the row wears the glyph of the place it is kept in."
