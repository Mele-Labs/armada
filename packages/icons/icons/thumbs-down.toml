[icons.thumbs-down]
  means = "A hand with its thumb pointed down — the work is not right"
  group = "Action"
  size = "16px"
  status = "Specified"
  reserved = "Send it back on a step the gaming check holds, on its button only. Never a rejection, which is `ban`, never a kill, and never a Judge's refusal."
  notes = "Minted 2 Oct 2026, the owner's call on the walk of #1672: the two answers to a flag read as agree and disagree before their words do. It breaks the Actions rule that text buttons carry no icon, and only on these two buttons, which are a pair whose whole meaning is the direction of the thumb. Paired with `thumbs-up`; the two differ by orientation alone, which is why they are only ever drawn side by side with their words. Refused: `undo-2`, reserved to taking back a canvas stroke; `x`, a system failure; `ban`, a person's rejection, which ends a Job where this sends work back."
