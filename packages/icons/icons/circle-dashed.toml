[icons.circle-dashed]
  means = "A circle's outline broken into eight short dashes, with nothing at its centre — the break in the stroke is the whole claim, not motion. circle-dot's claim is the opposite construction, a continuous ring around a filled centre, so the two read apart by two independent facts: whether the stroke is unbroken, and whether anything sits in the middle."
  group = "Step and Verdict"
  size = "12px"
  status = "Specified"
  reserved = "Two uses, told apart by which record it marks. step_state.not_started on a step's own row; a Plan region's open task, below. Never a loading or busy indicator — the dashes read a stroke broken at rest, not a stroke in motion — and never a Judge verdict, which is circle-check/x/minus's family."
  notes = "Added 2026-09-02 for step_state.not_started, minted rather than borrowed — none of [conventions.step_activity_borrowing]'s five glyphs fit, since circle-dot, eye, rotate-cw, check and x each claim some activity happened or is happening, and not_started is the state where none of that is true yet. Unlike circle-check, circle-x and circle-minus, which are a ring plus a separate interior stroke — two graphical elements, one nested in the other — circle-dashed has no second element: the eight dashes are the entire outline, not a detail drawn inside a stable ring. What differs is a property of the stroke itself, continuous or broken, which is why this survives rule 3 where an icon needing its interior resolved would not. It is the mark StepActivityMark (packages/components) falls back to only where no ordinal reaches it — WorkflowRail and StepRow both pass one today, and the ordinal keeps the cell wherever a caller supplies it; a step's position is more informative than a silhouette and this glyph never displaces it. Renders at --fg-subtle, unchanged from packages/tokens/src/status.css:106's existing not_started assignment — no token edit made or needed. docs/contracts/iconography.md rule 6 and its Contrast floor section now name circle-dashed beside circle-minus as the second --fg-subtle exception, on the same grounds: --fg-subtle clears 4.58:1 post-lift, and this glyph carries no status hue for the same reason gate_undecided doesn't. --fg-muted was rejected on purpose: that is retrying's colour, and status.css keeps not_started one step dimmer than retrying deliberately; equalising them to clear rule 6 would erase the distinction the token file exists to hold."

  [[icons.circle-dashed.usage]]
    means = "An open plan task, not yet started"
    group = "Step and Verdict"
    size = "12px"
    status = "Specified"
    reserved = "TaskMark's (packages/components) open state only, docs/concepts/plan.md. Never a step's own not_started, which is the table above."
    notes = "Added 2026-09-13 for #896/#898. Reuses the same claim one level below a step: a stroke broken at rest rather than in motion, for a task no work has touched yet. Renders at --fg-subtle, the same contrast-floor exception the table above already carries — no second exception needed."

  [[icons.circle-dashed.usage]]
    means = "Not set up yet: the shared home before it exists, and a sign-in whose settings are blank"
    group = "Account"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 15 Oct 2026 for the walks `sign-in-no-home` and `sign-in-ended`. The stroke broken at rest is what this glyph already says of a thing not started, here a home nothing has made. Tooltips `Not set up yet` and `Not set up`. Never a spinner: the turn is `rotate-cw`'s."

  [[icons.circle-dashed.usage]]
    means = "A repository waiting for a choice in Not matched"
    group = "Account"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 15 Oct 2026 for the walk `account-repositories`. Tooltip `Waiting for a choice`. No profile matched it, or two both did. The broken ring at rest, as for a home not made."

  [[icons.circle-dashed.usage]]
    means = "A turn of the owner's that is not sent yet: the notes held on a Job's walk, at the end of its thread"
    group = "Step and Verdict"
    size = "12px"
    status = "Proposed"
    reserved = "The pending notes turn's band in the walk window's Job panel. Tooltip `Pending`. Never a failed send, which is the thread's `x` named `Not sent`, and never a send under way, which is the turning `loader-circle`."
    notes = "Proposed 19 Oct 2026 for the walk `walk-held-notes`, from the owner's note that pending notes show as the last item of the Job's thread. The stroke broken at rest says the turn has not started, the same claim it makes for a step or a task. Read at the band's own ink in --you, as the thread's delivery marks are."
