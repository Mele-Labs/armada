[icons.bot]
  means = "A robot's head \u2014 a rounded box with an antenna and a stub either side"
  group = "Record kind"
  size = "12px"
  status = "Specified"
  reserved = "A Record row about a Drone arriving at a step or leaving it. Never a Drone's state, never a model or the proposer, and never Helm, which is `message-square`."
  notes = "Minted 2026-09-29 for [record-kind-marks]. A Drone is an agent process, and this is the literal drawing lucide has of one. The antenna and the side stubs break the outline, which is what separates it at 12px from `file` and `archive`, the rectangles already in the grey set. The contract's *Where the answer is no icon* keeps the Who column in words, and this does not reach it: the Who cell still says Drone, and this mark names the row's family under All alone. Refused: `cpu`, a queued reason's; `terminal`, Pilot's alone; `user-check`, the human figure."

  [[icons.bot.usage]]
    means = "A retro item that got in a Drone's way"
    group = "Retro"
    size = "12px"
    status = "Specified"
    notes = "Added 3 Oct 2026 with the Lessons page and a Job's retro sheet (`docs/concepts/retro.md`). The same drawing of a Drone the Record's kind column uses, for the same reason: it is the literal agent. It names whose way an item got in, never a Drone's state, so the reservation above holds. --fg-muted; tooltip: Drone."

  [[icons.bot.usage]]
    means = "A retro item that got in a Session agent's way"
    group = "Retro"
    size = "12px"
    status = "Specified"
    notes = "Added 8 Oct 2026 with a Session's retro. A Session's agent is the same kind of thing a Drone is, so it takes the same drawing and a tooltip of its own, so the owner can tell a Session's items from a Job's. --fg-muted; tooltip: Agent."

  [[icons.bot.usage]]
    means = "A Drone at work, on a Job's Now line and on a Dashboard tile"
    group = "Now"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 9 Oct 2026 with the Dashboard's call card and tiles, which draw what a Job runs now with the Now panel's own marks. It sits beside the reservation above rather than inside it, and the owner may rule it out."
