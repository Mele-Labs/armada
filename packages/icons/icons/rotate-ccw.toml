[icons.rotate-ccw]
  means = "A single arrow turning back on itself - run the same command again"
  group = "Run"
  size = "16px"
  status = "Specified"
  reserved = "Run again on a command the person ran from a code block, and Start again on the line in a Job's thread that says its agent did not start. Redispatch of a Job stays `rotate-cw`."
  notes = "Proposed 11 Oct 2026 for the mock walk `runCodeBlock`. Mirror of `rotate-cw`, so a re-run does not read as a Redispatch. Approved 11 Oct 2026."

  [[icons.rotate-ccw.usage]]
    means = "Run a code block's command again after it ended"
    group = "Run"
    size = "16px"
    status = "Specified"
    notes = "Tooltip `Run again`. Shown beside the result mark. Approved 11 Oct 2026."

  [[icons.rotate-ccw.usage]]
    means = "Start again, on the line in a Job's thread that says its agent did not start"
    group = "Session"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 29 Oct 2026 for the walk `job-failed-to-start`. The same act as a re-run: the one start that failed is made again, nothing is dispatched anew, so it is not Redispatch, which stays `rotate-cw`. Icon-only, tooltip and aria-label `Start again`."
