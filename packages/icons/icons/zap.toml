[icons.zap]
  means = "A lightning bolt — a zigzag with no enclosing shape"
  group = "Canvas rail"
  size = "16px"
  status = "Specified"
  reserved = "Two uses, both the owner's: Run on a Studio, and a workflow step that advances on its submission alone. Run on a Studio is the rail's press that opens the checkout's Checks, Commands and servers, whose node lands where the person is looking, and the command palette's row that opens the same menu. Never a Job dispatch, never a fast path or an automation, and never a power state, which is `power`."
  notes = "Minted 2026-10-02, when the owner moved Run off the whiteboard's top-right corner and onto the rail's place group (`.claude/decisions/2026-10-02-run-is-on-the-rail.md`). A bolt is an object standing for its verb, the construction `pin`, `stamp` and `wrench` already use, so P1 is not crossed. Against the rail it joins it collides with nothing: `sticky-note` is a square with a peeled corner, `link` a chain, `shapes` three figures, and the view group's `maximize` four corners; a zigzag is no closed outline at all. It reads against `power`, the node bar's Stop the server, as the start to that stop, which is the pair a person meets on one Run node. Refused: `play`, the obvious mark, because `rocket`'s and `flask-conical`'s rows both refused it as a triangle beside `triangle-alert`, Doctor's, and this row does not reopen that; `circle-play`, since `circle-*` is the Judge's; `square-play`, a third square in a rail that already holds `sticky-note`; `terminal` and `square-terminal`, Pilot's; `rocket`, reserved to sending a node through the proposer, which waits at the approval gate where Run starts at once."

  [[icons.zap.usage]]
    means = "A workflow step that advances on its submission alone"
    group = "Workflows"
    size = "12px"
    status = "Specified"
    notes = "Added 5 Oct 2026 with the Workflow creator, and kept by the owner the same day against the Run reservation above: a submission-only step is its own use of the bolt, drawn on a workflow definition and never on a Studio. The two never share a surface."
