[icons.circle-x]
  means = "A circle with a cross inside"
  group = "Step and Verdict"
  size = "12px"
  status = "Specified"
  reserved = "Judge verdicts only. Never a failed Check (shield-x), never a Job failure, never a dismiss or close control."
  notes = "Added 2026-08-21. In --verdict-not-met. A criterion is met or it is not, and that is a measured fact, so it renders as flatly as one. The red does not claim the Job failed: a refusal is the gate working. Verdict hue is per criterion and never sums onto the step or the Job, which is what lets a red cross sit under a running step beneath an escalated badge."
