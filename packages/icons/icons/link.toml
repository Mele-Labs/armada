[icons.link]
  means = "Two interlocking chain segments on a diagonal"
  group = "Queued reason"
  size = "12px"
  status = "Specified"
  notes = "Changed from lock. A lock says you lack permission; nothing is locked, something upstream is unfinished."

  [[icons.link.usage]]
    means = "A Link node placed on a Studio's whiteboard — an address a person kept"
    group = "Canvas rail"
    size = "16px"
    status = "Specified"
    notes = "Added 2026-09-28 with the canvas rail (#1626's annotation run). A second context on a glyph carrying no reservation, which is what a `usage` sub-table is for. A chain is what every surface a person has ever used draws a hyperlink as, and a Studio's Link node is an address and nothing else — so the silhouette is already read correctly before the tooltip opens. It is a cross-group collision with the Queued reason above and the contract permits those: that one is a 12px badge glyph in `--status-queued`, this is a 16px control on a canvas, and no surface draws the two together. Refused: `external-link` is Chrome's and means *this press leaves the app*, which placing a node does not; `paperclip` would say attachment, and a Link on a Studio is a node like any other rather than something clipped to one. The palette's Add a link row draws it too, since 2 Oct 2026: the same act, and the owner asked for the rail's glyphs there."

[[icons.link.usage]]
  means = "The Depended on row in a worktree's panel: another Job has not finished"
  group = "Worktree slot"
  size = "12px"
  status = "Specified"
  notes = "Proposed 5 Oct 2026 with Cleanup's one grid. The Queued reason already says something upstream is unfinished, which is what a dependent Job is. Tooltip `Another Job has not finished`."

[[icons.link.usage]]
  means = "The address a device code is typed at, github.com/login/device"
  group = "Account"
  size = "16px"
  status = "Proposed"
  notes = "Proposed 14 Oct 2026 for the walks `onboarding-home` and `onboarding-work`. Leads the address on the sign-in card; pressing it opens the page. An address a person kept is the glyph's Studio meaning, and this is an address. `external-link` stays Chrome's."

[[icons.link.usage]]
  means = "A Session dispatched to wait on another and not started: its mark in the Cockpit's Work list and in its head, and the row in the other Session's thread that tells it waits"
  group = "Session"
  size = "12 and 16px"
  status = "Proposed"
  reserved = "A Session that has not started because something upstream has not finished. Never a Session that is blocked on the person, which is `eye`, and never a link to an address, which is the Studio meaning above."
  notes = "Proposed 16 Oct 2026 for the walk `sessionAfterAnother`. The Queued reason already says something upstream is unfinished, and a Session that starts when another ends is that, one level up from a Job. Tooltips `Starts when <Session> ends`, `Starts when <part> is done in <Session>`, `Starts when #<number> is pushed` and `Starts when #<number> lands`. In the other Session's thread the row's mark has the tooltip `Waits on this Session`. Drawn in the row's own hue, calm: nothing is asked of the person."

[[icons.link.usage]]
  means = "A Session linked to the one it was handed from: the Sessions a parent follows"
  group = "Session"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 16 Oct 2026 for the walk `linkedSessions`. A plan group handed to a Session of its own. Leads the Session's row on the Plan, in the Ledger's Linked section, under its parent in Work, and in the parent's thread where it needs him, finishes or merges; it is also the Hand to a Session act. A chain is what a link between two things draws. Tooltip `Linked Session`. Refused: `corner-up-right` is Redirect and the Started row's glyph, and a Session its agent started with no group stays that; `git-fork` is Fork a Session, which copies a conversation. The owner may rule otherwise."

[[icons.link.usage]]
  means = "A mod of kind Words, which keeps how Bridge shows words: a Jira key linking to each repository's own site"
  group = "Mods"
  size = "16px"
  status = "Proposed"
  notes = "Proposed 23 Oct 2026 for the walk `teach-mods`, tooltip `Words`. A chain is what a Jira key becomes when it is taught. Leads the Mods row as the palette leads a theme. Borrowed and not minted: the owner may rule otherwise."

[[icons.link.usage]]
  means = "A found link in a run: one process expects another on a fixed port, which a leased port breaks"
  group = "Run"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 25 Oct 2026 for the walk `run-link`. Leads the link's line under the processes on the first-run confirm, and stands on the expecting process's row in the running panel, in `--status-awaiting-review`: something is asked of the person and nothing is urgent. A chain is what two processes joined by an address draw. Tooltip `<process> runs on a leased port, not <port>`. Refused: `unplug` is a connection that is gone, and this one was never made."
