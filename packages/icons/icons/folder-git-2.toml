[icons.folder-git-2]
  means = "repository"
  group = "Git and config"
  size = "12px"
  status = "Specified"
  notes = "Detail views only, never in a Job Board row. Precedes a mono value in --fg-muted."

  [[icons.folder-git-2.usage]]
    means = "A workflow that lives in this repository, and a step the repository decides"
    group = "Workflows"
    size = "12px"
    status = "Specified"
    notes = "Added 5 Oct 2026 with the Workflow creator. Two uses on one surface, each with its tooltip: the row's mark for a definition in `.armada/workflows`, and the gate's `Repository decides` line on a step. Both mean the repository, which is the row's own meaning."

  [[icons.folder-git-2.usage]]
    means = "A Trigger set in this repository"
    group = "Trigger"
    size = "12px"
    status = "Specified"
    notes = "Added 7 Oct 2026 with Triggers on the Workflows surface. The level mark on a Trigger row and on a Job's fired Trigger, tooltip `This repository`: the same meaning it has on a workflow row."

  [[icons.folder-git-2.usage]]
    means = "The repository a request will be dispatched into"
    group = "Git and config"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 9 Oct 2026 for the walk `dispatch-grows-from-the-bar`. The mark on the dispatch panel's repository chip and on each row of its inline list. Found, picked or the rail's, it precedes the repository's name in mono; none found, it stands alone on a dashed outline with the tooltip `No repository found`. The same meaning it has everywhere else: the repository."
