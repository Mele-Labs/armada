[icons.pencil-ruler]
  means = "A pencil crossed with a ruler - drawing a diagram"
  group = "Action"
  size = "12 and 16px"
  status = "Proposed"
  reserved = "Drawing a sketch for a Session's message, and a Session's own sketch rows. Never placing a Sketch node on a whiteboard, which is `shapes`, and never freehand, which is `pencil`."
  notes = "Proposed 7 Oct 2026 for the walk `sessions`, for the owner to rule on. `shapes` is reserved to placing a Sketch node on a Studio's whiteboard, and `pencil` is freehand; this act opens the same pad Dispatch draws on, in a sheet, so it needed a glyph that says drawing a diagram and neither of those."

[[icons.pencil-ruler.usage]]
  means = "A plan group's Sketch approved gate, closed when you approve its sketch"
  group = "Plan gates"
  size = "12px"
  status = "Specified"
  notes = "Specified 9 Nov 2026 on the walk `plan-as-progress`, which the owner walked and approved. Drawn at 12px, unframed, at the end of the last group's line in a chunk's row in Now, and leading the gate line that heads a finished chunk in Done. Tooltip `Ends when <what the gate waits for>`, `Gate, the Job is held on you` (pulsing in the Needs you hue) or `Gate, closed by Fleet`. A Session's own sketch, which the reservation already holds, as the thing the gate waits on."
