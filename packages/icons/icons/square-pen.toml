[icons.square-pen]
  means = "A pen crossing out of a square's open corner — a name in a box being rewritten"
  group = "Action"
  size = "16px"
  status = "Specified"
  reserved = "Renaming, and rewording one step of a procedure in a Needs you steps panel, which is renaming a line; nothing else. Today that is the Studio heading's Rename and the steps panel's Edit step. Never a general edit, never drawing, which is `pencil`'s, and never writing a node up, which is `type`'s."
  notes = "Minted 2026-09-29 from the owner's note on the Studio heading (annotation jyee): *an edit icon button instead of a word button*, with Rename in its tooltip. It lifts the ban his own 28 Sep registry put on `square-pen` for this one meaning, and he took the cost knowingly: the heading sits on the same screen as the canvas rail's `pencil`, and at 16px the two read as cousins — a pen on a diagonal, one boxed and one bare. What keeps them apart is the box and the reservations, not the pen: `pencil` is still the sketch pad's and still never edit or rename, and this row is rename only, so neither glyph ever means the other's act. Why this one and not `pencil`: lifting `pencil`'s reservation would have made one outline mean *draw* in the rail and *rename* in the heading, which is rule 4's mixed meaning on a single screen. Refused: `text-cursor-input`, which is honest but is not the edit glyph he asked for; `notebook-pen` and `pen-line`, whose unboxed pens sit closer still to `pencil`. The decision is `.claude/decisions/2026-09-29-rename-takes-square-pen.md`. Widened 15 Oct 2026 by the owner, knowingly against his 29 Sep rename-only decision, for the steps panel's Edit step (tooltip `Edit step`): a step is a line of words the person rewrites in place, the same act as a name in a box. `pencil` stays the sketch pad's and `user-pen` marks a step already reworded."

[[icons.square-pen.usage]]
  means = "Edit on the Flight control: the panel's tiles are arranged, hidden and added"
  group = "Session"
  size = "16px"
  status = "Specified"
  notes = "Approved 26 Oct 2026 by the owner on the walk `flight-control`, knowingly against the rename-only reservation above: the Flight control's band is a glyph and a tooltip, `Edit`, in place of the word, and the control is the panel's arrangement being rewritten in place, the same act as a name in a box. `pencil` stays the sketch pad's."
