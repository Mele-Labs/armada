[icons.megaphone]
  means = "A horn flaring from a narrow throat, over a handle that hangs below it — the only cone in the badge set, and the only glyph in it depicting the Job's own act rather than a person's"
  group = "Job state"
  size = "12px"
  status = "Specified"
  reserved = "job_status.escalated only. Never an alert or a notification — bell is Alerts' and an alert is a condition on a Job rather than a status a Job holds, so the two populations may not share an outline. Never an escalation reason, which is the collision that would undo the split this glyph exists for. Never an action: a person answers an escalation, and nothing in Armada broadcasts."
  notes = "Added 2026-09-03 with job_status.escalated, minted rather than borrowed. It renders --status-escalated, so rule 4 asks it to differ from every outline sharing that hue — octagon, closed loop, page-and-question, Y-split, broken plug, ascender-to-a-line, and wrench's diagonal shaft with an open jaw — and a cone flaring from a narrow throat over a hanging handle is none of them. The interior tick, the stroke dividing the mouthpiece from the flare, is detail rather than silhouette, so it was drawn at 12, 16, 24 and 48px on --bg-raised before this row was written: at 12px the tick and the throat box merge into one small mass at the left, and what survives is the cone and the handle. Neither carries the meaning in the tick, so rule 3 holds — the same test circle-dashed and wrench were put to, reached by a different route. What it says: the Job called out and is still calling, which is what an escalated Job does until somebody answers. bell is the nearest claim in the app and cannot be taken — it is Alerts' rail glyph, its own row calls the bell the interrupt metaphor, and docs/concepts/bridge.md rests on an alert being a condition on a Job rather than a status a Job holds. The silhouettes carry that distinction exactly: a bell is rung at a person, and a horn is held by the thing doing the asking. Also refused: octagon-alert is stalled's by its own note and is a reason rather than the status; user-check is reserved to human-required and is awaiting_approval's in this same group; circle-help and circle-alert are ring outlines and collide with circle-dot at 12px; triangle-alert is reserved to Doctor. The metaphor question was answered before minting rather than after. A megaphone is not a thing Armada has — and neither is a stamp, a wrench, a flag, a lidded box or a severed plug, all five Specified in this file. P1 confines metaphor to proper nouns, which is what refused a ship's wheel for Helm, a name; an object standing for a verb is what stamp means attest and wrench means repair already do, and this one stands for asking. Where it departs from that family is worth recording: stamp, eye, terminal and wrench are each the object for the act a person owes, and this is the object the Job holds. That is the difference between a status that asks and a status that waits, and it is why this badge is not a second human-required mark."
