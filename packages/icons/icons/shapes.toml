[icons.shapes]
  means = "A circle, a square and a triangle overlapping — a diagram, drawn as the figures it is made of"
  group = "Canvas rail"
  size = "16px"
  status = "Specified"
  reserved = "Placing a Sketch node on a Studio's whiteboard only. Never a shape tool, never a style or a fill picker, and never the sketch pad's own boxes, which have no shape to pick."
  notes = "Added 2026-09-28 with the canvas rail (#1626's annotation run). Three overlapping figures is the only silhouette in lucide that says *a diagram* without saying *a picture file*, which matters because a Studio's Sketch is a drawing on the pad (1 Oct 2026) and not a picture file. The reservation is the load-bearing half: a rail button drawn as three shapes is exactly what a person expects to be a shape tool in every other canvas they have used, so the row says outright that Armada has none. Refused: `image` and `file-image`, both of which promise a picture a person can open, and `file-*` is reserved to evidence besides; `pencil-ruler`, which is a compound glyph whose ruler is interior detail at 16px and which collides with `pencil` above in the same rail; `frame`, which reads as a crop; `workflow` and `waypoints`, which name a workflow and the Graph view toggle, both things Armada already has."
