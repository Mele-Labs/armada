[icons.globe]
  means = "A globe - a page published to the web"
  group = "Session"
  size = "12px"
  status = "Proposed"
  reserved = "A page a Session published to claude.ai, on its ledger. Never a network, a server or a link: `link` and `external-link` keep those."
  notes = "Proposed 7 Oct 2026 for the walk `session-ledger`, for the owner to rule on. A published page lives at an address anyone can open, which is what a globe says and a file does not. Refused: `file-*`, evidence's; `external-link`, Chrome's press that leaves the app, which the row does but is not what the row is."

  [[icons.globe.usage]]
    means = "Global scope: how the owner works across every project"
    group = "Shared home"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 14 Oct 2026 for the walks `onboarding-home` and `onboarding-work`. One of the three scope marks on a synced item in What syncs, tooltip `Global`. A globe reads as everywhere, which is the scope. Not a network, a server or a link, and not a published page: the reservation above is untouched."

  [[icons.globe.usage]]
    means = "The web outpost on the Cockpit map, where Sessions' fetches and searches land"
    group = "Outpost"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 17 Oct 2026 for the walk `field-outposts`, for the owner to rule on. Reads as the web at large, which a fetch of a host is. Not a published page: the reservation above is untouched."

  [[icons.globe.usage]]
    means = "Browser, the Flight control tile that opens a Job's browser in the side panel"
    group = "Flight control"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 28 Oct 2026 for the walk `job-browser`, for the owner to rule on. A page on the web, which is what the Job browser shows; the reservation refuses a network, a server or a link, and this is none of them. Tooltip `Open the Job browser in the side panel`."
