[icons.armada-mark]
  means = "Armada itself. The product, never a state and never an action."
  group = "Brand"
  size = "16px"
  status = "Proposed"
  reserved = "Absolute. Nothing else may use this outline, and the mark may not be made to mean anything other than Armada — not home, not app, not a nav destination. It never appears in a Job Board row, a badge, or a button."
  notes = "Three equal hulls on a shallow arc — one filled path repeated three times, in one colour. **Redrawn 2026-09-07; the Countersign mark it replaced was two offset squares, which is the duplicate glyph in lucide, Feather and macOS, and read as a copy icon.** The construction changed with it: this mark carries no stroke at all, so the Rendering section\'s one-stroke rule has nothing to fix here — see the Brand mark amendment on Iconography. The floor is 16px, where the notches hold at about one pixel; it is comfortable from 24. **It has left 12px** — the old row permitted 12 beside badge text while its own reservation banned it from badges, and the new floor removes the contradiction rather than resolving it. Below 16 the three hulls fuse into one silhouette and the wordmark is set alone instead. Two-tone variant (ArmadaMarkDuo, the two trailing hulls held back) at 32px and above only. Accent fill permitted on the macOS app tile alone. The full specification — construction, clear space, colour and what may never change — is packages/brand/README.md."
