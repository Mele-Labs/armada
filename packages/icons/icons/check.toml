[icons.check]
  means = "A bare checkmark"
  group = "Job state"
  size = "12 and 16px"
  status = "Specified"
  notes = "Bare checkmark, nothing is more legible small. Check means yes in both places, which is the point."

[[icons.check.usage]]
  means = "A plan task the agent's list marks completed, with no edit seen for it"
  group = "Step and Verdict"
  size = "12px"
  status = "Specified"
  reserved = "TaskMark's (packages/components) done and handed_in states."
  notes = "17 Oct 2026. `handed_in` reads as done: the same check in `--step-advanced`, with a faint `pencil-off` in its corner."

[[icons.check.usage]]
  means = "A row that is the same on this machine and in the shared home"
  group = "Shared home"
  size = "16px"
  status = "Proposed"
  notes = "Proposed 13 Oct 2026 for the walk `shared-home`. Check means yes in both places, and here both places are literal. Draws --fg-muted, receded, so the rows that need a look are the ones that stand out. Tooltip `Same as the home`."

[[icons.check.usage]]
  means = "A set-up row that is done, and the profile that is active"
  group = "Account"
  size = "16px"
  status = "Proposed"
  notes = "Proposed 14 Oct 2026 for the walks `onboarding-home` and `onboarding-work`. Bare check in `--step-advanced`, tooltip `Done` on a set-up row and `Active` beside a profile's login."

[[icons.check.usage]]
  means = "An output style that is active"
  group = "Kit"
  size = "16px"
  status = "Proposed"
  notes = "Proposed 16 Oct 2026 for the walk `output-styles`. Bare check in `--fg-default`, tooltip `Active`, beside the one style in force. The active name is also heavier, so the mark is not the only carrier."

  [[icons.check.usage]]
    means = "A reviewer who approved the pull request, on the Reviewers card"
    group = "Pull request"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 19 Oct 2026 for the Pull request panel's Reviewers card. Bare check in `--status-completed-success`, tooltip `Approved`. The Conversation tab draws the same glyph for an approving review, so a verdict reads the same on both."

  [[icons.check.usage]]
    means = "A request that was answered with a 2xx or 3xx, on its row in a Job's thread and in Requests' history"
    group = "Session"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 19 Oct 2026 for the walk `requests-with-the-owners-header`, replaced by `requests-collections-and-environments`. Bare check in `--step-advanced`, tooltip the status, `200`. The status is also drawn as text, so the mark is not the only carrier."

  [[icons.check.usage]]
    means = "A workflow act that went through, the line beside the acts: Saved, Matches Armada's, Sent"
    group = "Workflows"
    size = "12px"
    status = "Specified"
    notes = "Specified 27 Oct 2026 on the walk `workflowsManaged`, which the owner walked and approved (`.claude/decisions/2026-10-27-a-feature-job-walks-before-it-tests.md`). Bare check in `--step-advanced`, drawn at 14px, stroke 2. Check means yes, and the line says which act it was."

[[icons.check.usage]]
  means = "A state an instance went through, and a rule that fired and acted, on a lane"
  group = "Workspace lanes"
  size = "14px"
  status = "Proposed"
  notes = "Proposed 28 Oct 2026 for the walk `workspaces-lanes`. Bare check in --step-advanced, tooltips `Went through` and `Acted`. The same yes the Workflows page uses for an act that went through."

  [[icons.check.usage]]
    means = "A triaged comment on a Job's pull request lane that was sent to the Job's agent"
    group = "Job lanes"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 28 Oct 2026 for the walk `workspaces-lanes`, the comments under a Job's Lanes view. Bare check in `--step-advanced`, tooltip `Sent`, in a column of its own beside the row's two acts. The row keeps its place."

[[icons.check.usage]]
  means = "A comment handed to the Job's agent, on its row in the pull request panel"
  group = "Job lanes"
  size = "16px"
  status = "Proposed"
  notes = "Proposed 29 Oct 2026 for the walk `workspaces-lanes`. Replaces the Send to Job button once pressed. Tooltip `Sent to the Job`."

[[icons.check.usage]]
  means = "Pick on a line of the agent's message, and the mark a picked line keeps"
  group = "Job thread"
  size = "16px for the act, 12px for the mark"
  status = "Proposed"
  notes = "Proposed 31 Oct 2026 for the walk `real-thread-pick-a-line`, the owner's ask to select one of the agent's options in place. Tooltip `Pick this` on the act, `Picked` on the muted mark. Check means yes, and a pick is a yes to one of several."
