[icons.activity]
  means = "An ECG trace - a line that rises and falls with a live signal, what is happening now"
  group = "Chrome"
  size = "16px"
  status = "Specified"
  reserved = "The Asker view's toggle in the Now panel head only: the left-hand view of what is asking, its live output and what it changed. Never an Active jobs surface (retired 2026-08-31), never a loading or spinner mark, and never a step's activity, which the step activity glyphs carry."
  notes = "Un-retired 8 Oct 2026 for the Asker view, on the owner's ruling. Active jobs folded into the Job Board on 2026-08-31 and the glyph was left free; the ECG outline reads cleanly at 16px, which is why it was first chosen. It sits beside the Sketch and Canvas toggles in the Now panel head, so a person switches between a sketch, the asker and the canvas without a word. `drafting-compass` and `network` are the other two."
