[icons.square]
  means = "A filled square - stop what is running"
  group = "Run"
  size = "16px"
  status = "Specified"
  reserved = "Stop on a run the person started. Never a Job or a Drone stopping, which Fleet owns."
  notes = "Proposed 11 Oct 2026 for running a code block from a Session's thread, the mock walk `runCodeBlock`. Approved 11 Oct 2026."

  [[icons.square.usage]]
    means = "Stop a command the person ran from a code block in a Session's thread"
    group = "Run"
    size = "16px"
    status = "Specified"
    notes = "Tooltip `Stop`. Shown in place of Run while the command runs. Approved 11 Oct 2026."

  [[icons.square.usage]]
    means = "Stop the turn a Session's agent is running"
    group = "Run"
    size = "16px"
    status = "Proposed"
    notes = "Tooltip `Stop`, no label. Sits beside the working mark at the end of a Session's thread, on the owner's word of 12 Oct 2026. The same glyph and tooltip as stopping a command run from a code block, since both end what the person started in that Session. Awaiting the walk `debug-bridge-draft`. Helm's dock draws it the same way, since Helm's thread is a Session's (walk `helm-is-a-session`)."

  [[icons.square.usage]]
    means = "Stop a run the person started from the Cockpit, in the running panel's head"
    group = "Run"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 25 Oct 2026 for the walk `run-an-app`. Tooltip `Stop`, key `s`. A run the person started, which is this glyph's own reservation."
