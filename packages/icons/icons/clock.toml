[icons.clock]
  means = "A clock face with two hands — the only time-shaped badge, since hourglass is banned"
  group = "Job state"
  size = "12px"
  status = "Specified"
  notes = "Unambiguous now that hourglass is banned — no other badge is time-shaped. A Job scale glyph, and not lent to a rail row: it is not on [conventions.step_activity_borrowing] and is refused there rather than merely absent. A clock says nobody is acting, which is what grey says beside it; a step waiting on a person is the opposite claim and takes `eye`. #347."

  [[icons.clock.usage]]
    means = "A sign-in whose code ran out before it was typed"
    group = "Account"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 15 Oct 2026 for the walk `sign-in-ended`. Nobody acted in time, which is the clock's claim. Tooltip `Expired`. The row carries no reservation."

  [[icons.clock.usage]]
    means = "An MCP server in a Session's Loadout still connecting"
    group = "Session"
    size = "12px"
    status = "Specified"
    notes = "Proposed 17 Oct 2026 for the walk `session-loadout`, approved by the owner 18 Oct 2026. Nothing has answered yet, which is the clock's claim. Tooltip `Connecting`. `loader-circle` is reserved to a worktree slot, and `circle-dashed` to a step not started."

  [[icons.clock.usage]]
    means = "A line of how a repository runs that its place has not taken yet"
    group = "Repository"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 19 Oct 2026 for Armada configuration for a repository kept in the repository itself, where a line waits for a Job branch to be written on. Nobody has acted on it yet, which is the clock's claim. Tooltip is Fleet's own `why`. A line the place holds wears the place's glyph."

  [[icons.clock.usage]]
    means = "A reviewer asked to review who has given no verdict yet, on the Reviewers card"
    group = "Pull request"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 19 Oct 2026 for the Pull request panel's Reviewers card. Nobody has acted yet, which is the clock's claim. Draws muted, tooltip `Waiting`. The Conversation tab has no row for it, since a review that was not given is not in the thread."

[[icons.clock.usage]]
  means = "A step waiting on a lifecycle state, and a rule still waiting, on a lane"
  group = "Workspace lanes"
  size = "14px"
  status = "Proposed"
  notes = "Proposed 28 Oct 2026 for the walk `workspaces-lanes`. Nothing has happened yet, which is the clock claim. A step reads `Waiting on PR #812: Approved` and a rule `Waiting`, each in the waiting hue; the edge of a waiting rule is dashed."

  [[icons.clock.usage]]
    means = "A step held on a state an instance has yet to reach, as a beat in the Job's Now zone: Waiting on PR #812: Approved"
    group = "Job lanes"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 28 Oct 2026 with a Job's Lanes view. The agent rests and Fleet's watch wakes the Job on the change, so nobody is acting, which is the clock's claim. It is a fact and no call: the lamp does not pulse and nothing joins Needs you. It is a beat and not a step's activity mark, so it sits outside `step_activity_borrowing`; a step waiting on a person keeps `eye`. Tooltip `Waiting`."
