[icons.clock]
  means = "A clock face with two hands — the only time-shaped badge, since hourglass is banned"
  group = "Job state"
  size = "12px"
  status = "Specified"
  notes = "Unambiguous now that hourglass is banned — no other badge is time-shaped. A Job scale glyph, and not lent to a rail row: it is not on [conventions.step_activity_borrowing] and is refused there rather than merely absent. A clock says nobody is acting, which is what grey says beside it; a step waiting on a person is the opposite claim and takes `eye`. #347."

  [[icons.clock.usage]]
    means = "A sign-in whose code ran out before it was typed"
    group = "Account"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 15 Oct 2026 for the walk `sign-in-ended`. Nobody acted in time, which is the clock's claim. Tooltip `Expired`. The row carries no reservation."

  [[icons.clock.usage]]
    means = "An MCP server in a Session's Loadout still connecting"
    group = "Session"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 17 Oct 2026 for the walk `session-loadout`. Nothing has answered yet, which is the clock's claim. Tooltip `Connecting`. `loader-circle` is reserved to a worktree slot, and `circle-dashed` to a step not started."
