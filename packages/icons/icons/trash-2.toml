[icons.trash-2]
  means = "A bin with its lid lifted clear"
  group = "Node bar"
  size = "12 and 16px"
  status = "Specified"
  reserved = "A person taking off something they put there \u2014 a Studio node deleted, a sketch box removed, an attachment dropped from a request. Never a Job ending, never a record cleaned up, and never a machine discarding anything: every use is somebody's own act on their own thing."

  [[icons.trash-2.usage]]
    means = "Removing a free or unmade worktree slot from the pool, the act on its bay"
    group = "Worktree slot"
    size = "12px"
    status = "Specified"
    notes = "Proposed 4 Oct 2026 with the pool's controls. A person taking off a slot of this machine's pool, which is their own act on their own thing, as the row requires. Offered only where the pool would let it go. Tooltip `Remove`."
  notes = "Minted 2026-09-28, and it is the mint the node bar's open question said would pay for itself: one decision serving the Studio's Delete, the sketch pad's Remove and `AttachmentChip`'s dismiss rather than three. `trash-2` rather than `trash`, whose lid sits on the bin and loses its gap at 12px. Refused, and refused before the mint opened: `x`, reserved to system failure and banned by its own row from carrying a human decision; `minus`, reserved to a record nothing checked and a dropped plan task; `ban`, which is `rejected`'s and means a person declined a whole Job; the `circle-*` and `shield-*` families, which are verdicts; `eraser`, which says a mark rubbed out and collides with `pencil` on the one surface that draws both."

  [[icons.trash-2.usage]]
    means = "Taking off an item an agent stated that a Session waits on the person for, with a reason the agent is told"
    group = "Session"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 14 Oct 2026 for the walk `needs-me-replied-and-delete`, on the owner's word that he should be able to delete a needs-me item. The row reserves this glyph to a person's own act on their own thing, and the item is the agent's; it is borrowed because the act is the person's and the registry holds no other glyph for a human removal (`x` is system failure, `minus` and `ban` are verdicts). On the ledger's waiting rows, the thread's Needs you band and the Cockpit call card. Tooltip `Remove`. The owner may rule otherwise."

  [[icons.trash-2.usage]]
    means = "A skill the person removed from this Mac, still listed in a Job's Loadout"
    group = "Session"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 22 Oct 2026 for the walk `session-loadout`, with Remove on a Kit skill's Loadout row. The person took off a skill of their own, which is the act the row reserves this glyph to. The row stays, marked, with Restore on its face while the Trash holds the folder. Tooltip `Removed`. --fg-muted."

  [[icons.trash-2.usage]]
    means = "Deleting a watch that ended, with all it kept, from a Job's Watching block"
    group = "Watch"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 26 Oct 2026 for the walk `watchingTidy`. The watch is the agent's and the act is the person's, borrowed as the needs-me delete borrows it, since the registry holds no other glyph for a person taking a thing away. On ended rows only, in a column every row keeps, shown on Show ended. Tooltip `Delete`. The owner may rule otherwise."

[[icons.trash-2.usage]]
  means = "Delete a workflow copy, in the Workflows page's header toolbar, and a step, state or rule picked on its lanes"
  group = "Workflows"
  size = "16px"
  status = "Proposed"
  notes = "Proposed 29 Oct 2026 for the walk `workspaces-lanes`. Tooltip `Delete`. Somebody taking off what they put there. In the header toolbar it is set apart at the end of the row."
