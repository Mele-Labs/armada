[icons.ban]
  means = "A circle with a diagonal bar through it"
  group = "Job state"
  size = "12 and 16px"
  status = "Specified"
  notes = "Circle and diagonal: you declined it. Not a cross, because this is a decision and not an error. **That second sentence is why it also marks the destructive confirmation dialog**, added 10 Sep 2026: `x` had the head glyph there and `x` is reserved to system failure, its own row naming this one as where a human decision goes instead. The dialog covers more than declining — kill a Drone, kill a Job, give a worktree back, clear a terminal — and the circle-and-diagonal reads as *this will not continue* across all of them, where a cross would claim something had gone wrong. The badge and the dialog share the outline and not the hue, which rule 4 admits."

  [[icons.ban.usage]]
    means = "A workflow file Fleet left out, and the rail's warning that one is"
    group = "Workflows"
    size = "12px"
    status = "Specified"
    notes = "Added 5 Oct 2026 with the Workflow creator, on the owner's word after walking it. A file that cannot run is declined by Fleet, which is what the circle and diagonal already say. One outline for both the row's mark and the rail row's warning, so the two read as the same fact. The tooltip names it; no count is drawn. `triangle-alert` stays Doctor's and is not drawn here."

  [[icons.ban.usage]]
    means = "A sign-in the person turned down at the forge"
    group = "Account"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 15 Oct 2026 for the walk `sign-in-ended`. Denied is a decision, which is what this glyph already says; it is not a failure. Tooltip `Turned down`. The row carries no reservation."

  [[icons.ban.usage]]
    means = "What signing in never does, one line each"
    group = "Account"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 15 Oct 2026 for the walk `account-page`. Tooltip `Never`. The circle and diagonal says this will not happen; the lines are facts and the glyph is the same on each."

  [[icons.ban.usage]]
    means = "A repository given None: it claims and syncs nothing"
    group = "Account"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 15 Oct 2026 for the walk `account-repositories`. In Not matched, tooltip `None`. The circle and diagonal says this will not happen, and the Never lines draw the same glyph."

  [[icons.ban.usage]]
    means = "A folder every session is refused with no card"
    group = "Sessions"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 16 Oct 2026 with #2441, in Settings, Features, Folders sessions reach. Tooltip `Always blocked`. The owner declined the folder for every session, which is what the circle and diagonal says."

  [[icons.ban.usage]]
    means = "A way a repository runs that the person does not want kept"
    group = "Repository"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 18 Oct 2026 for the walk `runs-at-scale`. On a line of all of how a repository runs, tooltip `Do not keep`, key x. The person declines a command, which is what the circle and diagonal says. The line is never kept again."

  [[icons.ban.usage]]
    means = "A reviewer who requested changes on the pull request, on the Reviewers card"
    group = "Pull request"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 19 Oct 2026 for the Pull request panel's Reviewers card. Requesting changes is a decision to hold the pull request back, which is what the circle and diagonal says; it is not a failure. In `--status-completed-failed`, tooltip `Changes requested`. The Conversation tab draws the same glyph for that review."

  [[icons.ban.usage]]
    means = "A workflow file Fleet left out, on its row in the Workflows list"
    group = "Workflows"
    size = "12px"
    status = "Specified"
    notes = "Specified 27 Oct 2026 on the walk `workflowsManaged`, which the owner walked and approved (`.claude/decisions/2026-10-27-a-feature-job-walks-before-it-tests.md`). Drawn at 14px, stroke 2. The same fact the rail's warning draws, now on the page's own row. The tooltip is Fleet's reason."
