[icons.loader-circle]
  means = "An open ring, spinning - a take or a release under way"
  group = "Worktree slot"
  size = "12px"
  status = "Specified"
  reserved = "A worktree slot being taken or given back. The one animated mark in the group; held still under reduced motion."

  [[icons.loader-circle.usage]]
    means = "Fleet is restarting: the Restart Fleet button, from the press until a Fleet is back"
    group = "Action"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 8 Oct 2026 for the walk `fleetProtocolMismatch`. Spins, and holds still under reduced motion, as the slot mark above does. An open ring spinning is an act under way, which is what both uses say."

  [[icons.loader-circle.usage]]
    means = "Fleet is restarting onto the other build, a refreshed preview or the latest main: the Fleet panel's button and the mark beside main"
    group = "Action"
    size = "12 and 16px"
    status = "Specified"
    notes = "Proposed 8 Oct 2026 for the walk `fleetBuildRefreshing`, approved by the owner the same day. The same restart the mismatch notice's button shows, from the Fleet panel. Spins, and holds still under reduced motion."

  [[icons.loader-circle.usage]]
    means = "The dispatch panel is reading the request for the repository it belongs to"
    group = "Action"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 9 Oct 2026 for the walk `dispatch-panel-from-the-title-bar`. The repository chip's mark from the first word until the reading comes back, tooltip `Finding the repository`: an open ring turning is something under way, which is what every use of it says. Spins, and holds still under reduced motion."

  [[icons.loader-circle.usage]]
    means = "Helm is reading a thought for where it belongs, over the message box"
    group = "Action"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 12 Oct 2026 for the walk `route-a-thought`, tooltip `Finding where this goes`. An open ring turning is something under way, which is what every use of it says. Spins, and holds still under reduced motion."

  [[icons.loader-circle.usage]]
    means = "A Session's subagent that has not finished, in place of `split` on its row of the Cockpit's timeline"
    group = "Session"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 14 Oct 2026 for the walk `cockpit-feed-more-kinds`, tooltip `Subagent working`. An open ring turning is something under way, which is what every use of it says. Spins, and holds still under reduced motion."
