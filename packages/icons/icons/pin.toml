[icons.pin]
  means = "A pushpin seen from the side, head over a driven point — a view held on one thing"
  group = "Canvas rail"
  size = "16px"
  status = "Specified"
  reserved = "The workflow canvas's Stay on the running step, and a run process's port pinned to one number in a repository. Never a pinned row, a favourite, a bookmark or a kept item — nothing else in Armada is pinned in that sense, and a further meaning here would make the rail's own group ambiguous."
  notes = "Added 2026-09-28 with the canvas rail (#1626's annotation run). It is its own group under the view group rather than inside it, because a zoom acts once and this hands the viewport over for as long as it is on — and it is not a tool, since it places nothing. A pushpin is an object standing for the verb, which is the construction `stamp` means attest and `wrench` means repair already use, so P1's confinement of metaphor to proper nouns is not crossed. Refused: `crosshair` and `locate-fixed`, both rings, which is `circle-dot`'s silhouette and `circle-dot` is the running step's own mark — the collision would land on the one canvas where this control exists and be about the very node it follows; `eye` is reserved to Review; `flag` to a stopped step; `signpost` is the neutral confirm's."

[[icons.pin.usage]]
  means = "A run process's port pinned: the backend always answers on that number in this repository, shown on its row in place of `leased`"
  group = "Run"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 25 Oct 2026 for the walk `run-link`, in the owner's words (a pin glyph). A press on it on the first-run confirm undoes the pin, and the tooltip is `Pinned to <port>. A Job's bay can't run it at the same time`. It reaches the reservation's pinned-row ban at one place only: a port held to one number, which is the verb the canvas pin already draws, a thing held on one value. The reservation is amended to say so, and the owner may rule otherwise. Refused: `lock`, a step that cannot be skipped; `anchor`, a Job's bay kept after it ended."
