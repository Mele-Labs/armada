[icons.thumbs-up]
  means = "A hand with its thumb raised — the work is fine"
  group = "Action"
  size = "16px"
  status = "Specified"
  reserved = "Carry on past a gaming flag, on its button only; and A question on a Needs you question Fleet read from a reply, beside `thumbs-down`, icon-only with its words as tooltip. Never Approve, which is `check`, and never a Judge's verdict."
  notes = "Minted 2 Oct 2026 with `thumbs-down`, the owner's call on the walk of #1672. Carry on overrules a flag rather than approving the work, so `check` — which means yes and is Approve's — would claim more than the press does. The pair breaks the Actions rule that text buttons carry no icon on these two buttons alone. Widened 23 Oct 2026 with `thumbs-down`, the owner's pick on the walk `not-a-question`."

[[icons.thumbs-up.usage]]
  means = "Yes to a line of the agent's message, and the mark that line keeps"
  group = "Job thread"
  size = "16px for the act, 12px for the mark"
  status = "Proposed"
  notes = "Proposed 31 Oct 2026 for the walk `real-thread-pick-a-line`, beside `thumbs-down` and `check`. Icon-only, tooltip `Yes to this` on the act and `Yes` on the mark."
