[icons.orbit]
  means = "A small body circling a larger one on an ellipse, with a second body further out — the fleet read as a map of stars"
  group = "View"
  size = "16px"
  status = "Specified"
  reserved = "The flight deck's Map only: its tile and its pane's header. Never a loading or busy indicator, never a refresh, and never a graph on a Job, which is `waypoints`."
  notes = "Chosen by the owner on 9 Oct 2026 for the map of Jobs and Sessions as stars, and put back on 14 Oct 2026 as the flight deck's Map tile and the map pane's header, once the Timeline had its own tile, `chart-no-axes-gantt`. `waypoints` is the graph view toggle on Plan and Workflow, a graph of one Job's own steps; this map is of many Jobs and its marks are told apart so the two never read as one."
