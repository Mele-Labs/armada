[icons.laptop]
  means = "A laptop: this machine"
  group = "Shared home"
  size = "12 and 16px"
  status = "Proposed"
  reserved = "This machine: where a thing is, and for private scope that it stays only here. Never Fleet, which is `server`, and never a worktree's disk, which is `hard-drive`."
  notes = "Minted 13 Oct 2026 for the walk `shared-home`. The counterpart of `house`: a row that is only on this machine, tooltip `Only on this machine`, and the head of the machine's side of a differing row."
  [[icons.laptop.usage]]
    means = "This machine, on a pull request's registered owner"
    group = "Pull request owner"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 14 Oct 2026 for the walk `pr-owners`. The same meaning as above, drawn past the divider of the owner chip where the Session or Job is on this machine, tooltip `This machine`. Another machine is `monitor`."

  [[icons.laptop.usage]]
    means = "Private scope: a synced item that stays on this machine and never syncs"
    group = "Shared home"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 14 Oct 2026 for the walks `onboarding-home` and `onboarding-work`. One of the three scope marks on a synced item in What syncs, tooltip `Private`. The glyph has one meaning, this machine, and private scope is its strict reading: the item is here and nowhere else. The other uses say where a thing is, which another machine could also be; this one says it never leaves. The tooltip `Private` carries that difference, and the two readings never share a surface."

  [[icons.laptop.usage]]
    means = "This machine, as the account's own profile and as the machine named on its page"
    group = "Account"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 15 Oct 2026 for the walk `account-page`. Beside the page's title it names the machine, tooltip `This machine`; on a profile's head it marks the one the machine started with, tooltip `This machine's own`. `user-pen` marks one added on purpose."

[[icons.laptop.usage]]
  means = "Where a repository's runs are kept: on this Mac, in the person's Kit"
  group = "Repository"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 18 Oct 2026 for the walks `first-run` and `runs-at-scale`. The first row of the places asked when a repository is added, and the mark on a row of how a repository runs, tooltips `On this Mac` and `Kept on this Mac`. Nothing is written into the repository. The same meaning it has everywhere else: this machine."
