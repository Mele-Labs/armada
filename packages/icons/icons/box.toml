[icons.box]
  means = "A cube seen from above one corner \u2014 one closed thing"
  group = "Record kind"
  size = "12px"
  status = "Specified"
  reserved = "A Record row about the Job itself: created, started, moved, ended. Never a Job's status, which the Job state group owns; never a package, an export or storage; never Kit, which is `briefcase`."
  notes = "Minted 2026-09-29 when the owner asked for the six Record marks that were owed ([record-kind-marks]). The Job is the one thing every other row happens inside, and a closed solid is that thing rather than any state of it. Against the grey set it sits beside, `archive` is a lidded box drawn face-on, a rectangle with a band; this is a hexagon whose outline is cut by its two top faces, and the difference is silhouette rather than interior detail. Refused: `briefcase`, reserved to Kit and by its own row never a Job; `package`, this cube with a band across it, which `briefcase`'s row already refused as a lidded box; `clipboard-list`, the Job Board's; `scroll-text`, the workflow a Job runs; `activity`, free again, but its own row says the outline does not survive 12px."

  [[icons.box.usage]]
    means = "The Job holding a worktree slot, leading its title on Cleanup"
    group = "Worktree slot"
    size = "12px"
    status = "Specified"
    notes = "Added 4 Oct 2026 on the owner's walk of the slot pool: the holder cell needed to read as a Job and as a press. The same drawing of the Job itself the Record uses, never its status. --accent, with the title, as a link."

[[icons.box.usage]]
  means = "A Job on a chip and in a Session's ledger, beside its slot"
  group = "Session"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 6 Oct 2026 for the walk `sessions`. The same Job mark Cleanup's tile already draws before the Job's title, on the chips that name a Job and in the ledger row of a Job a Session dispatched."

  [[icons.box.usage]]
    means = "A Job waiting on another Job, on its Now line"
    group = "Now"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 9 Oct 2026 with the Dashboard's call card and tiles, which draw what a Job runs now with the Now panel's own marks. It sits beside the reservation above rather than inside it, and the owner may rule it out."
