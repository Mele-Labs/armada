[icons.split]
  means = "One line becoming two"
  group = "Escalation reason"
  size = "12px"
  status = "Specified"
  notes = "Changed from git-fork, which loses its nodes at 12px. One line becoming two is literally what fanning out means, and it frees git-* for real git operations."

[[icons.split.usage]]
  means = "A subagent a Session dispatched, in its ledger"
  group = "Session"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 6 Oct 2026 for the walk `sessions`. One line becoming two is what dispatching a subagent is; `split` carries no reservation, and `bot` does (a Drone's Record row), so a subagent could not take it."

[[icons.split.usage]]
  means = "The Commander split one task of a plan into two"
  group = "Now"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 11 Oct 2026 with the Commander's act rows. One line becoming two is what a split is; the Commander also has a Drone to restart, which is `rotate-cw`. Tooltip `Split task`."

[[icons.split.usage]]
  means = "A row whose two versions, on this machine and in the shared home, have gone different ways"
  group = "Shared home"
  size = "16px"
  status = "Proposed"
  notes = "Proposed 13 Oct 2026 for the walk `shared-home`. One line becoming two is what a version that diverged is. `diff` says differs too but is reserved to a criterion's origin, and `arrow-up-down` is sort. Draws in the awaiting review hue, because the owner picks a side. Tooltip `Differs from the home`."

[[icons.split.usage]]
  means = "A Session's subagent started or finished: a row on the Cockpit's timeline"
  group = "Session"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 14 Oct 2026 for the walk `cockpit-feed-more-kinds`, tooltip `Subagent`. The same meaning as the ledger row above, here as an event. A finished subagent draws still in the passed hue; one that has not finished draws `loader-circle` in its place."

[[icons.split.usage]]
  means = "Subagents: every one a Session started, as a key on Flight control"
  group = "Session"
  size = "16px"
  status = "Specified"
  notes = "Approved 16 Oct 2026 on the walk `compactSessionView`. The same meaning as the ledger row, here as the key that opens the whole list. The Field draws only the ones at work. Tooltip `Subagents`."

[[icons.split.usage]]
  means = "A state, step or rule that a Workspace or one repository maps or runs differently from the level above, on its node or chip, beside its value in the panel, and on a Runs in tab that differs"
  group = "Workspace lanes"
  size = "14px"
  status = "Proposed"
  notes = "Proposed 29 Oct 2026 for the walk `workspaces-lanes`. Tooltip `Differs in store-api` on a node or chip, naming the levels, and `Changed for store-api` in the panel and on the tab. One line becoming two: one value, and another below it. A tab that keeps the level above has no mark."
