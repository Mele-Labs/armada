[icons.bell-ring]
  means = "A ringing bell - something is calling for the owner"
  group = "Session"
  size = "12px"
  status = "Specified"
  reserved = "Not an alert on a Job (that is `bell`) and not a stalled Job."
  notes = "Chosen by the owner 8 Oct 2026 for a Session that is waiting on him: the mark on its list row and the head of the Waiting on you section in its ledger. Tooltip lists the items. One mark, no count."

  [[icons.bell-ring.usage]]
    means = "A plan waiting on the person's approval, on the plan card in the thread, beside `badge-check` once it is approved"
    group = "Session"
    size = "16px"
    status = "Proposed"
    notes = "Proposed 16 Oct 2026 in place of `hourglass`, which is banned. The plan is calling for the owner, which is this glyph's meaning, and not time passing. Tooltip `Plan waiting for approval`."
