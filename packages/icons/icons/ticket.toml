[icons.ticket]
  means = "A ticket stub, notched at both ends and perforated down its length"
  group = "Criterion origin"
  size = "12px"
  status = "Specified"
  reserved = "A criterion whose words were read out of an issue, on that criterion's origin line and on an issue tagged in a message with `#`. Never a Job, a request or a dispatch, never a pull request, which is `git-pull-request`, and never a place in a queue."
  notes = "Minted 3 Oct 2026, the owner's pick from the glyph candidates (`hash` and `square-dot` refused). The forge's own issue mark is a ring around a dot, which is `circle-dot`, running's by reservation, so the issue is drawn as the thing it is called rather than the forge's picture of it. A notched stub is the only outline in the set with bites out of both short edges, so it holds at 12px. The issue's reference follows it on the line. Refused: `circle-dot` (running), `file-*` (evidence), `message-square` (Helm), `scroll-text` (a workflow)."

[[icons.ticket.usage]]
  means = "An issue named in a message with #, in the message box and in the thread"
  group = "Message tag"
  size = "12px"
  status = "Specified"
  notes = "Added 12 Oct 2026 with `#` tags in Helm's box and the Sessions box. The registry already draws an issue as `ticket`, so the tag does too, beside `git-pull-request` for a pull request. 12px, --fg-muted. Tooltip: Issue."

[[icons.ticket.usage]]
  means = "The issue tracker outpost on the Cockpit map, where calls to Linear, Jira and `gh issue` land"
  group = "Outpost"
  size = "16px"
  status = "Proposed"
  notes = "Proposed 17 Oct 2026 for the walk `field-outposts`, for the owner to rule on. The registry already draws an issue as `ticket`, so the place issues are kept is a ticket too."

[[icons.ticket.usage]]
  means = "A tracker mod in the Mods list, the kind an issue tracker Armada was not built for is taught by"
  group = "Mods"
  size = "16px"
  status = "Specified"
  notes = "Added 23 Oct 2026 with tracker mods in the list of every mod. The registry already draws an issue as `ticket`, so the tracker that keeps issues is a ticket too, beside `palette`, `eclipse`, `panels-top-left`, `link` and `bell` for the other kinds. Tooltip: Tracker."
