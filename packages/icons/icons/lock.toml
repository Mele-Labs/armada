[icons.lock]
  means = "Cannot be skipped, even on retry"
  group = "Step and Verdict"
  size = "12px"
  status = "Specified"
  reserved = "Never a permission, never a security or auth state, never a locked file. Armada has no lock that means access."
  notes = "Added 2026-08-21 with the hard-prerequisite mark. Sits at the step row's trailing edge in --fg-muted, label only, with no row action behind it — the way past a locked step is Pilot. A hard prerequisite is a property of the workflow definition rather than of this run, so it reads the same on a Job that has not started as on one that stopped."

  [[icons.lock.usage]]
    means = "A Logbook entry the owner locked: Armada never rewrites it or lets it fade"
    group = "Logbook"
    size = "12px"
    status = "Proposed"
    reserved = "A locked Logbook entry, and the Lock act on it. Never a permission, a security state or a locked file."
    notes = "Proposed 22 Oct 2026 for the walk `logbook-changes`, in place of `pin`, which stays the canvas rail's alone. Tooltip `Locked: Armada never rewrites it or lets it fade.`"

  [[icons.lock.usage]]
    means = "The band under the side chat's tab: the copy it asks is read-only and the Job does not see the exchange"
    group = "Job tools"
    size = "14px"
    status = "Proposed"
    reserved = "That band alone. Still never a permission, a security or auth state, or a locked file."
    notes = "Proposed 16 Nov 2026 for the walk `native-side-chat`, as the owner's approved sketch draws it. It says the copy cannot write, which is a property of the copy and grants or refuses nobody access. The words beside it are `Read-only copy. The Job doesn't see this.`"
