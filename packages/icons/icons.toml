  group = "Pull request state"
  size = "12px"
  status = "Specified"
  reserved = "A pull request closed without merging, on its badge only. Never a refusal, a failure or a kill: nothing on the wire says why a pull request closed, so the mark claims only that it did. `x`, `ban` and `power` hold those."
  notes = "Minted 1 Oct 2026 with `git-merge`, for the other settled state. It renders `--status-not-started`, the neutral hue, because a hue that said refused or failed would claim a reason nobody recorded. The cross at its end is detail rather than silhouette: the stopped strand beside a lone node is what survives at 12px, and that already differs from `git-merge`'s joined fork and from `git-pull-request`'s two strands."

[icons.group]
  means = "Two like figures inside a dashed frame \u2014 a selection made into one thing"
  group = "Node bar"
  size = "16px"
  status = "Specified"
  reserved = "Accepting several Notes as one Cluster. Never a generic grouping control, never a folder, and never the Plan's own groups, which draw their boundary instead of a glyph."
  notes = "Minted 2026-09-28 with the node bar's mint. Clustering is the one act that takes several nodes and gives back one, and a marquee round two figures depicts that rather than standing for it. Against `shapes` on the rail beside it: that is three unlike figures overlapping and carries no frame, this is two like figures inside one \u2014 the frame is both the outline difference rule 3 asks for and the whole of the claim. Refused: `layers`, reserved to how many places a Job writes; `boxes`, three cubes, which says a pile rather than a union; `combine` and `merge`, whose arrows promise something is consumed, where a Cluster leaves every Note standing."

[icons.hard-drive]
  means = "A drum lying on its side, cut through by a line running the full width of the grid, with two short marks below it — disk, drawn as the object and never as anything done to one"
  group = "Navigation"
  size = "16px"
  status = "Specified"
  reserved = "The Worktrees surface only. Never the act of reclaiming, and never a delete or a sweep control — a glyph that drew deletion would promise the bulk act that surface exists to replace. Never storage-in-general, a database or a file."
  notes = "Added 2026-09-03 for Worktrees, the surface listing every worktree fleet is holding that it will not give back on its own — a branch with unmerged commits, files an agent never committed, a Job still running — with the reason beside each, so a person takes back the ones they look at and approve. It names that destination and nothing that happens on it. It is the only horizontal vessel in the Navigation set: clipboard-list is an upright board, message-square a bubble with a tail, and bell, stethoscope and file-cog are each an outline with something drawn on or inside it — none of them is a wide low drum cut edge to edge. Its two interior dots are fine here where they would not be on a badge, because rule 3's interior-detail floor is the 12px badge and the rail draws at 16px: at 16 the two marks sit clear of the band above them, and at 12 they begin to merge into it, which is why this row's size is not \"12 and 16px\". Refused before it was proposed: archive is superseded's and its own row claims the lidded box as a unique outline in the badge set, so a second surface wearing it would spend that; database would name SQLite, which Armada actually has, so it would name the wrong object. Row only — the surfaces array and the digit binding that reach it are Bridge's and land with #401."

[icons.hourglass]
  means = "nothing — banned outright"
  group = "Banned"
  status = "Banned"
  reserved = "Banned."
  notes = "Removed from stalled because it reads as be patient for the state that most needs to read as wrong. Nothing in Armada may use it."

[icons.image]
  means = "A frame with a horizon and a sun \u2014 a picture that can be opened"
  group = "Node bar"
  size = "16px"
  status = "Specified"
  reserved = "Opening the picture a Studio Note kept, full size. Never an attachment, never a staged file, and never a Sketch node, which is `shapes`."
  notes = "Minted 2026-09-28 with the node bar's mint. `shapes`'s own row refused `image` on the grounds that it *promises a picture a person can open*, which is exactly what this act does \u2014 so that refusal is the argument for it here, and the same sentence is what keeps the two apart. Refused: `file-image`, since `file-*` is reserved to evidence throughout; `frame`, which reads as a crop; `eye`, reserved to Review; `maximize`, reserved to fitting a canvas to what is on it."

[icons.layers]
  means = "how many places a Job writes — one layer for one, stacked layers for several"
  group = "Graph"
  size = "12px"
  status = "Specified"
  notes = "At the approval gate and in the detail header only, never in a Job Board row \u2014 the row already names the first write target and counts the rest in text. Read `means = \"convoy\"` until 22 Sep 2026: the owner retired every kind name that day (#1530), and the glyph had always stood for blast radius rather than for a shape of Job. `docs/contracts/iconography.md`, Blast radius, is the rule."

[icons.layout-dashboard]
  means = "Overview — a rectangle split into panes, like the tile band and lists it opens on"
  group = "Navigation"
  size = "16px"
  status = "Specified"
  notes = "Added 2026-09-13 with Overview, Bridge's first surface (#921). The only Navigation glyph built from a grid of panes rather than a single bounded shape, which is what keeps it clear of clipboard-list (an upright board), hard-drive (a horizontal vessel), and the outline-with-something-inside family — message-square, bell, stethoscope, file-cog."

[icons.link]
  means = "Two interlocking chain segments on a diagonal"
  group = "Queued reason"
  size = "12px"
  status = "Specified"
  notes = "Changed from lock. A lock says you lack permission; nothing is locked, something upstream is unfinished."

  [[icons.link.usage]]
    means = "A Link node placed on a Studio's whiteboard — an address a person kept"
    group = "Canvas rail"
    size = "16px"
    status = "Specified"
    notes = "Added 2026-09-28 with the canvas rail (#1626's annotation run). A second context on a glyph carrying no reservation, which is what a `usage` sub-table is for. A chain is what every surface a person has ever used draws a hyperlink as, and a Studio's Link node is an address and nothing else — so the silhouette is already read correctly before the tooltip opens. It is a cross-group collision with the Queued reason above and the contract permits those: that one is a 12px badge glyph in `--status-queued`, this is a 16px control on a canvas, and no surface draws the two together. Refused: `external-link` is Chrome's and means *this press leaves the app*, which placing a node does not; `paperclip` would say attachment, and a Link on a Studio is a node like any other rather than something clipped to one. The palette's Add a link row draws it too, since 2 Oct 2026: the same act, and the owner asked for the rail's glyphs there."

[icons.list-ordered]
  means = "Numbered lines \u2014 things read in an order"
  group = "Node bar"
  size = "16px"
  status = "Specified"
  reserved = "Reading several Studio nodes as one Outline. Never a plan, never a step list, and never a generic list control."
  notes = "Minted 2026-09-28 with the node bar's mint. An Outline is several nodes read *in order*, and the digits carry the whole claim \u2014 which is why `list`, the same lines without them, is refused: unordered is the one thing an Outline is not. Refused besides: `clipboard-list`, which is the Job Board and carries a board and a clip; `list-tree`, a hierarchy an Outline does not have; `align-left`, which says how text is set rather than what it is."

[icons.lock]
  means = "Cannot be skipped, even on retry"
  group = "Step and Verdict"
  size = "12px"
  status = "Specified"
  reserved = "Never a permission, never a security or auth state, never a locked file. Armada has no lock that means access."
  notes = "Added 2026-08-21 with the hard-prerequisite mark. Sits at the step row's trailing edge in --fg-muted, label only, with no row action behind it — the way past a locked step is Pilot. A hard prerequisite is a property of the workflow definition rather than of this run, so it reads the same on a Job that has not started as on one that stopped."

[icons.maximize]
  means = "Four corner brackets facing outward — the whole of a thing brought into its frame"
  group = "Canvas rail"
  size = "16px"
  status = "Specified"
  reserved = "Fitting a canvas to what is on it. Never full screen, never a window control, and never expanding a panel or a row."
  notes = "Added 2026-09-28 with the canvas rail (#1626's annotation run), when the owner moved the zoom pair and Fit out of the bottom-right corner and onto the rail. Fit was the word `Fit` in a text button, which a 32px square rail button cannot hold beside two signs — so the act needed a mark, and four disjoint corner brackets is the one silhouette nothing else in the set carries. The zoom pair beside it keeps `−` and `+`: those are signs rather than glyphs under rule 1, and minting `zoom-in` and `zoom-out` would put two magnifiers next to `search`, which is Chrome's. Refused: `scan`, the same four corners with a line through them, which reads as reading a code; `expand` and `fullscreen`, which promise the window control this reservation bans; `crosshair`, which says centre on a point rather than show the whole."

[icons.megaphone]
  means = "A horn flaring from a narrow throat, over a handle that hangs below it — the only cone in the badge set, and the only glyph in it depicting the Job's own act rather than a person's"
  group = "Job state"
  size = "12px"
  status = "Specified"
  reserved = "job_status.escalated only. Never an alert or a notification — bell is Alerts' and an alert is a condition on a Job rather than a status a Job holds, so the two populations may not share an outline. Never an escalation reason, which is the collision that would undo the split this glyph exists for. Never an action: a person answers an escalation, and nothing in Armada broadcasts."
  notes = "Added 2026-09-03 with job_status.escalated, minted rather than borrowed. It renders --status-escalated, so rule 4 asks it to differ from every outline sharing that hue — octagon, closed loop, page-and-question, Y-split, broken plug, ascender-to-a-line, and wrench's diagonal shaft with an open jaw — and a cone flaring from a narrow throat over a hanging handle is none of them. The interior tick, the stroke dividing the mouthpiece from the flare, is detail rather than silhouette, so it was drawn at 12, 16, 24 and 48px on --bg-raised before this row was written: at 12px the tick and the throat box merge into one small mass at the left, and what survives is the cone and the handle. Neither carries the meaning in the tick, so rule 3 holds — the same test circle-dashed and wrench were put to, reached by a different route. What it says: the Job called out and is still calling, which is what an escalated Job does until somebody answers. bell is the nearest claim in the app and cannot be taken — it is Alerts' rail glyph, its own row calls the bell the interrupt metaphor, and docs/concepts/bridge.md rests on an alert being a condition on a Job rather than a status a Job holds. The silhouettes carry that distinction exactly: a bell is rung at a person, and a horn is held by the thing doing the asking. Also refused: octagon-alert is stalled's by its own note and is a reason rather than the status; user-check is reserved to human-required and is awaiting_approval's in this same group; circle-help and circle-alert are ring outlines and collide with circle-dot at 12px; triangle-alert is reserved to Doctor. The metaphor question was answered before minting rather than after. A megaphone is not a thing Armada has — and neither is a stamp, a wrench, a flag, a lidded box or a severed plug, all five Specified in this file. P1 confines metaphor to proper nouns, which is what refused a ship's wheel for Helm, a name; an object standing for a verb is what stamp means attest and wrench means repair already do, and this one stands for asking. Where it departs from that family is worth recording: stamp, eye, terminal and wrench are each the object for the act a person owes, and this is the object the Job holds. That is the difference between a status that asks and a status that waits, and it is why this badge is not a second human-required mark."

[icons.menu]
  means = "Three stacked horizontal lines"
  group = "Navigation"
  size = "16px"
  status = "Specified"
  reserved = "The narrow title row's menu only, which holds the row's own controls. Never a drag handle, never a list or a Board view, and never a row's more-actions."
  notes = "Added 2026-09-30 when the owner put the narrow title row behind one menu, the way a mobile web app does. Three lines is the silhouette people already read as that menu, and nothing else in the set is three plain bars."

[icons.merge]
  means = "The merge line: two paths bending into one and rising as a single arrow, branches taking their turn onto main"
  group = "Navigation"
  size = "16px"
  status = "Specified"
  reserved = "The Merge line surface only. Never the merge act at a gate, which is a button with its own word, and never a merged pull request, which is `git-merge`."
  notes = "Added 2 Oct 2026 for the Merge line's rail row, and chosen by the owner over `list-end` on the walk the same day. Every Navigation glyph is reserved to its own surface, so none could be borrowed. Against the set: `layout-dashboard` is a grid of panes, `hard-drive` a horizontal vessel, `presentation` a board on legs, `briefcase` a case, `book-open` two leaves; two strokes converging into an arrowhead is none of them. Against `git-merge`, the Pull request state badge: that is two nodes on strands, drawn at 12px in a Job header; this is open paths with an arrowhead at 16px in the rail, and the two never sit together. The other candidate was `list-end`, lines with a turn into the end, which says a queue but at 16px reads close to `menu`'s three bars. Refused: `list-ordered`, reserved to Studio outlines; `git-merge`, reserved to the badge; `waypoints`, the graph toggle."

[icons.message-square]
