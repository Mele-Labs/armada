  notes = "Minted 3 Oct 2026 with where a retro item's fix lands (`lands_in = armada`), the owner's three places. Armada is the product, and an application window is the plainest drawing of one. **The objection to expect is that Fleet has no window**: the place is Fleet or Bridge, and a mark for the product had to cover both. Refused: `armada-mark`, whose reservation is absolute and keeps it out of rows; `server`, already whose way for Fleet, which would draw one glyph twice on a row saying two things; `wrench`, reserved to awaiting_repair; `settings`, configuration. Tooltip: Lands in Armada."

[conventions.record_kind_mark]
  glyphs = ["box", "file-check", "file-diff", "shield", "scale", "bot", "list-todo", "flask-conical"]
  means = "The kind of a Record row, as a mark leading it"
  group = "Record kind"
  size = "12px"
  status = "Specified"
  notes = "The Record's Kind column became a 12px mark under the All filter on 2026-09-28, the owner's own instruction: no kind word under a specific filter, and an icon on the left of the row with the kind's name on hover under All. The rows divide into eight families. Two had a glyph the registry already sanctioned: `file-check` leads an Evidence row, since a submitted claim, a hand-in and a kept deliverable are each a submission that landed, and `file-diff` leads a Files row, since reading what one file changed is that glyph's own reservation. On 2026-09-29 the owner asked for the six that were owed, and six were minted in a group of their own, one per family, each reserved to its family's rows and none of them an outcome: `box` the Job, `scale` a Judge, `bot` a Drone, `list-todo` a task, `flask-conical` a case run, `shield` a Check. Each row carries its refusals. **A Check row takes the bare `shield`**, the owner's answer the same day: the Check's silhouette is the shield throughout, and rule 4, which would refuse an outline shared with shield-minus and shield-off inside one grey, is waived for this mark alone because it draws only in this column, beside the words that say what it is. See `shield`'s row and *The Record's kind marks* in docs/contracts/iconography.md. Every mark draws --fg-muted and never a status hue: the kind is the whole of what it says, and the Outcome column owns what the row came to."

[conventions.step_activity_borrowing]
  glyphs = ["circle-dot", "eye", "rotate-cw", "check", "x", "power"]
  means = "Step activity, borrowed from the Job set"
  group = "Step and Verdict"
  size = "12px"
  status = "Specified"
  notes = "A step may carry the Job glyph that means the same thing one level down. A step and a Job answer the same question at different scales, so a second silhouette for one meaning is the collision this page exists to prevent — a rail row and the badge above it showing the same claim must show the same mark. What a step may not do is take a badge glyph in a sense the badge does not carry. The rail's activity values take their glyphs this way, and `glyphs` above is the roster. It named Iconography's step-activity table as the roster instead until 2026-09-04, and that table had drifted to `waiting (clock)` — a glyph this list does not lend, and each authority pointing at the other is why the disagreement stood with nobody able to say which half was stale (#347). Iconography carries the reasoning and not the lookup; the per-value assignment is `verbs.step_state` in crates/core-model/domain/enum-verbs.toml, where a waiting rail row takes `eye`. `clock` is refused rather than merely missing: it is `queued`'s badge, where nobody is acting and the row reads grey, and a step at `awaiting_human` is the opposite claim — a person is waited on, `--step-waiting` aliases `--status-awaiting-review`, and `eye` is that badge's own glyph, reserved to review, which is this step's claim one level down. Three values are not borrowings and carry their own rows: `flag` for stopped, `circle-dashed` for not_started, and `lock` for a hard prerequisite. `power` joined the roster 2026-09-04 for a killed step, which `StepActivityMark` has drawn since the value landed: it is `job_status.killed`'s own glyph one level down, the same act freezing the step where it stood, so the convention already sanctioned it and only this list was short. One borrowing differs in treatment rather than glyph — `x` at step level is hued in --step-failed on a --step-failed-bg row, where the Job badge's `x` takes the badge's own colour. That sits inside `x`'s reservation rather than widening it: a failed Check is a system failure, not a human decision."


