# packages/icons/icons.toml
#
# The Armada icon registry. AUTHORED HERE, not generated — this file is the
# authority on which lucide-react glyph means what, and what a glyph may
# never be reused for. Notion's "Armada Icons" database is retired to
# history; a page there that disagrees with this file is stale, not right.
#
# One [icons.<name>] table per lucide glyph, keyed by its kebab-case
# lucide-react name. `reserved` is the part that must not be edited
# casually: it is the reservation rule — what a glyph's silhouette may
# never be made to mean elsewhere. A glyph used in more than one place in
# the UI (see `file-cog`, `chevron-down`) carries each context as a
# `[[icons.<name>.usage]]` entry rather than overwriting the first.
#
# `[conventions.*]` tables record cross-cutting rules that name several
# glyphs at once rather than assigning one glyph its own meaning.
#
# Fields:
#   means    - what the glyph's outline depicts (or, for some rows, the
#              concept it labels — carried as Notion recorded it)
#   group    - the badge/UI family this assignment belongs to
#   size     - "12px", "16px", or "12 and 16px"; absent where Notion left
#              it unset
#   status   - Specified | Proposed | Retired | Banned
#   reserved - what this glyph may never be reused for (absent where
#              Notion recorded none)
#   notes    - the reasoning behind the choice (absent where Notion
#              recorded none)
[icons.activity]
  means = "Active jobs"
  group = "Navigation"
  size = "16px"
  status = "Retired"
  notes = "Retired 2026-08-31. Active jobs folded into the Job Board when the Board became every Job with state as a filter, so the surface this named no longer exists — see docs/concepts/bridge.md. The glyph is free again. The ECG outline reads cleanly at 16px where it would not at 12px, which is why it was chosen and why it is worth someone else having."

[icons.archive]
  means = "A box with a lid"
  group = "Job state"
  size = "12px"
  status = "Specified"
  notes = "The work landed outside the Job and the record no longer describes it. A lidded box is a unique outline in the badge set with no interior detail, and it states filed-away rather than succeeded or failed — which is the distinction superseded carries against the other terminals."

[icons.armada-mark]
  means = "Armada itself. The product, never a state and never an action."
  group = "Brand"
  size = "16px"
  status = "Proposed"
  reserved = "Absolute. Nothing else may use this outline, and the mark may not be made to mean anything other than Armada — not home, not app, not a nav destination. It never appears in a Job Board row, a badge, or a button."
  notes = "Three equal hulls on a shallow arc — one filled path repeated three times, in one colour. **Redrawn 2026-09-07; the Countersign mark it replaced was two offset squares, which is the duplicate glyph in lucide, Feather and macOS, and read as a copy icon.** The construction changed with it: this mark carries no stroke at all, so the Rendering section\'s one-stroke rule has nothing to fix here — see the Brand mark amendment on Iconography. The floor is 16px, where the notches hold at about one pixel; it is comfortable from 24. **It has left 12px** — the old row permitted 12 beside badge text while its own reservation banned it from badges, and the new floor removes the contradiction rather than resolving it. Below 16 the three hulls fuse into one silhouette and the wordmark is set alone instead. Two-tone variant (ArmadaMarkDuo, the two trailing hulls held back) at 32px and above only. Accent fill permitted on the macOS app tile alone. The full specification — construction, clear space, colour and what may never change — is packages/brand/README.md."

[icons.arrow-up-down]
  means = "sort"
  group = "Chrome"
  size = "16px"
  status = "Specified"

[icons.arrow-up-to-line]
  means = "An ascender meeting a hard horizontal line"
  group = "Escalation reason"
  size = "12px"
  status = "Specified"
  notes = "Added 2026-08-21 with the seventh escalation reason, loop_cap. An ascender meeting a hard horizontal line is literally the semantics: the loop rose until it met its ceiling. Two strokes, no interior detail, so it holds at 12px. Chosen against a loop glyph on purpose — see the page reasoning. Crosses hue groups with `arrow-up-down` (Chrome, sort), which rule 4 permits and which is a different glyph in a different column at a different size."

[icons.ban]
  means = "A circle with a diagonal bar through it"
  group = "Job state"
  size = "12 and 16px"
  status = "Specified"
  notes = "Circle and diagonal: you declined it. Not a cross, because this is a decision and not an error. **That second sentence is why it also marks the destructive confirmation dialog**, added 10 Sep 2026: `x` had the head glyph there and `x` is reserved to system failure, its own row naming this one as where a human decision goes instead. The dialog covers more than declining — kill a Drone, kill a Job, give a worktree back, clear a terminal — and the circle-and-diagonal reads as *this will not continue* across all of them, where a cross would claim something had gone wrong. The badge and the dialog share the outline and not the hue, which rule 4 admits."

  [[icons.ban.usage]]
    means = "A workflow file Fleet left out, and the rail's warning that one is"
    group = "Workflows"
    size = "12px"
    status = "Specified"
    notes = "Added 5 Oct 2026 with the Workflow creator, on the owner's word after walking it. A file that cannot run is declined by Fleet, which is what the circle and diagonal already say. One outline for both the row's mark and the rail row's warning, so the two read as the same fact. The tooltip names it; no count is drawn. `triangle-alert` stays Doctor's and is not drawn here."

[icons.bell]
  means = "Alerts"
  group = "Navigation"
  size = "16px"
  status = "Specified"
  notes = "Escalations interrupt, and the bell is the interrupt metaphor. Deliberately not octagon-alert, which belongs to stalled."

[icons.book-open]
  means = "Guides — two facing leaves meeting at a spine, which is the catalogue of guides held open"
  group = "Navigation"
  size = "16px"
  status = "Specified"
  reserved = "The Guides surface only. Never a document, a log, a transcript, a brief or an evidence bundle — those are the file-* family's, and never a workflow, which is `scroll-text`."
  notes = "Minted 23 Sep 2026 with the guidance system (#1602, #1603), for the owner's catalogue of guides: a `?` beside a piece opens its card, and this rail row is where every card can be read again. Against the Navigation set it collides with none — `layout-dashboard` is a grid of panes, `clipboard-list` an upright board with a clip, `presentation` a board on legs, `hard-drive` a horizontal vessel, `briefcase` a case whose handle breaks its top edge, and `bell`, `stethoscope`, `file-cog` and `settings` are each an outline with something drawn on or inside it. Two leaves rising from a centre spine is none of those, and the spine is the silhouette rather than interior detail, so rule 3 holds at 16px. What was refused: `file-question-mark` reads exactly right and cannot be taken, because `file-*` means evidence throughout by its own reservation; `circle-help` is refused twice over, since `circle-*` is reserved to Judge criterion verdicts and a ring outline collides with `circle-dot`; `info` is the same ring with the same two problems and names a notice rather than a place; `scroll-text` already means the workflow a Job runs, so a rail row wearing it would say *workflow* where it means *guides*; `library` and a closed `book` are both rectangles at 16px, which is `file` and `archive` territory. **The objection to expect is `scroll-text`**, since a rolled sheet and an open book are both something authored — it passes rule 4 because the two are in different groups at different sizes, 16px Navigation against 12px Graph, and the contract admits collisions across those. The mark that opens one card is not a glyph at all: it is the character `?`, which is the owner's own word for the control."

[icons.bookmark]
  means = "A ribbon with a notched foot \u2014 a thing set aside to come back to"
  group = "Node bar"
  size = "16px"
  status = "Specified"
  reserved = "Deferring what a Studio node raised. Never a favourite, never a saved search, never a kept Job \u2014 nothing in Armada is bookmarked in that sense, and a second meaning here would leave the bar ambiguous the way `pin`'s reservation keeps the rail's from being."
  notes = "Minted 2026-09-28 when the owner opened the mint for the hovering node bar. Defer writes a Deferred node: what was raised is not wrong and not now, which is what a ribbon left in a page says. Refused: `clock`, `alarm-clock`, `timer` and `calendar-clock`, since the set holds one time-shaped mark by decision and `hourglass` is banned outright, so a second clock face is rule 4's collision on the very glyph that row exists to protect; `flag`, reserved outright against every other use in Armada; `archive`, a Job state meaning the record no longer describes the work; `moon` and `snowflake`, metaphors for later that P1 confines to proper nouns."

[icons.briefcase]
  means = "Kit — a case with a handle above its body, which is the tool set you bring"
  group = "Navigation"
  size = "16px"
  status = "Specified"
  reserved = "The Kit surface only. Never a Job, a workspace, a package or an export, and never a generic settings or configuration glyph — that is `settings`, and a Manifest is `file-cog`."
  notes = "Added 2026-09-18 with Kit's rail row (#1275), after the owner settled that Settings keeps the cog, and confirmed by him the same day. Kit is the tool set a person brings from machine to machine — skills, MCP servers, plugins, agent files, commands — and a case with a handle is that object rather than a second way of drawing configuration. The only Navigation glyph with a handle standing above its body: clipboard-list is an upright board with a clip on it, presentation a board on legs, layout-dashboard a grid of panes, hard-drive a horizontal vessel, and bell, stethoscope, file-cog and settings are each an outline with something drawn on or inside it. Nothing else here breaks its own top edge, which is what tells it apart at 16px and would at 12. Refused before it was proposed: `package` and `archive` are both lidded boxes and `archive`'s own row claims that outline as unique in the badge set; `backpack` carries straps and pockets, which is the interior detail rule 3 refuses; `puzzle` reads as one extension rather than a set, and would be the wrong promise on a surface that is to hold skills and commands too; `wrench` is reserved to job_status.awaiting_repair by its own row, which names settings as the collision that reservation exists to refuse."

  [[icons.briefcase.usage]]
    means = "A retro item whose fix lands in the Kit"
    group = "Retro"
    size = "12px"
    status = "Specified"
    notes = "Added 3 Oct 2026 with where a retro item's fix lands (`lands_in`, `docs/concepts/retro.md`), the owner's three places. Kit is the tool set a person brings — Skills, MCP, sub-agents, the allowlist, models — and this is Kit's own glyph, so the mark says the fix lands on that surface's subject rather than borrowing it for a second meaning. 12px, --fg-muted, beside the who mark. Tooltip: Lands in Kit."

  [[icons.briefcase.usage]]
    means = "A workflow in Kit, and Kit as the scope a workflow is written to"
    group = "Workflows"
    size = "12px"
    status = "Specified"
    notes = "Added 5 Oct 2026 with the Workflow creator. Kit is where a definition goes that every repository on this machine should have, so the case is the row's mark and the scope's. The Navigation reservation to the Kit surface stands for 16px."

[icons.check]
  means = "A bare checkmark"
  group = "Job state"
  size = "12 and 16px"
  status = "Specified"
  notes = "Bare checkmark, nothing is more legible small. Check means yes in both places, which is the point."

[icons.circle-check]
  means = "A circle with a check inside"
  group = "Step and Verdict"
  size = "12px"
  status = "Specified"
  reserved = "Judge verdicts only. Never a Check result, never a generic success mark, never a completed step — that is bare check in --step-advanced."
  notes = "Added 2026-08-21. In --verdict-met. circle-* is the Judge's own glyph family, beside shield-* for Checks and file-* for evidence artifacts — a verdict on a criterion is neither a gate nor an artifact, so the silhouette carries hedge-by-source before the label is read. Rendered as \"no objection\" rather than \"accepted\": the Judge declines to refuse, it never grants."

[icons.circle-dashed]
  means = "A circle's outline broken into eight short dashes, with nothing at its centre — the break in the stroke is the whole claim, not motion. circle-dot's claim is the opposite construction, a continuous ring around a filled centre, so the two read apart by two independent facts: whether the stroke is unbroken, and whether anything sits in the middle."
  group = "Step and Verdict"
  size = "12px"
  status = "Specified"
  reserved = "Two uses, told apart by which record it marks. step_state.not_started on a step's own row; a Plan region's open task, below. Never a loading or busy indicator — the dashes read a stroke broken at rest, not a stroke in motion — and never a Judge verdict, which is circle-check/x/minus's family."
  notes = "Added 2026-09-02 for step_state.not_started, minted rather than borrowed — none of [conventions.step_activity_borrowing]'s five glyphs fit, since circle-dot, eye, rotate-cw, check and x each claim some activity happened or is happening, and not_started is the state where none of that is true yet. Unlike circle-check, circle-x and circle-minus, which are a ring plus a separate interior stroke — two graphical elements, one nested in the other — circle-dashed has no second element: the eight dashes are the entire outline, not a detail drawn inside a stable ring. What differs is a property of the stroke itself, continuous or broken, which is why this survives rule 3 where an icon needing its interior resolved would not. It is the mark StepActivityMark (packages/components) falls back to only where no ordinal reaches it — WorkflowRail and StepRow both pass one today, and the ordinal keeps the cell wherever a caller supplies it; a step's position is more informative than a silhouette and this glyph never displaces it. Renders at --fg-subtle, unchanged from packages/tokens/src/status.css:106's existing not_started assignment — no token edit made or needed. docs/contracts/iconography.md rule 6 and its Contrast floor section now name circle-dashed beside circle-minus as the second --fg-subtle exception, on the same grounds: --fg-subtle clears 4.58:1 post-lift, and this glyph carries no status hue for the same reason gate_undecided doesn't. --fg-muted was rejected on purpose: that is retrying's colour, and status.css keeps not_started one step dimmer than retrying deliberately; equalising them to clear rule 6 would erase the distinction the token file exists to hold."

  [[icons.circle-dashed.usage]]
    means = "An open plan task, not yet started"
    group = "Step and Verdict"
    size = "12px"
    status = "Specified"
    reserved = "TaskMark's (packages/components) open state only, docs/concepts/plan.md. Never a step's own not_started, which is the table above."
    notes = "Added 2026-09-13 for #896/#898. Reuses the same claim one level below a step: a stroke broken at rest rather than in motion, for a task no work has touched yet. Renders at --fg-subtle, the same contrast-floor exception the table above already carries — no second exception needed."

[icons.circle-dot]
  means = "Two concentric circles"
  group = "Job state"
  size = "12px"
  status = "Specified"
  notes = "Two concentric primitives, maximum legibility at 12px. Reads live, and unlike play it does not read as a button."

[icons.circle-minus]
  means = "A circle with a minus inside"
  group = "Step and Verdict"
  size = "12px"
  status = "Specified"
  reserved = "Judge verdicts only. Never disabled, absent, or removed — and never Check's not-reached, which is shield-minus."
  notes = "Added 2026-08-31, for gate_undecided. The outline was reassigned to shield-minus on 2026-08-21 when circle-* became the Judge family; the name returns to the family it left, but the meaning is new, not restored — shield-minus keeps Check's not_reached, this is a third Judge outcome. met and not_met are both judged; gate_undecided is what the Judge produces when it could not read the artifact at all, so it is neither circle-check nor circle-x rendered badly. In --fg-subtle rather than either verdict hue, because the criterion went unjudged rather than judged and coloured — the 20 Aug legibility lift raised --fg-subtle to 4.58:1 on --bg-overlay (packages/tokens/src/colors.css), clearing the floor the pre-lift value could not survive. core-model's escalation module treats gate_undecided as the one trigger that is not overrulable: the machine is saying it could not read the artifact, so there is nothing ruled to disagree with, and Recourse::RerunGate is what answers it, not Override."

[icons.circle-x]
  means = "A circle with a cross inside"
  group = "Step and Verdict"
  size = "12px"
  status = "Specified"
  reserved = "Judge verdicts only. Never a failed Check (shield-x), never a Job failure, never a dismiss or close control."
  notes = "Added 2026-08-21. In --verdict-not-met. A criterion is met or it is not, and that is a measured fact, so it renders as flatly as one. The red does not claim the Job failed: a refusal is the gate working. Verdict hue is per criterion and never sums onto the step or the Job, which is what lets a red cross sit under a running step beneath an escalated badge."

[icons.clipboard-list]
  means = "Job Board"
  group = "Navigation"
  size = "16px"
  status = "Specified"

[icons.clock]
  means = "A clock face with two hands — the only time-shaped badge, since hourglass is banned"
  group = "Job state"
  size = "12px"
  status = "Specified"
  notes = "Unambiguous now that hourglass is banned — no other badge is time-shaped. A Job scale glyph, and not lent to a rail row: it is not on [conventions.step_activity_borrowing] and is refused there rather than merely absent. A clock says nobody is acting, which is what grey says beside it; a step waiting on a person is the opposite claim and takes `eye`. #347."

[icons.copy]
  means = "copy an id or a path"
  group = "Chrome"
  size = "16px"
  status = "Specified"

[icons.corner-up-right]
  means = "Redirect"
  group = "Action"
  size = "16px"
  status = "Specified"
  notes = "Course correction into a live drone. Survives as: redirected."

[icons.cpu]
  means = "A square with radiating ticks — unique in the whole system at 12px"
  group = "Queued reason"
  size = "12px"
  status = "Specified"
  notes = "The square-with-radiating-ticks outline is unique in the system, which is what matters at 12px."

[icons.diff]
  means = "A plus over a rule: what was, and something more"
  group = "Criterion origin"
  size = "12px"
  status = "Specified"
  reserved = "The issue a criterion was read from has been edited since Fleet read it, beside that criterion's origin only. Never a change count, a diff view or a produced file's change: `file-diff` holds that, and a diff's gutter draws `+` and `-` as signs. Never on a canvas."
  notes = "Minted 3 Oct 2026, the owner's pick from the glyph candidates (`git-compare` and `asterisk` refused). Says *differs* in three strokes. It takes the caution hue of the moved state, which is the state's and not the glyph's; rule 4 holds against the other marks in that hue, none of which is a plus over a rule. Kept off canvases because on its own it reads as add, and the canvas rail's `+` is a sign in a square. It replaced the sentence slice 4 drew, which said the issue moved *since these words were frozen*: wrong at the gate, where nothing is frozen yet. Its tooltip names it and the date the issue moved."

[icons.download]
  means = "An arrow entering an open tray \u2014 what is behind an address, brought in"
  group = "Node bar"
  size = "16px"
  status = "Specified"
  reserved = "Reading a source into a Studio. Never a file written to disk, never an export, and never a fetch or a poll, which is `rotate-cw`."
  notes = "Minted 2026-09-28 with the node bar's mint. Read in takes an address a Studio already holds and brings what is behind it in as nodes, so the arrow points into the surface rather than out of it. Against `arrow-up-to-line`, the Escalation reason: that is a bare ascender meeting a hard horizontal line and carries no vessel, this is an arrow entering one \u2014 and the two never appear together, a 12px badge in a Job row against a 16px control on a canvas, which is the cross-group collision the `link` row already argues the contract permits. Refused: `import`, whose box is interior detail at 16px; `book-open`, reserved to the Guides surface; `glasses`, which says *read* rather than *read in*; `scan-text`, which reads as reading a code, the objection that kept `scan` off Fit."

[icons.external-link]
  status = "Specified"

  [[icons.external-link.usage]]
    means = "open a PR externally"
    group = "Chrome"
    size = "16px"

  [[icons.external-link.usage]]
    means = "hand a path to the OS — a job's worktree, log or transcript"
    group = "Chrome"
    size = "16px"
    notes = "The log-reference row's trailing control. The same reading as the PR use one step down: the thing opens outside Bridge, in whatever the machine opens it with. Deliberately not the copy glyph — the value beside it already copies on click, and a value that copies does not also get a button that copies it."

  [[icons.external-link.usage]]
    means = "Open a Studio node's own address — a Link, an Issue, a Pull request, an Epic"
    group = "Canvas rail"
    size = "16px"
    notes = "Added 2026-09-28 when the owner asked for the hovering node bar to be a row of icon buttons rather than a menu. The third context on a row carrying no reservation, and the same reading as the other two: the address is handed to whatever browses the web on this machine, so the press leaves Bridge. That is exactly the claim the Canvas rail's `link` row refused `external-link` for — placing a Link node stays inside the app, and opening one does not — so the two sit in one group without colliding. Refused here: `eye`, reserved to Review; `book-open`, reserved to the Guides surface; `maximize`, reserved to fitting a canvas."

[icons.eye]
  means = "An eye — an almond outline around a circle"
  group = "Job state"
  size = "12 and 16px"
  status = "Specified"
  reserved = "Review. Nothing else may use it."
  notes = "One glyph, two places, by design. Badge at 12px, navigation at 16px."

[icons.file-cog]
  status = "Specified"
  reserved = "Manifest only — the surface and the file. Never a generic settings or config glyph; Settings uses `settings` and Kit uses `briefcase`."

  [[icons.file-cog.usage]]
    means = "Manifest — Bridge's seventh surface"
    group = "Navigation"
    size = "12 and 16px"
    notes = "Added 2026-08-21 with the Manifest surface (see Run and edit a Manifest). 16px in the rail, --fg-muted at rest and --fg-default when active, never status-coloured. The same glyph already assigned to Manifest in Git and config, reused deliberately: a surface and the thing it edits are one concept, and a second glyph would imply two. Bridge went from six surfaces to seven with this addition."

  [[icons.file-cog.usage]]
    means = "Manifest"
    group = "Git and config"
    size = "12px"

  [[icons.file-cog.usage]]
    means = "A retro item whose fix lands in the Manifest"
    group = "Retro"
    size = "12px"
    status = "Specified"
    notes = "Added 3 Oct 2026 with where a retro item's fix lands (`lands_in = manifest`): the repository the Job worked on, its armada.yml Checks, its tests and its code, which the owner named Manifest. The Manifest's own glyph, so the tab and the mark say one word. `folder-git-2`, the repository, was the first candidate and is refused only because its component name carries a vendor literal the gate refuses outside adapters. 12px, --fg-muted. Tooltip: Lands in the Manifest."

[icons.file]
  means = "A log — the plain page outline"
  group = "Evidence"
  size = "12px"
  status = "Specified"
  reserved = "The log row, and nothing else. It is the file-* family's unmarked member."
  notes = "`docs/concepts/log-envelope.md` states the rule this row carries out: the file-* family is reserved to evidence, so the log row takes the plain page outline rather than a new glyph. The row was missing while three screens rendered a log line, so each left its mark channel empty rather than borrowing a glyph that means something else."

[icons.file-check]
  means = "A page outline with a check — one submitted piece of evidence"
  group = "Evidence"
  size = "12px"
  status = "Specified"
  reserved = "A submission that landed. Never a Check result, which is the shield-* family."
  notes = "The check marks that evidence was submitted, not that anything passed — a submission returns a receipt and the verdict arrives later. Distinguishing those two is why this is not `shield-check`."

  [[icons.file-check.usage]]
    means = "A plan task handed in, waiting for its Checks"
    group = "Step and Verdict"
    size = "12px"
    status = "Specified"
    reserved = "TaskMark's (packages/components) handed_in state only, and `verbs.task_state.handed_in`. Never a done task, which is check, and never a Check result, which is shield-*."
    notes = "Added 2026-10-02 for protocol 22.0, spike 022 slice 1a, with the owner's answer 1: done arrives at green, and a task in between needs its own mark. This glyph's own claim, one level below a step: the task's agent handed its work in, and the verdict comes later. Renders --step-running, the work still in flight, as a group's `checking` takes running's hue."

[icons.file-diff]
  means = "A page outline carrying a plus and a minus"
  group = "Evidence"
  size = "12px"
  status = "Specified"
  reserved = "Reading what one produced file changed. Never a Check result, which is the shield-* family; never a submission that landed, which is file-check; and never the change count on a row, which is text — a Job row already reads `3 files · +94 −31` and a glyph there would say it twice."
  notes = "Added 2026-08-31 for job detail's Produced chips, where a file a step produced opens its diff. The file-* family means evidence throughout and a produced file is evidence, so the diff takes a member of that family rather than a new silhouette: file-check says a submission arrived and claims nothing about its content, and this is the one that opens the content. It carries more interior detail than any other member — a plus and a minus on the page's face rather than one mark at its edge — so it is drawn at 12px and never smaller, which is the size both the palette row and the chip use."

[icons.file-question-mark]
  means = "A page outline with a question mark"
  group = "Escalation reason"
  size = "12px"
  status = "Specified"
  reserved = "The file-* family means evidence throughout."
  notes = "The page outline does the differentiating work alone. Named file-question before lucide 0.511; that spelling is still exported as a deprecated alias, which is why nothing broke when the registry kept it."

[icons.filter]
  means = "filter"
  group = "Chrome"
  size = "16px"
  status = "Specified"

[icons.flag]
  means = "A pennant on a staff"
  group = "Step and Verdict"
  size = "12px"
  status = "Specified"
  reserved = "Nothing else in Armada may use flag — no flag-for-review, no feature flag."
  notes = "Added 2026-08-21 with the sixth step-activity value. --fg-default on a --step-stopped-bg row: the surface carries the warning, so a hued glyph would say it twice. A flag marks a position rather than declaring a verdict, which is the correct claim — the verdict is on the criterion rows beneath it and the reason is on the badge above. octagon-x was rejected because the octagon belongs to stalled and a stopped step sits under an escalated badge; a bare attempt count was rejected for sharing a silhouette with a not-started row."

[icons.folder]
  means = "workspace"
  group = "Git and config"
  size = "12px"
  status = "Specified"

[icons.folder-git-2]
  means = "repository"
  group = "Git and config"
  size = "12px"
  status = "Specified"
  notes = "Detail views only, never in a Job Board row. Precedes a mono value in --fg-muted."

  [[icons.folder-git-2.usage]]
    means = "A workflow that lives in this repository, and a step the repository decides"
    group = "Workflows"
    size = "12px"
    status = "Specified"
    notes = "Added 5 Oct 2026 with the Workflow creator. Two uses on one surface, each with its tooltip: the row's mark for a definition in `.armada/workflows`, and the gate's `Repository decides` line on a step. Both mean the repository, which is the row's own meaning."

[icons.git-branch]
  means = "branch"
  group = "Git and config"
  size = "12px"
  status = "Specified"

[icons.git-commit-horizontal]
  means = "commit"
  group = "Git and config"
  size = "12px"
