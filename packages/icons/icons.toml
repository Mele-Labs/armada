  notes = "Added 2026-09-22 for #1591, which gave toggle_sidebar (⌘\\) an act: the column collapses to its 48px rail on a press at any width, where before only --layout-breakpoint could do it. No registered glyph fits. The chevron family is the obvious reach and each of its three members is reserved to disclosure inside a record or a tree, which this is not — the column does not disclose, it changes width — and a bare chevron says nothing about what it would move. layout-dashboard is the nearest bounded shape and is Navigation's, a grid of panes rather than one frame with a column divided off; the hue groups differ anyway, which rule 4 admits. **The objection to expect is rule 3**, that meaning must not live inside the shape: the caret inside the frame is interior detail at 12px. It is answered by the size — this draws at 16px in chrome and nowhere near a badge — and by which half carries the meaning. The frame with its leading column divided off is the whole claim and is identical in both halves of the pair; the caret is direction alone, exactly what chevron-up survives rule 3 on. What the pair buys is the one thing the issue asks for in as many words: a control that says which state it is in, at a glance rather than only in a tooltip."

