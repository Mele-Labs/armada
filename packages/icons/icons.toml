  notes = "No nautical iconography. A wheel or compass for Helm is decoration, and metaphor is confined to proper nouns."

[icons.minus]
  means = "A plain horizontal dash"
  group = "Step and Verdict"
  size = "12px"
  status = "Specified"
  reserved = "Two uses, told apart by which record it marks. A verdict-sheet row where no Judge and no Check beyond artifact_exists ruled; a Plan region's dropped task, below. Never a Check outcome (shield-*) or a Judge outcome (circle-*)."

  [[icons.minus.usage]]
    means = "A dropped plan task"
    group = "Step and Verdict"
    size = "12px"
    status = "Specified"
    reserved = "TaskMark's (packages/components) dropped state only, docs/concepts/plan.md. Never a verdict-sheet row, which is the table above."
    notes = "Added 2026-09-13 for #896/#898. A dropped task stays on the list struck through rather than being removed, and minus's own claim — nothing checked this — reads the same one level below a Job: nobody's ruled on whether it still stands, which is why a person's add is what brings the work back rather than a Drone's own retry."

[icons.octagon-alert]
  means = "An octagon with an exclamation mark — the only octagon in the system"
  group = "Escalation reason"
  size = "12px"
  status = "Specified"
  reserved = "stalled only. Generic warnings use triangle-alert."
  notes = "Changed from hourglass. The stop-sign polygon is the loudest shape available and the only octagon in the system."

[icons.pause]
  means = "Freeze dispatch"
  group = "Action"
  size = "16px"
  status = "Specified"
  notes = "Two bars, the most legible glyph in the set. snowflake rejected as decorative. A second use, 5 Oct 2026: a merge line turn held because its failed Check is red on main too (`land_state.held`), drawn at 12px on the running turn's rows in `--status-not-started` and at 16px on the panel's neutral Alert, so the two read as one condition. It does not pulse. Freeze dispatch is a control and this is a state, and the two never share a surface."

[icons.pencil]
  means = "A held drawing instrument at an angle, tip to the lower leading corner — drawing by hand"
  group = "Canvas rail"
  size = "16px"
  status = "Specified"
  reserved = "The sketch pad's pen only. Never edit, never rename, and never compose — a pencil here means a line a person draws with the pointer, not a field they type in."
  notes = "Added 2026-09-28 with the canvas rail (#1626's annotation run), minted because the set held no drawing glyph at all: freehand is the sketch pad's alone, per docs/contracts/design-system.md hard rule 6, so nothing had needed one. The control is a mode and draws `aria-pressed`, which is why the reservation names edit and rename — a pencil that sometimes means *type here* and sometimes means *draw here* is the mixed-meaning failure rule 4 exists to stop, and Studios' own rename takes `square-pen` instead, minted for rename alone on 29 Sep 2026. Against the group it joins it collides with nothing: `square-plus` is a box with a cross in it, `undo-2` an arrow bending back, `link` a chain, `sticky-note` a square with a peeled corner, `shapes` three overlapping figures. Refused: `pen-tool`, which draws a bezier handle and would promise a curve tool the pad does not have; `brush` and `highlighter`, whose loaded heads are interior detail rule 3 will not have at this size; `signature`, which sits beside `stamp`'s attestation and would read as a mark you make rather than a picture you draw."

[icons.pin]
  means = "A pushpin seen from the side, head over a driven point — a view held on one thing"
  group = "Canvas rail"
  size = "16px"
  status = "Specified"
  reserved = "The workflow canvas's Stay on the running step only. Never a pinned row, a favourite, a bookmark or a kept item — nothing in Armada is pinned in that sense, and a second meaning here would make the rail's own group ambiguous."
  notes = "Added 2026-09-28 with the canvas rail (#1626's annotation run). It is its own group under the view group rather than inside it, because a zoom acts once and this hands the viewport over for as long as it is on — and it is not a tool, since it places nothing. A pushpin is an object standing for the verb, which is the construction `stamp` means attest and `wrench` means repair already use, so P1's confinement of metaphor to proper nouns is not crossed. Refused: `crosshair` and `locate-fixed`, both rings, which is `circle-dot`'s silhouette and `circle-dot` is the running step's own mark — the collision would land on the one canvas where this control exists and be about the very node it follows; `eye` is reserved to Review; `flag` to a stopped step; `signpost` is the neutral confirm's."

[icons.plus]
  means = "Compose a new job"
  group = "Action"
  size = "16px"
  status = "Specified"
  reserved = "The title row's Dispatch segment only. Never dispatched, which is send's — this marks opening the composer, not the act the composed request performs once sent."
  notes = "#1107. The shell mock leads Dispatch's label with a plus; a bare cross is the smallest departure from send's silhouette in the Action group, and the two read as compose versus commit rather than as duplicates."

[icons.power]
  means = "A broken ring with an ascender rising through the gap"
  group = "Job state"
  size = "12 and 16px"
  status = "Specified"
  notes = "The universal deliberate-stop glyph. Pairs against unplug to encode deliberate against accidental."

  [[icons.power.usage]]
    means = "Stop the server a Studio's Run node is holding"
    group = "Canvas rail"
    size = "16px"
    notes = "Added 2026-09-28 with the hovering node bar's row of icon buttons. One meaning in two places rather than a second meaning: a person pressing this stopped the thing on purpose, which is what the row above says the silhouette is for, and `unplug` stays the accidental half in both. Refused: `pause`, which is Freeze dispatch and would promise the server comes back; `x` and `ban`, both reserved elsewhere and neither about a process; `circle-*`, the Judge's verdicts."

  [[icons.power.usage]]
    means = "Kill one process a Job holds, or every one, held and then confirmed"
    group = "Action"
    size = "16px"
    notes = "Added 2026-09-29 with Pulse's Processes card (#1647): a kill on each row and one in the card's head, icon-only with `Hold to kill` as the tooltip. Kill's own glyph, for the reason the server stop above borrows it — a process ended on purpose. 16px, the button size, as is the head's `rotate-cw` Refresh beside it."

  [[icons.power.usage]]
    means = "Stop the Scout reading a stranded worktree slot, and the mark on a Finding it was stopped on"
    group = "Worktree slot"
    size = "12px"
    status = "Proposed"
    notes = "Proposed 4 Oct 2026 with the rescue of a stranded slot, for the walk `rescuingAStrandedSlot`. A person ending a read on purpose, which is what the silhouette is for. Tooltip `Stop`, and `Stopped` on the Finding. Refused: `octagon-alert` and `x`, both reserved elsewhere and neither about a process."

[icons.presentation]
  means = "Studios — a whiteboard on its stand, which is what a Studio is drawn as"
  group = "Navigation"
  size = "16px"
  status = "Specified"
  reserved = "The Studios surface only. Never a node, a slide, a report or a preview."
  notes = "Added 2026-09-17 with the Studios surface (#1287), accepted by the owner with the surface's place in the rail. The only Navigation glyph that is a board on legs, which keeps it clear of clipboard-list (an upright board with a clip and no stand), layout-dashboard (a grid of panes), hard-drive (a horizontal vessel) and the outline-with-something-inside family. Refused before it was proposed: waypoints is Graph's view toggle, and workflow and network would each name something Armada already has — a workflow, and the fleet."

[icons.quote]
  means = "A pair of opening quotation marks"
  group = "Criterion origin"
  size = "12px"
  status = "Specified"
  reserved = "A criterion whose words came from the request a person typed at dispatch, on its origin line only. Never a citation of an issue or a document, never Helm's words, and never a Drone's or a Judge's text."
  notes = "Minted 3 Oct 2026, the owner's pick from the glyph candidates (`text-cursor-input` and `text-quote` refused). Your own words, quoted back to you. Two filled-weight marks with no interior detail, so it is the heaviest small silhouette of the three and holds at 12px; nothing else in the set is drawn as punctuation. It draws in `--fg-muted` on a `--fg-subtle` line (rule 6), and its tooltip names it. A criterion's origin is a different field from its verification source and its actor, which stay words: `docs/contracts/iconography.md`, Where the answer is no icon."

[icons.refresh-cw]
  means = "Two arrows chasing each other round a closed loop"
  group = "Escalation reason"
  size = "12px"
  status = "Specified"
  reserved = "churning only. Refresh and poll controls use rotate-cw."
  notes = "Two arrows chasing each other is busy-going-nowhere exactly."

[icons.rocket]
  means = "A hull with fins, on a diagonal"
  group = "Node bar"
  size = "16px"
  status = "Specified"
  reserved = "Sending a Studio node's text or address through the Job proposer. Never a Job running, never a step starting, and never the title row's Dispatch, which is `plus`."
  notes = "Minted 2026-09-28 with the node bar's mint. An object standing for its verb, the construction `pin`, `stamp` and `wrench` already use, so P1's confinement of metaphor to proper nouns is not crossed. **The reservation is the load-bearing half**: nothing runs on this press \u2014 the node goes to the proposer and waits at the approval gate \u2014 and a launch silhouette left unreserved reads as *start it now* the first time somebody meets it. Refused: `plus`, whose own row reserves it to the title row's Dispatch segment *only*, and that word is the owner's to move rather than this file's; `send`, which means dispatched, the act a composed request performs once sent, and so names the wrong end of this one; `play`, a triangle, which separates from `triangle-alert` at 16px on interior detail alone; `ship`, whose subject is `armada-mark`'s and reserved absolutely."

[icons.rotate-cw]
  means = "Redispatch"
  group = "Action"
  size = "16px"
  status = "Specified"
  notes = "Single arrow, distinct from refresh-cw. Also the proposed step-level retrying mark."

  [[icons.rotate-cw.usage]]
    means = "Refresh a reading — Pulse's own act, which asks Fleet to go and look at this job again"
    group = "Action"
    size = "12px"
    status = "Specified"
    notes = "Added 2026-09-28 with the owner's rename of that button from `Look now` to `Refresh`. Not a new claim: docs/contracts/iconography.md's reserved list already sends every refresh and poll control here, because refresh-cw is churning's alone. It replaced `search`, which meant search and had been borrowed for a button that goes and reads. Draws at 12px rather than the 16px above, matching the small button it sits in; the silhouette is one arrow and a gap, which rule 3 keeps at that size."

[icons.scan-line]
  means = "Four corner brackets with a single rule across the middle — an open frame passing over something, and the thing under it. The only glyph in the badge set that is not a closed shape"
  group = "Job state"
  size = "12px"
  status = "Specified"
  reserved = "job_status.proposing only. Never a search or a filter control: `search` is Chrome's magnifier and `filter` is the Board's, and a frame meaning *read* borrowed for *look for* is the collision this reservation exists to refuse. Never a Drone working — that is `circle-dot` in this same group, and it shares this badge's hue, so the two carry the whole distinction between them. Never a loading, busy or progress indicator: the rule is what is being read and not a bar filling, and `circle-dashed`'s own row already refuses that reading one level down. Never Evidence or a capture — the `file-*` family is evidence's and `image` is a kept frame's, and a scan frame over either would claim Armada photographed something. Never an action: a person presses Dispatch and the reading is what follows, so nothing is pressed on this mark."
  notes = "Minted 2026-09-30 with `job_status.proposing`, #1159, rather than borrowed. **What it says: a machine reading something a person handed it**, which is what the Job proposer does with a request and what nothing else in the set claims — every other candidate says either that work is under way on a repository or that time is passing, and neither is this. Rule 4: it renders `--status-running`, so it must differ from every outline sharing that hue, which is `circle-dot`'s two concentric circles and the run, live-phase and Drones marks that alias it — four detached corners and a rule is not a closed shape at all, which is as far from concentric rings as the set goes. Rule 3 needs no test at 12px: the corners *are* the silhouette rather than a detail drawn inside a stable shape, and the single rule is the only interior mark, so nothing about the meaning lives inside — the same argument `circle-dashed` and `wrench` each make by a different route. What was refused: `scan-text` is this frame with three ruled lines instead of one, and three rules an eighth of the glyph apart merge into a block at 12px, which is rule 3's own test failed; `scan-search` puts a ring with a tail inside the frame, and a ring at 12px is exactly the `circle-dot` collision, on the one hue this badge shares with it; `scan-eye` is refused outright because `eye` is reserved to Review and nothing else may use it; `circle-dot` is `job_status.running`'s own and lending it would leave the shared hue with no second channel, which is what *Every badge carries an icon* exists to prevent; `clock` is `queued`'s and means time passing rather than work happening, which is the one thing this status is not; `hourglass` is Banned outright; `send` means dispatched, the act a composed request performs, so it names the moment before this one and is Action's at 16px; `split` is `escalation_reason.fan_out`'s one-becoming-several, which is what the proposer's *answer* may be rather than what this is; `scroll-text` is the workflow a Job runs, and the whole claim of this status is that there is not one yet; `sparkles` and `wand-sparkles` are metaphor with no object standing for a verb, which P1 confines to proper nouns. The metaphor question was answered before minting: a scan frame is not a thing Armada has, and neither is a stamp, a wrench, a megaphone or a lidded box, all Specified here — the construction is the same one those use, an object standing for its verb, so P1 is not crossed. Where it departs from `megaphone`'s note is worth recording: `stamp`, `eye`, `terminal` and `wrench` are each the object for the act a person owes, `megaphone` is the object the Job holds while it asks, and this is a third thing — the object the *machine* is using while nobody is owed anything. The status was not left drawing its verb alone the way `[no-report-glyph]` and `[scope-refused-glyph]` were, and `wrench`'s row is why: those are escalation reasons, where this contract sanctions a wordless row, and this is a Job status, where hue is a single channel and several statuses share one."

[icons.scroll-text]
  means = "A sheet rolled at both ends with ruled lines across it — something authored, and read from the top down"
  status = "Specified"
  notes = "Read `means = \"Activity feed\"`, Navigation, 16px, `status = \"Retired\"` until 23 Sep 2026. Retired 2026-08-31 with that surface: finished Jobs are the Job Board filtered to what is over, so no feed exists to name. Its retirement note handed on one piece of reasoning — that `history` was rejected as a clock collision — and it does not bear on the use below. Taken back rather than left free: the rolled sheet is the only silhouette in the set depicting something written down in an order, which is what a workflow is."

  [[icons.scroll-text.usage]]
    means = "the workflow a Job runs, and how many steps it has"
    group = "Graph"
    size = "12px"
    notes = "Added 23 Sep 2026 for #1556, because `layers` had been drawing the Board row's Workflow field and `layers` means how many places a Job writes — see `docs/contracts/iconography.md`, Blast radius, which bans it from a Board row outright. **The argument for a scroll is that a workflow is the one thing on the row that was written before the Job existed**: `crates/core-model/domain/workflows.toml` is an authored, ordered script, and no other glyph in the set depicts one. Against the two glyphs it shares the row's `--fg-muted` with it collides with neither: `folder` is a tab-topped box and `git-branch` is strands and dots. What was refused: `waypoints` is the Graph group's other row and is nodes on lines, which is `git-branch`'s silhouette in the same hue on the same row, so rule 4 stops it; `clipboard-list` is the Job Board's own rail glyph and would say *Board* inside a Board row; `activity`, the registry's other free row, is an ECG, means liveness rather than a recipe, and its own note says it does not read at 12px. **The objection to expect is the `file-*` family**, reserved to evidence, since a scroll and a page are cousins at 12px — it is admitted because the ruled lines are texture rather than the claim, the way `cpu`'s ticks and `file-diff`'s marks are, and because no evidence glyph is drawn in a Board row."

