  notes = "Approved by the owner 2026-10-03, on the walk of `bridge/step-card-phase`; proposed the same day for his annotation `ouqa` (\"I had no idea it was running checks\"). It was first a mark on the state pill, which he found too easy to miss, and is now a part of the phase track he drew, named by its tooltip, `Checks running`. Within the shield reservation, so the family still reads as gates and checks; the dots are the one interior mark, and they say *not answered yet* the way a typing indicator does. **The objection to expect is rule 3**, since at 12px the dots are interior detail: the shield outline carries *a Check* and the dots only *still going*, which the pulse says too. Refused: bare `shield`, the Record's kind mark under a rule-4 waiver that is its alone; `shield-check`, a result; `circle-dot`, which is a Drone working and the track's Drones part; `loader` and `loader-circle`, a spinner, which iconography refuses as a progress indicator with no object."

