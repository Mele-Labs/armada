  notes = "Proposed 5 Oct 2026. The owner asked for one arrow from who to where, in place of two separate tags, so an item reads as `Fleet to Armada`. A long thin arrow rather than `chevron-right`, which is the disclosure caret and would read as a fold. --fg-muted, a mark between two words."

