[conventions.watch_state_borrowing]
  glyphs = ["circle-dashed", "circle-dot", "check", "x", "corner-up-right", "clock", "unplug", "ban"]
  means = "Where a watch stands, and each part of its reading, borrowed from the step glyphs and the Check outcome set"
  group = "Watch"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 22 Oct 2026 for the walk `watching`. A watch's reading answers the question a step does one level down, so `waiting`, `running`, `passed` and `failed` take the step glyphs rather than a second silhouette for one meaning: `circle-dashed`, `circle-dot` (the inner dot pulses, nothing else moves), `check` and `x`. The three ends no reading says borrow the Check outcome that is the same ending: `gave_up` is `clock`, a run that outran its time as `check_outcome.timed_out` is; `broken` is `unplug`, a command that gave no line, the severed ending `check_outcome.signalled` draws; `stopped` is `ban`, an end someone chose, which `x`'s reservation sends to `ban`. A part set aside keeps its glyph and is struck through with the sentence that set it aside. `not_ours`, proposed 26 Oct 2026 for the walk `watch-not-ours`, borrows `corner-up-right` from the Action group: a run whose only failures were set aside points away from the change to their owner, and it is never `check`. Each mark has a tooltip naming the state: Waiting, Running, Passed, Failed, Not ours with the parts that failed, Gave up, Broken, Stopped. Until `crates/core-model/domain/enum-verbs.toml` carries a `watch_state` vocabulary the words live beside the marks in `apps/desktop/src/renderer/src/session-view/watch-marks.tsx`."
