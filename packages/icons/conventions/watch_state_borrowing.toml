[conventions.watch_state_borrowing]
  glyphs = ["circle-dashed", "circle-dot", "check", "x", "clock", "unplug", "ban"]
  means = "Where a watch stands, and each part of its reading, borrowed from the Trigger firing set and the Check outcome set"
  group = "Watch"
  size = "12px"
  status = "Proposed"
  notes = "Proposed 22 Oct 2026 for the walk `watching`. A watch's reading answers what a Trigger's firing answers, so `waiting`, `running`, `passed` and `failed` take `[conventions.trigger_firing_borrowing]`'s glyphs: `circle-dashed`, `circle-dot`, `check` and `x`. The three ends no reading says borrow the Check outcome that is the same ending: `gave_up` is `clock`, a run that outran its time as `check_outcome.timed_out` is; `broken` is `unplug`, a command that gave no line, the severed ending `check_outcome.signalled` draws; `stopped` is `ban`, an end someone chose, which `x`'s reservation sends to `ban`. A part set aside keeps its glyph and is struck through with the sentence that set it aside. Each mark has a tooltip naming the state: Waiting, Running, Passed, Failed, Gave up, Broken, Stopped. Until `crates/core-model/domain/enum-verbs.toml` carries a `watch_state` vocabulary the words live beside the marks in `apps/desktop/src/renderer/src/session-view/watch-marks.tsx`."
