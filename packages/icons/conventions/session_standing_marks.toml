[conventions.session_standing_marks]
  glyphs = ["reply", "power", "clock", "message-square-dashed"]
  means = "What Fleet read a Session to be doing when the agent has not said so: its turn ended on a reply, it said it was done, or its running turn went quiet"
  group = "Session"
  size = "12 and 16px"
  status = "Proposed"
  notes = "Proposed 14 Oct 2026 for the walk `session-standing`. `reply` is a Session whose turn ended on the agent's message and which the person has not opened since; it is the glyph the Reply act already wears, and it is the unread mark (14 Oct 2026, on the owner's word that a reply asks nothing of him): the row is filed under Idle with it, raises no call, and the mark goes once he has been in the Session. Tooltip `Unread reply`. `power` is a Session whose agent said nothing is left, the state whose act is End session, and the deliberate stop the glyph already draws. The act itself wears `power-off` (approved 15 Oct 2026, walk `session-end-icon`), since the two stand side by side in a finished Session's head. Tooltip `Done`. `clock` is a Session whose running turn has been quiet, the glyph the timeline's stuck lane already wears. Tooltip `Stuck`. `message-square-dashed` is a Job holding a first message nobody has sent, tooltip `Draft`, approved on the walk `job-draft-mark` (19 Oct 2026, over `text-cursor-input`). One answer on the Sessions list, the Cockpit's tiles and lanes, and the call card. Borrowed and not minted; `eye` stays a Session that waits with something the agent or a card asked, and `check` stays idle. The owner may rule otherwise."
