[conventions.session_standing_marks]
  glyphs = ["reply", "power", "clock"]
  means = "What Fleet read a Session to be doing when the agent has not said so: its turn ended on a reply, it said it was done, or its running turn went quiet"
  group = "Session"
  size = "12 and 16px"
  status = "Proposed"
  notes = "Proposed 14 Oct 2026 for the walk `session-standing`. `reply` is a Session whose turn ended on the agent's message and which waits for the person's answer; it is the glyph the Reply act already wears, since the answer is what is owed. Tooltip `Replied`. `power` is a Session whose agent said nothing is left, the state whose act is End session, which is the deliberate stop the glyph already draws. Tooltip `Done`. `clock` is a Session whose running turn has been quiet, the glyph the timeline's stuck lane already wears. Tooltip `Stuck`. One answer on the Sessions list, the Cockpit's tiles and lanes, and the call card. Borrowed and not minted; `eye` stays a Session that waits with something the agent or a card asked, and `check` stays idle. The owner may rule otherwise."
