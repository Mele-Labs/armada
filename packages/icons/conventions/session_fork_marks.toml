[conventions.session_fork_marks]
  glyphs = ["unplug", "move-right"]
  means = "A Session nothing is listening to, and the link between a Session and the one forked from it"
  group = "Session"
  size = "12 and 16px"
  status = "Proposed"
  notes = "Proposed 7 Oct 2026 for the walk `session-fork`. `unplug` is a Session that ended or whose terminal stopped asking, a connection that is gone, as it is for a Job that lost its Drone; its tooltip says which. `move-right` is a row in the ledger's Forks section, from a Session to the one forked from it or the one it was forked to, the arrow from who to where that Fleet-to-Armada tags already use. Borrowed and not minted, and the owner may rule otherwise."
