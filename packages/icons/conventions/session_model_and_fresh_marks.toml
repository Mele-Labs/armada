[conventions.session_model_and_fresh_marks]
  glyphs = ["cpu", "move-right"]
  means = "The model a Session's composer reads, and the mark that offers a fresh start on a Session that is big or old"
  group = "Session"
  size = "12 and 16px"
  status = "Proposed"
  notes = "Proposed 13 Oct 2026 for the walk `session-fresh`. `cpu` names the model in the message box's Model select, the default included. The Session's head no longer draws a model (14 Oct 2026). `move-right` at 16px sits after the context tank once a Session passes 300k tokens or a day, and opens a card of two acts, a new Session on a short handoff and a fork. Borrowed and not minted: a handoff goes from one Session to another, which is what `move-right` already draws between the Sessions in the ledger's Forks section. The owner may rule otherwise."
