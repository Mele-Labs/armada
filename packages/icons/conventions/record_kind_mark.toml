[conventions.record_kind_mark]
  glyphs = ["box", "file-check", "file-diff", "shield", "scale", "bot", "list-todo", "flask-conical"]
  means = "The kind of a Record row, as a mark leading it"
  group = "Record kind"
  size = "12px"
  status = "Specified"
  notes = "The Record's Kind column became a 12px mark under the All filter on 2026-09-28, the owner's own instruction: no kind word under a specific filter, and an icon on the left of the row with the kind's name on hover under All. The rows divide into eight families. Two had a glyph the registry already sanctioned: `file-check` leads an Evidence row, since a submitted claim, a hand-in and a kept deliverable are each a submission that landed, and `file-diff` leads a Files row, since reading what one file changed is that glyph's own reservation. On 2026-09-29 the owner asked for the six that were owed, and six were minted in a group of their own, one per family, each reserved to its family's rows and none of them an outcome: `box` the Job, `scale` a Judge, `bot` a Drone, `list-todo` a task, `flask-conical` a case run, `shield` a Check. Each row carries its refusals. **A Check row takes the bare `shield`**, the owner's answer the same day: the Check's silhouette is the shield throughout, and rule 4, which would refuse an outline shared with shield-minus and shield-off inside one grey, is waived for this mark alone because it draws only in this column, beside the words that say what it is. See `shield`'s row and *The Record's kind marks* in docs/contracts/iconography.md. Every mark draws --fg-muted and never a status hue: the kind is the whole of what it says, and the Outcome column owns what the row came to."
