# The Studios surface: pure modules in node, and whole-app tests in a browser.
# Commands run here, in this directory. `docs/concepts/manifest.md`,
# *Workspace gating*; the comments on `${width}` and `exec` are the root's, at
# the top of its `checks:`.
version: 1
id: armada-studios

# What this surface reads from elsewhere, repo-relative. A hit runs every Check
# below, since none declares a `when`. Its tests mount the whole app, so the
# renderer and shared source of `apps/desktop` are here; `main` and `preload`
# are not, since the mock bridge does not run them.
depends_on:
  - "packages/screens/**"
  - "packages/shell/**"
  - "packages/components/**"
  - "packages/tokens/**"
  - "packages/brand/**"
  - "packages/protocol/**"
  - "apps/desktop/src/renderer/**"
  - "apps/desktop/src/shared/**"
  - "package.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"

setup:
  requires:
    - bootstrap
    - browsers

checks:
  typecheck:
    # `--noEmit -p`: one project, no build info. Named rather than left to
    # `pnpm -r`. No `narrow`: `tsc` reads whatever its tsconfig references.
    run: pnpm typecheck

  test:
    run: pnpm exec vitest run --maxWorkers=${width}
    # No `dir`: see `components_test` in `packages/components/armada.yml`.
    runner:
      name: vitest
    # `vitest -t`, as `desktop_test`'s `one_test`. #1203. One worker, for the
    # reason given there: `-t` still loads every browser file.
    one_test:
      run: pnpm exec vitest run --maxWorkers=1 -t {}
    # Chromium beside the other browser suites: #1102.
    places: 3
