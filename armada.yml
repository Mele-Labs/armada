# Armada's own Manifest, read by a running Fleet. A Job dispatched here runs
# these commands verbatim.
#
# Every section the Manifest concept page describes but this file omits is
# refused by name: a key nothing reads is a promise the system does not keep.
#
# The two exceptions are `auto_merge` and `review_gate`, which have defaults
# rather than refusals — they are `Manifest only`, so an absent key has no tier
# above it to defer to and means `never` and `human_always`. This repository
# writes neither, which is those two answers: no machine lands Armada's own work
# and a person signs every review step off.

version: 1

# Written rather than minted, so renaming the directory does not orphan a Job.
id: armada

# Optional. Absent, Armada infers one and says so in the pull request.
base: main

# Checks gate advancement. A step naming one not declared here is refused.
#
# **The order below is the order they are reported in**, and no longer the order
# they start in: `fleet::checking` starts them fastest first by this
# repository's past runs (#1062). There is no `order:` key, for the reason a
# workflow's `steps[]` has none.
#
# **`${width}` is how many workers a Check may start**, and every test runner
# here is handed one rather than left to size itself. Absent the substitution a
# suite takes the machine: on 17 Sep a Drone's `desktop_test` spawned sixteen
# headless Chromium workers and took the load average to 73, which made the
# owner's Bridge and editor unusable while one Job worked. The number is the
# machine's, already divided by the Jobs that may run at once, and a Check may
# declare `width:` to take less — never more. Nothing enforces it: these lines
# are the enforcement, which is why a runner that sizes itself from a config
# file rather than a flag reads `ARMADA_CHECK_WIDTH` from its environment
# instead. #1444. **Checks also take turns across the whole machine**:
# `armada check`, the land line and Fleet's gate share one set of slots, so a
# Check may wait on one another session started. `docs/concepts/manifest.md`,
# *How many Checks run at once*.
#
# **`runner:` is where the ways of running less than a whole check live.** A
# check names the runner and the commands are written once in that runner's own
# description, not once per check here — `.armada/runners/vitest.yml`, and
# `docs/concepts/runner-adapter.md` for why. A drone that names the files it
# changed gets the tests that import them, through vitest's own graph: measured
# on `screens_test`, 1178 tests in 7.61s becomes 11 in 245ms. #1456.
#
# **`exec` rather than the package script**, which is #1205's finding and the
# reason every `one_test` is written the same way. `pnpm -C <dir> test --
# --maxWorkers=4` reaches vitest as `vitest run -- --maxWorkers=4`, and an
# argument after a bare `--` is a positional rather than an option, so vitest
# reads it, discards it and exits zero. Measured 18 Sep on `desktop_test`, peak
# vitest processes: unbounded 20, the `--` form 20, the script form without it
# 8, and `pnpm --dir <dir> exec vitest run --maxWorkers=2` 6. Only the last
# has no script and no `--` to get this wrong in, which is what #1216 settled
# for every shape a runner is given.
#
# **`runs_at: gate` keeps a Check out of a Drone's own run** and nowhere else —
# the gate still runs it (#849). The two are the slowest things a Drone asked
# for: `storybook` at 1m21s–2m42s and the story tests at up to 184s, measured
# on 14 Sep 2026. They are `packages/components`' now.
#
# **The Bridge's Checks are in `packages/components`, `packages/screens` and
# `apps/desktop`, each in its own `armada.yml`**, and what is below is the
# rest. A manifest gates a change that touches a path it owns or one its
# `depends_on` names, and the root owns the paths no workspace claims — so the
# root's `when` lists below never see `apps/desktop`, `packages/components` or
# `packages/screens`. `docs/concepts/manifest.md`, *Workspace gating*.
checks:
  build:
    # `--locked`: a Check that updates the lockfile changed what it measured.
    run: cargo build --workspace --locked
    # What a Drone gets when it asks about its own change rather than the whole
    # tree. `--workspace` is gone rather than joined by `-p`: cargo reads the
    # two together as the whole workspace and drops the `-p` silently, so a
    # narrowed run would have been the whole run wearing a shorter command.
    #
    # `under: crates` is this repository declaring its own layout, and it is
    # the only Cargo fact anywhere in the chain. `xtask` sits at the root
    # rather than under `crates`, so a change to it narrows to nothing and this
    # Check is not run — the gate still reads it whole.
    #
    # No `except`, unlike `test` below: `--workspace` builds `acceptance` too,
    # so `-p acceptance` measures nothing the whole run does not.
    narrow:
      run: cargo build --locked
      each: "-p {}"
      under: crates
    # **What the command reads, not what it is usually about.** A pattern
    # missing here is a Check that stops running on a change that breaks it.
    #
    # `crates/**` and `xtask/**` are the workspace's members. `Cargo.toml` and
    # `Cargo.lock` are what `--workspace --locked` resolves, and `.cargo/**`
    # carries the flags and aliases a build runs under. `protocol-version.toml`
    # is read by `crates/ipc/build.rs`, and the shipped workflow definitions are
    # compiled into `config` by `include_str!`. `armada.yml` is here because a
    # change to this file is a change to the command itself.
    #
    # `apps/**` and `packages/**` are deliberately absent: nothing outside a
    # test compiles them in, and `test` below says why it needs them.
    when:
      - "crates/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "protocol-version.toml"
      - ".armada/workflows/**"
      - "armada.yml"

  test:
    # `--exclude acceptance`: `acceptance` below reads a milestone's claim on
    # its own, so a red `test` always names a unit test and never a milestone
    # claim breaking. See docs/practices/acceptance-tests.md. `nextest`
    # measured 3x `cargo test`.
    run: cargo nextest run --workspace --exclude acceptance --test-threads ${width}
    # `--exclude` goes with `--workspace`, and cargo refuses it without one —
    # so the exclusion is restated as `except`, and it is the same exclusion
    # for the same reason: a narrowed run that pulled `acceptance` back in
    # would blur the line `test` and `acceptance` keep between them.
    #
    # `-p xtask` in every narrowed run, because its tests read the whole tree —
    # error codes and status edges declared under `crates/` among them — so no
    # change under `crates` is outside its reach: 341 tests, about 6s of test
    # time, measured 2 Oct 2026. The merge line narrows through this too, over
    # the crates a turn touches and every crate depending on one:
    # `docs/capabilities/merge-line.md`, *What a narrowed Check runs*.
    #
    # `outside` is what that `-p xtask` already measures on its own: `apps/`
    # and `packages/`, which `when` below covers only because xtask's tests
    # read them. No other member reads either tree, by test or `include_str!`
    # — checked 4 Oct 2026. So a change there runs xtask alone rather than
    # every test in the workspace after a cold compile, which is what Job 3's
    # Bridge-only change paid. Owner, 4 Oct 2026. A path a member other than
    # xtask reads does not belong here: it would run without the tests that
    # read it.
    #
    # **`outside` is now `brand`, `protocol`, `shell`, `tokens` and `icons`
    # alone**: the root owns only what no workspace claims, so a change under
    # `apps/desktop`, `packages/components` or `packages/screens` never reaches
    # this Check. `apps/desktop`'s `xtask_test` is that same `-p xtask` run for
    # them.
    narrow:
      run: cargo nextest run --test-threads ${width} -p xtask
      each: "-p {}"
      under: crates
      except:
        - acceptance
      outside:
        - "apps/**"
        - "packages/**"
    # One test by name, which Fleet runs against a checkout of main before a
    # Drone's `draft_fix` drafts anything. The whole run's exclusion stays, so a
    # test this Check never runs cannot be named. #999.
    #
    # **The name is matched as whole segments of a test's path**, so
    # `armada check test a_span_holding_one_taken_port_is_not_free` runs the
    # same test `tests::servers::a_span_holding_one_taken_port_is_not_free`
    # does, and `servers` or `tests::servers` runs every test under that
    # module. `{}` arrives regex-escaped; a name that matches several runs
    # each, and the count is said.
    one_test:
      run: cargo nextest run --workspace --exclude acceptance -E test(/(^|::){}(::|$)/)
    # Everything `build` reads, and the Bridge tree with it. **`xtask`'s own
    # tests read `apps/` and `packages/`** — the error-code rule collects
    # declarations from both, and the vocabulary rules read the generated
    # modules under `packages/` — so a change there really can turn this run
    # red. `scripts/**` is absent because no test in the workspace reads it,
    # and `docs/**` is named only where code reads it: `fleet`'s scout brief
    # takes `agent-prompt.md` by `include_str!`, `adapters`' transcript tests
    # read `docs/spikes/`, and `xtask`'s studio rule reads the lexicon in
    # `design-system.md` from the real tree.
    when:
      - "crates/**"
      - "xtask/**"
      - "apps/**"
      - "packages/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "protocol-version.toml"
      - ".armada/workflows/**"
      - "armada.yml"
      # Where a hung test is ended. docs/practices/rust.md, section 8.
      - ".config/nextest.toml"
      - "docs/contracts/agent-prompt.md"
      - "docs/contracts/design-system.md"
      - "docs/spikes/**"

  acceptance:
    # A milestone's own claim, checked on its own so a red `acceptance` names
    # a broken claim and a red `test` never does. See
    # docs/practices/acceptance-tests.md and #1130.
    run: cargo nextest run -p acceptance --test-threads ${width}
    # No `narrow`: `-p acceptance` already is the narrowest run a change could
    # ask for, unlike `build` and `test` above which narrow to whichever
    # workspace member changed.
    one_test:
      run: cargo nextest run -p acceptance -E test(/(^|::){}(::|$)/)
    # Everything the suite compiles from, and no further, so a Bridge-only
    # change does not pay for it. It is the only run of the suite on the merge
    # line: `verify-foundations` checks each test exists and leaves passing
    # here, so a path missing from this list is a change nothing tests.
    # `config` embeds `.armada/workflows/`, and `ipc`'s build reads
    # `protocol-version.toml`.
    when:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "protocol-version.toml"
      - ".armada/workflows/**"
      - ".config/nextest.toml"

  # The Bridge half moved to `packages/components`, `packages/screens` and
  # `apps/desktop`, each with its own `armada.yml`, so a change to one package
  # gates that package's Checks and what depends on it. `armada covers` names
  # the Checks a change reaches. What is left here is the packages nothing owns:
  # `brand`, `protocol`, `shell`, `tokens` and `icons`.
  typecheck:
    # Named rather than left to `pnpm -r`, which skips a package that declares
    # no `typecheck` — silently, which is how the library went unchecked for as
    # long as it existed. Only the three that have the script and no manifest of
    # their own: `tokens` and `icons` have no TypeScript, and the three
    # packages with a manifest typecheck there.
    #
    # **The names are in a `package.json` script and not here, because a `run`
    # gets no shell.** This line was `pnpm -C … && pnpm -C …`; the runner
    # passed `&&` as an argument and `tsc` died on `Unknown build option
    # '-C'`, so the Check could never pass and every Job dispatched against
    # this repository failed on it. A script is where a chain of commands can
    # be written, and the list stays explicit inside it.
    run: pnpm typecheck
    # **No `narrow`, and that is an answer rather than an omission.** A project
    # is the unit a TypeScript compilation has: `tsc` reads the files its
    # tsconfig references whatever is handed to it, so there is nothing
    # narrower to run.
    #
    # `domain/**` and `protocol-version.toml`: codegen emits TypeScript from
    # them into `packages/protocol`, so a change there is a change to compiled
    # code. A path under `apps/` is a workspace's, so none is named.
    when:
      - "packages/**"
      - "crates/core-model/domain/**"
      - "protocol-version.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

  # The two Python suites that hold the local merge line together. They are two
  # Checks rather than one because a `run` gets no shell, so nothing here can
  # chain two commands — and because the two are read by different changes: one
  # is the script agents land through, the other is the hook that keeps them in
  # it.
  scripts_test:
    # `scripts/land` against a throwaway repository with a local bare remote and
    # stub `gh` and `armada`. A failure means the line would merge, refuse or
    # stall differently from what `docs/capabilities/merge-line.md` says — read
    # the named test, not the exit code. They run against the real
    # `armada land`, which `test_land.py` builds itself first, since a
    # Check's `run:` has no shell to chain that onto the suite. A couple of
    # minutes, most of it that build.
    #
    # `armada.yml` is named because a test reads this file: the Checks this
    # suite asserts are gated are declared here.
    run: python3 scripts/test_land.py
    when:
      - "scripts/**"
      - "crates/armada/src/land/**"
      - "crates/adapter-traits/src/delivery.rs"
      - "crates/adapters/src/delivery.rs"
      - "crates/adapters/src/landing.rs"
      - "armada.yml"

  hooks_test:
    # What `.claude/hooks/guard_merge.py` refuses and what it lets through. A
    # failure means either a merge to `main` can walk past the line, or — the
    # half that costs more — an ordinary branch push is being refused and every
    # agent in the repository is stuck. It runs no git and no `gh`: a payload in,
    # a decision out, in under a second.
    run: python3 .claude/hooks/test_guard_merge.py
    when:
      - ".claude/hooks/**"

  # `format`, not `fmt`: that name is a Command below and both registries
  # refuse a collision — the Command writes, this reads. No `clippy` beside it;
  # `[clippy-as-a-check]` in docs/OPEN.md is why.
  #
  # **No `requires: [fmt]`, on purpose, and it once had one.** #387 gave it
  # that, for a Job that burned its whole retry budget failing `format` at a
  # different unformatted line each attempt while the Command that fixes it
  # sat right below in this file. It read as a fix: every gate evaluation ran
  # `fmt` and then read what `fmt` had just written, so `format` passed every
  # time it ran and unformatted Rust merged unnoticed —
  # `xtask/src/rules_stories.rs` on `main`, until this line was found. A Check
  # that writes what it then reads is not a check, whoever runs it: `armada check
  # format` and a person's own run inside a Job read the same Manifest and are
  # owed the same answer the gate gives, by this file's own rule at `declared`
  # in `crates/armada` — so this could not be fixed for a Drone alone without
  # the two disagreeing. A failure here says `armada run fmt`. A Drone already
  # holds that Command as a Bash grant on every step, `fmt` being
  # non-destructive — Spike 011 — so nothing here is protecting a retry
  # budget it cannot also protect by running the fix itself.
  format:
    run: cargo fmt --all --check
    # The other shape of narrowing: the changed paths, verbatim, with no
    # derivation at all. `from` keeps everything but Rust out — rustfmt exits
    # non-zero on a file it cannot parse, so a changed `.md` would fail this
    # Check for a reason that is not the work.
    #
    # `rustfmt` and not `cargo fmt`, because `cargo fmt -- <path>` passes what
    # follows `--` to rustfmt as options and computes its own file list from
    # the workspace's targets: the paths are ignored and the whole tree is read.
    # Measured here on 8 Sep 2026, on a file this repository does not compile.
    narrow:
      run: rustfmt --check --edition 2021
      each: "{}"
      from:
        - "**/*.rs"
    # Every Rust source in the workspace, wherever it sits — `build.rs` and
    # `xtask/` included. `Cargo.toml` decides which members `--all` reaches and
    # which edition each is read under, `rustfmt.toml` would change how every
    # one of them is formatted, and `armada.yml` is the command itself.
    when:
      - "**/*.rs"
      - "Cargo.toml"
      - "rustfmt.toml"
      - "armada.yml"

# Commands gate nothing — they are what a Drone is given to run.
commands:
  # `setup.requires` names this; a Drone is never given it. `--frozen-lockfile`
  # so preparation writes nothing the Drone's diff would carry.
  bootstrap:
    run: pnpm install --frozen-lockfile

  # The browser `components_test` and `screens_test` mount into. `setup.requires` names this
  # too, after `bootstrap` — the binary it runs is installed by it.
  #
  # **A machine-level cache, not a worktree one.** Playwright puts the shell in
  # the user's cache directory, so this is a fetch on a machine that has never
  # run it and a version check on every one after. Left out of setup, the first
  # Job on a fresh machine would fail `components_test` on a missing executable and
  # report it as a broken test.
  #
  # `--only-shell`: the headless shell is what a headless run launches, and it
  # is a third of the full browser download.
  #
  # One install for two packages. `packages/screens` pins the same Playwright as
  # `packages/components` and the shell is cached per machine, so this covers
  # both — a second line here would download nothing and would go stale the
  # first time the pins differed.
  browsers:
    run: pnpm -C packages/components exec playwright install chromium --only-shell

  fmt:
    run: cargo fmt --all

  # **A Drone regenerating the wire's TypeScript after a protocol bump.** Not a
  # Check — it writes, and what it writes lands in the diff — but a Drone that
  # changes `crates/ipc` and `protocol-version.toml` cannot make `typecheck`
  # pass without it, so it has to be reachable.
  #
  # **Declared because #1174 withholds the program.** Every Bash call naming a
  # program one of the Checks runs is now refused whatever `when_blocked` says,
  # and `pnpm` is one. That is right for `pnpm -C packages/screens test`, which
  # `run_checks` does better, and wrong for this, which nothing else does at
  # all — so it stops being an ungranted command and becomes a named one. A
  # Drone runs it as `armada run codegen`.
  codegen:
    run: pnpm -C apps/desktop codegen

  gate:
    # Exits non-zero on purpose, which is why it is not a Check.
    run: cargo xtask verify-foundations

  # What `setup.seed` warms the base checkout with: the same build the `build`
  # Check compiles, and every test binary without running one.
  warm_build:
    run: cargo build --workspace --locked
  warm_tests:
    run: cargo nextest run --workspace --no-run --locked

  # Bridge's renderer on a mock Fleet, in a browser, held open so a person can
  # look around while Jobs land. `evidence:` runs the same command for its own
  # frames; this is the one a person starts, and `start_server` is what starts
  # it, so Fleet holds it and knows which checkout it serves.
  mock:
    serve: pnpm -C apps/desktop exec vite --config vite.mock.config.ts --port ${port.mock} --strictPort
    ready: curl -sf http://localhost:${port.mock}
    links:
      - url: http://localhost:${port.mock}
        name: Bridge on a mock Fleet

  # The `storybook` Check builds and exits; this holds the port open. `--ci` or
  # a taken port opens a prompt nobody can answer.
  storybook_dev:
    serve: pnpm -C packages/components exec storybook dev -p ${port.storybook} --no-open --ci
    # A command rather than a duration, the rule `evidence:` already follows.
    # Storybook's first start on a cold cache is minutes, and a number here
    # would be a guess against whichever machine is slowest that week.
    ready: curl -sf http://localhost:${port.storybook}
    links:
      - url: http://localhost:${port.storybook}
        name: Storybook

# Armada places these, so two worktrees never bind the same number.
ports:
  storybook: {}
  mock: {}

# How this repository shows what a change looks like. A step whose
# `evidence.captured` is true runs this, and Fleet keeps what lands in `frames`.
#
# **Bridge on the mock Fleet, in a browser, and not the Electron app.** What is
# photographed is `App` itself on a scenario replaying a recorded Job — a Job a
# Fleet really ran, through the fold main folds with — so a frame is the app's
# own reading of real wire data rather than a drawing of one. Driving the
# Electron app would take the owner's screen for the length of every Job, and
# `.claude/skills/armada-local/SKILL.md` says what that costs. Storybook drew
# these as stories until #1225 took screens out of it.
evidence:
  serve: pnpm -C apps/desktop exec vite --config vite.mock.config.ts --port ${port.mock} --strictPort
  ready: curl -sf http://localhost:${port.mock}
  # `{}` is where the spec a Drone named goes. The spec itself is not
  # substituted, so `ARMADA_PORT_STORYBOOK` is its only channel to the port.
  run: pnpm -C packages/components exec playwright test {}
  # Ignored whole by `.gitignore`, with everything else one run leaves behind.
  frames: .armada/frames
  never:
    # The Notes panel's own route. A GET reads a shot back; a POST writes into
    # `.notes/`, which is a spec editing the worktree it is photographing.
    # Armada enforces none of this and says so — it is read by whoever writes
    # the spec, and by whoever reviews it.
    - /__notes

# What a step asking to be walked is served on, when it stops for a person —
# Prototype's Build. Bridge on a mock Fleet, in the Job's own worktree, and its
# picker plays this repository's walks.
walk: mock

# How patient Fleet is with a Drone working here. Both keys are optional and
# each falls back on its own: what is not written is what Fleet was started
# with, and a workflow step may override either again.
drone:
  # 300, against a shipped 120, because one command here is longer than the
  # whole of what the threshold was measured against. Spike 009 saw a longest
  # honest silence of 79s on a repository with a warm cache and small changes.
  # Measured here into an empty target directory on 3 Sep 2026, each a single
  # tool call a Drone makes no sound during: `build` 37.6s, `test` 41s, and
  # the Bridge tests 6s then 40s before a browser starts. A Drone that runs two of
  # them before it speaks is past 120s while nothing is wrong.
  #
  # 300 is the top of the band that spike named as separating every stuck step
  # it saw from every honest one, so this is still a tripwire. Raise it again
  # only with a silence somebody measured.
  quiet_after_seconds: 300
  # No `poke_limit`. Nothing here wants more or fewer nudges than Fleet's two,
  # and a number written without a reason is one the next person deletes.

# No `after_merge:`. The key exists and this repository does not set it — see
# docs/concepts/manifest.md, *Proving what merged*. What it would buy is a run of
# `build` and `test` against the commit each merge leaves on `main`; what it
# costs is those two on the machine somebody is working on, cold, for an event
# nobody is waiting for. docs/practices/rust.md section 8 names a hook that
# rebuilt on merge as the cause of v1's four-minute cold build and says outright
# not to reintroduce one. Turning it on is two lines and is a decision somebody
# takes deliberately, which is the whole reason absent means off.

# What this repository requires of every change, read into every Judge brief
# so that fixing the prose a change made wrong is not refused as scope
# expansion. A Drone is not handed it: it reads the repository itself. Read
# from this checkout, never a Job's worktree, and cut at the
# `standing-rules-cap` setting. docs/concepts/manifest.md, *What every change
# here carries*.
standing_rules: docs/instructions/every-change.md

# What has to have run before any step starts in a fresh worktree. Names a
# Command above; a name nothing declares is refused at load. Fleet runs it once
# where the worktree is cut, not once per Drone, and has no opinion about what
# it runs. A failure here is not a step failure — no step has started.
setup:
  requires:
    - bootstrap
    - browsers
  # What a new worktree's `target/` starts from: a copy-on-write clone of the
  # base checkout's, warmed by the two Commands above. Measured 14 Sep 2026: a
  # seeded worktree's build recompiled only this workspace's own 14 crates.
  seed:
    paths:
      - target
    warm:
      - warm_build
      - warm_tests
